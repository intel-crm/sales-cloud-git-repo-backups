<template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_small">
       <div class="slds-modal__container">
          <!-- modal header start -->
          <header class="slds-modal__header">
             <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                <lightning-icon icon-name="utility:close"
                   alternative-text="close"
                   variant="inverse"
                   size="small" ></lightning-icon>
                <span class="slds-assistive-text">Close</span>
             </button>
             <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{modalTitle}</h2>
          </header>
          <!-- modal body start -->
          <div class="slds-modal__content slds-p-around_xxx-small" id="modal-content-id-1">
                <template if:false={isLineItemsEmpty}>
                    <c-datatable-utility 
                        hide-checkbox-column={modalHideCheckboxColumn} 
                        show-row-number-column={modalShowRowNumberColumn} 
                        enable-infinite-loading={modalEnableInfiniteLoading}
                        num-and-checkbox-both-cols={modalNumAndCheckboxBothCols}
                        normal-data-table={modalNormalDataTable}
                        records={records}
                        columns={columns}
                        number-of-rows-to-show={modalNumberOfRowsToShow}
                        height-in-rem={modalTableHeightInRem}
                        onrecordselection={getSelectedRecords}
                        selected-rows={modalTablePreSelectedRows}>
                    </c-datatable-utility>
                </template>
                <template if:true={messageText1Present}>
                  <div class="slds-p-left_xx-large slds-theme_shade slds-text-color_error">
                      {messageText1}
                  </div>
              </template>
                <template if:true={messageText2Present}>
                    <div class="slds-p-left_xx-large slds-theme_shade slds-text-color_error">
                        {messageText2}
                    </div>
                </template>
          </div>
          <!-- modal footer start-->
          <footer class="slds-modal__footer">
             <button class="slds-button slds-button_neutral" onclick={closeModal}>Cancel</button>
             <button class="slds-button slds-button_brand" onclick={saveHandler}>Save</button>
          </footer>
       </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
 </template>
