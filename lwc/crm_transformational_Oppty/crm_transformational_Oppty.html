<template>
    <div class="slds-box slds-theme_default">
        <section class="slds-section">
          <div class="slds-section__title">
            <button class="slds-button slds-section__title-action" onclick={toggleSection}>
              <lightning-icon icon-name={iconName} alternative-text="Toggle" size="x-small"></lightning-icon>
              <span class="slds-truncate" title=" Transformational Opportunity">Highlighted Opportunity</span>
            </button>
          </div>
    
        <template if:false={isCollapsed}>
           
                    <template if:false={isCardVisible}>
                        <div class="slds-p-horizontal_medium slds-p-vertical_small">

                            <!-- Opportunities Section -->
                            <div class="slds-p-around_small">
                                <lightning-layout vertical-align="start">
                                    <lightning-layout-item class="slds-size_1-of-1">
                                        <template if:false={isshowOpportunityies}>
                                            <div class="slds-grid slds-grid_align-spread">
                                                <p class="slds-m-bottom_xx-small">Opportunities</p>
                                                <lightning-button-icon 
                                                    icon-name="utility:edit" 
                                                    alternative-text="Edit"
                                                    onclick={handleToggle}
                                                    variant="bare"
                                                    class="slds-m-bottom_xx-small">
                                                </lightning-button-icon>
                                            </div>
                                            <div class="slds-m-bottom_xx-small" style="border-bottom: 1px solid #ccc; padding-bottom: 0.5rem;">
                                                <!--
                                                <lightning-formatted-rich-text 
                                                    value={transformationalOpportunity}>
                                                </lightning-formatted-rich-text>
                                                -->
                                            </div>
                                        </template>
                                        <template if:true={isshowOpportunityies}>
                                            <div class="slds-grid slds-grid_align-spread">
                                                <p class="slds-m-bottom_xx-small">Opportunities</p>
                                                <lightning-button-icon 
                                                    icon-name="utility:edit" 
                                                    alternative-text="Edit"
                                                    onclick={handleToggle}
                                                    variant="bare"
                                                    class="slds-m-bottom_xx-small">
                                                </lightning-button-icon>
                                            </div>
                                            <div class="slds-box slds-box_xx-small">
                                                <div class="custom-scroll" >
                                                       <lightning-datatable
                                                           key-field="Id"
                                                           data={showOpportunityies}
                                                           columns={columns}
                                                           hide-checkbox-column="true">
                                                       </lightning-datatable>
                                                   </div>
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>
                        
                            <!-- Comments Section -->
                            <div class="slds-p-around_small">
                                <lightning-layout vertical-align="start">
                                    <lightning-layout-item class="slds-size_1-of-1">
                                        <template if:false={transformationalOpportunityComment}>
                                            <div class="slds-grid slds-grid_align-spread">
                                                <p class="slds-m-bottom_xx-small">Comments</p>
                                                <lightning-button-icon 
                                                    icon-name="utility:edit" 
                                                    alternative-text="Edit"
                                                    onclick={handleToggle}
                                                    variant="bare"
                                                    class="slds-m-bottom_xx-small">
                                                </lightning-button-icon>
                                            </div>
                                            <div class="slds-m-bottom_xx-small" style="border-bottom: 1px solid #ccc; padding-bottom: 0.5rem;">
                                                <!--
                                                <lightning-formatted-rich-text 
                                                    value={transformationalOpportunityComment}>
                                                </lightning-formatted-rich-text>
                                                --> 
                                                
                                            </div>
                                        </template>
                                        <template if:true={transformationalOpportunityComment}>
                                            <div class="slds-grid slds-grid_align-spread">
                                                <p class="slds-m-bottom_xx-small">Comments</p>
                                                <lightning-button-icon 
                                                    icon-name="utility:edit" 
                                                    alternative-text="Edit"
                                                    onclick={handleToggle}
                                                    variant="bare"
                                                    class="slds-m-bottom_xx-small">
                                                </lightning-button-icon>
                                            </div>
                                            <div style="min-height: 50px; max-height: 150px; overflow: auto; border: 1px solid #ccc; padding: 0.5rem; border-radius: 8px;">
                                                <lightning-formatted-rich-text 
                                                    value={transformationalOpportunityComment}>
                                                </lightning-formatted-rich-text>
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>
                        
                        </div>
                        
                    </template>
     
                    <template if:true={isCardVisible}>
                    
                        <template if:true={opportunities}>
                        
                            <div class="header-container">
                                <lightning-input
                                    type="search"
                                    label="Search Opportunities"
                                    placeholder="Search..."
                                    onchange={handleSearchChange}
                                    class="slds-size_small">
                                    </lightning-input>
                            </div>
                            <div class="slds-box slds-box_xx-small">
                                 <div class="custom-scroll" >
                                        <lightning-datatable
                                            key-field="Id"
                                            data={opportunities}
                                            columns={columns}
                                            onrowselection={handleRowSelection}
                                            selected-rows = {preselectedIds}>
                                        </lightning-datatable>
                                    </div>
                             </div>
                        
                            <div class = "slds-p-top_medium">
                                <lightning-input-rich-text
                                label="Comment for selected opportunities"
                                value={preSharedComment}
                                onchange={handleCommentChange}>
                            </lightning-input-rich-text>
                            </div>
                            <div class="button-group">
                                <lightning-button 
                                    label="Cancel" 
                                    variant="neutral" 
                                    onclick={handleCancel}>
                                </lightning-button>
                
                                <lightning-button 
                                    label="Save" 
                                    variant="brand" 
                                    class="slds-m-left_small"
                                    onclick={handleSave}>
                                </lightning-button>
                            </div>
                        
                    </template>
                </template>
                
        </template>
    </section>
  </div>

    
</template>
