<template>
    <section role="dialog" tabindex="-1" aria-label="Meaningful description of the modal content" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container" style="width:40%;">
            <template if:true={isModalHeaderRequired}>
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={falseHandler}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading--large slds-align--absolute-center">{modalHeader}</h2>
                </header>
            </template>
            <template if:false={isModalHeaderRequired}>
            <header class="slds-modal__header slds-modal__header_empty">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close">
                  <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                    <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
                  </svg>
                  <span class="slds-assistive-text">Close</span>
                </button>
            </header>
            </template>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <div class="slds-align_absolute-center">
                    <lightning-icon icon-name={iconName} size="small"></lightning-icon>&nbsp; 
                    <div>{bodyContent}</div>
                </div>
            </div>
            <footer class="slds-modal__footer">
                <div class="slds-align_absolute-center">
                    <lightning-button slot="actions" variant="brand" label={trueBtnLabel} title={trueBtnLabel} onclick={trueHandler}></lightning-button>&nbsp;&nbsp;&nbsp;
                    <lightning-button slot="actions" label={falseBtnLabel} title={falseBtnLabel} onclick={falseHandler}></lightning-button>
                    <!-- <button class="slds-button slds-button_neutral" onclick={falseHandler}>{falseBtnLabel}</button>
                    <button class="slds-button slds-button_brand" onclick={trueHandler}>{trueBtnLabel}</button> -->
                </div>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
