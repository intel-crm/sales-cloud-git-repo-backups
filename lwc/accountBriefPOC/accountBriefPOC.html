<template>
    <!-- Button to add a new row -->
    <lightning-button 
        label="Add Row" 
        onclick={handleAddRow}>
    </lightning-button>

    <!-- Dynamically render rows -->
    <template for:each={rows} for:item="row">
        <div key={row.id} class="row-container">
            <!-- Account Brief Summary -->
            <div class="input-group">
                <label class="custom-label" for={row.id}>Account Brief Summary</label>
                <lightning-input-rich-text 
                    value={row.Account_Brief_Summary__c}
                    onchange={handleFieldChange}
                    data-id={row.id}
                    data-field="Account_Brief_Summary__c">
                </lightning-input-rich-text>
            </div>

            <!-- Meeting Invite -->
            <div class="input-group">
                <label class="custom-label" for={row.id}>Meeting Invite</label>
                <lightning-input-rich-text 
                    value={row.Meeting_Invite__c}
                    onchange={handleFieldChange}
                    data-id={row.id}
                    data-field="Meeting_Invite__c">
                </lightning-input-rich-text>
            </div>

            <!-- Attendees -->
            <div class="input-group">
                <label class="custom-label" for={row.id}>Attendees</label>
                <lightning-input-rich-text 
                    value={row.Attendees__c}
                    onchange={handleFieldChange}
                    data-id={row.id}
                    data-field="Attendees__c">
                </lightning-input-rich-text>
            </div>
        </div>
    </template>

    <!-- Button to Save Rows -->
    <lightning-button 
        label="Save Rows" 
        onclick={handleSave}>
    </lightning-button>

    <!-- Button to Download PDF -->
    <lightning-button 
        label="Download PDF" 
        onclick={handleDownloadPDF}>
    </lightning-button>

    <!-- Display existing child records in a table format -->
    <template if:true={childRecords}>
        <lightning-card title="Existing Rows">
            <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_striped custom-table">
                <thead>
                    <tr>
                        <th>Account Brief Summary</th>
                        <th>Meeting Invite</th>
                        <th>Attendees</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={childRecords} for:item="childRecord">
                        <tr key={childRecord.Id}>
                            <td class="custom-cell">
                                <lightning-formatted-rich-text 
                                    value={childRecord.Account_Brief_Summary__c}>
                                </lightning-formatted-rich-text>
                            </td>
                            <td class="custom-cell">
                                <lightning-formatted-rich-text 
                                    value={childRecord.Meeting_Invite__c}>
                                </lightning-formatted-rich-text>
                            </td>
                            <td class="custom-cell">
                                <lightning-formatted-rich-text 
                                    value={childRecord.Attendees__c}>
                                </lightning-formatted-rich-text>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </lightning-card>
    </template>
</template>
