<template>

  <lightning-card title={reportname} icon-name="standard:report">
    <template if:true={hasData}>
      <template if:true={allrecordProcessed}>
        <c-export-as-c-s-v-lwc export-data={mainCopy} slot="actions" newdata-set-name={reportdatasetname}>
        </c-export-as-c-s-v-lwc>
      </template>
      <lightning-layout>
        <lightning-layout-item size="8" class="slds-p-around_small">
          <p>Total Mismatched Records : {mainCopy.length}
            <template if:false={allrecordProcessed}>
              <lightning-progress-ring value={progressPercentage} class="slds-p-top-medium slds-m-left_small"
                title="Progress" size="small">
              </lightning-progress-ring>
            </template>
          </p>

        </lightning-layout-item>
        <template if:true={allrecordProcessed}>
          <lightning-layout-item size="4" flexibility="auto" padding="horizontal-small slds-p-top_x-small"
            class="slds-text-align_right slds-p-bottom_small">
            <lightning-input placeholder="Seach by Account Name" type="text" value={inputValue} onchange={handleChange}>
            </lightning-input>
          </lightning-layout-item>
        </template>
      </lightning-layout>
      <lightning-layout class="slds-box">
        <lightning-layout-item flexibility="auto" size="12">
          <lightning-datatable key-field="id" show-row-number-column="true" columns={fields} data={tableData}
            hide-checkbox-column default-sort-direction={sortedDirection} sorted-direction={sortDirection}
            sorted-by={sortedBy} onsort={updateColumnSorting}>
          </lightning-datatable>
        </lightning-layout-item>
      </lightning-layout>
      <template if:false={searchFilter}>
        <template if:true={allrecordProcessed}>
          <div class="slds-p-around_small slds-align_absolute-center">
            <lightning-button variant="brand" label={prevBtnLbl} onclick={handlePrevious} disabled={loadPrev}
              style=" background-color: white; padding-right: 2px;">
            </lightning-button>
            <p class="slds-p-around_small">Showing {showingOfTotal} of {mainCopy.length}</p>
            <lightning-button variant="brand" label={nextBtnLbl} onclick={handleNext} disabled={loadMore}
              style="background-color: white;">
            </lightning-button>
          </div>
        </template>
      </template>
    </template>
    <div if:true={spinner} class="slds-spinner_inline spinner-padding">
      <lightning-spinner variant="brand" alternative-text="Loading Data" size="medium">
      </lightning-spinner>
    </div>
    <template if:false={spinner}>
      <template if:false={hasData}>
        <p class="slds-align_absolute-center">Error Encountered!</p>
      </template>
      <template if:true={noMismatchFlag}>
        <p class="slds-align_absolute-center">No Benefit Mismatch Observed</p>
      </template>
    </template>

  </lightning-card>

</template>
