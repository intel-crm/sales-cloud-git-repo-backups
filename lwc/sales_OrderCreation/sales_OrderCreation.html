                                              </span>  
                                              <span class="slds-assistive-text">Remove selected record</span>  
                                            </button>

                                            <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">

                <lightning-input-field field-name='AccountId' value={accountVal} required="true">

              <template if:true={isAccounthidden}>

              <!-- Custom Picklist For Order Reason -->
              <div class="slds-form-element slds-m-right_xx-small slds-m-left_xx-small">
                <label class="slds-form-element__label">
                  <template if:true={isAttributeRequired}>
                    <abbr title="required" class="requiredFont">* </abbr>
                  </template>

                </label>
                <div class="slds-form-element__control">

                  value={soldAccount.BillingCity}></lightning-input-field>
                <lightning-input-field field-name='Sales_SoldTo_Province_Txt__c' data-id="soldto" disabled="true"
                  value={soldAccount.BillingState}></lightning-input-field>

                  value={soldAccount.BillingCountryCode}></lightning-input-field>

                  value={soldAccount.Core_Direct_Distributor_Channel_Nm__c}></lightning-input-field>

                  value={soldAccount.BillingStateCode}></lightning-input-field>
                <lightning-input-field field-name='Sales_SoldTo_Zip_Txt__c' data-id="soldto" disabled="true"
                  value={soldAccount.BillingPostalCode}></lightning-input-field>

                  value={soldAccount.Core_Direct_Payment_Term_Nm__c}></lightning-input-field>

                <lightning-input-field field-name='Sales_ShipTo_Street_Dsc__c' data-id="shipto" disabled="true"

                <lightning-input-field field-name='Sales_ShipTo_Country_Txt__c' data-id="shipto" disabled="true"

              </template>

                <lightning-input-field field-name='Sales_Ship_To_Acct_Id__c' data-id="shipto" disabled="true"

                <lightning-input-field field-name='Sales_ShipTo_Zip_Txt__c' data-id="shipto" disabled="true"

                </lightning-input-field>
              </template>
            </div>
          </div>

              </template>
            </div>

            <div class="slds-size_1-of-2 slds-p-around_medium">
              <template if:true={isEndCustPresent}>
                <lightning-input-field field-name='Sales_End_Cust_Acct_Id__c' data-id="endCust" disabled="true"

              <br>
              <br>

                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                  </div>
                </div>
              </div>-->


            <div class= "spinner" >
                  <lightning-spinner alternative-text="Loading" variant="brand">

              </div>

          <!-- modal footer start-->

            <!--<button class="slds-button slds-button_neutral"  onclick={saveAndNewClick}>Save & New</button>&nbsp;-->
