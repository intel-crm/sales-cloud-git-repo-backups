<template>
    <template if:true={showModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCancel}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
         </button>
                    <h2 class="slds-text-heading_medium slds-text-align_center">New Account Plan</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">

                    <div class="slds-p-around_medium">

                        <!-- EVENT DETAILS -->
                        <div class="custom-section slds-p-around_small">
                            <div class="section-heading">
                                <label class="slds-text-heading_medium section-header-title custom-header">EVENT DETAILS</label>
                            </div>
                            <div class="slds-grid slds-wrap">
                                <div class="slds-col slds-size_1-of-3">
                                    <label class="custom-label">Event Engagement Name</label>
                                    <lightning-input label="Event Engagement Name" data-id="crmEventEngagementName"
                                        value={crmEventEngagementName} onchange={handleInputChange} variant="label-hidden"></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <label class="custom-label">Scheduled Start Time</label>
                                    <lightning-input type="datetime" label="Scheduled Start Time"
                                        data-id="crmScheduledStartTime" value={crmScheduledStartTime}
                                        onchange={handleInputChange} variant="label-hidden"></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <label class="custom-label">Scheduled End Time</label>
                                    <lightning-input type="datetime"  label="Scheduled End Time"
                                        data-id="crmScheduledEndTime" value={crmScheduledEndTime}
                                        onchange={handleInputChange} variant="label-hidden"></lightning-input>
                                </div>
                            </div>
                        </div>
                       </div>
                </div>
                <!-- Modal/Popup Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
                    <lightning-button class="slds-m-left_small" variant="neutral" label="Save and New"
                        onclick={handleSave}>
                    </lightning-button>
                    <lightning-button class="slds-m-left_small" variant="brand" label="Save" onclick={handleSave}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        </div>


        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
