<template>
    <div class="container">
        <div if:true={isLoaded}>
            <lightning-spinner style="position: fixed;" alternative-text="Loading..."></lightning-spinner>
            <div style="position: fixed;" class="slds-backdrop slds-backdrop_open"></div>
        </div>
        <header>
            <template if:true={showForm}>
                <div class="slds-card">
                    <lightning-layout horizontal-align="center" multiple-rows="true">
                        <lightning-layout-item flexibility="grow" size="12" small-device-size="12"
                            medium-device-size="10" large-device-size="10" padding="around-small">
                            <div style="text-align: center;font-size: large;">{pageHeaderTxt}</div>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
            </template>
        </header>
        <template if:true={showSPIFRestrictError}> 
            <lightning-layout horizontal-align="center" multiple-rows="true">
                <lightning-layout-item flexibility="grow" size="12" small-device-size="12"
                    medium-device-size="10" large-device-size="10" padding="around-small">
            <div class="slds-box slds-theme--warning" style="text-align: center;">
                <lightning-icon icon-name="utility:warning" size="medium"
                alternative-text="Error" class="iconContainer"></lightning-icon> &nbsp;
            <span class="slds-text-body_regular">
                <lightning-formatted-rich-text value={spifWarningError}>
                </lightning-formatted-rich-text>
            </span>
        </div> 
            </lightning-layout-item>
        </lightning-layout>    
            </template>
            <!--Added by Sai-->
            <template if:true={showExtAccBasedChannelMdfRestrictError}> 
                <lightning-layout horizontal-align="center" multiple-rows="true">
                    <lightning-layout-item flexibility="grow" size="12" small-device-size="12"
                        medium-device-size="10" large-device-size="10" padding="around-small">
                <div class="slds-box slds-theme--warning" style="text-align: center;">
                    <lightning-icon icon-name="utility:warning" size="medium"
                    alternative-text="Error" class="iconContainer"></lightning-icon> &nbsp;
                    <span class="slds-text-body_regular">
                        <lightning-formatted-rich-text value={extAccBasedCloneChannelMDFWarningError}>
                        </lightning-formatted-rich-text>
                    </span>
                </div> 
                </lightning-layout-item>
                </lightning-layout>    
            </template>
            <!--End of Sai's code-->

                <div class="slds-card">

                        <lightning-layout-item flexibility="grow" size="12" small-device-size="12"

                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12"

                                            <lightning-icon icon-name="utility:error" size="medium"

                                            </span>

                                </lightning-layout>

                                    </lightning-layout-item>

                                            selected-record={selectedAccount}
                                            disabled={campaignFieldDisabled.Core_MDF_Account__c}>
                                        </c-core_-m-d-f_-custom-lookup>
                                    </template>
                                    <template if:true={campaignFieldDisabled.Core_MDF_Account__c}>
                                        <lightning-input type="text" name="accName" value={selectedAccount.Name}

                                            required={campaignFieldLabel.Core_MDF_Account__c}
                                            disabled={campaignFieldDisabled.Core_MDF_Account__c}></lightning-input>
                                    </template>
                                </lightning-layout-item>
                                <template if:true={campaignFieldVisibility.Name}>

                                            value={campaignFieldValue.Name} label= "Campaign Name"
                                            required={campaignRequiredFields.Name}
                                            disabled={campaignFieldDisabled.Name}
                                            onchange={handleStandardFields}></lightning-input>
                                    </lightning-layout-item>
                                </template>                                
                                <template if:true={campaignFieldVisibility.Name__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12"
                                        medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-input type="text" maxlength="80" name="Name"
                                            field-level-help={campaignFieldHelpText.Name__c}
                                            value={campaignFieldValue.Name} label= "Campaign Name"
                                            required={campaignRequiredFields.Name__c}
                                            disabled={campaignFieldDisabled.Name__c}></lightning-input>
                                    </lightning-layout-item>
                                </template>
                                <template if:true={campaignFieldVisibility.Description}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12"

                                            value={campaignFieldValue.Description}
                                            label={campaignFieldLabel.Description}
                                            required={campaignRequiredFields.Description}
                                            disabled={campaignFieldDisabled.Description}
                                            onchange={handleStandardFields}></lightning-textarea>
                                    </lightning-layout-item>
                                </template>
                                <template if:true={campaignFieldVisibility.Description__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12"
                                        medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-textarea name="Description" maxlength="32000"

                                            label={campaignFieldLabel.Description__c}
                                            required={campaignRequiredFields.Description__c}
                                            disabled={campaignFieldDisabled.Description__c}></lightning-textarea>
                                    </lightning-layout-item>
                                </template>

                                        disabled={campaignFieldDisabled.StartDate}

                                </template>

                                    </lightning-layout-item>
                                </template>
                                <template if:true={budgetWarning.Core_MDF_Opal_Budget_Type_Txt__c}>

                                        <lightning-formatted-text class="customHelptext" value={ccfBudgetWarningMessage}></lightning-formatted-text>
                                    </lightning-layout-item>
                                </template> 
                                <template if:true={selectPartnerBudgetTypeWarning.Core_MDF_Opal_Budget_Type_Txt__c}>

                                        <lightning-formatted-text class="customHelptext" value={selectPartnerBudgetTypeError}></lightning-formatted-text>
                                    </lightning-layout-item>
                                </template>
                                <template if:true={showAvailableBudgets}>

                                        values={availableBudgetValues} 
                                        onbudgetselection={onBudgetSelection}
                                        ></c-core_-m-d-f_-campaign_-available_-budgets_-picklist>
                                       <br/>
                                            <template if:true={startEndDateErr}> 
                                            <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12"
                                            medium-device-size="12" large-device-size="12" padding="around-small">
                                            <lightning-formatted-text class="customHelptext1"
                                            value={startEndDateSoftWarning}></lightning-formatted-text>
                                        </lightning-layout-item>
                                    
                                    </template>
                                </lightning-layout-item>

                                        <lightning-formatted-text class="customHelptext" value={availableBudgetWarningMessage}></lightning-formatted-text>
                                    </lightning-layout-item>
                                </template>

                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={noBudgetsWarning}>

                                        <lightning-formatted-text class="customHelptext" value={campaignBudgetsError}></lightning-formatted-text>
                                    </lightning-layout-item>
                                </template>

                                        <lightning-formatted-text class="customHelptext" value={budgetAmountDecreasedErr}></lightning-formatted-text>
                                    </lightning-layout-item>
                                </template>

                                </template>

                                        <lightning-textarea name="Core_MDF_Hero_Product__c" maxlength="255" field-level-help={campaignFieldHelpText.Core_MDF_Hero_Product__c} value={campaignFieldValue.Core_MDF_Hero_Product__c} label={campaignFieldLabel.Core_MDF_Hero_Product__c} required={campaignRequiredFields.Core_MDF_Hero_Product__c} disabled={campaignFieldDisabled.Core_MDF_Hero_Product__c} ></lightning-textarea>
                                    </lightning-layout-item>
