<template>
    <div class="container">
        <div if:true={isLoaded}>
            <lightning-spinner style="position: fixed;" alternative-text="Loading..."></lightning-spinner>
            <div style="position: fixed;" class="slds-backdrop slds-backdrop_open"></div>
        </div>
        <header>
            <template if:true={showForm}>
                <div class="slds-card">
                    <lightning-layout horizontal-align="center" multiple-rows="true">
                        <lightning-layout-item flexibility="grow" size="12" small-device-size="12" medium-device-size="10" large-device-size="10" padding="around-small">
                            <div style="text-align: center;font-size: large;">{pageHeaderTxt}</div>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
            </template>
        </header>
        <div class="body">
            <template if:true={showForm}>
                <div class="slds-card">
                    <lightning-layout horizontal-align="center" multiple-rows="true">
                        <lightning-layout-item flexibility="grow" size="12" small-device-size="12" medium-device-size="10" large-device-size="10" padding="around-small">
                            <template if:true={error}>
                                <lightning-layout horizontal-align="center" multiple-rows="true">
                                    <lightning-layout-item flexibility="no-grow" size="12"  small-device-size="12" medium-device-size="12" large-device-size="12" padding="around-small">
                                        <div class="slds-box slds-theme--error" style="text-align: center;">
                                            <lightning-icon icon-name="utility:error" size="medium" alternative-text="Error" class="iconContainer"></lightning-icon> &nbsp;
                                            <span class="slds-text-body–regular">
                                                <lightning-formatted-rich-text value={error} ></lightning-formatted-rich-text>
                                            </span>
                                        </div>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </template>
    
                            <lightning-layout multiple-rows="true">
                                <template if:true={campaignFieldVisibility.Core_MDF_Program__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-combobox
                                            name="Core_MDF_Program__c"
                                            field-level-help={campaignFieldHelpText.Core_MDF_Program__c}
                                            label={campaignFieldLabel.Core_MDF_Program__c}
                                            value={campaignFieldValue.Core_MDF_Program__c}
                                            disabled={campaignFieldDisabled.Core_MDF_Program__c}
                                            options={campaignPicValues.Core_MDF_Program__c}
                                            required={campaignRequiredFields.Core_MDF_Program__c}>
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                </template>
                                <template if:true={showForm}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">    
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={campaignFieldVisibility.Name}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-input type="text" maxlength="80" name="Name" field-level-help={campaignFieldHelpText.Name} value={campaignFieldValue.Name} label= "Campaign Name" required={campaignRequiredFields.Name} disabled={campaignFieldDisabled.Name} ></lightning-input>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={campaignFieldVisibility.Core_MDF_Account__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <template if:false={campaignFieldDisabled.Core_MDF_Account__c}>
                                            <c-core_-m-d-f_-custom-lookup label={campaignFieldLabel.Core_MDF_Account__c} 
                                            required={campaignRequiredFields.Core_MDF_Account__c} 
                                            obj-name="Account" 
                                            search-placeholder="Search Accounts..." 
                                            icon-name="standard:account" 
                                            onlookupselected={handleSelectedAccount} 
                                            filter={accountQueryFilter} 
                                            selected-record={selectedAccount} 
                                            disabled={campaignFieldDisabled.Core_MDF_Account__c} ></c-core_-m-d-f_-custom-lookup>
                                        </template>
                                        <template if:true={campaignFieldDisabled.Core_MDF_Account__c}>
                                            <lightning-input type="text" name="accName" value={selectedAccount.Name} label={campaignFieldLabel.Core_MDF_Account__c} required={campaignFieldLabel.Core_MDF_Account__c} disabled={campaignFieldDisabled.Core_MDF_Account__c} ></lightning-input>
                                        </template>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={campaignFieldVisibility.StartDate}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-input type="date" 
                                        name="StartDate"
                                        class="startDateValidation"
                                        field-level-help={campaignFieldHelpText.StartDate} 
                                        value={campaignFieldValue.StartDate} 
                                        label={campaignFieldLabel.StartDate} 
                                        required={campaignRequiredFields.StartDate} 
                                        disabled={campaignFieldDisabled.StartDate}
                                        onchange={handleDateChanges}></lightning-input>
                                        <template if:true={showCCFDCFStartDateError}>
                                            <div class="slds-text-color_error slds-m-top_xx-small">
                                                {beforeCCFDCFDateText}{formattedCCFDCFBlockDate}.
                                                <a href="javascript:void(0);" onclick={navigateToActivityComponent}>{afterCCFDCFDateText}</a>
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={campaignFieldVisibility.EndDate}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-input class = "dateValidation" 
                                        type="date" 
                                        name="EndDate" 
                                        field-level-help={campaignFieldHelpText.EndDate} 
                                        value={campaignFieldValue.EndDate} 
                                        label={campaignFieldLabel.EndDate} 
                                        required={campaignRequiredFields.EndDate} 
                                        disabled={campaignFieldDisabled.EndDate}
                                        onchange={handleDateChanges}>
                                        </lightning-input>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={campaignFieldVisibility.Core_MDF_Integrated_Campaign__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
    
                                        <lightning-combobox 
                                            name="Core_MDF_Integrated_Campaign__c"
                                            label={campaignFieldLabel.Core_MDF_Integrated_Campaign__c}
                                            value={campaignFieldValue.Core_MDF_Integrated_Campaign__c}
                                            options={campaignPicValues.Core_MDF_Integrated_Campaign__c}
                                            disabled={campaignFieldDisabled.Core_MDF_Integrated_Campaign__c}
                                            required={campaignRequiredFields.Core_MDF_Integrated_Campaign__c}
                                            onchange={handleIntCampChange}>
                                        </lightning-combobox>
                                    </lightning-layout-item>
                        
                                </template> 
    
                                <template if:true={campaignFieldVisibility.Core_MDF_Integrated_Campaign_Details__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-textarea 
                                        class="textAreaOrPicklistFields"
                                        name="Core_MDF_Integrated_Campaign_Details__c" 
                                        maxlength="255" 
                                        field-level-help={campaignFieldHelpText.Core_MDF_Integrated_Campaign_Details__c} 
                                        value={campaignFieldValue.Core_MDF_Integrated_Campaign_Details__c} 
                                        label={campaignFieldLabel.Core_MDF_Integrated_Campaign_Details__c} 
                                        required={campaignRequiredFields.Core_MDF_Integrated_Campaign_Details__c} 
                                        disabled={campaignFieldDisabled.Core_MDF_Integrated_Campaign_Details__c} ></lightning-textarea>
                                    </lightning-layout-item>
                                </template>

                                <template if:true={campaignFieldVisibility.Core_MDF_Strategic_Marketing_Fund_Ind__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-input type="checkbox" 
                                        name="Core_MDF_Strategic_Marketing_Fund_Ind__c"
                                        field-level-help={campaignFieldHelpText.Core_MDF_Strategic_Marketing_Fund_Ind__c} 
                                        checked={campaignFieldValue.Core_MDF_Strategic_Marketing_Fund_Ind__c} 
                                        label={campaignFieldLabel.Core_MDF_Strategic_Marketing_Fund_Ind__c} 
                                        required={campaignRequiredFields.Core_MDF_Strategic_Marketing_Fund_Ind__c} 
                                        disabled={campaignFieldDisabled.Core_MDF_Strategic_Marketing_Fund_Ind__c}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={campaignFieldVisibility.Core_MDF_External_Visibility_Date__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-input class="memberVisibilityDate" type="date" name="Core_MDF_External_Visibility_Date__c" field-level-help={campaignFieldHelpText.Core_MDF_External_Visibility_Date__c} value={campaignFieldValue.Core_MDF_External_Visibility_Date__c} label={campaignFieldLabel.Core_MDF_External_Visibility_Date__c} required={campaignRequiredFields.Core_MDF_External_Visibility_Date__c} 
                                        disabled={campaignFieldDisabled.Core_MDF_External_Visibility_Date__c}
                                        onchange={handleDateChanges}></lightning-input>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={campaignFieldVisibility.Core_MDF_Opal_Budget_Type_Txt__c}>

                                        <lightning-dual-listbox
                                            class="textAreaOrPicklistFields"
                                            name="Core_MDF_Opal_Budget_Type_Txt__c"
                                            label={campaignFieldLabel.Core_MDF_Opal_Budget_Type_Txt__c}
                                            source-label={sourceLabelStr}
                                            selected-label={selectedLabelStr}
                                            value ={campaignFieldValue.Core_MDF_Opal_Budget_Type_Txt__c}
                                            options={campaignPicValues.Core_MDF_Opal_Budget_Type_Txt__c}
                                            onchange={handleBudgetTypeChange} 
                                            disabled={campaignFieldDisabled.Core_MDF_Opal_Budget_Type_Txt__c}
                                            required={campaignRequiredFields.Core_MDF_Opal_Budget_Type_Txt__c}>
                                        </lightning-dual-listbox>
                                    </lightning-layout-item>
                                </template>
                                

                                <template if:true={loadBudgetTypefields}>  
                                <template if:false={showAvailableBudgets}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">

                                </template>
    
                                <template if:true={budgetWarning.Core_MDF_Opal_Budget_Type_Txt__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="12" large-device-size="12" padding="around-small">
                                        <lightning-formatted-text class="customHelptext" value={ccfBudgetWarningMessage}></lightning-formatted-text>
                                    </lightning-layout-item>
                                </template> 

                                <template if:true={selectPartnerBudgetTypeWarning.Core_MDF_Opal_Budget_Type_Txt__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="12" large-device-size="12" padding="around-small">
                                        <lightning-formatted-text class="customHelptext" value={selectPartnerBudgetTypeError}></lightning-formatted-text>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={showAvailableBudgets}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <c-core_-m-d-f_-campaign_-available_-budgets_-picklist picklistlabel={availableBudgetsLabel} 
                                        values={availableBudgetValues} 
                                        onbudgetselection={onBudgetSelection}
                                        ></c-core_-m-d-f_-campaign_-available_-budgets_-picklist>
                                    </lightning-layout-item>
                                </template>

                                <template if:true={showApprovalCheckbox}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-input type="checkbox" 
                                        name="Core_MDF_Activity_Approval_Required_Ind__c"
                                        field-level-help={campaignFieldHelpText.Core_MDF_Activity_Approval_Required_Ind__c} 
                                        checked={isApprovalRequired} 
                                        label={campaignFieldLabel.Core_MDF_Activity_Approval_Required_Ind__c} 
                                        required={campaignRequiredFields.Core_MDF_Activity_Approval_Required_Ind__c} 
                                        disabled={isApprovalCheckboxDisabled}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={availableBudgetWarning.Core_MDF_Opal_Budget_Type_Txt__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="12" large-device-size="12" padding="around-small">
                                        <lightning-formatted-text class="customHelptext" value={availableBudgetWarningMessage}></lightning-formatted-text>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={showCampaignBudgets}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="12" padding="around-small" style="z-index: 1;">
                                        <c-core_-m-d-f_-campaign-budgets cmp-budgets-error-to-retain-map = {cmpBudgetsErrorToRetainMap} campaign-budgets={campaignBudgets} oncampaignbudgets= {onCampaignBudgets}  onerror = {handleBudgetError} rec-mode={mode} rec-status={status} old-campaign-budgets={campaignBudgets} activity-budgets={budgetsOnActiveActivities} 
                                        activity-amt-budgets={activityBudgetAmt} camp-id={recordId}> </c-core_-m-d-f_-campaign-budgets>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={noBudgetsWarning}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="12" large-device-size="12" padding="around-small">
                                        <lightning-formatted-text class="customHelptext" value={campaignBudgetsError}></lightning-formatted-text>
                                    </lightning-layout-item>
                                </template>
                                 <!-- US1017349 - changes start -->
                               <!-- <template if:true={isBudgetAmountDecreased}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="12" large-device-size="12" padding="around-small">
                                        <lightning-formatted-text class="customHelptext" value={budgetAmountDecreasedErr}></lightning-formatted-text>
                                    </lightning-layout-item>
                                </template>-->
                                 <!-- US1017349 - changes end -->
                                <template if:true={showLegacyFields}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-input type="number" 
                                        name="Core_MDF_First_Year_Budget_Amount__c" 
                                        step="0.01" maxlength="16"
                                        formatter="currency"
                                        field-level-help={campaignFieldHelpText.Core_MDF_First_Year_Budget_Amount__c} 
                                        value={campaignFieldValue.Core_MDF_First_Year_Budget_Amount__c} 
                                        label={campaignFieldLabel.Core_MDF_First_Year_Budget_Amount__c} 
                                        required={campaignRequiredFields.Core_MDF_First_Year_Budget_Amount__c}
                                        disabled={campaignFieldDisabled.Core_MDF_First_Year_Budget_Amount__c}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={showLegacyFields}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-input type="number" 
                                        name="Core_MDF_Second_Year_Budget_Amount__c" 
                                        step="0.01" maxlength="16"
                                        formatter="currency"
                                        field-level-help={campaignFieldHelpText.Core_MDF_Second_Year_Budget_Amount__c} 
                                        value={campaignFieldValue.Core_MDF_Second_Year_Budget_Amount__c} 
                                        label={campaignFieldLabel.Core_MDF_Second_Year_Budget_Amount__c} 
                                        required={campaignRequiredFields.Core_MDF_Second_Year_Budget_Amount__c}
                                        disabled={campaignFieldDisabled.Core_MDF_Second_Year_Budget_Amount__c}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={showLegacyFields}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-combobox
                                            name="Core_MDF_Reimbursement_Rate__c"
                                            field-level-help={campaignFieldHelpText.Core_MDF_Reimbursement_Rate__c}
                                            label={campaignFieldLabel.Core_MDF_Reimbursement_Rate__c}
                                            value={campaignFieldValue.Core_MDF_Reimbursement_Rate__c}
                                            options={campaignPicValues.Core_MDF_Reimbursement_Rate__c}
                                            onchange={handleReimbursementRateChange} 
                                            disabled={campaignFieldDisabled.Core_MDF_Reimbursement_Rate__c} 
                                            required={campaignRequiredFields.Core_MDF_Reimbursement_Rate__c}>
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={showLegacyFields}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">    
                                    </lightning-layout-item>
                                </template>

                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-textarea name="Core_MDF_Key_Performance_Indicator__c" maxlength="255" field-level-help={campaignFieldHelpText.Core_MDF_Key_Performance_Indicator__c} value={campaignFieldValue.Core_MDF_Key_Performance_Indicator__c} label={campaignFieldLabel.Core_MDF_Key_Performance_Indicator__c} required={campaignRequiredFields.Core_MDF_Key_Performance_Indicator__c} disabled={campaignFieldDisabled.Core_MDF_Key_Performance_Indicator__c} class="textAreaOrPicklistFields"></lightning-textarea>
                                    </lightning-layout-item>
                                </template>

                                    </lightning-layout-item>
                                </template>
    
                                <template if:true={campaignFieldVisibility.Core_MDF_Hero_Product__c}>
                                    <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
                                        <lightning-textarea name="Core_MDF_Hero_Product__c" maxlength="255" field-level-help={campaignFieldHelpText.Core_MDF_Hero_Product__c} value={campaignFieldValue.Core_MDF_Hero_Product__c} label={campaignFieldLabel.Core_MDF_Hero_Product__c} required={campaignRequiredFields.Core_MDF_Hero_Product__c} disabled={campaignFieldDisabled.Core_MDF_Hero_Product__c} class="textAreaOrPicklistFields"></lightning-textarea>
                                    </lightning-layout-item>
                                </template>
                                <template if:true={showLegacyFields}>

                                        <lightning-input type="number"

                                        formatter="currency"
                                        field-level-help={campaignFieldHelpText.Core_MDF_Spending_Cap_Amt__c}

                                    </lightning-layout-item>
                                </template>

                            <template if:true={priorityPecFlag}>

                                    </lightning-layout-item>
                                </template>
                            </template>

                                        <lightning-combobox

                                            name="Core_MDF_Priority__c"
                                            label={campaignFieldLabel.Core_MDF_Priority__c}
                                            source-label={sourceLabelStr}
                                            selected-label={selectedLabelStr}
                                            value ={campaignFieldValue.Core_MDF_Priority__c}

                                            disabled={campaignFieldDisabled.Core_MDF_Priority__c}

                                        disabled={campaignFieldDisabled.Core_MDF_Priority_Percentage__c}
                                        onchange={handlePriorityPctChange}></lightning-input>
                                    </lightning-layout-item>
                                </template>

                                <template if:true={campaignFieldVisibility.Core_MDF_Priority_2_nm__c}>

                                            class="SecondPriority"

                                            source-label={sourceLabelStr}
                                            selected-label={selectedLabelStr}

                                    min="0" max="100" step="0.01"

                                    onchange={handlePriorityPctChange}></lightning-input>
                                </lightning-layout-item>
                            </template>

                                <template if:true={campaignFieldVisibility.Core_MDF_Priority_3_nm__c}>
