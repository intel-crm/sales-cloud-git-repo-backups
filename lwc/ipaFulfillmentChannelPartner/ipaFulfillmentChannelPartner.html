<template>
    <lightning-card>
        <template for:each={itemList} for:item="item" for:index="index">
            <lightning-record-edit-form key={item.id}>
                <lightning-messages> </lightning-messages>
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2"
                        padding="around-small">
                        <p>Fulfillment Channel Partner</p>
                        <select class="slds-select" onchange={selectionChangeHandler}>
                        <option value="Select">Select</option>
                        <template for:each={copmanyList} for:item="option">
                            <option key={option.Id} class="uiInputSelectOption" value={option.Name}>{option.Name}</option>
                        </template>
                        </select>
                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2"
                        padding="around-small">
                        <p>Region</p>
                        <select class="slds-select" onchange={selectionChangeHandler}>
                        <option value="Select">Select</option>
                        <template for:each={regionList} for:item="option">
                            <option key={option.Id} class="uiInputSelectOption" value={option.Name}>{option.Name}</option>
                        </template>
                        </select>
                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2"
                        padding="around-small">
                        <div class="slds-p-top_medium">
                            <lightning-icon icon-name="action:new" access-key={item.id} id={index}
                                alternative-text="Add Row" size="xx-small" title="Add Row" onclick={addRow}>
                            </lightning-icon>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>

            </lightning-record-edit-form>
        </template>
        <div class="slds-p-around_medium">
            <lightning-input type="text" label="If not found enter Fulfillment Name:" placeholder="Company Name"></lightning-input>
        </div>
        <div class="slds-p-around_medium">
            <lightning-input type="url" placeholder="Website URL"></lightning-input>
        </div>
        <div class="slds-p-around_medium">
            <p>Region</p><br/>
                        <select class="slds-select" onchange={selectionChangeHandler}>
                        <option value="Select">Select</option>
                        <template for:each={regionList} for:item="option">
                            <option key={option.Id} class="uiInputSelectOption" value={option.Name}>{option.Name}</option>
                        </template>
                        </select>
        </div>
        </br>
    </lightning-card>
</template>
