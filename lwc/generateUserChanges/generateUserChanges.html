<template>
    <lightning-card title="Generate User Changes">
        <div class="container">
                <div class="input-section">
                    <lightning-input
                        label="Select User"
                        value={username}
                        onchange={handleUsernameChange}
                        placeholder="Enter Username">
                    </lightning-input>
                </div>
                <div class="button-section">
                    <lightning-button
                        label="Generate User Changes"
                        onclick={handleSearch}
                        class="slds-m-left_x-small">
                    </lightning-button>
                </div>
        </div>
        <template if:true={auditTrails}>
            <div>
                <lightning-datatable
                    key-field="id"
                    data={auditTrails}
                    columns={columns}>
                </lightning-datatable>
                <div class="bottom-button-section">
                        <lightning-button
                            variant="brand"
                            label="Download File"
                            onclick={handleDownload}
                            class="slds-m-left_x-small">
                        </lightning-button>
                        <lightning-button
                            variant="success"
                            label="Create User Story"
                            onclick={handleCreate}
                            class="slds-m-left_x-small">
                        </lightning-button>
                </div>
            </div>
        </template>
        <template if:true={error}>
            <div class="slds-text-color_error">{error}</div>
        </template>
    </lightning-card> 
</template>
