<template>
    <template if:true={loaded}>
        <div class="slds-spinner_container">
            <div class="slds-spinner--brand  slds-spinner slds-spinner--small slds-is-relative" role="alert">
              <span class="slds-assistive-text">Loading...</span>
              <div class="slds-spinner__dot-a"></div>
              <div class="slds-spinner__dot-b"></div>
            </div>
        </div>
    </template>

    <template if:false={loaded}>
        <div style="padding: 5px !important;" class="slds-grid">
            <div class="slds-text-heading_medium slds-align_left slds-size_2-of-6" style="padding: 5px;">
                New Request
            </div>
            <lightning-input type="checkbox" label="Submitting request for myself" value=true checked name="self"
                class="self slds-size_2-of-6" style="padding: 7px;" onchange={handleSelfSelectionchange}>
            </lightning-input>
            <lightning-input type="checkbox" label="Submitting request for Others" value=false name="others"
                class="others slds-size_2-of-6" style="padding: 7px;" onchange={handleSelfSelectionchange}>
            </lightning-input>
        </div>
        <lightning-record-edit-form object-api-name='Account_Create_Request__c' layout-type="Full" columns="2"
            onsuccess={handleSuccess} onsubmit={handleSubmit} onerror={handleError} onload={handleLoad}>
            <template if:true={selected}>
                <div class=" slds-theme--shade" style="padding: 5px;">
                    <div class="slds-text-heading_small">
                        <b>Requesting For</b>
                    </div>
                </div>
                <div class="slds-col slds-size_2-of-6 slds-p-around_small slds-p-bottom_none slds-p-top_none"
                    style="padding: 5px;margin-bottom:10px">
                    <c-lwc-custom-lookup-user-generic onremove={selectedRecord} onselected={selectedRecord}>
                    </c-lwc-custom-lookup-user-generic>
                </div>

            </template>
            <lightning-card>
                <div class=" slds-theme--shade" style="padding: 5px;">
                    <div class="slds-text-heading_small">
                        <b>Account Information</b>
                    </div>
                </div>
                <lightning-layout multiple-rows="true">
                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                    small-device-size="12">
                    <abbr title="required" class="slds-required">*</abbr>
                        <Label for ="accName">Customer Name - English</Label>
                        <lightning-input-field class="Name" id="accName" field-name="Account_Name__c" onchange={handleFieldChange} required variant="label-hidden">
                        </lightning-input-field>
                    </lightning-layout-item>
                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                    small-device-size="12">
                        <lightning-input-field class="processType" field-name="Process_Type__c" value={acctreasontrail} disabled>
                        </lightning-input-field>
                    </lightning-layout-item>

                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        
                        <lightning-input-field field-name="Core_Alternate_Name_Language__c" onchange={handleFieldChange} >
                            
                        </lightning-input-field>
                    </lightning-layout-item>

                    
                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        <Label for ="locallang">Customer Name - Local Language</Label>
                        <lightning-input-field field-name="Core_Alternate_Language_Name__c" class="AltLangName" id = 'locallang' onchange={handleFieldChange} value={accountNameLocalLan} disabled={disabledLocalLang} variant="label-hidden" required>
                        </lightning-input-field>
                    </lightning-layout-item>

                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                    small-device-size="12">
                    <lightning-input-field class="digitalIdentifier" field-name="Digital_Identifier_Type__c" onchange={handleFieldChange} required>
                    </lightning-input-field>  
                    </lightning-layout-item>
                    
                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                    small-device-size="12">
                    <template if:false={disabledDigital}>
                        <abbr title="required" class="slds-required">*</abbr>
                    </template>
                        <Label for ="digital">Digital Identifier Value</Label>
                        <lightning-helptext content="If a customer website cannot be found, you can enter N/A"></lightning-helptext>
                        <lightning-input-field class="digitalIdentifierVal" field-name="Digital_Identifier_Value__c" id = 'digital' onchange={handleFieldChange} value={digitalIdentifierVal} disabled={disabledDigital} variant="label-hidden" required>      
                        </lightning-input-field>
                    </lightning-layout-item>

                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        <lightning-input-field class="Industry" field-name="Industry__c" onchange={handleFieldChange} required>
                        </lightning-input-field>
                    </lightning-layout-item>

                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        <lightning-input-field class="SubIndustry" field-name="Core_Sub_Industry__c" onchange={handleFieldChange} required>
                        </lightning-input-field>
                    </lightning-layout-item>

                    <template if:true={displaySalesgroup}>
                        <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                            small-device-size="12">
                            <lightning-input-field value={Value} class="SalesGrp" field-name="Core_Sales_Groups__c" onchange={handleFieldChange} required>
                            </lightning-input-field>
                        </lightning-layout-item>
                    </template>

                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        <lightning-input-field class="TaxId" field-name="Tax_Id__c" onchange={handleFieldChange}>
                        </lightning-input-field>
                    </lightning-layout-item>

                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        <lightning-input-field class="AccountCoverage" field-name="Core_Account_Primary_Coverage__c" onchange={handleFieldChange} required>
                        </lightning-input-field>
                    </lightning-layout-item>

                    
                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        <lightning-input-field class="AccountCategory" field-name="Core_Account_Category__c"
                            onchange={handleFieldChange} required>
                        </lightning-input-field>
                    </lightning-layout-item>
                    

                    
                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        <lightning-input-field class="AccountLevel" field-name="Core_Account_Level__c"
                            onchange={handleFieldChange} >
                        </lightning-input-field>
                    </lightning-layout-item>
                    

                </lightning-layout>

                <div class=" slds-theme--shade" style="padding: 5px;">
                    <div class="slds-text-heading_small">
                        <b>Address Information</b>
                    </div>
                </div>

         <lightning-layout multiple-rows="true">
                 <lightning-layout-item padding="around-small" size="12" large-device-size="12" medium-device-size="12"
                small-device-size="12">
                <abbr title="required" class="slds-required">*</abbr>
                        <Label for ="address">Primary Address</Label>
                    <lightning-input-address class ="Address" field-name="Address__c" id="address"
                    street-label="Primary Street"
                    city-label="Primary City"
                    country-label="Primary Country/Region"
                    province-label="Primary State/Province"
                    postal-code-label="Primary Postal Code" 
                    street={addressAddress.street}
                    city={addressAddress.city}
                    country={addressAddress.Country}
                    province={addressAddress.province}
                    postal-code={addressAddress.postalCode}
                    country-options={getCountryOptions}
                    province-options={getStateOptions}
                    onchange={pickListChangeHandler}
                    ></lightning-input-address> 
                </lightning-layout-item> 
            </lightning-layout>
            <div class=" slds-theme--shade" style="padding: 5px;">
                <div class="slds-text-heading_small">
                    <b>Additional Attributes</b>
                </div>
            </div>

            <lightning-layout multiple-rows="true">
                    
                <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                    small-device-size="12">
                
               
                </lightning-layout-item>

                <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                small-device-size="12">
                  
                </lightning-layout-item>
            </lightning-layout>

                <lightning-layout multiple-rows="true">

                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        <lightning-input-field class="globaAcct" field-name="Global_Account__c"
                            onchange={handleFieldChange} required>
                        </lightning-input-field>
                    </lightning-layout-item>
                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        <lightning-input-field field-name="Requestor_WWID__c" value={UserWWID} disabled="true">
                        </lightning-input-field>
                    </lightning-layout-item>
                </lightning-layout>
                <lightning-layout multiple-rows="true">
                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        <lightning-input-field field-name="Requestor_Name__c" value={UserName} disabled="true">
                        </lightning-input-field>
                    </lightning-layout-item>

                    <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                        small-device-size="12">
                        <lightning-input-field field-name="Requestor_Email__c" value={UserEmail} disabled="true">
                        </lightning-input-field>
                    </lightning-layout-item>
                     <!-- <lightning-layout-item padding="around-small" size="6" large-device-size="6" medium-device-size="6"
                    small-device-size="12">
                        <lightning-input-field field-name="OwnerId" value={OwnerId} disabled="true" hidden>
                        </lightning-input-field> 
                    </lightning-layout-item>  -->
                </lightning-layout>
                <div>
                    <!-- <div if:true={loaded}>
                    <lightning-spinner alternative-text="Loading"></lightning-spinner>
                </div> -->
                    <div class="inlineFooter">

                <lightning-button-group>
                    <lightning-button 
                        label="Back"
                        onclick={handleBackButtonClick}>
                    </lightning-button>
                    <lightning-button
                    variant="brand"
                    type="submit"
                    label="Submit"
                    onclick={handleSubmit1}
                    disabled={showDuplicates}>
                    </lightning-button> 
                        
                    
                </lightning-button-group>
            </div>

        </div><!-- 
            <template if:true={loaded}>
                <lightning-spinner alternative-text="Loading" ></lightning-spinner>
            </template>
            -->
        </lightning-card>
        
    </lightning-record-edit-form>
    <template if:true={spinLoad}>
        <lightning-spinner class="slds-is-fixed" alternative-text="Loading1"></lightning-spinner>
    </template>
    <template if:true={showDuplicates}>
        <div class=" slds-theme--shade" style="padding: 10px;">
            <div class="slds-text-heading_small">
                <b>Matching Results</b>
            </div>
        </div>
        <div class="slds-text-color_error" style="padding-left: 14px; padding-top:8px;">ERROR! Account Match Found</div>
        <div style="padding-left: 14px;"><b>. </b>An account matching the customer name & address you entered has been found. You can’t submit this new request as it is a duplicate.</div>
        <div style="padding-left: 14px;"><b>. </b>Please review the below matching results to see if the account is listed in the “Accounts” section and available for you to select and use or if the account has been requested and is pending review in the account request queue.</div>
        <div style="padding-left: 14px;"><b>. </b>If the match is to another account request, please check back once the request is complete and you will be able to select and use the new account.</div>
        <template if:true={accountDuplicate}>
            <div class="slds-p-around_medium">
                <p style="font-size: 16px; margin-bottom:8px; font-weight: bold;">Accounts</p>
                <lightning-datatable
                key-field="Id"
                data={formattedRecordsAccount}
                columns={acctColumns}
                hide-checkbox-column>
                </lightning-datatable>
            </div>
        </template>
        <template if:true={accountRequestDuplicate}>
            <div class="slds-p-around_medium">
                <p style="font-size: 16px; margin-bottom:8px; font-weight: bold;">PENDING Requests in Account Request Queue</p>
                <lightning-datatable
                key-field="Id"
                data={formattedRecordsAccountRequest}
                columns={accRequestColumns}
                hide-checkbox-column>
                </lightning-datatable>
            </div>
        </template>
    </template>
</template>


</template>
