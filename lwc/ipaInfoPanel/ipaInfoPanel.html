<template>
  <lightning-card >
    
      <lightning-layout  class="slds-p-around_large" multiple-rows="true">        
          
      <div class="demo-only demo-only--sizing slds-grid slds-wrap">
        <template for:each={ipaInfoShare} for:item="infoShare">
          <div key={infoShare.label} class="slds-size_1-of-3 slds-small-size--1-of-1 slds-medium-size--1-of-3 slds-max-small-size--1-of-1">
            <div class=" slds-box_x-small slds-text-align_center slds-m-around_x-small">
                <div class="slds-list_horizontal">
                  <div class=" slds-p-right_small slds-m-top_xx-small">
                   <img  class="img1" src={infoShare.resource}></img>
                  </div>
                  <div>
                    <c-ipa-link external-url={infoShare.url} label={infoShare.label} analytics-page=""
                    class-name="color-white inverse" class="slds-text-heading_medium slds-var-m-bottom_medium  slds-text-color_inverse"></c-ipa-link>
                    <p class="slds-text-color_inverse slds-text-align_center slds-is-static">{infoShare.description}</p>                  
                  </div>
                 </div>
            </div>
          </div>
        </template>  

        </div>
      
      </lightning-layout>
    
  </lightning-card>
</template>
