<template>
  <div class="mainbackground">
    <div class="container">
      <h3 class="heading slds-align_absolute-center slds-p-vertical_large">
        {labels.headline}
      </h3>
      <div class="slds-grid slds-wrap slds-p-vertical_medium">
        <template for:each={ipaInfoShare} for:item="infoShare">
          <div key={infoShare.label} class="slds-size_1-of-3 slds-small-size--1-of-1 slds-medium-size--1-of-3 slds-max-small-size--1-of-1">
            <div class="slds-box_x-small slds-align_absolute-center slds-text-align_center slds-m-around_x-small">
                <div class="slds-list_horizontal">
                  <template if:true={showLogo}>
                    <div aria-hidden="true" class= "slds-p-right_small slds-m-top_xx-small">
                      <img class="img1" src={infoShare.resource} aria-hidden="true"></img>
                    </div>
                  </template>
                  <div>
                    <c-ipa-link external-url={infoShare.url} label={infoShare.label} analytics-page=""
                    class-name="color-white inverse" class="slds-text-heading_medium slds-var-m-bottom_medium  slds-text-color_inverse"></c-ipa-link>
                    <p class="slds-text-color_inverse slds-text-align_center textsize">{infoShare.description}</p>                  
                  </div>
                 </div>
            </div>
          </div>
        </template>
        </div> 
        </div>  
      </div>
</template>
