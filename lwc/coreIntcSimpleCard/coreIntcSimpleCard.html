<!--CORE: Simple Card Default | No Icon-->
<template>
  <c-core-intc-link label={card.linkData.label} community-page={card.linkData.communityPage} external-url={card.linkData.externalUrl} object-page={card.linkData.objectPage} record-id={card.linkData.recordId} hide-icon>
    <div class="core-card-container">
      <div class="core-card-title">
        <div class={classes.titleClass}>{card.title}</div>
      </div>
    </div>
  </c-core-intc-link>
</template>
