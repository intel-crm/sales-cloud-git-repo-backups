<!--CORE: Simple Card Template | With Icon and Body and Link-->
<template>
    <div class={classes.containerClass}>
        <div class="core-card-title-container">
            <div class="core-card-icon-container">
                <template if:true={card.icon}>
                    <span class="fa-wrap">
                        <span class={iconFaClass}></span>
                    </span>
                </template>
                <template if:true={card.sfIcon}>
                  <span class="fa-wrap">
                    <lightning-icon icon-name={card.sfIcon} size="large"></lightning-icon>
                  </span>
                </template>
                <template if:true={card.svgIconUrl}>
                  <div class="core-card-image">
                    <img src={card.svgIconUrl}>
                  </div>
                </template>
                <template if:true={card.imageUrl}>
                  <div class="core-card-image">
                    <img src={card.imageUrl}>
                  </div>
                </template>
            </div>
            <div class="core-card-title">
                <template if:true={ifs.hasLinkData}>
                    <c-core-intc-link class-name="link-text h4" label={card.title} community-page={card.linkData.communityPage} external-url={card.linkData.externalUrl} object-page={card.linkData.objectPage} record-id={card.linkData.recordId}></c-core-intc-link>
                </template>
                <template if:false={ifs.hasLinkData}>
                    <div class={classes.titleClass}>{card.title}</div>
                </template>
            </div>
        </div>
        <slot name="body" class="core-card-body-container">
            <template if:true={ifs.hasDescription}>
                <div class="core-card-description"><p>{card.description}</p></div>
            </template>
            <template if:true={ifs.hasLinkData}>
                <c-core-intc-link class-name="text-underline-hover" label={card.linkData.label} community-page={card.linkData.communityPage} external-url={card.linkData.externalUrl} object-page={card.linkData.objectPage} record-id={card.linkData.recordId} hide-icon="false"></c-core-intc-link>
            </template>
        </slot>
    </div>
</template>
