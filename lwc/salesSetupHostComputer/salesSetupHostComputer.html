<template>
    <lightning-button variant="neutral" label={label.Sales_AddComp_Err_HTML} title={label.Sales_AddComp_Err_HTML}
        onclick={openAddComputerModal} class="slds-m-left_x-small"></lightning-button>
    <template if:true={showAddComputerModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-edit-form object-api-name="Sales_Host__c" onsuccess={handleSuccess}
                        onsubmit={handleSubmit}>
                        <!--  onerror={handleError}  -->
                        <!--Setup Host Computer-->
                        <header class="slds-modal__header">
                            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{label.SalesAddCompErrHTML}
                            </h2>
                        </header>
                        <div class="slds-grid slds-wrap">
                            <div class="slds-size_1-of-1 slds-p-around_medium">

                                <lightning-messages></lightning-messages>

                                <div class="slds-section slds-is-open">
                                    <h3 class="slds-section__title slds-theme_shade">{label.SalesCompInfoHTML}</h3>
                                    <div aria-hidden="false" class="slds-section__content">
                                        <lightning-input-field field-name='Sales_License_Type__c'
                                            onchange={handleLicenseTypeChange} required="true">
                                        </lightning-input-field>
                                        <lightning-input-field field-name='Sales_Computer_Type__c' required="true">
                                        </lightning-input-field>
                                        <lightning-input-field field-name='Sales_Computer_Name_Txt__c' required="true">
                                        </lightning-input-field>
                                        <lightning-input-field field-name='Name' required="true">
                                        </lightning-input-field>
                                    </div>
                                </div>

                                <div class="slds-section slds-is-open">
                                    <h3 class="slds-section__title slds-theme_shade">{label.SalesServerInfo}</h3>
                                    <div aria-hidden="false" class="slds-section__content">
                                        <template if:true={islicTypeFloat}>
                                            <lightning-input-field field-name='Sales_Redundant_Server1_Txt__c'>
                                            </lightning-input-field>
                                            <lightning-input-field field-name='Sales_Redundant_Server2_Txt__c'>
                                            </lightning-input-field>
                                        </template>
                                        <template if:true={islicTypeFixed}>
                                            <lightning-input-field field-name='Sales_Companion_Server1_Txt__c'>
                                            </lightning-input-field>
                                            <lightning-input-field field-name='Sales_Companion_Server2_Txt__c'>
                                            </lightning-input-field>
                                        </template>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <!-- Modal Footer start-->
                        <footer class="slds-modal__footer">
                            <lightning-button variant="brand" label={label.Sales_OrderSubmit_HTML} title="Submit" type="submit"
                                class="slds-m-left_x-small"></lightning-button>
                            <lightning-button variant="neutral" label={label.Sales_Cancel} title="Cancel"
                                onclick={closeAddComputerModal} class="slds-m-left_x-small"></lightning-button>
                        </footer>
                    </lightning-record-edit-form>
                </div>
            </div>
        </section>
    </template>
</template>
