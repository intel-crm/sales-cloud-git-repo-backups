<template > 
    <template if:true={isShowModal}>
        <div if:true={OpenSpinner} class="slds-is-relative">
          <lightning-spinner alternative-text="Loading" size="x-small"></lightning-spinner>
       </div>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                 <!-- modal header start -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                        <lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{label.formTitle}</h2>
                </header>
                <!-- modal body start -->
                <div class="slds-modal__content slds-p-around_medium slds-is-relative" id="modal-content-id-1">
                    <div if:true={alertViewed} class="slds-is-relative slds-m-around_xx-large">
                        <div class="slds-notify slds-notify_alert slds-alert_error slds-is-relative" role="alert">
                            <span class="slds-assistive-text">error</span>
                            <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small" title="Description of icon when needed">
                            <lightning-icon icon-name="utility:error" alternative-text="Error!" title="Error" size="medium" variant="inverse"></lightning-icon>
                            </span>
                            <ol class="slds-list_ordered">
                                <template for:each={errorList} for:item="err">
                                    <li key={err}>
                                        <h2 class="slds-text-align_left">{err}</h2>
                                    </li>
                                </template>
                            </ol>
                            <div class="slds-notify__close">
                              <button class="slds-button slds-button_icon slds-button_icon-small slds-button_icon-inverse" title="Close" onclick={closeModel}>
                            <lightning-icon
                                icon-name="utility:close"
                                size="medium"
                                alternative-text="Indicates close"
                                variant="inverse">
                            </lightning-icon>                
                            <span class="slds-assistive-text">Close</span>
                              </button>
                            </div>
                          </div>    
                    </div>
                
                <div class="slds-grid slds-wrap">       
                        <label class="slds-col slds-size_1-of-3">
                            <span class="">Opportunity Name :</span>
                        </label>
                        <div class="slds-col slds-size_2-of-3">
                            <lightning-formatted-url label={OppsName} value={OppsLink}></lightning-formatted-url>
                        </div>
                        <div class="slds-col slds-size_12-of-12">
                          <lightning-combobox name="RequestType" label="Support Request Type" value={value} options={options} onchange={handleChange1} placeholder="Select" required></lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_12-of-12">
                          <lightning-input name="Subject" type="text" label="Subject" value={Subject} onchange={handleChange1} required ></lightning-input>
                        </div>                    
                        <div class="slds-col slds-size_12-of-12">
                            <lightning-textarea name="Description" label="Description" value={Description} onchange={handleChange1}  required></lightning-textarea>
                        </div>
                        <div class="slds-col slds-size_12-of-12">
                            <lightning-input class="slds-size_1-of-2" type="date" name="DeadLineDate" label="Deadline for Results" value={DeadlineDate} onchange={handleChange1} required></lightning-input>
                        </div>
                    <div class="slds-col slds-size_12-of-12 slds-m-top_xx-small" >
                      <lightning-input type="checkbox" label="I agree to share the Opportunity with Software Engineering Teams" name="UserAgreed" value={userAgreed} onchange={handleChange1} required></lightning-input>
                    </div>
                </div>
                </div>  
                <footer class="slds-modal__footer">
                    <lightning-button label="Create Software Expert Support Request" onclick={createSSRRequest} class="slds-m-left_x-small"></lightning-button>
                </footer>  
            </div>
        </section>
      </template>
</template>
