<template>

  <div class="slds-p-vertical_medium">
    <template if:true={heading}>
      <h4 class={headingStyles}>{heading}</h4>
    </template>

    <div class="slds-p-vertical_medium">
      <template if:true={inBuilder}>
        <div class="preview slds-p-vertical_large">
          <h4 class="slds-text-align_center">
            Preview of content not available.
          </h4>
        </div>
      </template>

      <template if:true={timedOut}>
        <div class="error slds-p-vertical_large">
          <div class="slds-text-align_center">
            <lightning-icon icon-name="utility:error" size="small"></lightning-icon>
          </div>
        </div>
      </template>

      <template if:true={showIFrame}>
        <iframe src={iframeSrc} width="100%" height="0"></iframe>
      </template>
    </div>

    <template if:true={ctaLink}>
      <div class="slds-p-bottom_small">
        <c-core-intc-link external-url={ctaLink} label={ctaLabel} inverse={inverse}></c-core-intc-link>
      </div>
    </template>
  </div>

</template>
