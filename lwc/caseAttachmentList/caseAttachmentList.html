<template>
        <lightning-card>
                <div class="slds-grid slds-grid--align-center">
                        <template if:true={showbtnprfle}>
                                <button class="slds-button slds-button_neutral"  onclick={getAttachmentUrl}>Attach File-Public to Customers</button> &nbsp;&nbsp;&nbsp; 
                                <button class="slds-button slds-button_neutral" onclick={getAttachmentUrlPartners}>Attach File-Private to Partners</button> &nbsp;&nbsp;&nbsp;
                                <button class="slds-button slds-button_neutral" onclick={getAttachmentUrlIntel}>Attach File-Private to Intel</button> &nbsp;&nbsp;&nbsp;  
                                <button class="slds-button slds-button_neutral" onclick={hanldeRefreshButtonClick}>Refresh to see New Attachments</button> &nbsp;&nbsp;&nbsp;
                                <button class="slds-button slds-button_neutral"  onclick={hanldeLinkFileButtonClick} >Link File</button>              
                        </template>
                </div>
                <div class="slds-grid slds-grid--align-center" >
                        <lightning-input type="search" onchange={attachmentsearchbox}
                            class="slds-m-bottom_small attachmentSearch" placeholder="Search attachments"
                            maxlength="70" style="width: 300px;"></lightning-input>
                </div> <br/>                 
                <div if:true={isDataAvailable} >      
                        <div if:true={switchView} style="height: 16rem;">
                                <lightning-datatable 
                                        key-field="id" 
                                        data={dataToShow} 
                                        columns={columns}
                                        onrowaction={handleRowActions} 
                                        enable-infinite-loading ={isloading}
                                        onloadmore={handleLoadMore}
                                        hide-checkbox-column
                                        min-column-width="200px">
                                </lightning-datatable>
                        </div>
                        <div if:false={switchView} style="height: 16rem;">
                                        <lightning-datatable 
                                        key-field="id" 
                                        data={searchResult} 
                                        columns={columns}
                                        onrowaction={handleRowActions} 
                                        hide-checkbox-column
                                        min-column-width="200px"></lightning-datatable>
                        </div>
                                
                </div>
                <div if:false={isDataAvailable}>
                        <p>No records to display</p>
                </div>   
        </lightning-card>
        <template if:true={isShowModal}>
                        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                           <div class="slds-modal__container" style="width:900px;">
                              <!-- modal header start -->
                              <header class="slds-modal__header" style="background-color: rgb(3, 32, 95);color: white; width:900px;">
                                 <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                                    <lightning-icon icon-name="utility:close"
                                       alternative-text="close"
                                       variant="inverse"
                                       size="small" ></lightning-icon>
                                    <span class="slds-assistive-text">Close</span>
                                 </button>
                                 <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">File List</h2>
                              </header>
                              <!-- modal body start -->
                              <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1" style="width: 900px;">
                                 <c-case-attachment-link-file record-id={caseid} refresh-data={loadData}></c-case-attachment-link-file>      
                              </div>
                           </div>
                        </section>
                        <div class="slds-backdrop slds-backdrop_open"></div>
        </template> 
</template>
