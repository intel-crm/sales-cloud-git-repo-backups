<template>
    <!-- <lightning-card> -->

        <h3>THIS case related to the use of Intel Products in regards to military, intelligence,
            nuclear/biochemical, defense, or space (MINDS) items?</h3>

        <template for:each={radioOptions} for:item="item">
            <fieldset key={item.value} style="display: block; float: left;">
                <div class="slds-form-element__control">
                    <span class="slds-radio">

                        <input checked={item.checked} name="radiogroup" id={item.value} type="radio" value={item.value}
                            onchange={handleSelected} />
                        <label class="slds-radio__label" for={item.value}>
                            <span class="slds-radio_faux"></span>
                            <span class="slds-form-element__label">{item.label}</span>
                        </label>

                    </span>
                </div>
            </fieldset>
        </template><br /><br />
            <lightning-combobox name="progress" label="Country" value={countrydefaultvalue} placeholder="Select Progress"
            options={records} onchange={handleChangeforContact} required></lightning-combobox>
    <!-- </lightning-card> -->
</template>
