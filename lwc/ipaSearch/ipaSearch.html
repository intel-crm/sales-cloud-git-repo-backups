        <template if:true={showCategoryModal}>
            <c-core-intc-modal is-open onclose={handleCloseMobileModalX}>

                </div>
                <div slot="body" class="slds-p-around_medium bg-lightest-gray fill-modal-height">
                    <template for:each={categoryChildren} for:item="categoryChild">

                            <c-ipa-link label={categoryChild.label} object-page={categoryApiName} record-id={categoryChild.id} onclick={handleCategoryLinkClick}></c-ipa-link>

                    <template if:true={taxonomyLoaded}>
                        <c-ipa-search-filters
                            category-record={categoryRecord}
                            includes-pre-release={includesPreRelease}
                            pre-release-value={draftPreReleaseValue}
                            sort-by-options={sortByOptions}
                            version="mobile"
                            onclosemobile={handleCloseMobileModal}
                            search-params={searchParams}
                            search-response={searchResponse}
                            search-response-filters={searchResponseFilters}
                            draft-filters={draftFilters}>
                        </c-ipa-search-filters>
                    </template>                
                </div>
            </c-core-intc-modal>
        </template>

        <c-ipa-search-header

            search-params={searchParams}
            search-response={searchResponse}
            category-record-label={categoryRecordLabel}>

        <div class="slds-grid slds-wrap slds-is-relative" data-is-loading={loading}>

            </template>

                        </template>

                        </div>
