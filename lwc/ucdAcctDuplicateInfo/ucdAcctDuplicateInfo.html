<template>
    <div class="c-container">
        <lightning-card>
        <lightning-layout multiple-rows="true" title="Duplicate Account Check">
            <lightning-layout-item class="width-box" multiple-rows="true">         
            <div class="slds-cell-wrap slds-table_resizable-cols slds-truncate">
                <lightning-datatable columns={columns} data={acctfrmdetlstest} key-field="stpNm"
                    hide-checkbox-column="true" >
                </lightning-datatable> 
           </div>                     
            </lightning-layout-item>
            
              <!--  <template if:false={Spinner} class="slds-spinner_inline">
                    <lightning-spinner variant="brand" 
                                       alternative-text="Loading Records"     
                                       size="medium">
                    </lightning-spinner>
                </template>-->
			<lightning-layout-item class="width-box">
                <template if:true={accountsFound}>
					<template if:true={gridconfig.data}>
                        <c-ucd-grid-with-pagination config={gridconfig} onrowselection={handleRowSelection}>
                        </c-ucd-grid-with-pagination>
                    </template>
                </template>
            </lightning-layout-item>
        </lightning-layout>
        
			<template if:false={accountsFound}>
				
                 <br>
					<div class="slds-section__title slds-theme--shade slds-m-top-small primaryPaletteBorder test-id__section-header-container">
						<span class="test-id__section-header-title section-header-title slds-p-horizontal--small slds-truncate">
							Potential Matches
						</span>
					</div>
				
                <br><br>
                <lightning-layout>
				<div class="slds-align_absolute-center">
					<p class="slds-text-heading_medium ">
						<lightning-formatted-text value="No Duplicate Records Found!!!" ></lightning-formatted-text>
					</p>    
                </div>
                <br><br>
                

            </lightning-layout>
			</template>
            <div> </div>
        
        <lightning-button onclick={onPrevClickHandler} value="Previous" label="Previous">Previous</lightning-button>
        <lightning-button onclick={onNextClickHandler} value="Next" label="Next"></lightning-button>
    </lightning-card>
    </div>
</template>
