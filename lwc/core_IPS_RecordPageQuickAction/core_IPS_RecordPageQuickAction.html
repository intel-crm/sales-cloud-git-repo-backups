<template>
    	   
	<div if:true={isloading}>
		<lightning-spinner style="position: fixed;" alternative-text="Loading..."></lightning-spinner>
		<div style="position: fixed;" class="slds-backdrop slds-backdrop_open"></div>
	</div>

	<div if:false={isloading}>
      
    <div class="slds-grid slds-grid--align-end">
        <lightning-button-group>
            <template if:true={isEditCaseVisible}>
                <lightning-button label="Edit Case Details" onclick={handleButtonClick}></lightning-button>
            </template>
            <template if:true={isCaseCommentVisible}>
            <lightning-button label="New Comment" onclick={handleNavigate}></lightning-button>
            </template>
            <!--<template if:true={isManageInterestedPartyVisible}>    
                <lightning-button label="Manage Interested Parties" onclick={handleButtonClick} ></lightning-button>
            </template>-->
            <template if:true={isAcceptCaseVisible}>
                <lightning-button label="Accept Case" onclick={handleButtonClick}></lightning-button>
            </template>
            <template if:true={isRequestClosureVisible}>    
                <lightning-button label="Request Case Closure" onclick={handleClickClosure}></lightning-button>
            </template>
            <template if:true={isCopyVisible}>    
                <lightning-button label="Copy" onclick={handleButtonClick}></lightning-button>
            </template>
            <template if:true={isInvalidVisible}>            
                <lightning-button label="Invalid" onclick={handleButtonClick}></lightning-button>
            </template>
            <template if:true={isExportPDFVisible}>    
                <lightning-button label="Export To PDF" onclick={handleExportToPDF}></lightning-button>
            </template>
            <template if:true={isCloseCaseVisible}>
                <lightning-button label="Close Case" onclick={handleButtonClick}></lightning-button>
            </template>
        </lightning-button-group>
       
        <template if:true={isCloseCaseClicked}>
            <c-core_-i-p-s_modal-utility
                modal-header="Close Case"
                is-modal-header-required="true"
                icon-name="utility:warning"
                body-content={closeCaseWarningMsg}
                true-btn-label="Confirm Close Case" 
                false-btn-label="Cancel"
                ontrueclick={handleCloseCase} 
                onfalseclick={handleCancel}>
            </c-core_-i-p-s_modal-utility>
        </template>

        <template if:true={isInvalidClicked}>
            <c-core_-i-p-s_modal-utility
                modal-header="Invalid Case"
                is-modal-header-required="true"
                icon-name="utility:warning"
                body-content={invalidCaseWarningMsg}
                true-btn-label="Confirm Invalid Case" 
                false-btn-label="Cancel"
                ontrueclick={handleInvalidCase} 
                onfalseclick={handleCancel}>
            </c-core_-i-p-s_modal-utility>
        </template>

        <template if:true={isCopyClicked}>
            <c-core_-i-p-s_-create-case record-id={recordId} mode='copy' > </c-core_-i-p-s_-create-case>
        </template>

        <template if:true={isRequestCaseCloseClicked}>
                        <c-core_-i-p-s_-case_-closure_-request record-id={recordId}>
                        </c-core_-i-p-s_-case_-closure_-request>
        </template>
        <template if:true={isExportButtonClicked}>
        </template>

        <template if:true={spinnerOn}>
            <c-core_-i-p-s_-spinner-utility></c-core_-i-p-s_-spinner-utility>
        </template>

        <template if:true={isEditButtonClicked}>
            <c-core_-i-p-s_-create-case record-id={recordId} mode='edit'> </c-core_-i-p-s_-create-case>
        </template>
    </div>
    
    </div>
    <template if:false={caseCloneAccess}>
        <template if:true={openmodel}>
        </template>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
             <!-- modal header start -->
               <header class="slds-modal__header">
                  <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                     <!--<lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small" ></lightning-icon>
                     <span class="slds-assistive-text">Close</span>-->
                  </button>
                  <h1 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate"><b>Insufficient Privileges </b></h1>
               </header>
               <!-- modal body start -->
               <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                    <div font-size="18px" align="left">
                     <p>You do not have the level of access necessary to perform the operation you requested. Please contact the owner of the record or your administrator if access is necessary. For more information, <a href="https://help.salesforce.com/Partnercenter/s/htdoor?instance=NA104&language=en_US&loc=help&release=236.19.4&showSplash=true&target=admin_insufficient_privileges_flowchart.htm" target="_blank"> <span style="color:black"><u>see Insufficient Privileges Errors.</u></span></a></p>
                    </div>
                </div>
               <!-- modal footer start-->
               <footer class="slds-modal__footer">
                  <button class="slds-button slds-button_neutral" onclick={handleCancel}>Cancel</button>
               </footer>
            </div>
         </section>
         <div class="slds-backdrop slds-backdrop_open"></div>
      <!-- modal end -->
     
    </template>
</template>
