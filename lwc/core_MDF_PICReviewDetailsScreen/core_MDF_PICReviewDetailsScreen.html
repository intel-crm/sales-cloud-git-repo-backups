<!-- PIC Review Details Screen in LWC -->
<template>
    <div class="slds-card">
        <!-- Spinner Container -->
        <template if:true={showSpinner}>
            <lightning-spinner alternative-text={label.loadingLabel}></lightning-spinner>
        </template>
        <!--/ Spinner Container -->
        <template if:true = {hasErrorOrData}>
            <!-- Page Header -->
            <div class="slds-grid slds-page-header">
                <header class="slds-media slds-media--center">
                    <!-- Page Icon -->
                    <div class="slds-var-m-right_medium">
                        <lightning-icon size="small" icon-name="standard:partner_fund_claim"
                            alternative-text="PIC Reviews" title="PIC Reviews"></lightning-icon>
                    </div>
                    <!--/ Page Icon -->
                    <!-- Page Header Name -->
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <span title="PIC Reviews"
                                class="slds-truncate slds-m-right--xx-small">{label.picReviewDetail}</span>
                                <template if:true = {hasPICReview}>
                                    <span 
                                        class="slds-shrink-none slds-m-right--xx-small">({countOfPICReview})</span>
                                </template>
                        </h2>
                    </div>
                    <!--/ Page Header Name -->
                </header>
            </div>
            <!--/ Page Header -->
            <!-- Error Container -->
            <template if:true = {hasPICReviewError}>
                <div class="picreview-error">
                    {label.applicationError}
                </div>
            </template>
            <!--/ Error Container -->
            <template if:false = {hasPICReviewError}>
                <template if:true={hasPICReview}>
                    <!-- Accordion to display PIC Review Cycles -->
                    <lightning-accordion allow-multiple-sections-open>
                        <template for:each={data} for:item="PICReviewRecord">
                            <lightning-accordion-section label={PICReviewRecord.picReviewLabel} key={PICReviewRecord.picReviewId}
                                for:index="AccIndex">
                                <div slot="actions">
                                    <div class="slds-grid">
                                        <template if:true={isInternalUser}>
                                            <span class=" slds-var-m-right_xx-small picreview-grid">
                                                <span class="picreview-bold">{label.picReviewedby}</span>
                                                {PICReviewRecord.picReviewedBy}
                                            </span>
                                        </template>
                                        <span class="slds-var-m-right_xx-small picreview-grid"><span
                                                class="picreview-bold">{label.reviewDate}
                                            </span>
                                            {PICReviewRecord.picReviewedDate}</span>
                                        <span class="picreview-status-grid">
                                            <span class="picreview-bold">{label.picStatus} </span>
                                            <span class={PICReviewRecord.picCSS}>{PICReviewRecord.picStatus}</span>
                                        </span>
                                    </div>
                                </div>
                                <!-- List box to display Issue list-->
                                <template if:false={PICReviewRecord.isPICCompleted}>
                                    <lightning-datatable key-field="id" data={PICReviewRecord.picReviewDetail} columns={picReviewColumns}
                                        hide-checkbox-column="true">
                                    </lightning-datatable>
                                </template>
                                <!--/ List box to display Issue list-->
                            </lightning-accordion-section>
                        </template>
                    </lightning-accordion>
                    <!--/ Accordion to display PIC Review Cycles -->
                </template>
            </template>
        </template>
        
    </div>

</template>
<!--/ PIC Review Details Screen in LWC -->
