<!-- sldsValidatorIgnore -->
<template>
    <!--display spinner till data loads-->
    <template if:true={showSpinner}>
        <div class="spinner">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>
    <!--Header for PIC Review Process-->
    <div class="modal-header slds-modal__header slds-var-m-bottom_large">
        <!--<h2 class="title slds-text-heading--medium slds-hyphenate">{picLabel.picReviewScreenHeader}{claimReferenceId}</h2>-->
        <h2 class="title slds-text-heading--medium slds-hyphenate">{headerLabel}{claimReferenceId}</h2><!--16654-->
    </div>
    <!--Expandablse section implementation to display the claim and activity details-->
    <template if:true={isPICReviewer}>
        <template if:true={hasClaimRecordData}>
            <!--Expanadable section implementation-->
            <template if:true={eligibleForPIC}>
                <template if:false={showSpinner}>
                    <div class="slds-section slds-is-open slds-var-p-left_large slds-var-p-right_large">
                        <h3 class="slds-section__title">
                            <button aria-controls="expando-unique-id" aria-expanded="false"
                                class="slds-button slds-section__title-action" onclick={toggleClaimAndActvityDetails}>
                                <lightning-icon icon-name={iconNames} size="x-small" aria-hidden="true"
                                    class="accordion-chevron-icon"></lightning-icon>
                                <label class="slds-var-p-left_medium">{accordionTitle}</label>
                            </button>
                        </h3>
                        <!--claim and activity details displayed in the expandable section-->
                        <template if:true={showClaimAndActivityDetails}>
                            <div class="slds-section__content claim-activity-details" id="expando-unique-id"
                                aria-hidden="true">
                                <template for:each={claimAndActivityDetails} for:item="claimActivity" for:index="index">
                                    <template if:true={claimActivity.show}>
                                        <div class="slds-form-element slds-form-element_edit slds-form-element_readonly slds-hint-parent claim-activity"
                                            key={claimActivity.key}>
                                            <span class="slds-form-element__label">{claimActivity.key}</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">
                                                    <lightning-formatted-rich-text class="claim-activity-url"
                                                        value={claimActivity.value}></lightning-formatted-rich-text>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </template>
                        <br>
                        
                        <!-- potential exception details displayed in a tabular format -->
                        <template if:true={exceptions.length}>
                            <div class="slds-text-align_center slds-text-heading_small slds-var-m-bottom_medium">{potentialExceptionsLabel}</div>
                            <table class="slds-table slds-table_bordered slds-table_col-bordered slds-border_left slds-border_right slds-no-row-hover slds-table_fixed-layout">
                                <thead>
                                    <tr class="slds-text-heading_label">
                                        <th class="slds-text-align_center" scope="col">{exceptionNameLabel}</th>
                                        <th class="slds-text-align_center" scope="col">{exceptionReasonLabel}</th>
                                        <th class="slds-text-align_center" scope="col">{exceptionActCatTypeLabel}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={exceptions} for:item="exception" for:index="indexVar">
                                        <tr key={exception.Id}>
                                            <td class="slds-text-align_center slds-truncate">
                                                <lightning-formatted-url value={exception.Core_MDF_Exception_Detail_Link_txt__c} label={exception.Core_MDF_Name_of_Exception_nm__c} title={exception.Core_MDF_Name_of_Exception_nm__c} target="_blank"></lightning-formatted-url>
                                            </td>
                                            <td class="slds-text-align_center slds-truncate">
                                                <lightning-formatted-rich-text value={exception.Core_MDF_Exception_Reason_nm__c} title={exception.Core_MDF_Exception_Reason_nm__c}></lightning-formatted-rich-text>
                                            </td>
                                            <td class="slds-text-align_center slds-truncate">
                                                <lightning-formatted-rich-text value={exception.Core_MDF_Activity_Cate_and_Type_nm__c} title={exception.Core_MDF_Activity_Cate_and_Type_nm__c}></lightning-formatted-rich-text>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>                                                  
        
                    </div>
                </template>

                <!--child component pic doc details-->
                <div if:true={claimRecordData}>
                    <c-core_-m-d-f_-p-i-c-document-details onhidepicreviewscreen={hidePICReviewScreen}
                        claim-details={claimRecordData} onupdateofclaim={onUpdateOfClaim} onhidespinner={hideSpinner}>
                    </c-core_-m-d-f_-p-i-c-document-details>
                </div>
            </template>
            <template if:false={eligibleForPIC}>
                <div class="slds-var-p-around_medium slds-align_absolute-center">
                    <lightning-icon icon-name="utility:warning" alternative-text="Warning!" variant="warning"></lightning-icon>
                    <div class="slds-text-align_center slds-m-left_medium">{messageForNonEligibleUsers}</div>
                </div>
                <div class="modal-footer slds-modal__footer">
                    <lightning-button label="Close" variant="brand" onclick={closeQuickAction}></lightning-button>
                </div>
            </template>
        </template>
        <!--No claim data-->
        <template if:false={hasClaimRecordData}>
            <div class="slds-text-heading_medium slds-var-m-top_medium slds-text-align_center">{picLabel.noClaimData}
            </div>
        </template>
    </template>
    <!--This error message is displayed when the user is not a PIC reviewer or when the claim status is not PIC pending-->
    <template if:false={isPICReviewer}>
        <div class="slds-var-p-around_medium slds-align_absolute-center">
            <lightning-icon icon-name="utility:warning" alternative-text="Warning!" variant="warning"></lightning-icon>
            <div class="slds-text-align_center slds-m-left_medium">{messageForNonPICReviewer}</div>
        </div>
        <div class="modal-footer slds-modal__footer">
            <lightning-button label="Close" variant="brand" onclick={closeQuickAction}></lightning-button>
        </div>
    </template>
</template>
