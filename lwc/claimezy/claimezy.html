<template>
  
  <lightning-card>
    <h1 class="slds-text-heading_large slds-p-horizontal_medium">
      Document Analyzer
    </h1>
    <br/>
    <h3 class="slds-text-heading_small slds-text-title_bold slds-p-horizontal_medium">Upload an Invoice Document</h3>
    <div class="slds-p-around_medium">
        <lightning-input type="file" label="Choose Invoice" accept=".pdf" onchange={handleFileChange}></lightning-input>
        <template if:true={file}>
          <p>Selected Document: {file.name}</p>
      </template>
        <br/>
        <template if:true={showSpinner}>
            <lightning-spinner alternative-text="Uploading..." size="large"></lightning-spinner>
        </template>
        <template if:false={showSpinner}>
            <lightning-button label="Upload" onclick={handleUpload} disabled={showSpinner}></lightning-button>
        </template>
    </div>

    <template if:true={invoiceDetails}>
            <h3 class="slds-text-heading_small slds-text-title_bold slds-p-horizontal_medium">Invoice Details</h3>
            <div class="slds-p-around_medium">
              <template for:each={invoiceDetails} for:item="detail">
                  <div key={detail.key} class="slds-grid slds-gutters">
                      <div class="slds-col slds-size_2-of-12">
                          <p>{detail.label}</p>
                      </div>
                      <div class="slds-col slds-size_4-of-12">
                          <lightning-input type="text" value={detail.value} disabled></lightning-input>
                      </div>
                  </div>
              </template>
            </div>
          </template>
    </lightning-card>
  </template>
