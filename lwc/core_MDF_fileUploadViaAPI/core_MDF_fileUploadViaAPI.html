<template>
    <lightning-card title="File Upload" icon-name="utility:upload">

        <div class="slds-p-around_medium">

            <!-- ================================================ -->
            <!-- DRAG & DROP ZONE                                  -->
            <!-- ================================================ -->
            <div
                class="upload-dropzone"
                ondragover={handleDragOver}
                ondragleave={handleDragLeave}
                ondrop={handleDrop}
            >
                <div class="slds-align_absolute-center slds-p-around_large">
                    <div class="slds-text-align_center">

                        <lightning-icon
                            icon-name="utility:upload"
                            size="large"
                            class="slds-m-bottom_small"
                        ></lightning-icon>

                        <p class="slds-text-heading_small slds-m-bottom_x-small">
                            Drag &amp; Drop files here
                        </p>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                            or click below to browse
                        </p>

                        <!-- File Input -->
                        <div class="slds-form-element">
                            <div class="slds-form-element__control">
                                <label class="slds-button slds-button_neutral" for="fileInput">
                                    <lightning-icon
                                        icon-name="utility:search"
                                        size="x-small"
                                        class="slds-m-right_x-small"
                                    ></lightning-icon>
                                    Browse Files
                                </label>
                                <input
                                    type="file"
                                    id="fileInput"
                                    accept={acceptedFormats}
                                    multiple={allowMultiple}
                                    onchange={handleFileChange}
                                    class="file-input-hidden"
                                />
                            </div>
                        </div>

                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                            Accepted: {acceptedFormats} | Max size: 2GB
                        </p>
                    </div>
                </div>
            </div>

            <!-- ================================================ -->
            <!-- PROGRESS BAR                                      -->
            <!-- ================================================ -->
            <template if:true={isUploading}>
                <div class="slds-m-top_medium">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                        <span class="slds-text-body_small">Uploading...</span>
                        <span class="slds-text-body_small">{uploadProgress}%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style={progressStyle}></div>
                    </div>
                    <div class="slds-text-align_center slds-m-top_x-small">
                        <lightning-spinner
                            alternative-text="Uploading"
                            size="small"
                        ></lightning-spinner>
                    </div>
                </div>
            </template>

            <!-- ================================================ -->
            <!-- SUCCESS MESSAGE                                   -->
            <!-- ================================================ -->
            <template if:true={showSuccess}>
                <div class="slds-m-top_medium">
                    <div class="slds-notify slds-notify_alert slds-alert_success" role="alert">
                        <lightning-icon
                            icon-name="utility:success"
                            size="x-small"
                            class="slds-m-right_x-small"
                        ></lightning-icon>
                        <span>{successMessage}</span>
                    </div>
                </div>
            </template>

            <!-- ================================================ -->
            <!-- ERROR MESSAGE                                     -->
            <!-- ================================================ -->
            <template if:true={showError}>
                <div class="slds-m-top_medium">
                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                        <lightning-icon
                            icon-name="utility:error"
                            size="x-small"
                            class="slds-m-right_x-small"
                        ></lightning-icon>
                        <span>{errorMessage}</span>
                    </div>
                </div>
            </template>

            <!-- ================================================ -->
            <!-- UPLOADED FILES LIST                               -->
            <!-- ================================================ -->
            <!-- Uploaded Files List -->
            <template if:true={hasUploadedFiles}>
                <div class="slds-m-top_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">
                        Uploaded Files
                    </h3>
                    <ul class="slds-has-dividers_top-space">
                        <template for:each={uploadedFiles} for:item="file">
                            <li key={file.id} class="slds-item uploaded-file-item">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div class="slds-col">
                                        <lightning-icon
                                            icon-name="doctype:attachment"
                                            size="small"
                                            class="slds-m-right_x-small"
                                        ></lightning-icon>
                                        <span class="slds-text-body_regular">{file.name}</span>
                                        <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">
                                            ({file.size})
                                        </span>
                                        <!-- ✅ Show ContentDocumentId -->
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            Doc ID: {file.contentDocId}
                                        </div>
                                    </div>
                                    <div class="slds-col slds-no-flex">
                                        <lightning-icon
                                            icon-name="utility:check"
                                            size="x-small"
                                            variant="success"
                                            class="slds-m-right_small"
                                        ></lightning-icon>
                                        <lightning-button-icon
                                            icon-name="utility:delete"
                                            variant="bare"
                                            size="small"
                                            data-id={file.id}
                                            onclick={handleRemoveFile}
                                            alternative-text="Remove"
                                        ></lightning-button-icon>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
