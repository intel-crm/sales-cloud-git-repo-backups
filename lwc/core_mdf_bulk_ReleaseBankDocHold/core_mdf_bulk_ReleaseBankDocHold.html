<template>
    <!--spinner implementation-->
    <template if:true={isSpinner}>
        <div class="spinner">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>
    <!--If user has access to release bank document hold, then performm the below logic like, showing datatable, button visibility, search, pagination-->
    <template if:true={hasAccess}>
        <template if:false={isSpinner}>
            <lightning-layout class="slds-page-header slds-page-header--object-home" id="header">
                <lightning-layout-item>
                    <lightning-icon icon-name="standard:action_list_component" class="icn"></lightning-icon>
                </lightning-layout-item>
                <lightning-layout-item size="11" padding="horizontal-small">
                    <div class="page-section page-header">
                        <h2 class="slds-text-heading--medium"><b>Bulk Release Bank Document Hold</b></h2>
                    </div>
                </lightning-layout-item><br />
            </lightning-layout>
            <lightning-card>
                <lightning-layout>
                    <lightning-layout-item flexibility="auto">
                        <div class="slds-float_left"><br />
                            <span class="slds-text-heading_small slds-m-left_large slds-m-bottom_large">Claim on review
                                hold and bank document hold are excluded from this list. Once Released, the status
                                cannot be reverted.</span>
                        </div>
                        <div class="slds-float_right">
                            <lightning-input type="search" placeholder="Search Claims..."
                                onchange={fetchSearchedRecords}
                                class="slds-float_right slds-m-right_large slds-m-bottom_large"></lightning-input>
                        </div>

                    </lightning-layout-item>
                </lightning-layout>
                <!--Datatable with sorting and on row selection-->
                <lightning-datatable data={claimsToDisplay} columns={columns} key-field="id" onsort={handleSortdata}
                    sorted-by={sortBy} sorted-direction={sortDirection} onrowselection={prepareSelectedRows}>
                </lightning-datatable>
                <br />
                <template if:true={showTable}>
                    <c-paginator records={allClaims} total-records={allClaims.length}
                        onpaginatorchange={handlePaginatorChange}>
                    </c-paginator>
                </template>
                <!--Bulk Release Button-->
                <!--  <template if:true={showOrHide}>-->
                <div class="slds-align_absolute-center slds-m-top_xxx-small">
                    <lightning-button label="Release Bank Document Hold" variant="brand" onclick={updateSelRecords}
                        disabled={buttonDisable}></lightning-button>
                </div>
                <!--   </template>-->
            </lightning-card>
        </template>
    </template>
    <!--If user does not have access to release bank document hold then showing the below error message-->
    <template if:false={hasAccess}>
        <template if:false={isSpinner}>
            <lightning-card title="Sorry, you do not have access to release bank document hold"></lightning-card>
        </template>
    </template>
</template>
