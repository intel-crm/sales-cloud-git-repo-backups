<template>
    <div if:true={showGrid} class="slds-box slds-theme_default">
        <lightning-card>

            <!-- Header -->
            <div slot="title" class="title-container">
                <h2 class="slds-card__header-title">
                    <span>{nreGridHeader}</span>
                </h2>
                <a href={helpEngineeringActivityLink} 
                   target="_blank"
                   class="slds-text-link slds-text-body_small">
                    {helpEngineeringActivityText}
                </a>
            </div>

            <!-- CREATE ACTIVITY BUTTON (Visible only when allowed) -->
            <div if:true={hasCreateAccess} class="slds-m-around_medium slds-grid slds-grid_align-end">
                <template if:true={showCreateActivity}>
                    <lightning-button 
                        label={createActivityLabel} 
                        onclick={handleCreateRecords} 
                        variant="brand"
                        disabled={disableCreateActivity}>
                    </lightning-button>
                </template>
            </div>

            <div class="slds-m-around_medium">

                <!-- Spinner -->
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </template>

                <!-- Grid Table -->
                <div class="scrollable-table slds-border_left">
                    <template if:true={data}>
                        <c-core_-m-d-f_-custom_-picklist
                            key-field="Id"
                            data={data}
                            columns={columnsMod}
                            onvalueselect={handleSelection}
                            draft-values={draftValues}
                            oncellchange={handleCellChange}
                            errors={dataErrors}
                            onrowaction={handleRowAction}
                            hide-checkbox-column
                            suppress-bottom-bar
                            show-row-number-column>
                        </c-core_-m-d-f_-custom_-picklist>
                    </template>
                </div>

                <!-- NEW ACTIVITY BUTTON (Visible only when allowed) -->
                <template if:true={hasCreateAccess}>
                    <div class="slds-p-top_medium slds-text-align_left">
                        <template if:true={showNewActivity}>
                            <lightning-button 
                                label={newActitvityLabel}
                                onclick={handleAddRow}
                                disabled={disableNewActivityButton}
                                variant="neutral">
                            </lightning-button>

                            <div if:true={disableNewActivityButton}
                                 class="slds-p-top_small"
                                 style="color:#0176d3;">
                                 {limittenActvitiesLabel}
                            </div>
                        </template>
                    </div>
                </template>

                <!-- VIEW MORE ALWAYS VISIBLE -->
                <div class="slds-p-top_medium slds-text-align_center">
                    <a href="javascript:void(0);"
                       onclick={handleViewRecords}
                       class="slds-text-link">
                       {createViewLabel}
                    </a>
                </div>

            </div>
        </lightning-card>
    </div>
</template>
