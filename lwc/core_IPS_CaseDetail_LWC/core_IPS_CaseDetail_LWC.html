<template>
    <template if:true={hasAccess}>
        <template if:false={showCloseCaseSurvey}>
            <div class="pageBkGD">
                <template if:true={showmaincmp}>
                    <div class="slds-p-around_medium">
                        <lightning-button onclick={handleNavigateBack} label="< Back" title="Back to dashboard"
                            class="noBorder"></lightning-button>
                    </div>
                    <div class="Mask">
                        <div class="slds-p-around_large" style="color:white">
                            <template if:true={currentCaseData}>
                                <div class="slds-truncate slds-p-right_small" style="font-size:28px">
                                    {currentCaseData.Subject}
                                </div>
                                <div class="slds-truncate slds-p-right_small" style="font-size:16px">
                                    {currentCaseData.Description}</div>
                            </template>
</div>
<div class="slds-grid slds-wrap slds-p-left_large" style="color:white">
    <div class="slds-col slds-size_6-of-12 slds-large-size_1-of-12" style="font-size:16px">
        <div style="font-weight:bold">Case No</div>
        <template if:true={currentCaseData}>
                                    <div>{currentCaseData.CaseNumber}</div>
                                </template>
    </div>
    <div class="slds-col slds-size_6-of-12 slds-large-size_1-of-12" style="font-size:16px">
        <div style="font-weight:bold">Status</div>
        <template if:true={currentCaseData}>
                                    <div>{currentCaseData.Status}</div>
                                </template>
    </div>
    <div class="slds-col slds-size_6-of-12 slds-large-size_1-of-12" style="font-size:16px">
        <div style="font-weight:bold">Severity</div>
        <template if:true={currentCaseData}>
                                    <div>{currentCaseData.Core_Severity__c}</div>
                                </template>
    </div>
    <div class="slds-col slds-size_6-of-12 slds-large-size_1-of-12" style="font-size:16px">
        <div style="font-weight:bold">Project</div>
        <template if:true={currentCaseData}>
                                    <template if:true={ProjectData}>
                                        <div class="slds-truncate slds-p-right_small">
                                            <a href="" onclick={navigateToProjectDetail} target="_self">
                                                <span
                                                    style="color:white ;">{currentCaseData.Core_IPS_Project_Case__r.Name}
                                                </span>
                                            </a>
                                        </div>
                                    </template>
        <template if:false={ProjectData}>
                                        <div class="slds-truncate slds-p-right_small">
                                            {ProjNotapplicable}</div>
                                    </template>
        </template>
    </div>
    <div class="slds-col slds-size_6-of-12 slds-large-size_3-of-12" style="font-size:16px">
        <div style="font-weight:bold">Intel Product</div>
        <template if:true={currentCaseData}>
                                    <div class="">{currentCaseData.Core_IPS_Product_name__c}</div>
                                </template>
    </div>
    <div class="slds-float_right slds-p-top_x-small">
        <template if:true={ClosedCase}>
                                    <input onclick={openEditModal} type="button" class="caseEditBtn"
                                        value="Edit Case"></input>
                                </template>
        <template if:false={isCaseClosed}>
                                    <input onclick={openCsModal} type="button" class="caseCloseBtn"
                                        value="Close Case"></input>
                                </template>
    </div>
    <br></br>
    <div style="margin-top: 12px; padding-left:15px;">
        <template if:true={enableCopy}>
                                    <lightning-button-icon icon-name="utility:copy" alternative-text="Copy" title="Copy"
                                        class="slds-m-left_xx-small" variant="border-inverse" onclick={showCopy}>
                                    </lightning-button-icon>
                                </template>
        <template if:true={enablePrint}>
                                    <lightning-button-icon icon-name="utility:print" alternative-text="Print"
                                        title="Print" class="slds-m-left_xx-small" variant="border-inverse"
                                        onclick={showPrint}>
                                    </lightning-button-icon>
                                </template>

    </div>
</div>
<!-- Display Modal - Close Case -->
<template if:true={isModalOpen}>
                            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                                <div class="slds-modal__container">
                                    <button
                                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                        title="Close" onclick={closeCsModal}>
                                        <lightning-icon icon-name="utility:close" alternative-text="close"
                                            variant="inverse" size="small"></lightning-icon>
                                        <span class="slds-assistive-text">Close</span>
                                    </button>

                                    <div class="slds-modal__content slds-p-around_medium closemobile" id="modal-content-id-1">

                                        <span class="slds-p-bottom_xx-large slds-p-top_large slds-align_absolute-center"
                                            style="font-size:large;">
                                            Are you sure you want to close this case?
                                        </span>
                                        <div class="slds-align_absolute-center">
                                            <input onclick={closeCsModal} type="button" class="caseEditBtn"
                                                value="Cancel"></input>
                                            <input onclick={closeTheCase} type="button" class="caseCloseBtn"
                                                value="Close the Case"></input>
                                        </div>
                                    </div>
                                </div>
                            </section>
                            <div class="slds-backdrop slds-backdrop_open"></div>
                        </template>
<!-- Display Modal - Edit Case -->
<template if:true={isEditCase}>
                            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"

                                    <header class="slds-modal__header editCaseHeader">

                                            title="Close" onclick={closeEditModal}>
                                            <lightning-icon icon-name="utility:close" alternative-text="close"
                                                variant="inverse" size="small"></lightning-icon>
                                            <span class="slds-assistive-text">Close</span>
                                        </button>
                                        <div class="slds-clearfix">
                                            <div class="slds-float_left slds-p-left_medium">
                                                <h2 id="modal-heading-01"
                                                    class="slds-text-heading_medium slds-hyphenate">
                                                    <template if:true={currentCaseData}>
                                                        <div class="editCaseHeader">Edit Case
                                                            {currentCaseData.CaseNumber}
                                                        </div>
                                                    </template>
</h2>
</div>
<div class="slds-float_right slds-p-right_large">
</div>
</div>
</header>
