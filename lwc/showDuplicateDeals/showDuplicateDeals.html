<template>

    <lightning-card title={title} class="slds-around_small" icon-name="standard:collection">
        <div class="slds-box slds-m-around_small">
            <template if:true={loaded}>
                <lightning-layout>

                    <template if:true={hasData}>
                        <lightning-layout-item size="12" flexibility="auto">

                            <lightning-datatable key-field="id" data={gridData} columns={gridColumns} wrap-table-header
                                hide-checkbox-column="true" show-row-number-column></lightning-datatable>

                        </lightning-layout-item>

                    </template>
                    <template if:false={hasData}>
                        <lightning-layout-item size="12" flexibility="auto">
                            <p class="slds-align_absolute-center">No Potential Duplicates Found!</p>
                        </lightning-layout-item>
                    </template>
                </lightning-layout>
            </template>
            <template if:false={loaded}>

                <lightning-layout>
                    <lightning-layout-item flexibility="auto" size="12">
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </lightning-layout-item>
                </lightning-layout>

            </template>
            <template if:true={hasData}>
                <div class="slds-m-top_small slds-clearfix">
                    <lightning-button disabled={prevDisabled} onclick={handlePrevious}
                        label="Previous"></lightning-button>
                    <span class="slds-p-around_small">Page {currentPage} of {totalPages}</span>
                    <lightning-button disabled={nextDisabled} onclick={handleNext} label="Next"></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>

</template>
