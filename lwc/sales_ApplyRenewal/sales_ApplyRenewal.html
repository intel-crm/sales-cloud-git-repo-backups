<template>
    
<div class="slds-m-around_large">
    <div if:false={isLoaded} class="slds-is-relative">
       <!-- <lightning-spinner alternative-text="Loading...">
        </lightning-spinner>-->
    </div>
</div>
<div if:false={showModal}>
   
    <lightning-card >
           <header class="slds-media slds-media_center slds-has-flexi-truncate slds-modal__header" style="border:none">
            <lightning-icon icon-name="standard:form"></lightning-icon>
            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate slds-text-title_bold" style="font-size: medium;padding-left:20px"> Apply Renewal</h2>
            <div class="slds-media__body">
                <button class="slds-button slds-button_icon slds-float_right slds-button_icon-inverse" style="background: grey;"
              title="Close" onclick={handleOnCancelBtnClick}>
              <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                  size="medium"></lightning-icon>
              <span class="slds-assistive-text">Close</span>
          </button>
            </div>
           </header> 
        <p slot="footer" style="text-align: initial;" class="slds-box">
            <lightning-messages>
            </lightning-messages>
            
            <template if:false={showRenewalLicenseValidationErr}>
                <label class="slds-float_left slds-p-top_medium" for="primaryAdm">{label.Salesrenewalseat}</label>
                <abbr title="required" class="slds-float_left slds-required slds-p-top_medium">*</abbr>
                <lightning-input id="noOfSeats" onchange={inputChange} type="number" variant="label-hidden" min="1" step="1"
                    required="true" value={noOfSeats} style="width:100%;"></lightning-input>
            </template>  

            <template if:true={showRenewalLicenseValidationErr}>
                <span>
                    <p class="slds-m-bottom_medium">{errorMsg}</p>                   
                </span>
            </template>

            <template if:false={showRenewalLicenseValidationErr}>
            <lightning-layout>
            <lightning-layout-item size="5">
            </br>
           
            <p style="padding-top: 2%;">{label.existingrenewal}</p> 
            </lightning-layout-item>
            <lightning-layout-item size="7">
           <lightning-input  type="text"  placeholder="Filter by Primary Computer ID/Name" onchange={onchangeHandle}  style="width:50%;" class="slds-float_right"  ></lightning-input>
           &nbsp;
           <!-- <strong>Select an existing license that you want to renew -</strong>-->
           </lightning-layout-item>
            </lightning-layout>
            
            <div style="height: 120px;" class="slds-p-top_x-small slds-table_header-fixed_container slds-border_top ">
                <lightning-datatable key-field="id" data={data} columns={columns}  onrowselection={handlebaseLicSelected}>  <!--data={data} baseLicensedata -->
                </lightning-datatable>
            </div>
            
      

            <template if:true={finalselectedbaseLicenses}>
                <div class="slds-p-top_x-small">
                    <p class="slds-p-vertical_medium">
                        <strong>{label.SalesLicenseSplit}</strong>
                    </p>
                    <div style="height: 70px;">
                        <lightning-datatable key-field="id" hide-checkbox-column="true" data={selectedbaseLicenses} columns={baseLicenseColumns} > 
                        </lightning-datatable>
                    </div>               
                </div>            
            </template>    

        </template>
        </p>
        </lightning-card>  
        
        <lightning-layout class="slds-p-top_large" style="padding-bottom: 2%;" horizontal-align="end">
            <lightning-layout-item flexibility="auto">              
                   <lightning-button variant="brand" name="cancel" label={label.Sales_Cancel} 
                        style="padding-left: 0.75rem;" onclick={handleOnCancelBtnClick}>
                    </lightning-button> 
                    <lightning-button variant="brand" name="confirm" label={label.Sales_Confirm}
                    style="padding-left: 0.75rem;" onclick={handleOnConfirmBtnClick}
                    disabled={isRenewalLicenseInvalid}>
                   </lightning-button>  
                    </lightning-layout-item>
                    </lightning-layout>                       
                </div>
</template>
