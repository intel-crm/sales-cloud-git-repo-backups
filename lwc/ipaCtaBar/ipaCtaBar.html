<template>

      cta-comm-page={ctaCommPage}
      cta-label={labels.ctaLabel}
      cta-label-aria={labels.ctaLabelAria}
      cta-external-url={ctaUrlValue}
      subtitle={labels.subtitle}
      title={labels.title}
      variation={theme}
      oncorelinkclick={handleLinkClick}

  </template>
</template>
