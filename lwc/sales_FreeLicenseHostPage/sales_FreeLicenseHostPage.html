<template >
	<!--lightning-record-edit-form object-api-name="Sales_License__c" record-id={recordId} onload={handleOnLoad}-->
	<div if:true={isspinnerOn}>
	   <lightning-spinner class="slds-is-fixed"
		  alternative-text="Loading..." variant="brand">
	   </lightning-spinner>
	</div>
	<div data-id="redDiv">
	   <div class="slds-p-top_medium slds-p-bottom_medium slds-align_absolute-center">
		  <div class="slds-region_medium" style="width:1000px;margin-left: 4%; cursor:default; pointer-events:none;">
			 <div class="slds-path">
				<div class="slds-grid slds-path__track">
				   <div class="slds-grid slds-path__scroller-container">
					  <div class="slds-path__scroller">
						 <div class="slds-path__scroller_inner">
							<ul class="slds-path__nav" role="listbox" aria-orientation="horizontal" aria-labelledby="slds-path__stage-name">
							   <li class="slds-path__item slds-is-complete" role="presentation">
								  <a aria-selected="false" class="slds-path__link" href="#" id="path-50" role="option" tabindex="-1" onclick={handleBacktButtonClick}>
									 <span class="slds-path__stage">
										<lightning-icon icon-name="utility:check" alternative-text="Approved" title="Approved" class="my-icon" >
										</lightning-icon>
										<span class="slds-assistive-text">Stage Complete</span>
									 </span>
									 <span class="slds-path__title"></span>
								  </a>
							   </li>
							   <li class="slds-path__item slds-is-current slds-is-active" role="presentation">
								  <a aria-selected="false" class="slds-path__link" href="#" id="path-51" role="option" tabindex="-1">
									 <span class="slds-path__stage">
										<svg class="slds-icon slds-icon_x-small" aria-hidden="true">
										   <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#check"></use>
										</svg>
										<span class="slds-assistive-text">Current Stage:</span>
									 </span>
									 <span class="slds-path__title">{label.Sales_Path2TextLabel}</span>
								  </a>
							   </li>
							</ul>
						 </div>
					  </div>
				   </div>
				</div>
			 </div>
		  </div>
	   </div>
	</div>
	<div class="slds-p-top_medium slds-p-bottom_medium slds-align_absolute-center" style="width:100%;">
	   <div class="slds-region_medium" style="width: 1000px;margin-left: 10%;">
		  <div style="font-size: 16.5px; width: 100%">
			 <table>
				<tr>
				   <!--td-->
				   <!--abbr class="slds-required" title="required" style="font-weight:bold;margin-top:8px">*</abbr></td-->
				   <td>
					  <span class="required">* &nbsp;</span> 
					  <div class="slds-text-heading_medium">{label.Sales_GenerateLicenseHeadingHostPage}</div>
				   </td>
				</tr>
			 </table>
		  </div>
		 <br>
		  <!-- Changes Made by Bishal Singh-->
		  <div style="display:flex;margin-left: 1.5%">
			 <div style="display: flex;flex-basis: 100%;">
				<div style="flex-basis: 35%">
				   <div class="slds-p-around_medium" style="font-size: 16.5px;">
					  {label.Sales_AssignAnExistingComputerHostPage}
					  <lightning-helptext style="margin-left:1px; right:-1.5px; top:-3px;" content={label.Sales_AssignExistingComputerHelptext}></lightning-helptext>
				   <br>
				   <lightning-formatted-url label={label.Sales_ViewAllComputers} value={label.Sales_ViewAllComputersURL} target="_blank" style="font-size: 14px;"></lightning-formatted-url>				 
						</div>
				   <!--NoteIt-->
				</div>
				<div style="flex-basis: 65%;">
				   <div class="slds-p-around_medium" style="width:100%;">
					  <div>
						 <template if:true={hostExist}>
							<div class="table-wrapper">
							   <template for:each={hostDetails} for:item="host">
								  <div key={host.Id} class="tableContainer">
									 <div style="margin-left: 5%">
										<!--th scope="col"-->                            
										<input type="radio" name="hostName" id={host.Id} value={host.Name} onclick={handleChange} data-hostid={host.Id}/>
									 </div>
									 <div style="width:100%;margin-left:5%;padding: 0.5rem;font-weight: 400;font-size: 13px;">
										{host.Name}  
										<br>                          
										{host.compName}
									 </div>
								  </div>
							   </template>
							</div>
						 </template>
						 <template if:true={error}>
							{error}
						 </template>
						 <template if:false={hostExist}>    
							<template if:false={hasExistingHosts}>          
								{label.Sales_NoExistingHost}
								<br>
								{label.Sales_NoExistingHost1}
							</template>
						 </template>
					  </div>
				   </div>
				</div>
			 </div>
		  </div>
		  <div style="display:flex;margin-left: 1.5%">
			<div style="display: flex;flex-basis: 100%;align-items: center;">
			   <div style="font-size: 16.5px;flex-basis: 35%">
				  <div class="slds-p-around_medium" style="font-size: 16.5px;">
					 {label.Sales_CreateNewComputerHeadingHostPage} 
					 <lightning-helptext class="lgc-zz" style="margin-left:1px; right:-1.5px; margin-top:-8px" content={label.Sales_CreateNewCompHelptext}></lightning-helptext>
				  </div>
			   </div>
			   <div class="slds-p-around_medium">
				  <!--lightning-button label={label.Sales_addnewcomp} title="Add computer" onclick={createNewComputer} class="slds-m-left_x-small"></lightning-button-->
				  <template if:true={createComputer}>
					 <c-sslc-Create-New-Computer-Button onclose={closeEvent} onsuccess={handleHostSuccess} oncancel={cancelEvent} toollicensetype ={licenseType} primaryadmincontact={primarycontact}></c-sslc-Create-New-Computer-Button>
					 <!--c-sslc-Create-New-Computer-Button onclose={closeEvent} oncancel={cancelEvent} licneserecordid ={licneserecordid} toollicensetype ={licenseType} primaryadmincontact={primarycontact}></c-sslc-Create-New-Computer-Button-->
					 <div class="slds-backdrop slds-backdrop_open" style="opacity: .23;"></div>
				  </template>
				  <button class="slds-button slds-button_neutral lgc-bk" onclick={createNewComputer}>{label.Sales_NewComputerButtonHostPage} </button>
			   </div>
			</div>
		 </div>
		  <!--terms & conditions starts here-->
		  <div style="display: flex; width:100%;padding-top: 5%;">
			<div>
				<div style="display: flex;align-items:center;padding-bottom: 1%;">
				   <span class="required" style="display:flex;flex-basis: 3%;justify-content:center">*</span> 
				   
				   <lightning-input type="checkbox" name="options" onclick={handleTandC} style="flex-basis: 2%;margin-right:1.5%;">
				   </lightning-input>
				   
				   <label class="container" style="flex-basis:auto">{TermsConditionTxt}</label>              
				</div>
				<div style="display:flex;align-items:center;width:100%;padding-bottom: 1%;">
					<span style="flex-basis: 6.3%;"></span>
				   	<lightning-formatted-rich-text value={termsCondition} style="font-size:12px;font-family:'Work Sans';word-break:break-all;flex-basis:85%"> 
				   	</lightning-formatted-rich-text>
				</div>
				<div style="display: flex;align-items:flex-start;padding-bottom: 1%;">
					<span style="flex-basis: 3%;"></span>
					
					<lightning-input type="checkbox" name="options2" onchange={handleOptin}  style="font-family:'Work Sans';flex-basis: 2%;margin-right:1.5%; text-align:top;" ></lightning-input>
					
					<label checked="checked" style="flex-basis:auto;">{TermsCondition_Optin}</label>
				</div>
			 </div>
		  </div>
	   
	
	<div  class="slds-m-top_small slds-m-bottom_medium">
	   <div class="slds-p-top_medium lgb-bttn">
		  <lightning-button label={label.Sales_BackHostPage} title="Back" onclick={handleBacktButtonClick}  variant="brand"></lightning-button>
		  &nbsp;&nbsp;
		  <template if:true={isGenerateButtonDisabled}>
			 <lightning-button label={label.Sales_Generate} variant="brand" onclick={handleNextButtonClick} disabled={isGenerateButtonDisabled} title="Please select mandatory details" class="tooltip11">
			 </lightning-button>
		  </template>
		  <template if:false={isGenerateButtonDisabled}>
			 <lightning-button label={label.Sales_Generate}  variant="brand" onclick={handleNextButtonClick} disabled={isGenerateButtonDisabled}>
			 </lightning-button>
		  </template>
		  <!--lightning-button label="Generate" title="Fill the mandatory details" onclick={handleNextButtonClick} disabled={isGenerateButtonDisabled}  variant="brand"></lightning-button-->
	   </div>
	   <div>
		  <!--template if:true={error}>
			 <p>Error: {error}</p>
			 </template-->
	   </div>
	</div>
</div>
</div>
	<!--/lightning-record-edit-form-->
 </template>
