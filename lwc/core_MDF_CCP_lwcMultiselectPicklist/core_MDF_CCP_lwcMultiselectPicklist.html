<template>
        <div class="slds-combobox_container">
            <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open" aria-expanded="false" aria-haspopup="listbox" role="combobox"  >
                <!-- Search Input -->
                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                    <lightning-input disabled={disabled} class="inputBox" 
                    placeholder={placeholder}
                    onblur={blurOption} 
                    onclick={selectOptions} 
                    onkeyup={optionsFilter} 
                    value={searchString}
                    label={label}
                    auto-complete="off" variant="label-hidden" id="combobox-id-1" aria-autocomplete="list"></lightning-input>
                    <lightning-icon class="slds-input__icon" icon-name="utility:down" size="x-small" alternative-text="downicon"></lightning-icon>
                </div>
                <!-- Dropdown List -->
                <template if:true={dropdown}>
                    <div style="background: white;" id="listbox-id-1" class="slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                <template for:each={optionData} for:item="option">
                                    <template if:true={option.isVisible}>
                                    <li key={option.value} data-id={option.value} onmousedown={itemSelect} class="slds-listbox__item">
                                        <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" role="option">
                                            <span class="slds-media__figure slds-listbox__option-icon">
                                                <span class="slds-icon_container slds-icon-standard-account">
                                                    </span>
                                                    </span>
                                        <template if:true={option.selected}>
                                            <lightning-icon icon-name="utility:check" size="x-small" alternative-text="icon" ></lightning-icon>
                                        </template>
                                        <span class="slds-media__body">
                                        <span class="slds-media slds-listbox__option_entity ">{option.label}</span>
                                    </span>    
                                    </div>
                                    </li>
                                    </template>
                                </template>
                        </ul>
                    </div>
                </template>
            </div>
        </div>
        <!-- Multi Select Pills -->
        <template for:each={optionData} for:item="option">
            <template if:true={option.selected}>
                <lightning-pill key={option.value} class="slds-m-around_xx-small" name={option.value} label={option.label} onremove={removePill} icon-name="custom:custom11"></lightning-pill>
            </template>
        </template>

</template>
