<template>

  
    <div class="set-width tr-width">

    <lightning-record-view-form
        record-id={recordId}
        object-api-name={objectApiName}>

        <div class="slds-grid " style="background-color: white; height: 90%;">
            <div class="slds-col slds-size_1-of-2 slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small slds-m-top_medium">
                <div class="slds-page-header">
                    <div class="slds-page-header__row">
                      <div class="slds-page-header__col-title">
                        <div class="slds-media">
                          <div class="slds-media__figure">
                            <span class="slds-icon_container slds-icon-standard-opportunity" title="opportunity">
                              <svg class="slds-icon slds-page-header__icon" aria-hidden="true">
                                <use xlink:href="/assets/icons/standard-sprite/svg/symbols.svg#opportunity"></use>
                              </svg>
                            </span>
                          </div>
                          <div class="slds-media__body">
                            <div class="slds-page-header__name">
                              <div class="slds-page-header__name-title">
                                <h1>
                                  <span class="slds-page-header__title slds-truncate" title="Rohde Corp - 80,000 Widgets">Current Account</span>
                                </h1>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small slds-m-top_medium" >
                <div class="slds-page-header">
                    <div class="slds-page-header__row">
                      <div class="slds-page-header__col-title">
                        <div class="slds-media">
                          <div class="slds-media__figure">
                            <span class="slds-icon_container slds-icon-standard-opportunity" title="opportunity">
                              <svg class="slds-icon slds-page-header__icon" aria-hidden="true">
                                <use xlink:href="/assets/icons/standard-sprite/svg/symbols.svg#opportunity"></use>
                              </svg>
                            </span>
                          </div>
                          <div class="slds-media__body">
                            <div class="slds-page-header__name">
                              <div class="slds-page-header__name-title">
                                <h1>
                                  <span class="slds-page-header__title slds-truncate" title="Rohde Corp - 80,000 Widgets">Target Account</span>
                                </h1>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
            </div>
        </div>


        <div class="slds-grid " style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2 slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small slds-m-top_medium">
                <lightning-output-field field-name="Old_Account__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small slds-m-top_medium" >
                <lightning-output-field field-name="Account__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 90%;">
            <div class="slds-col slds-size_1-of-2 slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Old_CIM_ID__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="New_CIM_ID__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Old_CNDA__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="New_CNDA__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Old_English_Only_Name__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="New_English_only_Name__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Old_Export_Compliance_Block__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="New_Export_Compliance_Block__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Old_IPS_Active__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="New_IPS_Active__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Old_IsODM__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="New_IsODM__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Old_PSG_Account__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="New_PSG_Account__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Is_Approved__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Is_Rejected__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Checked_with_Account_Owner__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Keep_Entitlement__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Contact__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="New_Comments__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Contact_Email__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Reason__c"> </lightning-output-field>
            </div>
        </div>

        <div class="slds-grid" style="background-color: white; height: 100%;">
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Case_without_Project__c"> </lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2  slds-border_bottom slds-m-horizontal_medium slds-m-bottom_x-small">
                <lightning-output-field field-name="Case_with_Project__c"> </lightning-output-field>
            </div>
        </div>

        <template if:true= {showButtons}>
        <div class="slds-grid slds-m-top_x-large slds-m-bottom_x-small" >
            <div class="slds-col slds-size_1-of-3" >
                <lightning-button variant="brand" label="Approve" title="Primary action" onclick={handleClick1} class="slds-m-left_x-small"></lightning-button>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-button variant="brand" label="Reject" title="Primary action" onclick={handleClick2} class="slds-m-left_x-small"></lightning-button>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-button variant="brand" label="Show Entitlement" title="Primary action" onclick={AllEntitlement} class="slds-m-left_x-small"></lightning-button>
            </div>
        </div>
        </template>

    </lightning-record-view-form>
    </div>


    <template if:true={isModalOpen}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Reason for Rejection </h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <div class="slds-p-around_medium lgc-bg">
                        <lightning-input type="text" label="Enter Reason For Rejection" placeholder="type here..." onchange={handlechange}></lightning-input>
                    </div>
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={onRejection} title="OK" >Reject</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showEntitlement}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModalforEntitlments}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">All Entitlement </h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                    <div class="slds-p-around_medium lgc-bg">
                        <lightning-datatable
                                key-field="id"
                                data={data1}
                                columns={columns}>
                        </lightning-datatable>  
                    </div>
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModalforEntitlments} title="Cancel">Cancel</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
