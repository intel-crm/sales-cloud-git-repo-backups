<template>
  <!-- <lightning-input type="file"
                   label="Import Template"
                   variant="label-hidden"
                   multiple="false"
                   accept=".csv"
                   onchange={handleTemplate}
                   class="clearSearch"></lightning-input>           -->
      
                   <div class="choose_file">
                   
                    <button id="myBtn" type="button" class="slds-button slds-button_brand clearSearch" disabled={disableButton}>Choose file</button>
                    <input name="file" type="file"  onchange={uploadBulkDataUploadRecords} accept=".csv" disabled={disableButton}/>
                </div>
                <br/>
                <br/>
               <br/>
             
                <div>
                  <template if:true={isShowModal}>
                    <p style="text-align: center; font-weight:30px">{label.PRM_PleaseWaitSpinnerBulk}</p> 
              <div class="exampleHolder">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
            </template>
          
                </div>
              
              
  <!-- modal start -->      
  <template if:true={isShowModalSuccess}>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
      <!-- modal header start -->
        <header class="slds-modal__header">
          <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
              <lightning-icon icon-name="utility:close"
                alternative-text="close"
                variant="inverse"
                size="small" ></lightning-icon>
              <span class="slds-assistive-text">Close</span>
          </button>
          <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{label.PRM_Upload_Message}</h2>
        </header>
        <!-- modal body start -->
        <div class="slds-modal__content slds-p-around_medium slds-text-align_center" id="modal-content-id-12">
              <p>{label.PRM_Success_AlertMsgBulk}</p>
             <!-- <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Confirm" onclick={closeModal}></button> -->
        </div>
     
        <!-- modal footer start-->
        <footer class="slds-modal__footer">
          
          <button class="slds-button slds-button_brand" onclick={closeModal} title="OK">{label.PMP_Okay}</button>
        
          <!-- <button class="slds-button slds-button_brand" onclick={submitDetails} title="Confirm">Confirm</button> -->
          </footer>
      </div>
      </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
