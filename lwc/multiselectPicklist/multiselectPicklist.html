<template>
    <lightning-card>
        <div class="slds-form-element">

            <div class="slds-form-element__control">
                <div class="slds-combobox_container">
                    <div class="slds-m-around_medium">
                        <lightning-combobox value={options} options={options} placeholder="Select an Option"
                            label="Country" onchange={handleComboboxChange}></lightning-combobox>
                        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon slds-input-has-icon_left-right"
                            role="none">
                            <template for:each={selectedRecords} for:item="serecord">
                                <span key={serecord.value}>
                                    <lightning-pill label={serecord.label} name={serecord.value}
                                        onremove={removeRecord}>
                                        <lightning-icon icon-name={iconName} variant="circle"
                                            alternative-text={serecord.label}>
                                        </lightning-icon>
                                    </lightning-pill>
                                </span>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </lightning-card>

</template>
