<template>
    <div class="slds-box slds-theme_default">
        <lightning-layout class="slds-page-header slds-page-header--object-home">
            <lightning-layout-item padding="horizontal-small" size="12">
                <div class="">
                    <h1 class="slds-text-heading_medium">Batch Activity Upload</h1>
                </div>
            </lightning-layout-item>
        </lightning-layout>    
        <lightning-layout class="slds-var-p-around_medium">
            <lightning-layout-item size="4" class="slds-var-p-around_medium">
                <lightning-input type="file" 
                    accept=".csv"
                    label="Upload Attachment"
                    onchange={handleFileUpload}>
                </lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="2" class="slds-var-p-around_medium slds-align_absolute-center">
                <div>
                    <lightning-button
                        variant="brand"
                        label="Submit"
                        type="submit">
                    </lightning-button>
                </div>
            </lightning-layout-item>
            <lightning-layout-item size="6">                
            </lightning-layout-item>
        </lightning-layout>
    </div>   
</template>
