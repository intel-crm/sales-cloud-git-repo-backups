<template>
  <c-ipa-sticky full-width start="bottom">
    <div slot="sticky">
      <!-- Sticky outline -->
      <div class="sticky-container">
        <div class="slds-m-right_medium slds-m-vertical_x-small sticky-logo-container">
          <img src={logoUrl} alt={logoAlt} class="sticky-logo"></img>
        </div>
        <template if:true={contactPartnerVisible}>
          <div class="sticky-contact-button slds-p-top_small slds-p-bottom_small slds-m-right_medium">
            <c-ipa-contact-partner-button
              analytics-details={contactPartnerAnalyticsDetails}
              modal-data={contactPartnerModalData}
            ></c-ipa-contact-partner-button>
          </div>
        </template>
        <h1 class="sticky-headline slds-m-right_medium truncate-1 h3">
          {headline}
        </h1>
        <div class="sticky-social-button">
          <c-ipa-share show-label email-body={headline}></c-ipa-share>
        </div>
      </div>
    </div>

    <div slot="content">
      <div class="slds-grid slds-wrap slds-grid_pull-padded-medium header">
        <div class="header-content">
          <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-large-size_3-of-12 slds-p-horizontal_medium slds-p-bottom_medium img-col">
            <div class="img-container slds-p-around_x-small">
              <img src={logoUrl} alt={logoAlt} class="logo"></img>
            </div>
            <template if:true={contactPartnerVisible}>
              <div class="slds-m-top_medium">
                <c-ipa-contact-partner-button
                  analytics-details={contactPartnerAnalyticsDetails}
                  modal-data={contactPartnerModalData}
                >
                </c-ipa-contact-partner-button>
              </div>
            </template>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12 slds-large-size_9-of-12 header-wrapper slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="header-title">
              <h1 class="h2">{headline}</h1>
              <div class="social-share-container">
                <div class="slds-show_x-large">
                  <c-ipa-share show-label email-body={headline}></c-ipa-share>
                </div>
                <div class="slds-hide_x-large">
                  <c-ipa-share email-body={headline}></c-ipa-share>
                </div>
              </div>
            </div>
            <div class="slds-text-heading_small tagline slds-m-top_medium">{tagline}</div>
            <div class="badges-container slds-p-bottom_medium">
              <template iterator:it={formattedBadges}>
                <div key={it.value.name} class="badge-and-border">
                  <div class="badge-container slds-m-top_x-small">
                    <template if:true = {it.value.iconClass}>
                      <span class={it.value.iconClass}></span>
                    </template>
                    <template if:true = {it.value.image}>
                      <img class="specialty-img slds-m-right_x-small" src={it.value.image} aria-hidden="true"></img>
                    </template>
                    <div class="badge-name">{it.value.name}</div>
                  </div>
                  <div if:false={it.last} class="badge-border"></div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </div>
  </c-ipa-sticky>
</template>
