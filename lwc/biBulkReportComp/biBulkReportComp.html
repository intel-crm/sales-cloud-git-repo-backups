<template>
   
    <lightning-card>
    <template if:true={autoSignInEnabled}>
        <div data-id="embed-container" style="height:600px; width:100%"></div>
    </template> 
    
    
    <template if:false={autoSignInEnabled}>
        <template if:true={showReport}>
            <div style={setDIVHeight}>
                <iframe class=embed-iframe  data-id="embed_iframe" src={fullUrl} > </iframe>
            </div>
        </template>  
        <template if:true={showLink}>
           <div class="slds-m-left_medium">
            <lightning-formatted-text value="Click Here To View "></lightning-formatted-text><a href={fullUrl} target="_blank">Unified Customer Report</a>
           </div>
        </template> 
        
    </template>
    
    <template if:true={noAccess}>
        <p>{noAccessMsg}</p>
    </template>
</lightning-card>

</template>
