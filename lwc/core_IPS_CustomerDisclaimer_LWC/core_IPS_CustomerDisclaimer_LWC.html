<template>
    <div class="slds-p-around_large">
        <template if:true={finalDocData}>
            <div class="slds-align_absolute-center">
                <lightning-button label="I Accept" title="I Accept" onclick={getRedirect} class="slds-m-left_x-small">
                </lightning-button>
                <div class="slds-p-around_medium">
                    <lightning-button label="I do not Accept" title="I do not Accept" onclick={handleCancel}
                        class="slds-m-left_x-small"></lightning-button>
                </div>
            </div>
            <div class="slds-p-left_xx-large slds-p-right_xx-large slds-p-top_medium slds-p-bottom_medium"
                style="text-align: justify; text-justify: inter-word;">
                <lightning-formatted-rich-text style="text-align: justify;" disable-linkify="true" value={finalDocData}>
                </lightning-formatted-rich-text>
            </div>
        </template>
    </div>
</template>
