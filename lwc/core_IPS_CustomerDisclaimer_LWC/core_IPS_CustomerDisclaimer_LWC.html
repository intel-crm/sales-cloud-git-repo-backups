<template>
   

    <div class="slds-p-around_large">
        <template if:true={finalDocData}>
            <div class="slds-align_absolute-center">
                <!-- Accept Button -->
                <lightning-button label="I Accept" title="I Accept" onclick={getRedirect} class="slds-m-left_x-small">
                </lightning-button>
                
                <!-- Cancel Button -->
                <div class="slds-p-around_medium">
                    <lightning-button label="I do not Accept" title="I do not Accept" onclick={handleCancel}
                        class="slds-m-left_x-small"></lightning-button>
                </div>
            </div>
            
            <!-- Scrollable Content Area -->
            <div class="scrollable-content slds-p-left_xx-large slds-p-right_xx-large slds-p-top_medium slds-p-bottom_medium">
                <lightning-formatted-rich-text value={finalDocData} disable-linkify="true"></lightning-formatted-rich-text>
            </div>
        </template>
    </div>
</template>
