<template>
    <!-- Confirmation Dialog Modal -->
    <template if:true={showProceedDialog}>
        <!-- Modal Header -->
        <header class="slds-modal__header">
            <h1 class="slds-modal__title slds-hyphenate">AI Audit</h1>
        </header>
        
        <!-- Modal Body -->
        <div class="slds-modal__content slds-p-around_medium">
            <div class="slds-media">
                <div class="slds-media__body">
                    <p class="slds-text-body_regular">
                        Do you want to proceed with AI Audit? 
                        Please note that existing AI responses will be overridden.<br/>
                        Please refresh after sometime to check the AI response.
                    </p>
                </div>
            </div>
        </div>
        
        <footer class="slds-modal__footer">
            <lightning-button 
                variant="neutral" 
                label="Cancel" 
                onclick={handleCancel} 
                class="slds-m-right_small"
                disabled={isLoading}>
            </lightning-button>
            <lightning-button 
                variant="brand" 
                label="OK" 
                onclick={handleNext}
                disabled={isLoading}>
            </lightning-button>
        </footer>
    </template>
</template>
