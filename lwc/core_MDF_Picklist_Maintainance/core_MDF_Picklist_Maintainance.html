<template>
    <div class="slds-col slds-size_1-of-1 slds-var-p-around_xx-small">                   
     
       <div class="slds-grid slds-gutters slds-wrap">
         <div class="slds-col slds-size_12-of-12 slds-medium-size_6-of-12 slds-large-size_6-of-12 ">
           <!--<div class="slds-p-around_medium lgc-bg">-->
           <div style="height: 500px;overflow: auto;">
           <lightning-tree-grid columns={columns} 
           data={treeItems}
           key-field="ConCatname"
           is-loading={isLoading}
           ontoggle={handleClick}
           onrowselection={handleSelectedRows}
           selected-rows={selectedRows}
            ></lightning-tree-grid>
            </div>
         </div>
 
 
           
         <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-large-size_3-of-12">
           
           <template if:true={singleitem} >
             <lightning-card variant= "narrow">
               <h1 slot="title">Picklist Values rendered from</h1> 
                               <h1>{objectName} :: {recordTypeNm} :: {apiFieldName}</h1>
                               
               
               <template if:true={picklistValues.data} >
                 
                   <div class="slds-m-around_medium">
                       <template for:each={picklistValues.data.values} for:item="item">
                           <lightning-input key={item.value} label={item.label} data-value={item.value} type="radio"></lightning-input>
                       </template>
                   </div>
               
             </template>
           </lightning-card>
         </template>
        </div>
 
      <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-large-size_3-of-12">
       <template if:true={twoitems} >
      <lightning-card variant= "narrow">
       <h1 slot="title">Picklist Values rendered from</h1> 
                       <h1>{objectName1} :: {recordTypeNm1} :: {apiFieldName1}</h1>
                       
       
       <template if:true={picklistValues1.data}>
           <div class="slds-m-around_medium">
               <template for:each={picklistValues1.data.values} for:item="item">
                   <lightning-input key={item.value} label={item.label} data-value={item.value} type="radio"></lightning-input>
               </template>
           </div>
       </template>
   </lightning-card>
 </template>
 
 </div>
        </div>
       
     </div>
     
   
 
 </template>
