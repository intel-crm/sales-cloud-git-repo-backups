<!-- **********************************************************************************************
* LWC Name - psg_quoteRequestButton
* Created By - Avani
* Description - Button to invoke Disty Quote Request form from Community Portal
************************************************************************************************ -->
<template>
        <br/>
        <div class="slds-align_absolute-center">
            <lightning-button-group>
                <lightning-button if:true={isPSG} label="Create PSG Quote" title="Create PSG Quote"
                    onclick={openModal}
                    class="slds-align_absolute-center slds-m-left_x-small">
                </lightning-button>
                <lightning-button if:true={isTender} label="New Quote" title="New Quote"
                    onclick={openNewIQRQuoteForm}
                    class="slds-align_absolute-center slds-m-left_x-small">
                </lightning-button>
            </lightning-button-group>
        </div>
       
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close"
                                alternative-text="close"
                                variant="inverse"
                                size="small" ></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                       <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">PSG Quote Request</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        <c-psg_request-quote></c-psg_request-quote>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
     </template>
