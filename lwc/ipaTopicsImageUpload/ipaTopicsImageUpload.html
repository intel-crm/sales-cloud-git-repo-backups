<template>
    <lightning-card title="Image Upload">
        <div class="slds-m-around_medium">
            <lightning-input type="file" 
                accept=".jpg, .jpeg, .png"
                onchange={openfileUpload}>
            </lightning-input>
        </div>
        <template if:true={fileData}>
            <img src={preview} height="100" alt="Uploaded Image Preview...">
            <p>{fileData.filename}</p>
        </template>
        <lightning-button variant="brand" label="submit" title="Submit" onclick={handleClick} class="slds-m-top_medium"></lightning-button>
    </lightning-card>
</template>
