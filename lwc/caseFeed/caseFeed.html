<template>
	<div if:true={isSpinner}>
		<div style="display: flex;justify-content: center;align-items: center;width: 80px;height: 80px;">
			<lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
		</div>
	</div>
	<div if:false={isSpinner}>
		<lightning-tabset>
			<lightning-tab label="Chatter">
				<lightning-card variant="Narrow">
					<div class="slds-box">
						<lightning-tabset variant="scoped">
							<lightning-tab label="Post">
								<div class="PostClass">
									<lightning-input-rich-text 
										value={myVal} 
										onchange={handlePostComment} 
										placeholder="Share an update..." 
										oninput={handleMention}
									></lightning-input-rich-text>
								
									<template if:true={isMentioned}>
										<div class="mention-message">
											<ul class="mention-list">
												<template if:true={isSearchResult}>
													<template for:each={mentionedUsers} for:item="user">
														<li key={user.ExternalId} data-mention={user.ExternalId} data-name={user.Name__c} onclick={selectUser}>
															<span class="slds-avatar slds-avatar_circle slds-avatar_profile-image-large">
																<span class="slds-assistive-text">{user.Name__c}</span>
															</span>
															&nbsp;{user.Name__c}
														</li>
													</template>
												</template>
												<template if:false={isSearchResult}>
													<li>No results for "{searchTerm}".</li>
												</template>
											</ul>
										</div>
									</template>
									
									<!-- Share Button -->
									<div class="postclassInner-SelectSubmit">
										<lightning-button 
											variant="brand" 
											label="Share" 
											title="share" 
											onclick={handleSharePost} 
											class="slds-m-left_x-small"
										></lightning-button>
									</div>
								</div>
								
							</lightning-tab>
						</lightning-tabset>
						<div style="display:flex;padding-top:2%;justify-content: flex-end;">
							<button title="Share this item" onclick={handleRefresh} style="border: 1px solid lightgray;padding: 10px;border-radius : 5px;background: transparent;display: flex;">
								<lightning-icon icon-name="utility:refresh" alternative-text="refresh" title="refresh" size="xx-small"></lightning-icon>
							</button>
						</div>
						<template for:each={feed} for:item="element" for:index="index">
							<div key={element.Id}>
								<div if:true={element.showElement}>
									<div class="slds-feed" style="max-width: 100%;margin : 1px;">
										<ul class="slds-feed__list">
											<li class="slds-feed__item">
												<article class="slds-post">
													<header class="slds-post__header slds-media">
														<!-- Focus Here -->
														<div class="slds-media__figure">
															<span class="slds-avatar slds-avatar_circle slds-avatar_profile-image-large">
																<span class="slds-assistive-text">{element.bodyMessage.user}</span>
															</span>
														</div>
														<div class="slds-media__body">
															<div class="slds-grid slds-grid_align-spread slds-has-flexi-truncate">
																<p>
																	<a href="#" title={element.bodyMessage.user}>{element.bodyMessage.user}</a>
																</p>
															</div>
															<p class="slds-text-body_small"> {element.relativeCreatedDate} </p>
														</div>
													</header>
													<div class="slds-box">
														<div class="slds-post__content slds-text-longform">
															<div style="font-weight: 500">
																<u>Message</u>
															</div>
															<lightning-formatted-rich-text value={element.bodyMessage.message}></lightning-formatted-rich-text>
														</div>
													</div>
													<!-- Focus End -->
													<footer class="slds-post__footer">
														<div style="padding-top: 2%;display:flex;align-items:center;width: 100%;">
															<ul class="slds-post__footer-actions-list slds-list_horizontal" style="justify-content: flex-start;">
																<li class="slds-col slds-item slds-m-right_medium">
																	<button title="Share this item" class={element.commentClass} data-val={element.indexValue} onclick={handleIsVisble}>
																		<lightning-icon icon-name="utility:anywhere_chat" alternative-text="comments" title="comments" size="x-small"></lightning-icon> Comment
																	</button>
																</li>
															</ul>
															<ul class="slds-post__footer-meta-list slds-list_horizontal slds-has-dividers_right slds-text-title" style="justify-content: flex-end;">
																<li class="slds-item"> {element.capabilities.comments.page.total} comment </li>
															</ul>
														</div>
													</footer>
													<br>
													<div if:true={element.isVisible}>
														<div class="slds-feed__item-comments">
															<template for:each={element.commentComments} for:item="ele" for:index="index">
																<article class="slds-comment slds-media slds-hint-parent" key={ele}>
																	<div class="slds-media__figure">
																		<span class="slds-avatar slds-avatar_circle slds-avatar_profile-image-large">
																			<span class="slds-assistive-text">{ele.text.user}</span>
																		</span>
																	</div>
																	<div class="slds-media__body">
																		<header class="slds-media slds-media_center">
																			<div class="slds-grid slds-grid_align-spread slds-has-flexi-truncate">
																				<p class="slds-truncate" title={ele.text.user}>
																					<a href="#" title={ele.text.user}>{ele.text.user}</a>
																				</p>
																			</div>
																		</header>
																		<div class="slds-comment__content slds-text-longform">
																			<lightning-formatted-rich-text value={ele.text.message}></lightning-formatted-rich-text>
																		</div>
																		<footer>
																			<ul class="slds-list_horizontal slds-has-dividers_right slds-text-body_small">
																				<li class="slds-item"> {ele.relativeCreatedDate} </li>
																			</ul>
																		</footer>
																	</div>
																</article>
															</template>
															<div class="slds-media slds-comment slds-hint-parent">
																<div class="slds-media__figure">
																	<span class="slds-avatar slds-avatar_circle slds-avatar_profile-image-large">
																		<span class="slds-assistive-text">{element.bodyMessage.user}</span>
																	</span>
																</div>
																<div style="display: flex;flex-direction:column;width:100%;position: relative;">
																	<div class="slds-media__body">
																		<div class="slds-publisher slds-publisher_comment slds-is-active">
																			<label for="comment-text-input-01" class="slds-assistive-text">Write a comment</label>
																			<textarea id="comment-text-input-01" data-elementid={element.indexValue} data-id={element.setCommentId} class="slds-publisher__input slds-input_bare slds-text-longform" placeholder="Write a comment…" oninput={handleMentionComment} onchange={handeleComment}></textarea>
																			<div class="slds-grid slds-publisher__actions slds-grid slds-grid_align-spread" style="align-items: center;justify-content: right;">
																				<button class="slds-button slds-button_brand" data-id={element.setCommentId} onclick={handleCommentOfComments}>Comment</button>
																			</div>
																		</div>
																	</div>
																	<template if:true={element.isSomoneMentioned}>
																		<div class="mention-message-comment">
																			<ul class="mention-list">
																				<template if:true={isSearchResult}>
																					<template for:each={mentionedUsers} for:item="user">
																						<li key={user.ExternalId} data-mention={user.ExternalId} data-name={user.Name__c} data-id={element.setCommentId} data-elementid={element.indexValue}  onclick={selectUserForComment}>
																							<span class="slds-avatar slds-avatar_circle slds-avatar_profile-image-large">
																								<span class="slds-assistive-text">{user.Name__c}</span>
																							</span>
																							&nbsp;{user.Name__c}
																						</li>
																					</template>
																				</template>
																				<template if:false={isSearchResult}>
																					<li>No results for "{searchTerm}".</li>
																				</template>
																			</ul>
																		</div>
																	</template>
																</div>
															</div>
															<br>
														</div>
													</div>
												</article>
											</li>
										</ul>
									</div>
									<hr>
								</div>
							</div>
						</template>
					</div>
				</lightning-card>
			</lightning-tab>
			<lightning-tab label="Email">
				<div style="display:flex;padding-top:2%;justify-content: flex-end;">
					<button title="Share this item" onclick={handleRefresh} style="border: 1px solid lightgray;padding: 10px;border-radius : 5px;background: transparent;display: flex;">
						<lightning-icon icon-name="utility:refresh" alternative-text="refresh" title="refresh" size="xx-small"></lightning-icon>
					</button>
				</div>
				<template if:true={feedContainEmail}>
					<template for:each={feed} for:item="element" for:index="index">
						<div key={element.Id}>
							<div if:true={element.hasEmail}>
								<div class="slds-feed" style="max-width: 100%;margin : 1px;">
									<ul class="slds-feed__list">
										<li class="slds-feed__item">
											<article class="slds-post">
												<header class="slds-post__header slds-media">
													<div class="slds-media__figure">
														<span class="slds-avatar slds-avatar_circle slds-avatar_profile-image-large">
															<span class="slds-assistive-text">{element.bodyMessage.user}</span>
														</span>
													</div>
													<div class="slds-media__body">
														<div class="slds-grid slds-grid_align-spread slds-has-flexi-truncate">
															<p class="slds-truncate" title={element.bodyMessage.user}>
																<a href="#" title={element.bodyMessage.user}>
																	<b>
																		<u style="line-height: 2;text-decoration-style: dashed;font-weight: 600;font-size: 14px;text-decoration-color: lightgray;">{element.bodyMessage.user}</u>
																	</b>
																</a>
															</p>
															<p>{element.relativeCreatedDate}</p>
														</div>
														<div style="display: flex;align-items: center;">
															<span class="slds-icon_container" title="Email">
																<lightning-icon icon-name="standard:email" alternative-text="email" title="email" size="x-small"></lightning-icon>
															</span> &nbsp; <label style="font-size: 15px;font-weight: 400;">To:&nbsp; </label>
															<template for:each={element.capabilities.emailMessage.toAddresses} for:item="email">
																<span key={email.Id}>
																	<span class="slds-pill slds-pill_bare">
																		<span class="slds-pill__icon_container" style="display:flex;">
																			<a href="#" class="slds-pill__action" title={email.emailAddress} style="display: flex;flex-basis: 40%;overflow: unset;padding: 0;padding-left: 25%;font-size: 14px;align-items: center;">
																				<span class="slds-pill__label">{email.displayName}</span>
																			</a>
																		</span>
																	</span>
																</span>
															</template>
														</div>
														<div>
															<p>
																<br>
																<strong>Subject: </strong> {element.capabilities.emailMessage.subject}
															</p>
															<br>
															<template if:true={element.emailBody.hasAttachment}>
																<strong>Attachment: </strong>
																<div style="display: flex;gap: 8px;flex-wrap: wrap;">
																	<template for:each={element.emailBody.attachments} for:item="attach" for:index="att">
																		<div key={attach.Id}>
																			<svg version="1.1" viewBox="0 0 2048 2048" width="25" height="25" xmlns="http://www.w3.org/2000/svg">
																				<path transform="translate(499)" d="m0 0h911l503 503v2l4 2 3 4v1403l-2 28-5 19-6 15-8 14-11 14-8 9-14 11-13 8-15 7-19 6-17 3h-1300l-20-4-16-5-12-5-16-10-11-9-6-5-9-11-7-9-9-16-5-12-5-19-2-18v-197h-191l-18-2-15-6-9-7-6-5-8-11-5-10-3-10-1-8v-653l4-16 6-11 9-11 11-9 13-6 7-2 8-1h198v-839l2-18 6-20 9-19 7-11 12-14 7-7 16-12 18-10 22-7z" fill="#E5E8E9" />
																				<path transform="translate(186,960)" d="m0 0h1421l16 4 14 7 11 10 9 14 5 13 2 11v641l-2 17-4 13-7 12-10 11-13 8-14 5-12 2h-1409l-18-2-15-6-9-7-6-5-8-11-5-10-3-10-1-8v-653l4-16 6-11 9-11 11-9 13-6 7-2z" fill={attach.bgColor}></path> // for color changes
																				<path transform="translate(1409,1)" d="m0 0 4 2 500 500v2l4 2 2 4-2 1h-388l-17-3-20-6-18-8-15-10-10-9-12-12-11-16-8-16-5-14-2-9-2-20-1-43v-343z" fill="#B1B9BD" />
																				<path transform="translate(1657,1702)" d="m0 0 4 1 1 9-1 4 1 4 1 7v10l-2 10-5 12-11 13-10 9-8 5-9 3-5 1-26 1h-44l-132-2h-995l-28 1-3-2v-60l1217-1 24-4 12-6 4-1v-2h2v-2l4 1v-2l7-6z" fill="#CCD3D8" />
																				<path transform="translate(1550,511)" d="m0 0h369v324l-1 56-7-6-7-7-8-7-27-27-2-1v-2l-4-2-288-288v-2l-4-2-21-21-13-10-6-3v-1z" fill="#CCD3D8" />
																				<path transform="translate(1636,1715)" d="m0 0 2 1-4 4-10 5-4-1 15-8z" fill="#DEE2E4" />
																				<text x="12%" y="66%" font-size="600" fill="white" dy=".3em">{attach.fileType}</text>
																			</svg>
																			<a title={attach.fileName} data-id={attach.contentId} data-filename={attach.fileName} data-filetype={attach.fileType} onclick={handleAttachmentContent}>{attach.fileName}</a>
																		</div>
																	</template>
																</div>
															</template>
															<br>
															<lightning-formatted-rich-text value={element.emailBody.message}></lightning-formatted-rich-text>
														</div>
													</div>
												</header>
											</article>
										</li>
									</ul>
								</div>
								<hr>
							</div>
						</div>
					</template>
				</template>
				<template if:false={feedContainEmail}>
					<article class="slds-card">
						<div class="slds-card__body slds-card__body_inner" style="display: flex;justify-content: center;font-weight: 700;">No email to display</div>
					</article>
				</template>
			</lightning-tab>
		</lightning-tabset>
	</div>
</template>
