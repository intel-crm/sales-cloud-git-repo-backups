<template>
    <lightning-card title={title}>
        <template if:true={guidelines}>
            <div class="slds-m-bottom_small" style="white-space:pre-line;">
                <lightning-icon icon-name="utility:info" alternative-text="Info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                <span>{guidelines}</span>
            </div>
        </template>
        <!-- Display errors if any -->
        <template if:true={hasErrors}>
            <div class="slds-text-color_error">
                <ul>
                    <template for:each={errorMessages} for:item="error">
                        <li key={error}>{error}</li>
                    </template>
                </ul>
            </div>
        </template>

        <lightning-datatable
            key-field="id"
            data={rows}
            columns={columns}
            hide-checkbox-column={hidecheckbox}
            suppress-bottom-bar={hidebottombar}
            show-row-number-column={showrownumber}
            oncellchange={handleCellChange}>
        </lightning-datatable>
    </lightning-card>
</template>
