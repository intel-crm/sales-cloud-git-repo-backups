<template>
    <template if:true={coMarketingRecordType}>
        <div class="slds-card" style="padding-left: 4px; padding-right: 4px; padding-top: 4px; padding-bottom: 4px;">
            <div class="slds-page-header slds-page-header__title slds-p-around_x-small">        
                <p class="slds-text-heading--small"><b>{label.accountsHierarchy}</b></p>
            </div>
            <c-account-hierarchy_-tree-grid highlighted-row-id={recordId} ultimate-account-id={ultimateAccountId} ultimate-account-name={ultimateAccountName} salesforce-baseurl={salesforceBaseurl}>                                        
            </c-account-hierarchy_-tree-grid>
        </div>
    </template>  
</template>
