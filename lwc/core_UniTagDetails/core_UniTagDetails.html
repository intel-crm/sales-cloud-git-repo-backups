<template>
    <lightning-card title = "Tags Details">
    
        <div class = "slds-grid slds-p-horizontal_meduim slds-p-top_small">
            <div class ="slds-col">
                <a href="javascript:void(0);" onclick={toggleTable}>
                    {toggleLabel}
                </a>
            </div>
            <template if:true={showTable}>
                <div class ="slds-col slds-text-align_right">
                    <a href="javascript:void(0);" onclick={handleRefresh}>
                        Refresh
                    </a>
                </div>
            </template>
        </div>

        <template if:true = {isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
        
        <template if:true={showTable}>
            <lightning-datatable 
            key-field="Id" 
            data={tagDetails} 
            columns={columns}
            hide-checkbox-column
            wrap-text-max-lines = "4">
            </lightning-datatable>

            <div class="slds-m-top_medium slds-align_absolute-center">
                <lightning-button variant="brand" label="Back" onclick={handleBack} disabled={disableBack}></lightning-button>
                <lightning-button variant="brand" label="Next" onclick={handleNext} disabled={disableNext}></lightning-button>
            </div>
        </template>
    </lightning-card>
</template>
