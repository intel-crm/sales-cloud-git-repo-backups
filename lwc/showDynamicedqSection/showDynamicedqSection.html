<template>

    <div if:true={isLoaded}>
        <lightning-spinner style="position: fixed;" alternative-text="Loading..."></lightning-spinner>
        <div style="position: fixed;" class="slds-backdrop slds-backdrop_open"></div>
    </div>
    <template if:true={showEDQ}>

        <template for:each={recordsedq} for:item="env" for:index="questionId">
            <div key={env.questionId} title={env.type}>
                <template if:true={env.hasChildQuestions}>
                    <div aria-labelledby={env.label} aria-placeholder={env.lwcplaceholder} data-id={env.questionId}>
                        <c-dynamic-question onselecteddependentidchild={handleonanswerselected} type={env.type}
                            questionlist={env.label} requiredfields={env.required} answerlist={env.lwcplaceholder}
                            placeholdertext={env.splaceholder} is-child-question={env.hasChildQuestions}
                            dependent-child-data={env.childQuestions} questionid={env.questionId}
                            parentquestion={env.hasParentQuestion}>
                        </c-dynamic-question>
                    </div>
                    <div key={env.questionId} aria-labelledby={env.questionId} id={env.questionId} class=" main">
                        

                        <!-- <lightning-input type="text" value={childvalue} required={childrequiredFields}
                            label={childquestionlist}>
                        </lightning-input>-->
                    </div>
                </template>
                <template if:false={env.hasChildQuestions}>
                    <div aria-labelledby={env.label} aria-placeholder={env.lwcplaceholder} data-id={env.questionId}>
                        <c-dynamic-question parentiterate="true" type={env.type} questionlist={env.label}
                            requiredfields={env.required} answerlist={env.lwcplaceholder}
                            placeholdertext={env.splaceholder} is-child-question={env.hasChildQuestions}
                            dependent-child-data={env.childQuestions} questionid={env.questionId}
                            parentquestion={env.hasParentQuestion}>
                        </c-dynamic-question>
                    </div>
                </template>
                <!--oninselectedquestionanswer={handleallquestionanswer}-->

                <!--  <template if:true={env.hasChildQuestions}>
                    <lightning-combobox required={env.required} name="progress" label={env.label} value={value}
                        placeholder="Select Progress" options={env.lwcplaceholder}
                        onchange={env.renderDependentQuestions}>
                    </lightning-combobox>
        </template> -->

            </div>



            <!--  <template if:true={env.hasChildQuestions}>
                2
                <template for:each={env.childQuestions} for:item="envDetail">
                    <template if:true={envDetail.isVisible}>
                        <div key={envDetail.Id} title={envDetail.type}>
                            <c-dynamic-question type={envDetail.type} questionlist={envDetail.label}
                                requiredfields={envDetail.required} answerlist={envDetail.lwcplaceholder}
                                placeholdertext={envDetail.splaceholder} ischildvisible={envDetail.isVisible}>
                            </c-dynamic-question>
                        </div>
                    </template>
                </template>
            </template>-->
        </template>


    </template>

    <div class="slds-theme_default">
        <center>
            <!-- <p><b>Show Modal Box using Lightning Web Componentes</b></p><br /><br />
            <lightning-button label="Show Modal" variant="brand" onclick={openmodal}></lightning-button> -->
        </center>

        <template if:true={openmodel}>
            <div class="demo-only" style="height: 800px; width:800px">
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                    aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={closeModal}>
                                <lightning-icon icon-name="utility:close" size="medium">
                                </lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Environment
                                Details
                            </h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">

                            <template for:each={reshowChildQuestion} for:item="chi">
                                <template if:true={chi.isVisible}>
                                    <div key={chi.Id} title={chi.type}>
                                        <div aria-labelledby={chi.label} aria-placeholder={chi.lwcplaceholder}
                                            data-id={chi.questionId}>
                                            <c-dynamic-question childiterate="true" type={chi.type}
                                                questionlist={chi.label} requiredfields={chi.required}
                                                answerlist={chi.lwcplaceholder} placeholdertext={chi.splaceholder}
                                                ischildvisible={chi.isVisible} questionid={chi.questionId}
                                                parentid={chi.parentQuestionID}>

                                            </c-dynamic-question>
                                        </div>
                                    </div>
                                </template>
                            </template>

                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button label="Cancel" variant="neutral" onclick={closeModal}></lightning-button>
                            &nbsp;&nbsp;&nbsp;&nbsp;
                            <lightning-button label="Save" variant="brand" onclick={saveMethod}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </div>
        </template>
    </div>
</template>
