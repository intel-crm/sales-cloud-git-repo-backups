<template>
    <template if:false={onboth}></template>
    <template if:true={onboth}>       
            <lightning-card>
                <template if:true={recordId}>
                    <div class="slds-align_absolute-center slds-text-heading_medium" style="margin-left:20px;margin-right:20px;margin-bottom:2px;">
                        <lightning-formatted-rich-text value={recordpagemsg}>
                        </lightning-formatted-rich-text>
                    </div>
                </template>
                <template if:false={recordId}>
                   <div  class="slds-align_absolute-center slds-text-heading_medium"  style="margin-left:20px;margin-right:20px;margin-bottom:2px;" >     
                    <lightning-formatted-rich-text value={homepagemsg}>
                    </lightning-formatted-rich-text>
                    </div>
                </template>
            </lightning-card>
    </template>
    <template if:true={showOnHomeOnly}>       
            
                <template if:false={recordId}>
                <div  class="slds-align_absolute-center slds-text-heading_medium"  style="margin-left:20px;margin-right:20px;margin-bottom:2px;" >     
                    <lightning-formatted-rich-text value={homepagemsg}>
                    </lightning-formatted-rich-text>
                </div>
                </template>
                <template if:true={recordId}></template>
           
    </template>
    <template if:true={showOnRecordOnly}>       
        
            <template if:true={recordId}>
                <div class="slds-align_absolute-center slds-text-heading_medium" style="margin-left:20px;margin-right:20px;margin-bottom:2px;">
                    <lightning-formatted-rich-text value={recordpagemsg}>
                    </lightning-formatted-rich-text>
                </div>
            </template>
            <template if:false={recordId}></template>
       
    </template>
</template>
