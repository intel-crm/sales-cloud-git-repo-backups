<template>
    <br/>
    <div class="slds-grid slds-grid--align-center">
       <!--RECORDS PER PAGE-->

            <div class="slds-col">
                
              </div>
            <div class="slds-col">
                <span if:true={controlPrevious}>
                    <lightning-button-icon icon-name="utility:left" variant="bare" size="medium" alternative-text="Previous Page" onclick={previousPage} class="slds-p-horizontal_x-small"></lightning-button-icon>
                </span>
                <label class="slds-text-color_weak slds-p-horizontal_x-small" for="pageNum">Page:</label> 
                <input type="number" id="pageNum" value={pageNumber} maxlength="4" onkeypress={handlePageNumberChange} class="customInput" title="Go to a Page"></input>
                <span>&nbsp;of &nbsp;<b id="totalPages">{totalPages}</b></span>
                <span if:true={controlNext}>
                    <lightning-button-icon icon-name="utility:right" variant="bare" size="medium" alternative-text="Next Page" onclick={nextPage} class="slds-p-horizontal_x-small"></lightning-button-icon>
                </span>
            </div>
            &nbsp;&nbsp;
            <div class="slds-col">
                <span if:true={controlPagination} class="slds-list_inline customSelect">
                    <span class="slds-select_container">
                        <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                            <template for:each={pageSizeOptions} for:item="option">
                                &nbsp;<option key={option} value={option}>{option}</option>
                            </template>
                        </select>
                    </span>
                </span>  
            </div>  
            <div class="slds-col">
                
            </div>
         
    </div>
</template>
