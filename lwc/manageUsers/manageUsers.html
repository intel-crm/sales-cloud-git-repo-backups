<template>
    <div style="background: rgb(255, 255, 255); padding-left: 10px; padding-right: 10px; padding-top: 10px; padding-bottom: 10px;" >
    <div style="font: size 40px;">
        <h2>Search for an user record or upload an excel-sheet with user email to delete from Seismic and Lessonly</h2></div>
     <div class="slds-m-bottom_small">
       <table style="width:930px; border: 1ch;"><tr>
        <td style="width:80px;vertical-align: bottom;">User Email: </td>
        <td style="width:350px;vertical-align: bottom;"><lightning-input type="text" value={searchValue}
                    onchange={searchKeyword} style="max-width: 300px;"></lightning-input>  </td>
        <td style="text-align: left;vertical-align: bottom;width:200px"> <lightning-button label="Search" onclick={handleSearchClick} variant="brand"></lightning-button></td>
         
        <td style="width:150px;vertical-align: bottom; text-align: right;">Upload Excel Sheet: </td>
        <td style="vertical-align: middle; width:240px">
            <lightning-input type="file" accept=".xlsx" onchange={handleUploadFile}></lightning-input>  
        </td>
        </tr></table>
          
</div>

    <template if:true={users}>
        <lightning-datatable data={users} 
                            columns={columns} 
                            key-field="Id"
                            onrowaction={handleRowAction}  
                           >
        </lightning-datatable>
    </template>
    <template if:true={empty}><p>No user record found.</p></template>
    <template if:true={error}>{error}</template>

<br><br>

    <div style="font: size 40px; font-weight: bold;">
        <h2>List below are the deleted users from Seismic and Lessonly</h2></div>
        <template if:true={lessonlyusers.data}>
            <lightning-datatable data={lessonlyusers.data} 
                                columns={mcolumns} 
                                key-field="Id"
                                show-row-number-column="true" 
                                hide-checkbox-column="true">
            </lightning-datatable>
        </template>
        <template if:true={empty}><p>No user record found.</p></template>
        <template if:true={error}>{error}</template>
</div>
</template>
