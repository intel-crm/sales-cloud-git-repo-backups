<template>
    <a class={classes} href={href} onclick={handleClick} title={label} aria-label={label}>
        <template if:false={hasSlotContent}>
            {label}
        </template>
        <slot class={slotClass} onslotchange={handleSlotChange}>
            Missing slot content and/or label value.
        </slot>
        <template if:false={hideIcon}>
            <template if:true={caret}>
                <span class="intel-icon i-angle-right slds-m-left_xx-small"></span>
            </template>
            <template if:true={externalUrlOrNewWindow}>
                <span class="intel-icon i-link-ext slds-m-left_xx-small"></span>
            </template>
        </template>
    </a>
</template>
