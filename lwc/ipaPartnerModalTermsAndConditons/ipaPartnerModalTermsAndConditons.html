<template>

    <template if:false={ifs.showModal}>
        <slot name="tile"></slot>
    </template>
    <template if:true={ifs.showModal}>
        <a href="#" onclick={openModal}>
            <slot name="tile"></slot>
        </a>
        <c-core-intc-modal data-name="modal1" has-body has-header fixed-header>
            <div slot="header">
                <h3 class="color-white">{modalTitle}</h3>
            </div>
            <div slot="body">
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="loading"></lightning-spinner>
                </template>
                <div class="slds-p-around_large modal-body">
                    <template if:true={checkboxValue}>
                    <div class="content-wrap">
                        <template if:true={ifs.hasImageUrl}>
                            <div class="image slds-m-right_medium">
                                <img src={imageUrl}/>
                            </div>
                        </template>
                        <div class="content">
                            <!--<template if:true={content}>-->
                                <template for:each={content} for:item="item">
                                    <template if:true={item.isText}>
                                        <p class="slds-m-bottom_medium" key={item.id}>{item.body}</p>
                                    </template>
                                    <template if:true={item.isRichText}>
                                        <div class="slds-m-bottom_medium" key={item.id}><lightning-formatted-rich-text class="spaced-out" value={item.body}></lightning-formatted-rich-text></div>
                                    </template>
                                    <template if:true={item.isLinks}>
                                        <template for:each={item.body} for:item="link">
                                            <div class="link-out slds-m-bottom_medium" key={link.id}>
                                                <c-ipa-link label={link.label} external-url={link.externalUrl} community-page={link.communityPage}  object-page={link.objectPage} record-id={link.recordId} caret="true"></c-ipa-link>
                                            </div>
                                        </template>
                                    </template>
                                </template>
                        <!--</template> -->
                        </div>
                    </div>
                </template>
<!-- fields-->
                    <template if:true={checkboxValue}>
                        <div class="checkbox-wrap">
                            <template for:each={fields} for:item="checkbox">
                                <div class="slds-m-bottom_medium checkbox checkbox-size-default slds-form-element" key={checkbox.fieldId}>
                                    <div class="slds-form-element__control slds-grow">
                                        <span class="slds-checkbox">
                                            <input type="checkbox" id={checkbox.fieldId} name={checkbox.name} value={checkbox.value} disabled={ifs.isCompleted} onchange={handleAction}>
                                            <label for={checkbox.fieldId} class="slds-checkbox__label"><span class="slds-checkbox_faux"></span>
                                                <span class="slds-form-element__label">
                                                    <lightning-formatted-rich-text class="spaced-out" value={checkbox.label}></lightning-formatted-rich-text>
                                                </span>
                                            </label>
                                        </span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <div class="content content-footer">
                        <template if:true={gdpr}>
                            <template for:each={gdpr} for:item="item">
                                <template if:true={item.isText}>
                                    <p class="slds-m-bottom_medium" key={item.id}>{item.body}</p>
                                </template>
                                <template if:true={item.isRichText}>
                                    <div class="slds-m-bottom_medium" key={item.id}><lightning-formatted-rich-text class="spaced-out" value={item.body}></lightning-formatted-rich-text></div>
                                </template>
                                <template if:true={item.isLinks}>
                                    <template for:each={item.body} for:item="link">
                                        <div class="link-out slds-m-bottom_medium" key={link.id}>
                                            <c-ipa-link label={link.label} external-url={link.externalUrl} community-page={link.communityPage}  object-page={link.objectPage} record-id={link.recordId} caret="true"></c-ipa-link>
                                        </div>
                                    </template>
                                </template>
                            </template>
                        </template>
                    </div>

                    <div class="footer-link">
                        <template if:true={ifs.isFooterLinkValid}>
                            <c-ipa-link external-url={footerLinkData.externalUrl} label={footerLinkData.label} community-page={footerLinkData.communityPage}  object-page={footerLinkData.objectPage} record-id={footerLinkData.recordId} ></c-ipa-link>
                        </template>
                    </div>

                </div>
                <div class="slds-modal__footer">
                    <button type="button" class="button button-secondary slds-button_neutral" onclick={closeModal}>{label.cancel}</button>
                    <template if:false={ifs.isCompleted}>
                        <template if:true={formValid}>
                            <button type="button" class="button button-primary flex-right" onclick={submitForm}>{label.submit}</button>
                        </template>
                        <template if:false={formValid}>
                            <button type="button" class="button button_neutral flex-right" disabled=disabled >{label.submit}</button>
                        </template>
                    </template>
                    <template if:true={ifs.isCompleted}>
                        <button type="button" class="button button-primary flex-right" onclick={closeModal}>{label.close}</button>
                    </template>
                </div>
            </div>
        </c-core-intc-modal>
    </template>

</template>
