<template>
   <template if:true={showModal}>
      <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
         <div class="slds-modal__header" style="opacity: 75%;background-color: black;color: white;">
            <div style="display: flex;">
               <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1" style="display:flex;flex-basis: 40%;top: 0px;position: relative;margin-left:2%;">{documentLabel}</h1>
               <lightning-button-icon class="slds-modal__close" title="Download"  icon-name="utility:download" icon-class="slds-button_icon-inverse" onclick={handleDownload} style="margin-left:10%;top:0;position:relative;display: flex;flex-basis: 55%;" label="Download"></lightning-button-icon>
               <lightning-button-icon class="slds-modal__close" title="Close"  icon-name="utility:close" icon-class="slds-button_icon-inverse" onclick={closeModal} style="top:0;position:relative;"></lightning-button-icon>
            </div>
         </div>
         <div class="slds-modal__container" style="width:70%">
            <div style="display: flex;justify-content: center;align-items: center;flex-flow: column-reverse;">
               <template if:true={showImage}>
                  <div style ="display: flex">
                     <img src={url} />
                  </div>
               </template>
               <template if:true={showFrame}>
                  <div>
                     <div style="display: flex;flex-direction: column;padding: 1%;row-gap: 7px;justify-content: center;align-items: center;">
                        <h1 style="font-size: 32px;font-style: normal;text-align: center;color: white;">No preview available</h1>
                        <lightning-button variant="brand" label="Download" title="Download action with brand variant" icon-name="utility:download" class="slds-m-left_x-small" onclick={handleDownload}></lightning-button>
                    </div>
                  </div>
                </template>
            </div>
         </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
   </template>
</template>
