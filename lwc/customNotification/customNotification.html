<template>
    <template if:true={ischecked}></template>
    <template if:false={ischecked}>
        <template if:true={NotificationColor}>
            <lightning-card variant="narrow">
                <template if:true={objectApiName}>
                    <div  id="sahil" class="slds-align_absolute-center slds-text-heading_medium" style="height:5rem; color:red; font-size:12px; font-weight:bold;margin-right: 20px;margin-left: 20px">{label.Sales_DowntimeNotificationOnRecord}</div>
                </template>
                <template if:false={objectApiName}>
                    <div class="slds-align_absolute-center slds-text-heading_medium" style="height:5rem; color:red; font-size:12px; font-weight:bold;margin-right: 20px;margin-left: 20px">{label.Sales_DowntimeNotificationOnHomePage}</div>
                </template>
            </lightning-card>
        </template>
        <template if:false={NotificationColor}>
            <lightning-card>
                <template if:true={objectApiName}>
                    <div class="slds-align_absolute-center slds-text-heading_medium" style="height:5rem; font-size:12px; font-weight: bold; margin-right: 20px;margin-left: 20px">{label.Sales_DowntimeNotificationOnRecord}</div>
                </template>
                <template if:false={objectApiName}>
                    <div class="slds-align_absolute-center slds-text-heading_medium" style="height:5rem;  font-size:12px; font-weight: bold;margin-right: 20px;margin-left: 20px">{label.Sales_DowntimeNotificationOnHomePage}</div>
                </template>
            </lightning-card>
        </template>

    </template>
</template>
