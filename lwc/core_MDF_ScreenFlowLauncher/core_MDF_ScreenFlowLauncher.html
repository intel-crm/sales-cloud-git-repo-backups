<template>
    <div role="dialog" tabindex="-1" class="slds-modal slds-modal_small slds-fade-in-open">
        <div class="slds-modal__container">
            <button class="slds-button slds-modal__close slds-button_icon"
                    title="Close"
                    onclick={handleClose}>
                <lightning-icon icon-name="utility:close"
                                alternative-text="Close"
                                size="small">
                </lightning-icon>
                <span class="slds-assistive-text">Close</span>
            </button>
            <template if:true={headerTitle}>
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{headerTitle}</h2>
                </header>
            </template>
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-flow
                    flow-api-name={flowApiName}
                    flow-input-variables={flowInputVariables}
                    onstatuschange={handleStatusChange}>
                </lightning-flow>
            </div>
        </div>
    </div>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
