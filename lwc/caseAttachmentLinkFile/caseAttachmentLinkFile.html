<template>
    <template if:true={isDataAvailable}>
    <lightning-card title="Select Files">
        <div class="slds-align_absolute-center">
            <lightning-button variant="brand-outline" label="Save" onclick={onSaveHandler} class="slds-m-left_x-small">
            </lightning-button>

            <lightning-button variant="brand-outline" label="Cancel" onclick={onCancelHandler}
                class="slds-m-left_x-small"></lightning-button>
        </div>
        <div class ="slds-p-around_large">
                <lightning-datatable data={dataToShow} columns={columns} key-field="Id" onrowselection={getSelectedRecords} min-column-width></lightning-datatable>                   
        </div>
        <div if:true={spinner}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
         </div>
    </lightning-card>
 </template>
 <template if:false={isDataAvailable}>
     No Data To Display
 </template>
 
</template>
