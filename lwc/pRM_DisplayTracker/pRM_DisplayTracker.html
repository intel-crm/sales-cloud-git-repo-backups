<template>
    <template if:true={stepRecs}>
        <lightning-card title={displayLabel}>
            <div class="slds-scrollable" style="max-height:25rem;">
                <div class="slds-progress slds-progress_vertical slds-m-left_medium">
                    <ol class="slds-progress__list">
                        <template for:each={stepRecs} for:item="step">
                            <template for:each={step} for:item="stp">
                                <li class="slds-progress__item" key={stp.milestone} if:true={stp.inProgress}>
                                    <div class="slds-progress__marker"></div>
                                    <div class="slds-progress__item_content slds-grid slds-grid_align-spread">{stp.milestoneDisplay}
                                    </div>
                                </li>
                                
                                <li class="slds-progress__item slds-is-completed" key={stp.milestone} if:true={stp.completed}>
                                    <span
                                        class="slds-icon_container slds-icon-utility-success slds-progress__marker slds-progress__marker_icon slds-progress__marker_icon-success"
                                        title="Complete">
                                        <lightning-icon icon-name="utility:success" alternative-text="Completed" title="Success"
                                            size="x-small"></lightning-icon>
                                        <span class="slds-assistive-text">Complete</span>
                                    </span>
                                    <div class="slds-progress__item_content slds-grid">{stp.milestoneDisplay}
                                        <template if:true={stp.displayLink}>
                                        &nbsp; <lightning-formatted-url value={stp.url} label={stp.linkLabel} target="_blank" ></lightning-formatted-url>
                                        </template>
                                    </div>
                                </li>
                                
                                 <li class="slds-progress__item slds-has-error" key={stp.milestone} if:true={stp.error}>
                                    <span
                                        class="slds-icon_container slds-icon-utility-error slds-progress__marker slds-progress__marker_icon"
                                        title="Error">
                                        <lightning-icon icon-name="utility:error"  alternative-text="Error" title="Error"
                                            size="x-small"></lightning-icon>
                                        <span class="slds-assistive-text">Error</span>
                                    </span>
                                    <div class="slds-progress__item_content slds-grid slds-grid_align-spread">{stp.milestoneDisplay}
                                    </div>
                                </li>

                                <li class="slds-progress__item" key={stp.milestone} if:true={stp.skippable}>
                                    <span
                                        class="slds-icon_container slds-progress__marker slds-progress__marker_icon"
                                        title="Skip">
                                        <lightning-icon icon-name="utility:info"  alternative-text="Skipped" title="Skipped"
                                            size="x-small"></lightning-icon>
                                        <span class="slds-assistive-text">Error</span>
                                    </span>
                                    <div class="slds-progress__item_content slds-grid slds-grid_align-spread">{stp.milestoneDisplay}
                                    </div>
                                </li>
                            </template>
                        </template>
                    </ol>
                </div>
            </div>
        </lightning-card>
    </template>
    <template if:true={errr}>
        <lightning-card>
            <p class="slds-text-color_error slds-m-left_medium">{errr}</p>
        </lightning-card>
    </template>
</template>
