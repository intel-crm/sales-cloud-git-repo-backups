<template>
    <div if:true={showTacticSpending}>
        <div class="slds-p-top_medium">
        <div class="slds-box slds-theme_default custom-box">
        <lightning-card title={tacticSpendingText}>
            <div class="slds-grid slds-wrap slds-p-horizontal_medium slds-p-vertical_small slds-text-body_regular">
                <div class="slds-m-right_medium">
                    <strong>{reimbursementRateLabel}:</strong> {reimbursementRate}%
                </div>
                <template if:true={editable}>
                    <div>
                        <strong>{totalAmountUsdLabel}:</strong> ${reimbursableAmountUsd}
                    </div>
                </template>
               <div class="slds-grid slds-align-right currency-link-wrapper">
    <a
        href="javascript:void(0);"
        class="slds-text-link slds-m-left-small"
        onclick={openCurrencyConverter}
    >
        Currency Convertor
    </a>
</div>
            </div>
            <div class="slds-scrollable_x">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th>{tacticText}</th>
                            <th>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                        {totalPlannedSpendText}
                                    <lightning-helptext  content={total_planned_spend_help_text} class="slds-p-bottom_xx-small slds-m-left_xx-small"></lightning-helptext>
                                </div>
                            </th>
                            <th>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                        {previousPeriodSpendsText}
                                    <lightning-helptext content={previous_period_spends_help_text} class="slds-p-bottom_xx-small slds-m-left_xx-small"></lightning-helptext>
                                </div>
                            </th>
                            <th>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                        {ramainingSpendText}
                                    <lightning-helptext  content={remaining_spend_help_text} class="slds-p-bottom_xx-small slds-m-left_xx-small"></lightning-helptext>
                                </div>
                            </th>
                            <th>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <span>
                                        <abbr class="slds-required" title="required">*</abbr>
                                        {spendThisPeriodText}
                                    </span>
                                    <lightning-helptext if:true={spendThisPeriodHelpText} content={spendThisPeriodHelpText} class="slds-p-bottom_xx-small slds-m-left_xx-small"></lightning-helptext>
                                </div>
                            </th>
                             <th>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                        {intelContributionText}
                                    <lightning-helptext  content={Intel_contribution_this_period_help_text} class="slds-p-bottom_xx-small slds-m-left_xx-small"></lightning-helptext>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={tactics} for:item="row" for:index="i">
                            <tr key={row.tactic} class={row.className}>
                                <td>{row.tacticLabel}</td>
                                <td>${row.totalPlannedSpend}</td>
                                <td>${row.previousSpend}</td>
                                <td>${row.remainingSpend}</td>
                                <td if:true={row.editable}>
                                    <lightning-input
                                        type="number"
                                        min="0"
                                        step="0.01"
                                        formatter="decimal"
                                        value={row.spendThisPeriod}
                                        onchange={handleSpendChange}
                                        data-index={i}
                                        variant="label-hidden"
                                        required>
                                    </lightning-input>
                                </td>
                                <td if:false={row.editable}>
                                    ${row.spendThisPeriod}
                                </td>
                                <td if:true={row.intelContribution}>
                                    ${row.intelContribution}
                                </td>
                                <td if:false={row.intelContribution}>
                                    {row.intelContribution}
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </lightning-card>
    </div>
        </div>
    </div>
    <!-- Modal/Popup for Currency Converter - ADD THIS SECTION -->
    <template if:true={showCurrencyConverter}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" 
                            title="Close" onclick={closeCurrencyConverter}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button> <!-- popup -->
                    <h2 class="slds-text-heading_medium slds-hyphenate">Currency Converter</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    
                    <c-core_-m-d-f_-currency_-convertor></c-core_-m-d-f_-currency_-convertor>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeCurrencyConverter}>
                        Close
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
