<template>
    <div class="acc-border slds-p-around_small">

        <lightning-card icon-name="standard:account" title="Record View Form Layout Full">

            <lightning-record-form record-id={recordId} object-api-name={objectApiName} layout-type="Full"

                 columns="2" mode="view" >

            </lightning-record-form>

        </lightning-card>
        

    </div>

    <div class="acc-border slds-p-around_small">

        <lightning-card icon-name="standard:account" title="Record edit Form Layout Full">

            <lightning-record-form record-id={recordId} object-api-name={objectApiName} layout-type="Full"

                 columns="2" mode="edit" onload={handleLoad} onsuccess={handleSuccess}>

            </lightning-record-form>

        </lightning-card>
        

    </div>

    <div class="acc-border slds-p-around_small">

        <lightning-card icon-name="standard:account" title="Record readonly Form Layout Full">

            <lightning-record-form record-id={recordId} object-api-name={objectApiName} layout-type="Full"

                 columns="2" mode="readOnly" >

            </lightning-record-form>

        </lightning-card>
        

    </div>

    <div class="acc-border slds-p-around_small">
        <lightning-card icon-name="standard:account" title="Record Compact Form Layout Full">
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} layout-type="Compact"
                 columns="2" mode="readOnly" >
            </lightning-record-form>
        </lightning-card>        
    </div>

    <div class="acc-border slds-p-around_small">
        <lightning-card icon-name="standard:account" title="Record View ">
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={fields} layout-type="Compact"
                 columns="1" mode="view" >
            </lightning-record-form>
        </lightning-card>        
    </div>
    <div class="acc-border slds-p-around_small">
        <lightning-card icon-name="standard:account" title="Record Edit ">
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={fields} layout-type="Compact"
                 columns="2" mode="edit" >
            </lightning-record-form>
        </lightning-card>        
    </div>
    <div class="acc-border slds-p-around_small">
        <lightning-card icon-name="standard:account" title="Record Readonly">
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={fields} layout-type="Compact"
                 columns="3" mode="readOnly" >
            </lightning-record-form>
        </lightning-card>        
    </div>

    <div class="acc-border slds-p-around_small">
        <lightning-card icon-name="standard:account" title="Record edit form Custom Layout">
            <lightning-record-edit-form object-api-name={objectApiName} record-id={recordId} fields={fields} onsuccess={handleSuccess}>
                <div class="slds-grid">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name={accName}></lightning-input-field>
                        <lightning-input-field field-name={accType}></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name={accOwner}></lightning-input-field>
                    </div>
                </div>
                <div class="slds-var-m-top_medium">
                    <lightning-button variant="brand" type="submit" label="Save Changes">
                    </lightning-button>
                </div>
            </lightning-record-edit-form>
        </lightning-card>
    </div>

</template>
