<template>
    <lightning-button label="New Quote" title="New Quote"
                    onclick={openModal}
                    class="slds-align_absolute-center slds-m-left_x-small">
    </lightning-button>

<template if:true={isOpenModal}>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container containerWidth">
            <header class="slds-modal__header">
                <!--<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close">
                    <span class="slds-assistive-text">Close</span>
                </button>-->
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">New Quote</h1>
            </header>
            <template if:true={errorMsg}>
                            <div class="errorClass">
                                {errorMsg}
                            </div>
            </template>
            <div class="slds-modal__content slds-p-around_small" >Select Quote Type:</div>
            <div class = "slds-modal__content slds-p-around_small" style = "padding-bottom: 20px" id="modal-content-id-1">
                    <lightning-radio-group  name="radioButtonGroup" 
                                            options={quoteTypes}
                                            onchange={handleChange}
                                            value={selectedValue}
                                            type="radio">
                    </lightning-radio-group>
            </div>
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={closeModal}>Cancel</button>
                <button class="slds-button slds-button_brand" onclick={handleNext}>Next</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
</template>
