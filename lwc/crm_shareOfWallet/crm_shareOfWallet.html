<template>
    <lightning-card title="Share of Wallet" icon-name="standard:account">
        <template if:true={rows.length}>
            <div class="sow-table">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th>Year</th>
                            <th>Offering</th>
                            <th>Spend</th>
                            <th>With</th>
                            <th>Competitor</th>
                            <th>Contract End Date</th>
                            <th>Comments</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={rows} for:item="row">
                            <tr key={row.id}>
                                <td><lightning-input type="text" value={row.year} data-id={row.id} data-field="year" onchange={handleInputChange} placeholder="2025"></lightning-input></td>
                                <td>
                                    <lightning-combobox 
                                        options={offeringOptions} 
                                        value={row.offering} 
                                        data-id={row.id} 
                                        data-field="offering" 
                                        onchange={handleInputChange}>
                                    </lightning-combobox>
                                </td>
                                <td><lightning-input type="number" value={row.spend} data-id={row.id} data-field="spend" onchange={handleInputChange} placeholder="100"></lightning-input></td>
                                <td><lightning-combobox options={withOptions} value={row.with} data-id={row.id} data-field="with" onchange={handleInputChange} placeholder="Direct mail"></lightning-combobox></td>
                                <td><lightning-input type="text" value={row.competitor} data-id={row.id} data-field="competitor" onchange={handleInputChange} placeholder="Nvidia"></lightning-input></td>
                                <td><lightning-input type="date" value={row.contractEndDate} data-id={row.id} data-field="contractEndDate" onchange={handleInputChange} placeholder="choose the date"></lightning-input></td>
                                <td><lightning-input type="text" value={row.comments} data-id={row.id} data-field="comments" onchange={handleInputChange} placeholder="test"></lightning-input></td>
                                <td>
                                    <lightning-button-icon icon-name="utility:delete" alternative-text="Delete" data-id={row.id} onclick={handleDeleteRow}></lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
        <p if:false={rows.length} style="text-align:center; color:red;">No data found.</p>
        <div class="slds-p-around_medium">
            <lightning-button label="Add Row" onclick={handleAddRow}></lightning-button>
            <lightning-button label="Save" variant="brand" onclick={handleSave} class="slds-m-left_small"></lightning-button>
        </div>
    </lightning-card>
</template>
