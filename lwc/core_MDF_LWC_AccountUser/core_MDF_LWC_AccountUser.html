<template>
  <header class="slds-modal__header">

    <!-- <lightning-button-icon icon-name="utility:close" class="slds-button slds-modal__close slds-button_icon-border slds-button_icon-large remove-transparency" variant="bare" alternative-text="Close" onclick={onCancel}></lightning-button-icon> -->

    <button
    id="crossCancel"
    class="slds-button slds-button_icon slds-modal__close"
    title="Close"
    onclick={onCancel}
  >
    <lightning-icon
      id="crossCancelIcon"
      class="slds-icon"
      icon-name="utility:close"
      alternative-text="Close"
    ></lightning-icon>
  </button>

    <template if:true={isUserToAccountSelected}>
      <h2 id="headerUtoA" class="slds-text-heading--medium">
        {label.userToAccountHeader}
      </h2>
    </template>
    <template if:false={isUserToAccountSelected}>
      <h2 id="headerAtoU" class="slds-text-heading--medium">
        {label.accountToUserHeader}
      </h2>
    </template>
  </header>

  <div class="slds-modal__content slds-p-around--large slds-p-bottom_none">
    <div class="slds-grid slds-wrap">
      <div class="slds-col slds-size_2-of-6 slds-p-around_small">
        <label style="color:red;font-size: large;">*</label>
        <label
          id="selectAction"
          class="slds-form-element__label"
          for="unique-id-of-input"
          style="font-weight: bold;
            font-size: small;"
          >{label.action}</label
        >
      </div>
      <div
        class="slds-col slds-size_4-of-6 slds-p-around_small slds-p-bottom_none"
      >
        <select
          id="selectOption"
          class="slds-select"
          name="accountUserAction"
          onchange={onAccountUserActionChange}
        >
          <option value="A2U">{label.accToUserOption}</option>
          <option value="U2A">{label.userToAccOption}</option>
        </select>
      </div>
    </div>
  </div>
  <template if:false={spinner}>
    <lightning-spinner alternative-text="Loading"></lightning-spinner>
  </template>
  <!--Call cmp based on condition-->
  <template if:true={isUserToAccountSelected}>
    <c-lwc-dual-list-box-user-account></c-lwc-dual-list-box-user-account>
  </template>
  <template if:false={isUserToAccountSelected}>
    <c-lwc-dual-list-box-account-user></c-lwc-dual-list-box-account-user>
  </template>
  <!--Call cmp based on condition-->
  <footer class="slds-modal__footer">
    <div class="slds-list_horizontal slds-align_absolute-center">
      <button id="cancel" class="slds-button slds-button_neutral" onclick={onCancel}>
        {label.cancelButtonName}
      </button>
      <button id="save" class="slds-button slds-button_brand" onclick={onClickOfSave}>
        {label.saveButtonName}
      </button>
    </div>
  </footer>
</template>
