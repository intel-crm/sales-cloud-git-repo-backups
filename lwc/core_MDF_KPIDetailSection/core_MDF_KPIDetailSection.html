<template>

  <template if:true={haserror}>
    <div>{label.Core_MDF_KPI_ErrorMsg}</div>
  </template>

  <template if:true={isValidKPIdata}>
    <!-- <div class="slds-card"> -->
    <article class="slds-card">
      <!-- <template if:true={displayHeader}> -->
      <lightning-layout class="slds-page-header slds-page-header--object-home">
        <lightning-layout-item padding="horizontal-small" size="12" style="width:inherit;">
          <div class="page-section page-header">
            <!-- <h1 class="slds-text-heading--label">{displayHeader}</h1> -->
            <h1 class="slds-text-heading--label">{displayLabel}</h1>
          </div>
        </lightning-layout-item>
      </lightning-layout>
      <lightning-layout horizontal-align="spread" multiple-rows="true">
      </lightning-layout>
      <!-- </template> -->
      <lightning-layout-item flexibility="grow" size="12" padding="around_xxx-small"></lightning-layout-item>
      <div class="slds-grid wrap slds-p-left_medium">
        <div class="subwrap">
          <template for:each={KPIdata} for:item="keyValue">
            <!-- <div class="slds-size_1-of-2" key={keyValue.key}> -->
            <div class="slds-form-element slds-form-element_readonly slds-size_1-of-2 slds-p-right_medium child-wrap"
              key={keyValue.key}>
              <span class="slds-form-element__label slds-p-left_medium " key={keyValue.key}>
                {keyValue.key}</span>
                <!-- Added code to support Help Text -->
                <template if:true={keyValue.helpText}>
                  <lightning-helptext content={keyValue.helpText}>
                  </lightning-helptext>
                 </template>
              <div class="slds-form-element__control slds-p-left_medium" key={keyValue.key}>
                <div class="slds-form-element__static" key={keyValue.key}>{keyValue.value}</div>
              </div>
            </div>
            <!-- </div> -->
          </template>
        </div>
      </div>
      <!-- </div> -->
    </article>
  </template>
