<template>
    <div class="slds-section slds-is-open">
        <!-- Section Title -->
        <div class="slds-section__title slds-theme_shade slds-p-around_medium slds-grid slds-grid_align-start slds-border_top slds-border_right slds-border_left slds-border_bottom" onclick={toggleSection}>
            <lightning-icon
                icon-name={toggleIconName}
                size="x-small"
                class="slds-m-right_small slds-align-top"
                alternative-text="Toggle section">
            </lightning-icon>
            <h3 class="slds-text-heading_small">Intel Account Revenue</h3>
        </div>

        <!-- Section Body (Collapsible) -->
        <template if:true={isExpanded}>
            <div class="slds-box slds-theme_default slds-p-around_medium slds-border_top slds-border_right slds-border_left slds-border_bottom">

                <!-- Spinner -->
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading" size="medium" class="slds-m-bottom_medium"></lightning-spinner>
                </template>

                <!-- Table -->
                <div class="slds-box slds-theme_shade slds-p-around_small">
                    <div>
                        <table class="slds-table slds-table_bordered slds-table_cell-buffer custom-table">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th class="slds-text-title_caps slds-p-horizontal_small">Year</th>
                                    <th class="slds-text-title_caps slds-p-horizontal_small">Revenue Type</th>
                                    <th class="slds-text-title_caps slds-p-horizontal_small">Amount</th>
                                    <th class="slds-text-title_caps slds-p-horizontal_small">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={accountPlans} for:item="plan" for:index="index">
                                    <tr key={plan.id} class="slds-hint-parent">
                                        <td class="slds-p-horizontal_small">
                                            <lightning-combobox
                                                data-index={index}
                                                name="year"
                                                value={plan.year}
                                                placeholder="Select Year"
                                                options={yearOptions}
                                                onchange={handleInputChange}
                                                variant="label-hidden"
                                                class="no-border-input">
                                            </lightning-combobox>
                                        </td>
                                        <td class="slds-p-horizontal_small">
                                            <lightning-input
                                                type="text"
                                                name="bu"
                                                value={plan.bu}
                                                placeholder="Add BU eg.DCG/CCG"
                                                class="no-border-input"
                                                data-index={index}
                                                onchange={handleInputChange}
                                                variant="label-hidden"
                                                >
                                            </lightning-input>
                                        </td>
                                        <td class="slds-p-horizontal_small">
                                            <lightning-input 
                                                type="number"
                                                step="0.01"
                                                class="no-border-input"
                                                data-index={index}
                                                value={plan.amount}
                                                onchange={handleInputChange}
                                                name="amount"
                                                variant="label-hidden"
                                                placeholder="Enter $Amount">
                                            </lightning-input>
                                        </td>
                                        <td class="slds-p-horizontal_small slds-text-align_center">
                                            <lightning-button-icon 
                                                icon-name="utility:delete"
                                                alternative-text="Delete"
                                                data-index={index}
                                                variant="bare"
                                                class="no-border-trash-icon"
                                                onclick={handleRemoveRow}>
                                            </lightning-button-icon>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="slds-grid slds-grid_align-center slds-m-top_medium">
                    <lightning-button 
                        label="Add Row" 
                        onclick={handleAddRow} 
                        class="slds-m-right_medium">
                    </lightning-button>
                    <lightning-button 
                        label="Save" 
                        variant="brand" 
                        onclick={handleSave}>
                    </lightning-button>
                </div>
            </div>
        </template>
    </div>
</template>
