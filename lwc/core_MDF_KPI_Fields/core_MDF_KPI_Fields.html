<template>
  <template if:true={showForm}>
    <lightning-layout class="slds-page-header slds-page-header--object-home">
      <lightning-layout-item padding="horizontal-small" size="12" style="width:inherit;">
        <div class="page-section page-header">
          <h1 class="slds-text-heading_label">{inputValues.title}</h1>
        </div>
      </lightning-layout-item>
    </lightning-layout>
    <template if:true={error}>
      <lightning-layout class="slds-page-header slds-page-header--object-home">
        <lightning-layout-item padding="horizontal-small" size="12">
          <div class="slds-notify slds-notify_toast slds-theme_error">
            <span class="slds-assistive-text">ERROR</span>
            <div class="slds-notify__content">
              <br />
              <p class="slds-align_absolute-center">{errorMsg}</p>
            </div>
          </div>
        </lightning-layout-item>
      </lightning-layout>
    </template>

    <lightning-layout horizontal-align="center" multiple-rows="true">
      <lightning-layout-item flexibility="grow" size="12" small-device-size="12" medium-device-size="12"
        large-device-size="12" padding="around-small">

                value={kpiValues.Core_MDF_Metrics_txt} max-length="4000" required={kpiRequiredFields.Core_MDF_Metrics_txt__c}
                disabled={kpiDisabledFields.Core_MDF_Metrics_txt}>
