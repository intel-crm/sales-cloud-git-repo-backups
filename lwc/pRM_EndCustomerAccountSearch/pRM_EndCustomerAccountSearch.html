<template>
    <lightning-card title={cardTitle} icon-name="standard:account">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <template if:true={isLoading}>
                <lightning-spinner
                    alternative-text="Loading"
                    size="small">
                </lightning-spinner>
            </template>

            <div class="slds-box slds-theme_default slds-m-bottom_medium">
                <span class="slds-form-element__label">
                    End Customer Name
                </span>
                <div class="slds-text-body_regular slds-text-title_bold">
                    {customerNameDisplay}
                </div>
            </div>

            <template if:true={searchCompleted}>
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <div class="slds-text-heading_small">
                        Suggested End Customer Accounts
                    </div>
                    <div class="slds-text-body_small slds-text-color_weak">
                        {resultCountLabel}
                    </div>
                </div>

                <template if:true={hasResults}>
                    <lightning-datatable
                        key-field="accountId"
                        data={accounts}
                        columns={columns}
                        selected-rows={selectedRows}
                        max-row-selection="1"
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>

                    <div class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                        Select an Account and click Save to update the End Customer Account lookup.
                    </div>

                    <div class="slds-grid slds-wrap slds-grid_align-spread slds-m-top_medium">
                        <div class="slds-col">
                            <lightning-button
                                label="Save"
                                variant="brand"
                                onclick={handleSave}
                                disabled={isSaveDisabled}>
                            </lightning-button>
                        </div>

                        <template if:true={isPartnerDealOpportunity}>
                            <div class="slds-col">
                                <lightning-button
                                    label="Create End Customer Account"
                                    variant="neutral"
                                    icon-name="utility:add"
                                    onclick={handleCreateAccount}
                                    disabled={isLoading}>
                                </lightning-button>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={hasResults}>
                    <div class="slds-box slds-theme_shade slds-text-align_center">
                        No matching Accounts were found for
                        <strong>{customerNameDisplay}</strong>.
                    </div>

                    <template if:true={isPartnerDealOpportunity}>
                        <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                            <lightning-button
                                label="Create End Customer Account"
                                variant="brand"
                                icon-name="utility:add"
                                onclick={handleCreateAccount}
                                disabled={isLoading}>
                            </lightning-button>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
