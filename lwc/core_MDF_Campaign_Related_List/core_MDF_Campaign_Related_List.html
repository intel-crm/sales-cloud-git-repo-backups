<template>    
    <div if:true={isComponentVisible}>
    <div class="c-container">
        <div class="slds-card"> 
            <div class="slds-media__body">
                <h2 class="slds-card__header-title">
                    <span>
                        <!--{objectName} ({recordCount})-->
                        {resolvedHeader} ({recordCount})
                    </span>
                </h2>
            </div>
            <!--<div if:true={showStaticText}>
                <h2>Static Text</h2>
            </div>-->
            <div class="slds-card__body">
                <lightning-datatable 
                    key-field="Id"
                    data={tableData}
                    columns={columns}
                    min-column-width=200
                    hide-checkbox-column="true"
                    column-widths-mode="fixed"
                    wrap-text-max-lines="10"
                    resize-column-disabled="true">
                </lightning-datatable> 
                <template if:true={tableMessage}>
                    <div class="slds-p-around_small slds-text-body_regular">{tableMessage}</div>
                </template>
            </div>                           
        </div> 
    </div> 
    </div>   
</template>
