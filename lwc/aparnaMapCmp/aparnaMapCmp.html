<template>
    <lightning-card>
      <div class="slds-grid slds-wrap">
        <div class="slds-col slds-size_8-of-12">
          <lightning-card title={label.homePageLabel}>
            <!--<lightning-card title="Search">-->
            <lightning-button slot="actions" variant="brand" label="New MAP" title="New MAP" disabled={isVisible}>
            </lightning-button>
            <div class="slds-m-left_medium">
              <span class="slds-text-heading_small">Search</span>
              <div class="slds-m-left_xxx-small slds-grid slds-wrap slds-size_1-of-1 slds-gutters">
                <div class="  slds-grid slds-wrap slds-size_6-of-12 slds-grid--vertical-align-center ">
  
                  <div class="slds-size_4-of-12">
                    <label class="slds-form-element__label slds-m-top_small">By Supported Product:</label>
                  </div>
                  <div class="slds-size_8-of-12">
                    <c-core_-i-p-s_-lightning-input-utility onchange={handleSearchProductText} placeholder="Products"
                      value={searchProductText}>
                    </c-core_-i-p-s_-lightning-input-utility>
                  </div>
  
                </div>
                <div class="slds-grid slds-wrap slds-size_6-of-12 slds-grid--vertical-align-center ">
  
                  <div class="slds-size_3-of-12">
                    <label class="slds-form-element__label slds-m-left_medium slds-m-top_small">By Account:</label>
                  </div>
                  <div class="slds-size_9-of-12">
                    <c-core_-i-p-s_-lightning-input-utility onchange={handleSearchAccountText} placeholder="Accounts"
                      value={searchAccountText}>
                    </c-core_-i-p-s_-lightning-input-utility>
                  </div>
  
                </div>
              </div>
              <div class="slds-m-left_xxx-small slds-grid slds-wrap slds-size_1-of-1 slds-gutters">
                <div class="slds-grid slds-wrap slds-size_6-of-12 slds-grid--vertical-align-center ">
  
                  <div class="slds-size_4-of-12">
                    <label class="slds-form-element__label slds-m-top_small">By MAP Name:</label>
                  </div>
                  <div class="slds-size_8-of-12">
                    <c-core_-i-p-s_-lightning-input-utility onchange={handleSearchMapName} placeholder="MAP Name"
                      value={searchMapName}>
                    </c-core_-i-p-s_-lightning-input-utility>
                  </div>
  
                </div>
                <div class="slds-grid slds-wrap slds-size_6-of-12 slds-grid--vertical-align-center ">
  
                  <div class="slds-size_3-of-12">
                    <label class="slds-form-element__label slds-m-left_medium slds-m-top_small">By Org Name:</label>
                  </div>
                  <div class="slds-size_9-of-12">
                    <c-core_-i-p-s_-lightning-input-utility onchange={handleSearchOrgName} placeholder="Org Name"
                      value={searchOrgName}>
                    </c-core_-i-p-s_-lightning-input-utility>
                  </div>
  
                </div>
              </div>
            </div>
  
            <div class="slds-form slds-grid slds-gutters">
              <div class="slds-align_absolute-center slds-m-top_medium">
  
                <lightning-button variant="brand" label="Search" onclick={handleSearch} title="New MAP">
                </lightning-button>
                <lightning-button variant="brand" label="Clear" onclick={handleClear} class="slds-m-left_medium"
                  title="New MAP">
                </lightning-button>
  
              </div>
            </div>
            <template if:true={showMapResult}>
              <template if:true={displayMapResult}>
                <div class="slds-form slds-grid slds-gutters">
                  <c-core_-i-p-s_-search-result-utility enable-infinite-loading={enableInfiniteLoading}
                    no-of-records={recordsToDisplay} map-result={displayMapResult} columns={column}>
                  </c-core_-i-p-s_-search-result-utility>
                </div>
              </template>
            </template>
          </lightning-card>
        </div>
        <!--</lightning-card>-->
  
        <div class="slds-col slds-size_4-of-12">
  
        </div>
      </div>
  
    </lightning-card>
  </template>
