<template>
    <template if:true={showProceedDialog}>
        <header class="slds-modal__header">
            <h1 class="slds-modal__title slds-hyphenate">
                Agentic RFP Scraping Generation
            </h1>
        </header>

        <div class="slds-modal__content slds-p-around_medium">
            <p class="slds-m-bottom_medium">
                Do you want to proceed with Agentic RFP Scraping Generation?
                Please note that existing AI responses will be overridden.
            </p>

            <template if:true={documentOptions.length}>
                <lightning-checkbox-group
                    name="documents"
                    label="Select Documents"
                    options={documentOptions}
                    value={selectedDocuments}
                    onchange={handleDocumentSelection}
                    required>
                </lightning-checkbox-group>

                <template if:true={selectionError}>
                    <div class="slds-text-color_error slds-m-top_small">
                        Please select at least one document.
                    </div>
                </template>
            </template>

            <template if:false={documentOptions.length}>
                <p>No documents found on this Quote.</p>
            </template>
        </div>

        <footer class="slds-modal__footer">
            <lightning-button
                variant="neutral"
                label="Cancel"
                onclick={handleCancel}
                class="slds-m-right_small">
            </lightning-button>

            <lightning-button
                variant="brand"
                label="OK"
                onclick={handleNext}
                disabled={isLoading}>
            </lightning-button>
        </footer>
    </template>
</template>
