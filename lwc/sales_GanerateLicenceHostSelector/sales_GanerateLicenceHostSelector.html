<template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <div class="slds-modal__content slds-p-around_medium">
                <c-sales_-Generate-License_-On-License-Record fromcmp={fromComponentValue} onclose={closeEvent} webdisplay-flag={webdisplayFlag} activatecodeonload={activatecodeonload} selectedhost-id={hostValue} record-id={recordId} licneserecordid={recordId} existingcomputername={existingcomputername} success-event={closeEvent} disablefeedback={disablefeedback}></c-sales_-Generate-License_-On-License-Record>

                    <lightning-input-field field-name="Sales_License_Host_Node_Id__c">
                    </lightning-input-field>

                </lightning-record-edit-form>
            </div>

            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral">Cancel</button>
                <!-- <button class="slds-button slds-button_brand">Save</button> -->
            </footer>
        </div>
    </section>
