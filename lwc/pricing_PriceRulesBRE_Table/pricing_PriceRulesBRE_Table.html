<template>
    <lightning-card title="RPM Price Rules" icon-name="custom:custom63">
      <div class="slds-m-around_medium">
        <div class="slds-grid slds-grid_align-end slds-m-bottom_small">
            <lightning-button label="New" variant="brand" onclick={openModal}></lightning-button>
        </div>
          <lightning-datatable
            key-field="Id"
            data={priceRulesRecords}
            columns={COLS}
            onsave={handleSave}
            draft-values={draftValues}
            hide-checkbox-column="true"
          >
          </lightning-datatable>
      </div>


    <template if:true={isModalOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Create New Record</h2>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">

                    <!-- Lookup (custom component or use lightning-record-edit-form) -->
                   <!--- <c-custom-lookup onlookupselected={handleLookup}></c-custom-lookup>-->

                    <!-- Picklist 1 -->
                    <div class="slds-grid slds-gutters slds-wrap">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-combobox
                                label="Fields"
                                value={picklist1}
                                options={picklistOptions}
                                onchange={handlePicklist1Change}>
                            </lightning-combobox>
                        </div>
                    

                        <div class="slds-col slds-size_1-of-3">
                            <lightning-combobox
                                label="Operator"
                                value={picklist2}
                                options={OperatorOptions}
                                onchange={handleOperatorOptionChange}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-input
                                label="Value"
                                value={notes}
                                onchange={handleNotesChange}>
                            </lightning-input>
                        </div>
                    </div>                
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={handleSavebutton}></lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    </lightning-card>
  </template>
