    <!--code for multiselectPicklist-->
   
   
   <lightning-card  title="Account Type DQ Report">
    
       <div class="slds-p-horizontal_small">
        
           <div class="slds-form-element selectbox">
               <label class="slds-form-element__label" for="combobox-id-5">{picklistlabel}</label>
       
               <div class="slds-form-element__control">
                   <div class="slds-combobox_container slds-size_small">
                       <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open"
                           aria-expanded="true" aria-haspopup="listbox" role="combobox" onmouseleave={handleleave}>
                           <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                               <input type="text"
                                   class="slds-input slds-combobox__input slds-has-focus slds-combobox__input-value"
                                   id="combobox-id-5" aria-controls="listbox-id-5" role="textbox"
                                   placeholder="Select an Option" readonly="" value={selectedmessage}
                                   onclick={handleShowdropdown} />
                               <span
                                   class="slds-icon_container slds-icon-utility-down slds-input__icon slds-input__icon_right">
                                   <lightning-icon icon-name="utility:down" size="x-small" aria-hidden="true"
                                       alternative-text="drop-down" title="click to drop-down">
                                   </lightning-icon>
                               </span>
                           </div>
       
                           <!-- Drop down section : Start -->
                           <template if:true={showdropdown}>
                               <div id="listbox-id-5" class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                                   role="listbox">
                                   
                                   <ul class="slds-listbox slds-listbox_vertical" role="presentation">
       
                                       <template for:each={values} for:item="eachvalue">
       
                                           <c-picklist-value key={eachvalue.label} label={eachvalue.label}
                                               value={eachvalue.value} selected={eachvalue.selected}>
                                           </c-picklist-value>
       
                                       </template>
                                   </ul>
                               </div>
                               
                           </template>
                           <!-- Drop down section : Start -->
                           
                       </div>
                   </div>
                   <!-- Selected Pills section : Start-->
                   <div class="slds-listbox_selection-group">
                       <ul class="slds-listbox slds-listbox_horizontal" role="listbox" aria-label="Selected Options:"
                           aria-orientation="horizontal">
                           <template for:each={selectedvalues} for:item="eachvalue">
                               <li key={eachvalue} class="slds-listbox-item" role="presentation">
                                   <span class="slds-pill" role="option" tabindex="0" aria-selected="true">
                                       <span class="slds-pill__label" title={eachvalue}>{eachvalue}</span>
                                       <span class="slds-icon_container slds-pill__remove" title="Remove">
                                           <lightning-icon icon-name="utility:close" size="x-small" aria-hidden="true"
                                               alternative-text="Remove" title="Remove" onclick={closePill}
                                               data-value={eachvalue}>
                                           </lightning-icon>
                                           <span class="slds-assistive-text">Click to remove</span>
                                       </span>
                                   </span>
                               </li>
                           </template>
                       </ul>
                   </div>
                   <!-- Selected Pills section : End-->
               </div>
           </div>

           <lightning-button variant="brand" label="Fetch Report" title="Fetch Report" onclick={fetchReports}>
           </lightning-button>
           
       </br></br>
       
      
       
       <template if:true={loaded}>
           <lightning-spinner alternative-text="Loading"></lightning-spinner>
       </template>
       <template if:true={showae}>
           <h2><b> DQ Data </b></h2>
           <div class="slds-scrollable" style="height:500px;width:750px">
           
                    <c-screen_chart_-parent chart-configurations={chartConfiguration}></c-screen_chart_-parent>
            
       </div>
           <div  style="height:200px;">
           <div class="slds-scrollable" style="height:100%;width: 100%;">
           <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-border_left slds-border_right">
            <thead>
                <th style="width:50%" role="gridcell">
                    <div title="Name">Name</div>
                </th> 
                <th style="width:10%" role="gridcell">
                    <div  title="Name">DQ Score</div>
                </th>
                <th style="width:20%" role="gridcell">
                    <div  title="Name">Account Type</div>
                </th> 
                <th style="width:20%" role="gridcell">
                    <div  title="Name">Missing Data</div>
                </th> 
            </thead>
               <tbody>
                   <template for:each={combineReport} for:item="opp" for:index="index">
                       <tr key={opp.acc}>
                           <td  scope="col">
                               <div  title={opp.key}>{opp.acc.Name}</div>
                              
                                    <!--  <template for:each={opp.acc} for:item="acc">                                       
                                                   <div  key={acc.Id}>{acc.Name}</div>                                                                                            
                                      </template>-->
                                  
                           </td>
                           <td  scope="col">
                               <div  title={opp.value}>{opp.score}</div>
                           </td>
                           <td  scope="col">
                               <div  title={opp.value}>{opp.AccountType}</div>
                           </td>
                           <td  class="slds-cell-wrap" scope="col">
                          <!--  <div title={opp.value}>{opp.MissingData}</div> -->

                            <!-- Modal popup -->
                              <!--<lightning-button label="Show Required Fields" data-index={index} value={opp.MissingData} onclick={showModal}> </lightning-button>  -->
                              <lightning-button-icon icon-name="utility:preview"  variant="brand" alternative-text="Settings" data-index={index} value={opp.MissingData}  onclick={showModal}></lightning-button-icon>
                               
                           </td>
                       </tr>
                   </template>
                    
               </tbody>
           </table>
           </div>
       </div>

       <template if:true={openModal}>  
        <div class="slds-modal slds-fade-in-open slds-backdrop">  
          <div class="slds-modal__container">  
         <!--HEADER Section-->  
         <div class="slds-modal__header">  
           <lightning-button-icon icon-name="utility:close" alternative-text="Close this window" size="large"  
             variant="bare-inverse" onclick={closeModal} class="slds-modal__close">  
           </lightning-button-icon>  
           <h1>Required Fields</h1>  
          
         </div>  
         <!------Body Section-->  
         <div class="slds-modal__content slds-p-around_medium">  
            
            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-border_left slds-border_right">
                <thead>
                    <th  role="gridcell">
                        <div title="Name">Field</div>
                    </th> 
                    <th  role="gridcell">
                        <div  title="Name"> Populated </div>
                    </th>
                   
                </thead>
                <tbody>
                    <template for:each={modalData} for:item="md" for:index="index">
                        <tr key={md.FieldName}>
                            <td>{md.FieldName}</td>
                            <td>
                                <template if:true={md.isFilled}>                                                           
                                    <input name={md.FieldName}  type="checkbox" checked value="1" readonly />                                  
                                </template>                                                
                                <template if:false={md.isFilled}> 
                                    <input name={md.FieldName}  type="checkbox"  value="1" readonly />     
                                </template>
                            </td>
                        </tr>
                    </template> 
                </tbody>
            </table>

         </div>  
         <!------Footer Section-->  
         <div class="slds-modal__footer">  
          <!-- <lightning-button icon-name="utility:close" label="close" variant="brand" onclick={closeModal}>  
           </lightning-button> --> 
         </div>  
       </div>  
     </div>  
   </template>  


       </template>
       </div>
     </lightning-card>
   
</template>
