    </template>
    <!--template if:false={comp1}-->

        <c-sales_-free-license-host-page product-id={productId} product-option ={productOptions} seats ={Seats} terms-cond={termsCondition} license-type={toolLicenseType} is-option-select={isOptionSelect} onproductpage1={handleChild1} onlicenseconfirmation ={handleLicense}></c-sales_-free-license-host-page>

    <template if:true={comp3}>
        <c-sales_-free-license-Confirmation license-name={licenseName} license-full-url={licenseFullURL}></c-sales_-free-license-Confirmation>
