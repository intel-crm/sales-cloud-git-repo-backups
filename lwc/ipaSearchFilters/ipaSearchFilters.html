<template>
    <div class="slds-is-relative filters-main-container" data-fetching-counts={fetchingCounts}>
        <template if:true={fetchingCounts}>
            <lightning-spinner alternative-text={labels.loading}></lightning-spinner>
        </template>
        <template for:each={filterGroupings} for:item="grouping">
            <template if:true={grouping.hasFiltersWithResults}>
                <div key={grouping.key} class="filter-grouping-container">
                    <div role="button" tabindex="0" class="filter-grouping cursor-pointer slds-grid slds-grid_vertical-align-center"
                        data-key={grouping.key} onclick={handleToggleGrouping} onkeydown={handleToggleGroupingAccessibility}
                        aria-expanded={grouping.expanded} aria-controls={grouping.key}>
                        <div class="slds-grow">
                            <h4 class="slds-m-vertical_medium truncate-3">{grouping.label}</h4>
                        </div>
                        <div class="filter-grouping-right-container">
                            <span class="selected-filters-count color-medium-gray text-bold"
                                data-count={grouping.selectedFiltersCount}>
                                {grouping.selectedFiltersCount}</span>
                            <template if:false={grouping.expanded}>
                                <span class="fa-angle-down"></span>
                            </template>
                            <template if:true={grouping.expanded}>
                                <span class="fa-angle-up"></span>
                            </template>
                        </div>
                    </div>
                    <div class="search-filters-container" id={grouping.key} data-expanded={grouping.expanded}>
                        <template for:each={grouping.filters} for:item="filter">
                            <template if:true={filter.visibleOnDesktop}>
                                <div key={filter.key} class="search-filter-container slds-p-bottom_medium">
                                    <div role="button" tabindex="0" aria-label={filter.label}
                                        class="search-filter cursor-pointer" data-key={filter.key}
                                        aria-expanded={filter.expanded} aria-controls={filter.key}
                                        onclick={handleToggleTopLevelFilter} onkeydown={handleToggleTopLevelFilterAccessibility}>
                                        <div class="filter-label-container slds-p-left_large slds-is-relative">
                                            <lightning-icon
                                                class="slds-icon-bordered"
                                                icon-name={filter.sfIcon}>
                                            </lightning-icon>
                                            <span class="truncate-2">{filter.label}</span>
                                            <span class="selected-filters-count color-medium-gray text-bold"
                                                data-count={filter.selectedFiltersCount}>
                                                {filter.selectedFiltersCount}
                                            </span>
                                        </div>
                                    </div>
                                    <div id={filter.key} class="search-filter-nodes slds-p-left_large slds-is-relative" data-expanded={filter.expanded}>
                                        <template if:false={filter.hideSelectAllLinks}>
                                            <div class="slds-p-top_xx-small slds-p-bottom_small">
                                                <span role="button" tabindex="0" class="link-text text-upcase text-bold filters-small-text"
                                                    aria-label={labels.selectAll}
                                                    data-filter-name={filter.name}
                                                    onclick={handleSelectAll}
                                                    onkeydown={handleSelectAllAccessibility}>
                                                    {labels.selectAll}
                                                </span>
                                                <span class="slds-m-horizontal_small">|</span>
                                                <span role="button" tabindex="0" class="link-text text-upcase text-bold filters-small-text"
                                                    aria-label={labels.deselectAll}
                                                    data-filter-name={filter.name}
                                                    onclick={handleDeSelectAll}
                                                    onkeydown={handleDeSelectAllAccessibility}>
                                                    {labels.deselectAll}
                                                </span>
                                            </div>
                                        </template>
                                        <template if:true={filter.rendered}>
                                            <c-ipa-search-filter-node
                                                filter={filter}
                                                role={filter.ariaRole}
                                                aria-label={filter.label}
                                                onopenmodal={handleOpenModal}
                                                show-pre-release={preReleaseValue}
                                                search-params={searchParams}
                                                search-response-filters={searchResponseFilters}>
                                            </c-ipa-search-filter-node>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template if:true={grouping.showViewMoreFiltersLink}>
                            <div role="button" tabindex="0" class="show-more-filters cursor-pointer slds-m-bottom_medium slds-is-relative"
                                data-key={grouping.key} onclick={handleOpenModal} onkeydown={handleOpenModalKeydown}>
                                <lightning-icon icon-name="utility:add" class="slds-m-right_x-small"></lightning-icon>
                                <span class="color-blue text-upcase text-bold filters-small-text">{labels.viewMoreFilters}</span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </template>

        <template if:true={renderModal}>
            <c-core-intc-modal is-open onclose={handleCloseModal}>
                <div slot="header">
                    <h3 class="color-white">{labels.modalHeader}</h3>
                </div>
                <div class="search-filters-modal-body" slot="body">
                    <template if:false={renderModalFilters}>
                        <div class="slds-is-relative" style="min-height: 10rem;">
                            <lightning-spinner alternative-text={labels.loading}></lightning-spinner>
                        </div>
                    </template>
                    <template if:true={renderModalFilters}>
                        <c-ipa-search-filters
                            category-record={categoryRecord}
                            version="modal"
                            includes-pre-release={includesPreRelease}
                            pre-release-value={preReleaseValue}
                            selected-filter-for-modal={selectedFilter}
                            search-params={searchParams}
                            search-response={searchResponse}
                            search-response-filters={searchResponseFilters}
                            draft-filters={draftFilters}>
                        </c-ipa-search-filters>
                    </template>
                </div>
                <div slot="footer">
                    <div class="ipaSearchFilters-footer-container">
                        <lightning-button data-search-filters-modal-focusable="true" label={labels.modalCancelButton} variant="secondary" onclick={handleCancelModal}></lightning-button>
                        <button data-enabled={draftFiltersModified}
                            data-search-filters-modal-focusable={draftFiltersModified}
                            aria-label={labels.modalApplyButton}
                            tabindex={modalApplyTabIndex}
                            class="slds-is-relative button button-primary ipaSearchFilters-apply-button"
                            onclick={handleApplyFilters} onkeydown={handleApplyFiltersAccessibility}>
                            <div>{labels.modalApplyButton}</div>
                            <div class="selected-filters-count text-small" data-count={allSelectedFiltersCount}>{allSelectedFiltersCount}</div>
                        </button>
                    </div>
                </div>
            </c-core-intc-modal>
        </template>

    </div>

</template>
