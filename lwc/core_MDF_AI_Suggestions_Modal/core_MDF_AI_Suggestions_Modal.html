<!-- core_MDF_AI_Suggestions_Modal.html -->
<template>
    <template if:true={isVisible}>
        <!-- Backdrop -->
        <div class="modal-backdrop" onclick={handleBackdropClick}></div>

        <!-- Modal container -->
        <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-heading">

            <!-- Header -->
            <div class="modal-header">
                <div class="header-left">
                    <span class="ai-badge">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L13.09 8.26L19 7L15.45 11.82L21 14L15.45 16.18L19 21L13.09 15.74L12 22L10.91 15.74L5 21L8.55 16.18L3 14L8.55 11.82L5 7L10.91 8.26L12 2Z"
                                  fill="currentColor"/>
                        </svg>
                        AI Suggestions
                    </span>
                    <h2 id="modal-heading" class="modal-title">Smart Field Recommendations</h2>
                    <p class="modal-subtitle">Review AI-detected matches. Select the values you want to apply.</p>
                </div>
                <button class="close-btn" onclick={handleClose} aria-label="Close">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <!-- Body -->
            <div class="modal-body">
                <template if:true={isLoading}>
                    <div class="loading-state">
                        <div class="spinner-ring"></div>
                        <p class="loading-text">Analysing content with AI…</p>
                    </div>
                </template>

                <template if:false={isLoading}>
                    <template if:true={hasError}>
                        <div class="error-state">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="10" stroke="#ef4444" stroke-width="2"/>
                                <path d="M12 8v4M12 16h.01" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <p class="error-text">{errorMessage}</p>
                        </div>
                    </template>

                    <template if:false={hasError}>
                        <template if:false={hasMatches}>
                            <div class="empty-state">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                                    <circle cx="11" cy="11" r="8" stroke="#94a3b8" stroke-width="1.5"/>
                                    <path d="M21 21l-4.35-4.35" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
                                    <path d="M8 11h6M11 8v6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
                                </svg>
                                <p class="empty-text">No exact keyword matches found in the provided content.</p>
                            </div>
                        </template>

                        <template if:true={hasMatches}>
                            <div class="suggestions-grid">

                                <!-- Focus Area -->
                                <template if:true={suggestions.focusArea}>
                                    <div class="field-section">
                                        <div class="field-label">
                                            <span class="field-icon">🎯</span>
                                            Focus Area
                                        </div>
                                        <div class="chip-row">
                                            <label class="chip-label">
                                                <input
                                                    type="checkbox"
                                                    data-field="focusArea"
                                                    data-value={suggestions.focusArea}
                                                    checked={isFocusAreaChecked}
                                                    onchange={handleCheckboxChange}
                                                    class="chip-checkbox"
                                                />
                                                <span class="chip">{suggestions.focusArea}</span>
                                            </label>
                                        </div>
                                    </div>
                                </template>

                                <!-- Priority -->
                                <template if:true={hasPriority}>
                                    <div class="field-section">
                                        <div class="field-label">
                                            <span class="field-icon">⚡</span>
                                            Priority
                                        </div>
                                        <div class="chip-row">
                                            <template for:each={suggestions.priority} for:item="val">
                                                <label key={val} class="chip-label">
                                                    <input
                                                        type="checkbox"
                                                        data-field="priority"
                                                        data-value={val}
                                                        checked
                                                        onchange={handleCheckboxChange}
                                                        class="chip-checkbox"
                                                    />
                                                    <span class="chip">{val}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- Country -->
                                <template if:true={hasCountry}>
                                    <div class="field-section">
                                        <div class="field-label">
                                            <span class="field-icon">🌍</span>
                                            Country / Market
                                        </div>
                                        <div class="chip-row">
                                            <template for:each={suggestions.country} for:item="val">
                                                <label key={val} class="chip-label">
                                                    <input
                                                        type="checkbox"
                                                        data-field="country"
                                                        data-value={val}
                                                        checked
                                                        onchange={handleCheckboxChange}
                                                        class="chip-checkbox"
                                                    />
                                                    <span class="chip">{val}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- Target Audience -->
                                <template if:true={hasTargetAudience}>
                                    <div class="field-section">
                                        <div class="field-label">
                                            <span class="field-icon">👥</span>
                                            Target Audience
                                        </div>
                                        <div class="chip-row">
                                            <template for:each={suggestions.targetAudience} for:item="val">
                                                <label key={val} class="chip-label">
                                                    <input
                                                        type="checkbox"
                                                        data-field="targetAudience"
                                                        data-value={val}
                                                        checked
                                                        onchange={handleCheckboxChange}
                                                        class="chip-checkbox"
                                                    />
                                                    <span class="chip">{val}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- Ecosystem Partner -->
                                <template if:true={hasEcosystemPartner}>
                                    <div class="field-section">
                                        <div class="field-label">
                                            <span class="field-icon">🤝</span>
                                            Ecosystem Partner
                                        </div>
                                        <div class="chip-row">
                                            <template for:each={suggestions.ecosystemPartner} for:item="val">
                                                <label key={val} class="chip-label">
                                                    <input
                                                        type="checkbox"
                                                        data-field="ecosystemPartner"
                                                        data-value={val}
                                                        checked
                                                        onchange={handleCheckboxChange}
                                                        class="chip-checkbox"
                                                    />
                                                    <span class="chip">{val}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- Initiative -->
                                <template if:true={hasInitiative}>
                                    <div class="field-section">
                                        <div class="field-label">
                                            <span class="field-icon">🚀</span>
                                            Initiative
                                        </div>
                                        <div class="chip-row">
                                            <template for:each={suggestions.initiative} for:item="val">
                                                <label key={val} class="chip-label">
                                                    <input
                                                        type="checkbox"
                                                        data-field="initiative"
                                                        data-value={val}
                                                        checked
                                                        onchange={handleCheckboxChange}
                                                        class="chip-checkbox"
                                                    />
                                                    <span class="chip">{val}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- Brand -->
                                <template if:true={hasBrand}>
                                    <div class="field-section">
                                        <div class="field-label">
                                            <span class="field-icon">🏷️</span>
                                            Brand
                                        </div>
                                        <div class="chip-row">
                                            <template for:each={suggestions.brand} for:item="val">
                                                <label key={val} class="chip-label">
                                                    <input
                                                        type="checkbox"
                                                        data-field="brand"
                                                        data-value={val}
                                                        checked
                                                        onchange={handleCheckboxChange}
                                                        class="chip-checkbox"
                                                    />
                                                    <span class="chip">{val}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- Technology -->
                                <template if:true={hasTechnology}>
                                    <div class="field-section">
                                        <div class="field-label">
                                            <span class="field-icon">💻</span>
                                            Technology
                                        </div>
                                        <div class="chip-row">
                                            <template for:each={suggestions.technology} for:item="val">
                                                <label key={val} class="chip-label">
                                                    <input
                                                        type="checkbox"
                                                        data-field="technology"
                                                        data-value={val}
                                                        checked
                                                        onchange={handleCheckboxChange}
                                                        class="chip-checkbox"
                                                    />
                                                    <span class="chip">{val}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- Outcome Metric -->
                                <template if:true={hasOutcomeMetric}>
                                    <div class="field-section">
                                        <div class="field-label">
                                            <span class="field-icon">📊</span>
                                            Outcome Metric
                                        </div>
                                        <div class="chip-row">
                                            <template for:each={suggestions.outcomeMetric} for:item="val">
                                                <label key={val} class="chip-label">
                                                    <input
                                                        type="checkbox"
                                                        data-field="outcomeMetric"
                                                        data-value={val}
                                                        checked
                                                        onchange={handleCheckboxChange}
                                                        class="chip-checkbox"
                                                    />
                                                    <span class="chip">{val}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- Tactics -->
                                <template if:true={hasTactics}>
                                    <div class="field-section">
                                        <div class="field-label">
                                            <span class="field-icon">🎪</span>
                                            Tactics
                                        </div>
                                        <div class="chip-row">
                                            <template for:each={suggestions.tactics} for:item="val">
                                                <label key={val} class="chip-label">
                                                    <input
                                                        type="checkbox"
                                                        data-field="tactics"
                                                        data-value={val}
                                                        checked
                                                        onchange={handleCheckboxChange}
                                                        class="chip-checkbox"
                                                    />
                                                    <span class="chip">{val}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                            </div>
                        </template>
                    </template>
                </template>
            </div>

            <!-- Footer -->
            <template if:false={isLoading}>
                <template if:false={hasError}>
                    <template if:true={hasMatches}>
                        <div class="modal-footer">
                            <button class="btn-cancel" onclick={handleClose}>Dismiss</button>
                            <button class="btn-apply" onclick={handleApply}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                                    <polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="2.5"
                                              stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                Apply Selected
                            </button>
                        </div>
                    </template>
                </template>
            </template>

        </div>
    </template>
</template>
