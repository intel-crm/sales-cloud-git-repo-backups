<!-- Pdf Download Example -->
<template>
  <template if:false={isdata}>
    <template if:true={tableData}>
      <div class="myTable" >
        <lightning-datatable column-widths-mode='auto'
        key-field="id"
        data={tableData}
        columns={columns}
        hide-checkbox-column
        onrowaction={callRowAction}
        >
        </lightning-datatable>
      </div>
    </template>
  </template>
  <template if:true={isdata}>
    <div class="slds-align_absolute-center"><strong>No Files for Download</strong></div>
  </template>
</template>
