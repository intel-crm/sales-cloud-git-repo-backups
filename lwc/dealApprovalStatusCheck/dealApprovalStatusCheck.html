<template>
    <lightning-card title={title} variant="Narrow" icon-name="standard:opportunity">
        <lightning-layout>
            <lightning-layout-item padding="around-small">
                <template lwc:if={errorMsg}>
                    <!-- <lightning-formatted-rich-text value={errorMsg} ></lightning-formatted-rich-text> -->
                    <div class="slds-theme_error">
                        <lightning-icon icon-name="utility:error" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-var-p-left_x-small">{errorMsg}</span>
                    </div>
                </template>
                <template lwc:if={successMsg}>
                    <div class="slds-theme_success">
                        <lightning-icon icon-name="utility:success" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-var-p-left_x-small">{successMsg}</span>
                    </div>
                     <!-- <lightning-formatted-rich-text value={successMsg} ></lightning-formatted-rich-text>-->
                </template>
                <template lwc:if={displaySprinner}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
            </lightning-layout-item>
        </lightning-layout>
    </lightning-card>
</template>
