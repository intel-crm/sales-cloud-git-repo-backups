<template>
	<template if:true={showWarning}>

		<div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">
			<span class="slds-assistive-text">{label.SalesWarning}</span>
			<span class="slds-icon_container slds-icon-utility-warning slds-m-right_x-small"
				title="Description of icon when needed">
				<svg class="slds-icon slds-icon_x-small" aria-hidden="true">
					<use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#warning"></use>
				</svg>
			</span>
			<lightning-icon icon-name="utility:warning" alternative-text="Warning!" title="Warning"></lightning-icon>
			<h2>{warningMessage}</h2>
			&nbsp;&nbsp;
			<!--Recalculate hyper link enabled on the UI-->
			<template if:true={reasonCheck}>
			<a>
				<p onclick={recalculate}><strong>{label.SalesRecalculatePriceHTML}</strong></p>
			</a>
		</template>
			<!--<p><lightning-formatted-url value={refreshSales} label="Recalculate Price" target="_top"></lightning-formatted-url></p>-->
		</div>
	</template>

</template>
