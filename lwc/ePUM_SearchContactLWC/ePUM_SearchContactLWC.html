    <lightning-layout class="slds-p-bottom_medium slds-m-top_small slds-grid_vertical-align-center">
        <div class="slds-grid slds-wrap" style="width: 100%;">
    
            <!--Akshay Number of Records Dropdown menu - START**************************************-->
            <lightning-layout-item class="centerAlign totalNoClass" size="3" medium-device-size="3"
                large-device-size="3">
                {label.EPUM_RowsPerPage} : {rowsPerPage}
                <lightning-button-menu alternative-text="Show menu" variant="container"
                    onselect={handleOnselect_recPerPg}>
                    <lightning-menu-item value="5" label="5"></lightning-menu-item>
                    <lightning-menu-item value="10" label="10"></lightning-menu-item>
                    <lightning-menu-item value="25" label="25"></lightning-menu-item>
                    <lightning-menu-item value="50" label="50"></lightning-menu-item>
                    <lightning-menu-item value="100" label="100"></lightning-menu-item>
                </lightning-button-menu>
            </lightning-layout-item>
            <!--Akshay Number of Records Dropdown menu - END**************************************-->
    
            <!--Akshay Page Navigation - START**************************************-->
            <lightning-layout-item class="slds-text-align_center  prevNextButton" size="6" medium-device-size="6"
                large-device-size="6">
                <button class="slds-button slds-button_brand slds-m-right_xx-small prevNextButtonClass"
                    disabled={validFirst} onclick={firstButton}>
                    <template if:true={validFirst}>
                        <lightning-icon size="x-small" class="slds-p-right_x-small" icon-name="utility:arrow_left">
                        </lightning-icon><span class="disblePrevNextButton">
                        </span>
                    </template>
                    <template if:false={validFirst}>
                        <lightning-icon size="x-small" variant="inverse" class="slds-p-right_x-small"
                            icon-name="utility:arrow_left">
                        </lightning-icon>
                    </template>
                </button>
                <button class="slds-button slds-button_brand slds-m-right_xx-small prevNextButtonClass"
                    disabled={validPrevious} onclick={previousButton}>
                    <template if:true={validPrevious}>
                        <lightning-icon size="x-small" class="slds-p-right_x-small" icon-name="utility:back">
                        </lightning-icon><span class="disblePrevNextButton">
                        </span>
                    </template>
                    <template if:false={validPrevious}>
                        <lightning-icon size="x-small" variant="inverse" class="slds-p-right_x-small"
                            icon-name="utility:back">
                        </lightning-icon>
                    </template>
                </button>
                <lightning-layout-item class="pageNoClass centerAlign slds-text-align_right" padding="around-small">
                    {label.EPUM_Page} : {startPageNo}
                    <lightning-button-menu alternative-text="Show menu" variant="container" onselect={handleJumpToPage}>
                        <template for:each={jumpToPageArray} for:item="pageItem">
                            <lightning-menu-item label={pageItem} value={pageItem} key={pageItem}>
                            </lightning-menu-item>
                        </template>
                    </lightning-button-menu>
                    {label.EPUM_of} {totalPageNo}
                </lightning-layout-item>
    
                <button class="slds-button slds-button_brand slds-m-left_xx-small prevNextButtonClass"
                    disabled={validNext} onclick={nextButton}>
                    <template if:true={validNext}><span class="disblePrevNextButton">
                        </span>
                        <lightning-icon size="x-small" class="slds-p-left_x-small" icon-name="utility:forward">
                        </lightning-icon>
                    </template>
                    <template if:false={validNext}>
                        <lightning-icon size="x-small" class="slds-p-left_x-small" variant="inverse"
                            icon-name="utility:forward">
                        </lightning-icon>
                    </template>
                </button>
            </lightning-layout-item>
            <lightning-layout-item class="centerAlign totalNoClass" size="3" medium-device-size="3"
                large-device-size="3" padding="around-small">
                {label.EPUM_TotalUser} : {totalNoOfContacts}
            </lightning-layout-item>
            <!--Akshay Page Navigation - END**************************************-->
        </div>
    </lightning-layout>
    </div>

        onunsavedcustomevent={handleunsavedevent} onhidelistview={handleHideConList}></c-epum-contact-entitlement-view>
