<template>
    <div if:true={showData}>
        <div class="slds-align_absolute-center" style="background-color:#5875aa; height:50px;">
            <h1 style="color:white; font-size:1.5rem;"><b>Add Environment Detail Question's Case SubCategory</b></h1>
        </div>
        <div class="slds-p-around_small" style="background-color:white;">
            <lightning-layout>
                <lightning-layout-item class="slds-p-around_small">
            <!-- <div class="slds-p-around_small" > -->
                <lightning-input type="search" onchange={edqsearchbox}
                    class="slds-m-bottom_small attachmentSearch" placeholder="Search EDQ's" maxlength="70"
                    style="width: 300px;"></lightning-input>
                </lightning-layout-item>
                <!-- <div class="slds-align_absolute-center"> -->
                    <lightning-layout-item class="slds-align_absolute-center" >
                    <lightning-button label="Add Environmental Details" onclick={addEdqs}></lightning-button> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <lightning-button label="Exit" onclick={goTOCaseCatRecordPage}></lightning-button>
                </lightning-layout-item>
                <!-- </div>
            </div> -->
            </lightning-layout>
            <div class="slds-p-around_small" >
                <div if:true={switchView} style="height: 25rem;">
                    <lightning-datatable 
                        key-field="Id" data={updatedTabledata} 
                        columns={columns} onrowselection={handleRowActions}
                        onsave={saveHandleAction} draft-values={fldsItemValues} min-column-width="200px"
                        enable-infinite-loading ={isloading} onloadmore={handleLoadMore}>
                    </lightning-datatable>
            </div>
            <div if:false={switchView} style="height: 25rem;">
                    <lightning-datatable 
                        key-field="Id" 
                        data={searchResult} 
                        columns={columns}
                        onrowselection={handleRowActions}
                        onsave={saveHandleActionSearchResult} draft-values={searchFldsItemValues}>
                    </lightning-datatable>
            </div>
            </div>
            <div if:true={spinner}>
                <lightning-spinner alternative-text="Loading" size="Medium"></lightning-spinner>
            </div>
        </div>
    </div>
    <div if:false={showData}>
        <div class="slds-align_absolute-center" style="background-color:#5875aa; height:50px;">
            <h1 style="color:white; font-size:1.5rem;"><b>Add Environment Detail Question's To Case SubCategory</b></h1>
        </div>
        <div style="background-color:white;">
            <br/>
            <div class="slds-align_absolute-center" >
                <lightning-button label="Exit" onclick={goTOCaseCatRecordPage}></lightning-button>
            </div><br/>
            <div if:true={isAccess}>
                <div class="slds-align_absolute-center" style="font-size: 1.5rem;">
                    <h1><b>{Message}</b></h1>
                </div>
            </div>
            <div if:false={isAccess}>
                    <div class="slds-text-heading_medium">
                        <h1><b>Insufficient Privileges</b></h1></br>
                    </div>
                    <div class="slds-text-heading_small">
                        <p>You do not have the level of access necessary to perform the operation you requested. Please contact the owner of the record or your administrator if access is necessary. For more information, <a href="https://help.salesforce.com/Partnercenter/s/login/?startURL=%2Fapex%2Fhtdoor%3Floc%3Dhelp%26target%3Dadmin_insufficient_privileges_flowchart.htm%26language%3Den_US%26release%3D236.18.1%26instance%3DCS92%26showSplash%3Dtrue&ec=302&inst=Hx" target="_blank"> <span style="color:black"><u>see Insufficient Privileges Errors.</u></span></a></p>
                    </div><br/>
            </div>
        </div>
        
    </div>
</template>
