<template>
    <div class="slds-form-element selectbox">
        <div class="slds-form-element__control">
            <div class="slds-combobox_container">
                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open" 
		            aria-expanded="true" aria-haspopup="listbox" role="combobox" >
                    <lightning-input readonly type="text" value={selectedmessage} label ={picklistlabel} 
		    	        onclick={handleShowdropdown} placeholder="Select an Option" required>
	                    <lightning-icon icon-name="utility:down" size="x-small" aria-hidden="true" 
				            alternative-text="drop-down" title="click to drop-down">
			            </lightning-icon>
                    </lightning-input>

                    <template if:true={availableBudgetsError}>
                        <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12" medium-device-size="12" large-device-size="12" padding="around-small">
                            <lightning-formatted-text class="customHelptext" value="Complete this field."></lightning-formatted-text>
                        </lightning-layout-item>
                    </template>

                    <template if:true={showdropdown}>
                        <div id="listbox-id-5" class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid" 
			                role="listbox" onmouseleave={handleleave}>
                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                <template for:each={values} for:item="eachvalue">
                                    <c-core_-m-d-f_-campaign_-picklist_-selection 
                                        key={eachvalue.label} 
                                        label={eachvalue.label}
                                        value={eachvalue.value} 
                                        selected={eachvalue.selected} 
					                    disabled={eachvalue.disable}
                                        onpicklistselection= {onPicklistSelection}>
                                    </c-core_-m-d-f_-campaign_-picklist_-selection>
                                </template>
                            </ul>
                        </div>
                    </template>
                </div>
            </div>           
        </div>
    </div>
</template>
