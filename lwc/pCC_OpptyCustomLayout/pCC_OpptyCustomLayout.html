<template>
    <lightning-card>
<!--    <lightning-record-form
    record-id={recordId}
    object-api-name={objectApiName}
    layout-type="Full"
    columns="2"
    mode="view">
</lightning-record-form> -->

    <lightning-record-form record-id={recordId} object-api-name={objectName} layout-type="Full" columns="2" mode={mode} onsubmit={handleSubmit}>
    </lightning-record-form>
    <lightning-progress-indicator current-step={stageName} type="path" variant="base">
        <template for:each={steps} for:item="step">
            <lightning-progress-step label={step.label} value={step.value} key={step.label}></lightning-progress-step>
        </template>
    </lightning-progress-indicator>

    <lightning-accordion active-section-name="Opportunity Layout">
        <lightning-accordion-section name="Opportunity Information" label="Opportunity Information">
            <lightning-layout multiple-rows>
                <lightning-layout-item size="4" padding="around-small">
                    <lightning-record-form record-id={recordId} object-api-name={objectName} layout-type="Full" columns="2" mode={mode} onsubmit={handleSubmit}>
                    </lightning-record-form>

                </lightning-layout-item>
                <lightning-layout-item size="4" padding="around-small">
                    
                </lightning-layout-item>
            </lightning-layout>
        </lightning-accordion-section>
    </lightning-accordion>
    </lightning-card>
</template>
