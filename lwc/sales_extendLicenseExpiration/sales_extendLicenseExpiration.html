<template>
    <div class="slds-m-around_medium">
      
        <div class="slds-m-bottom_small">
            <lightning-input type="text"
               value={searchValue}
               label="Order Name"
               onchange={searchKeyword}
               ></lightning-input>
         </div>
         
         <lightning-button label="Search"
            onclick={handleSearchKeyword}
            variant="brand"></lightning-button>
            
        
         <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-top_small">
            <thead>
               <tr class="slds-line-height_reset">
                  <th class="" scope="col">
                     <div class="slds-truncate" title="Order Number">Order Number</div>
                  </th>
                  <th class="" scope="col">
                     <div class="slds-truncate" title="Account Name">Account Name</div>
                  </th>
                  <th class="" scope="col">
                     <div class="slds-truncate" title="Order Start Date">Order Start Date</div>
                  </th>
                  <th class="" scope="col">
                     <div class="slds-truncate" title="Stage">Stage</div>
                  </th>
               </tr>
            </thead>
            
            <tbody>   
               <template for:each={orders.data} for:item="ord">
                  <tr class="slds-hint-parent" key={ord.Id}>
                     <td>
                        <div class="slds-truncate">{ord.OrderNumber}</div>
                     </td>
                     <td>
                        <div class="slds-truncate">{ord.AccountId}</div>
                     </td>
                     <td>
                        <div class="slds-truncate">{ord.Status}</div>
                     </td>
                     <td>
                        <div class="slds-truncate">{ord.EffectiveDate}</div>
                     </td>
                  </tr>
               </template>
            </tbody>
         </table>
      </div>
</template>
