<template>

            </div>

                   <div class="slds-form-element slds-form-element_readonly">

                        <div class="slds-form-element__control">
                            <label class="test-id__field-value slds-form-element__static slds-grow word-break-ie11 is-read-only">{MasterAccountName}
                            </label>
                        </div>
                   </div>
                </lightning-layout-item>
                <lightning-layout-item style="padding: 14px 14px 0px 14px;" size="6" large-device-size="6" medium-device-size="6"

                        </div>
                   </div>
                </lightning-layout-item>

                  <div class="slds-form-element slds-form-element_readonly">
                    <span class="slds-form-element__label">Unified Hierarchy</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{unifiedHierarchy}
                        </div>
                    </div>
               </div>
                </lightning-layout-item>
                <lightning-layout-item style="padding: 0px 14px 0px 14px;" size="6" large-device-size="6" medium-device-size="6"

                    <span class="slds-form-element__label">Unified Customer Type</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{customerAggType}

                    </div>

                </lightning-layout-item>

                <!-- 3rd row-->

                    <div class="slds-form-element slds-form-element_readonly">
                        <span class="slds-form-element__label">Unified ID</span>
                        <div class="slds-form-element__control">
                            <div class="slds-form-element__static">{bpId}

                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{countryName}

                    </div>
               </div>
                </lightning-layout-item>

                        <div class="slds-form-element__control">
                            <div class="slds-form-element__static">{requestedName} </div>
                        </div>
                    </div>
                </lightning-layout-item>

                <!-- 5th Row-->

                            <div>{cwl}</div>

                </lightning-layout-item>

                <lightning-layout-item style="padding: 0px 14px 0px 14px;" size="6" large-device-size="6" medium-device-size="6"

                <lightning-layout-item style="padding: 0px 14px 0px 14px;" size="6" large-device-size="6" medium-device-size="6"
