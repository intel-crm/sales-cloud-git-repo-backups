<template>
    <template if:true={createmode}>
        <div class="divclass"></br>
            <p class="slds-text-align_center">Create New Case</p>
            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_3-of-12"></div>
                <div class="slds-col slds-size_6-of-12">
                    <ul class="slider">
                        <li class="slider-item">
                            <label class="text" for="f-option">&emsp;Case Details</label>
                            <span class="dot2"></span>
                        </li>
                        <li class="slider-item">
                            <label class="text" for="g-option">Check for Answers</label>
                            <span class="dot1"></span>
                        </li>
                        <li class="slider-item">
                            <label class="text" for="k-option">&emsp;Case Creation</label>
                            <span class="dot1"></span>
                        </li>
                    </ul>
                </div>
                <div class="slds-col slds-size_3-of-12"></div>
            </div>
        </div>
        <div>
            <div class="slds-grid slds-wrap">
                <div class="headline slds-col">
                    <span>
                        Military, intelligence, nuclear/biochemical, or space (MINDS) Information
                    </span>
                </div>
                <p style="font-weight: bolder;">&emsp;&emsp;&ensp;
                    Your My Settings tab indicates the following default settings. Please edit as appropriate for THIS
                    case.
                </p>
            </div>
            <div class="slds-grid">
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <p class="subHeadline">Is THIS case related to the use of Intel® Products and Solutions in regards
                        to
                        military, intelligence, nuclear/biochemical, defense, or space (MINDS) items?</p>
                </div>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <div></br>
                        <lightning-input type="checkbox" label="Yes" name="yeschecked" onchange={handleChangeMINDS}
                            checked={showboolean1}></lightning-input>
                    </div>
                    &emsp;
                    <div></br>
                        <lightning-input type="checkbox" label="No" name="nochecked" onchange={handleChangeMINDS}
                            checked={showboolean2}></lightning-input>
                    </div>
                </div>
            </div></br>
            <div class="slds-grid">
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <p class="subHeadline">I am submitting this case from Country/Region:</p>
                </div>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <span style="width: 100%;"></br>
                        <lightning-combobox data-id="countryField" class="inputs" name="CountryRegion" value={value}
                            placeholder="Please Select" options={countryOptions} onchange={handleChange}>
                        </lightning-combobox>
                        <!--  {contactCountry} -->
                    </span>
                </div>
            </div>
        </div>
        <div class="line"></div>
        <div>
            <div class="slds-grid slds-wrap">
                <div class="headline slds-col">
                    <span>
                        Case information
                    </span>
                </div>
            </div>

            <!-- Select Project start -->
            <div class="slds-grid">
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <p class="selectpjt"><abbr class="slds-required" title="required">*</abbr>Select Project</p>
                </div>
                <div class="slds-col slds-grid slds-size_1-of-3"></br>
                    <span style="width: 100%;">
                        <p>
                            <!-- Project start-->
                            <template if:true={isLookupQueryPresentProject}>
                                <div class="slds-grid slds-wrap slds-size_12-of-12 slds-m-top_small">
                                    <div class="slds-size_9-of-12">
                                        <template if:false={isSelectedProjectPresent}>
                                        <div class="slds-form-element__control validate">
                                            <c-core_-i-p-s_-custom-lookup onselectedrec={handleChangeProject}
                                                iconname={lookupIconNameProject}
                                                searchfield-name={lookupSearchFieldNameProject}
                                                query-string={lookupQueryStringProject} is-sosl="true"
                                                count-query-string={lookupCountQueryStringProject}
                                                query-execution-required=true
                                                extra-field1-label="Premier Support Project ID"
                                                extra-field1="Core_IPS_Project_ID__c">
                                            </c-core_-i-p-s_-custom-lookup>
                                        </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <!-- Project end-->
                        </p>
                    </span>
                </div>
            </div>
            <!-- Select Project end -->

            <!-- Select projectNote start -->
            <div class="slds-grid">
                <div class="slds-col slds-grid slds-size_4-of-12"></div>
                <div class="slds-col slds-grid slds-size_8-of-12">
                    <p style="font-weight: bolder;" class="notetext">
                        <!-- {label.projectNote} -->
                        <template if:true={showContacts}>
                            <div>
                                <p>*Note: If Project is blank or set to 'Not Applicable', all the <a onclick={openModal}>contacts</a> in your account will have access to the case.</p>
                            </div>
                            <!-- Contact Modal -->
                            <template if:true={isModalOpen}>
                                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01"
                                    aria-modal="true" aria-describedby="modal-content-id-1"
                                    class="slds-modal slds-fade-in-open">
                                    <div class="slds-modal__container">
                                        <header class="slds-modal__header contactHeader">
                                            <button
                                                class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                                title="Close" onclick={closeModal}>
                                                <lightning-icon icon-name="utility:close" alternative-text="close"
                                                    variant="inverse" size="small"></lightning-icon>
                                                <span class="slds-assistive-text">Close</span>
                                            </button>
                                            <h2 id="modal-heading-01" class="slds-float_left slds-text-heading_medium slds-hyphenate">
                                                Contact Information
                                            </h2>
                                        </header>
                                        <div class="slds-modal__content slds-p-around_medium pageBkGD portalTable" id="modal-content-id-1">
                                            <lightning-datatable data={conData} columns={contactColumns} key-field="Id"
                                            hide-checkbox-column="true">
                                            </lightning-datatable>
                                        </div>
                                    </div>
                                </section>
                                <div class="slds-backdrop slds-backdrop_open"></div>
                            </template>
                        </template>
                    </p>
                </div>
            </div>
            <!-- Select projectNote End -->

            <!-- Select ProductVariant start -->
            <div class="slds-grid" if:true={renderProductVariant}>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <p class="productVar">Product Variant</p>
                </div>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <span style="width: 100%;">
                        <!-- Product Variant -->
                        <template if:true={renderProductVariant}>
                            <div class="slds-grid slds-wrap slds-size_12-of-12 slds-m-top_small">
                                <div class="slds-size_9-of-12">
                                    <lightning-combobox name="progress" label="Product Variant"
                                        value={sendcaseproductvariant} placeholder="-Select Variant-"
                                        options={productVariantOptions} onchange={handleChangeProductVariant}
                                        disabled={disableEdit}>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-size_3-of-12"></div>
                            </div>
                        </template>
                        <!-- Product Variant -->
                    </span>
                </div>
            </div>
            <!-- Select ProductVariant End -->


            <!-- Select Product start -->
            <!-- <div class="line"></div> -->
            <div class="slds-grid">
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <p class="selectpjt"><abbr class="slds-required" title="required">*</abbr>Select Products</p>
                </div>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    </br>
                    <span style="width: 100%;">
                        <p>
                            <!-- Product -->
                            <template if:true={isLookupQueryPresentProduct}>
                                <div class="slds-grid slds-wrap slds-size_12-of-12 slds-m-top_small">
                                    <div class="slds-size_9-of-12">
                                        <c-core_-i-p-s_-custom-lookup onselectedrec={handleChangeProduct}
                                            iconname={lookupIconNameProduct} is-required-field="false"
                                            searchfield-name={lookupSearchFieldNameProduct}
                                            query-string={lookupQueryStringProduct} is-sosl="true"
                                            count-query-string={lookupCountQueryStringProduct}
                                            selected-record={projectdata} query-execution-required=true
                                            extra-field1-label="Product Focus Area"
                                            extra-field1="core_Product_Application__c"
                                            extra-field2-label="Premier Support Project"
                                            extra-field2="Core_IPS_Project_Name__c">
                                        </c-core_-i-p-s_-custom-lookup>
                                    </div>
                                    <div class="slds-size_3-of-12"></div>
                                </div>
                            </template>
                            <!-- Product end -->
                        </p>
                    </span>
                </div>
            </div>
            <!-- Select Product End -->

            <div class="line"></div>
            <div class="headline slds-col">
                <span>
                    Search Details
                </span>
            </div>
            <div class="slds-grid">
                <template if:true={showProject}>
                    <div class="slds-col slds-grid slds-size_1-of-3">
                        <p class="subHeadline">Project</p>
                    </div>
                    <div class="slds-col slds-grid slds-size_1-of-3">
                        <span style="width: 100%;"></br>
                            {selectedProjectName}
                        </span>
                    </div>
                </template>
            </div>
            <div class="slds-grid">
                <div class="slds-col slds-grid slds-size_4-of-12"></div>
                <div class="slds-col slds-grid slds-size_8-of-12">
                    <p style="font-weight: bolder;">
                        {label.projectNote}
                    </p>
                </div>
            </div>
            <div class="slds-grid">
                <template if:true={showProduct}>
                    <div class="slds-col slds-grid slds-size_1-of-3">
                        <p class="subHeadline">Product</p>
                    </div>
                    <div class="slds-col slds-grid slds-size_1-of-3">
                        <span style="width: 100%;"></br>
                            {selectedProductName}
                        </span>
                    </div>
                </template>
            </div>
            <div class="slds-grid">
                <template if:true={showProdVariants}>
                    <div class="slds-col slds-grid slds-size_1-of-3">
                        <p class="subHeadline">Product Variant</p>
                    </div>
                    <div class="slds-col slds-grid slds-size_1-of-3">
                        <span style="width: 100%;"></br>
                            {selectedVariantName}
                        </span>
                    </div>
                </template>
            </div>

            <div class="slds-grid" if:true={renderProductCategory}>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <p class="subHeadline">Case Category</p>
                </div>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <span style="width: 100%;">
                        <!-- <lightning-combobox class="inputs" name="progress" value={selectedCategory} placeholder="Please Select"
                            options={categories} onchange={handleCategoryChange}></lightning-combobox> -->
                        <!-- Category -->
                        <template if:true={renderProductCategory}>
                            <div class="slds-grid slds-wrap slds-size_12-of-12 slds-m-top_small">
                                <div class="slds-size_1-of-12"></div>
                                <div class="slds-size_9-of-12">
                                    <lightning-combobox name="progress" value={caseCategory}
                                        placeholder="-Select Category-" options={caseCategoryOptions}
                                        onchange={handleChangeSubCategory} disabled={disableEdit}>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-size_2-of-12"></div>
                            </div>
                        </template>
                        <!-- Category -->
                    </span>
                </div>
            </div>
            <div class="slds-grid" if:true={renderProductSubCategory}>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <p class="subHeadline">Case Sub-Category</p>
                </div>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <span style="width: 100%;">
                        <!-- <lightning-combobox class="inputs" name="subCategories" value={selectedSubCategory} placeholder="Please Select"
                            options={subCategories} onchange={handleSubCatChange}></lightning-combobox> -->
                        <!-- Sub Category -->
                        <template if:true={renderProductSubCategory}>
                            <div class="slds-grid slds-wrap slds-size_12-of-12 slds-m-top_small">
                                <div class="slds-size_1-of-12"></div>
                                <div class="slds-size_9-of-12">
                                    <lightning-combobox name="progress" value={caseSubCategory}
                                        placeholder="-Select Sub Category-" options={subcategoryoptions}
                                        onchange={handleChangeRenderSubCategoryedq} disabled={disableEdit}>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-size_2-of-12"></div>
                            </div>
                        </template>
                        <!-- Sub Category -->
                    </span>
                </div>
            </div>
            <div class="slds-grid">
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <p class="subHeadline"><abbr class="slds-required" title="required">*</abbr>Subject</p>
                </div>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <span style="width: 100%;">
                        <lightning-input class="inputs" onchange={handlesubject} value={sendcasesubject}>
                        </lightning-input>
                    </span>
                </div>
            </div>
            <div class="slds-grid">
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <p class="subHeadline"><abbr class="slds-required" title="required">*</abbr>Language</p>
                </div>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <span style="width: 100%;">
                        <lightning-input class="inputs" onchange={handlelanguage} value={sendcaselanguage}>
                        </lightning-input>
                    </span>
                </div>
            </div>
            <!-- <div class="slds-grid slds-wrap">
                <div class="headline slds-col">
                    <span>
                        Environmental Details
                    </span>
                </div>
            </div> -->

                <div class="slds-col slds-grid slds-size_1-of-3">

                <div class="slds-col slds-grid slds-size_1-of-3">

                        <lightning-combobox class="inputs" name="IPProducts" value={value} placeholder="Please Select" options={options}
                            onchange={handleChange}></lightning-combobox>
                    </span>
                </div>
            </div>

                <div class="slds-col slds-grid slds-size_1-of-3">
                    <span>
                        <lightning-combobox class="inputs" name="FPGADevelopmentTools" value={value} placeholder="Please Select" options={options}
                            onchange={handleChange}></lightning-combobox>
                    </span>
                </div>
            </div> 
             <div class="slds-grid">

            </div> -->
        <!-- Environmental Details START-->
        <div class="line"></div>
        <div class="headline slds-col">
            <span>Environmental Details</span>
             <div if:true={showProdEdqs}>
                <c-core_-i-p-s_dynamicformbuilder iscommunity={communityCheck} fields={prodEdqRecs}> </c-core_-i-p-s_dynamicformbuilder>
            </div>
            <div if:true={showProdEdqs}>
                <c-core_-i-p-s_dynamicformbuilder iscommunity={communityCheck} fields={subcatrecedqs}></c-core_-i-p-s_dynamicformbuilder>
             </div>

        </div>
    </template>
    <template if:true={sslcmode}>
        <div>
            <div class="slds-grid slds-wrap">
                <div class="headline slds-col">
                    <span>
                        Military, intelligence, nuclear/biochemical, or space (MINDS) Information
                    </span>
                </div>
                <p style="font-weight: bolder;">&emsp;&emsp;&ensp;
                    Your My Settings tab indicates the following default settings. Please edit as appropriate for THIS
                    case.
                </p>
            </div>
            <div class="slds-grid">
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <p class="subHeadline">Is THIS case related to the use of Intel® Products and Solutions in regards
                        to
                        military, intelligence, nuclear/biochemical, defense, or space (MINDS) items?</p>
                </div>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <div></br>
                        <lightning-input type="checkbox" label="Yes" name="yeschecked" onchange={handleChangeMINDS}
                            checked={showboolean1}></lightning-input>
                    </div>
                    &emsp;
                    <div></br>
                        <lightning-input type="checkbox" label="No" name="nochecked" onchange={handleChangeMINDS}
                            checked={showboolean2}></lightning-input>
                    </div>
                </div>
            </div></br>
            <div class="slds-grid">
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <p class="subHeadline">I am submitting this case from Country/Region:</p>
                </div>
                <div class="slds-col slds-grid slds-size_1-of-3">
                    <span style="width: 100%;"></br>
                        <!-- <lightning-combobox data-id="countryField" class="inputs" name="CountryRegion" value={value} placeholder="Please Select" options={countryOptions}
                       onchange={handleChange}></lightning-combobox> -->
                        {contactCountry}
                    </span>
                </div>
            </div>
        </div>
        <div class="slds-grid slds-wrap">
            <div class="headline slds-col"><span>Case information</span></div>
        </div>
        <div class="slds-grid">
            <div class="slds-col slds-grid slds-size_1-of-3">
                <p class="subHeadline">Project</p>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
                </br>{Projectdefault}
            </div>
        </div>
        <div class="slds-grid">
            <div class="slds-col slds-grid slds-size_1-of-3">
                <p class="subHeadline">Product</p>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
                </br>
                {Assetdefault}
            </div>
        </div>
        <div class="line"></div>
        <div class="slds-grid slds-wrap">
            <div class="headline slds-col"><span>Case Details</span></div>
        </div>
        <div class="slds-grid">
            <div class="slds-col slds-grid slds-size_1-of-3">
                <p class="subHeadline">Subject</p>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
                </br>
                <lightning-input data-id="subjectField" class="inputs" value={subjectvaluesslc} onchange={handleChange}>
                </lightning-input>
            </div>
        </div>
        <div class="slds-grid">
            <div class="slds-col slds-grid slds-size_1-of-3">
                <p class="subHeadline">Case Description</p>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
                </br>
                <lightning-input-rich-text data-id="descriptionFeild" class="inputs" value={descriptiondefault}
                    onchange={handleChange}></lightning-input-rich-text>
            </div>
        </div>
        <div class="slds-grid">
            <div class="slds-col slds-grid slds-size_1-of-3">
                <p class="subHeadline">Case Type</p>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
                <span>
                    <lightning-combobox data-id="CaseType" class="inputs" name="CaseType" value={CaseTypedefault}
                        placeholder="Please Select" options={CaseTypeOptions} onchange={handleChange}>
                    </lightning-combobox>
                </span>
            </div>
        </div>
        <div class="slds-grid">
            <div class="slds-col slds-grid slds-size_1-of-3">
                <p class="subHeadline">Severity</p>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
                <span>
                    <lightning-combobox data-id="Severity" class="inputs" name="Severity" value={severityValue}
                        placeholder="Please Select" options={caseSeverityoptions} onchange={handleChange}>
                    </lightning-combobox>
                </span>
            </div>
        </div>
        <div class="slds-grid">
            <div class="slds-col slds-grid slds-size_1-of-3">
                <p class="subHeadline">Customer Reference ID</p>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
                </br>
                <lightning-input data-id="custmerreference" class="custmerreference" onchange={handleChange}>
                </lightning-input>
            </div>
        </div>
        <div class="slds-grid">
            <div class="slds-col slds-grid slds-size_1-of-3">
                <p class="subHeadline">End Customer</p>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
                </br>
                <lightning-input data-id="endcustomer" class="endcustomer" onchange={handleChange}></lightning-input>
            </div>
        </div>
        <div class="line"></div>
        <div class="slds-grid slds-wrap">
            <div class="headline slds-col">
                <span>Product/Project Info</span>
            </div>
        </div>
        <div class="slds-grid">
            <div class="slds-col slds-grid slds-size_1-of-3">
                <p class="subHeadline">Case Category</p>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
                <!-- {Case_Categorydefault} -->
                <span style="width: 100%;">
                    <!-- Category -->
                    <div class="slds-grid slds-wrap slds-size_12-of-12 slds-m-top_small">
                        <div class="slds-size_1-of-12"></div>
                        <div class="slds-size_9-of-12">
                            <lightning-combobox name="progress" value={Case_Categorydefault}
                                placeholder="-Select Category-" options={caseCategoryOptions}
                                onchange={handleChangeSubCategory} disabled={disableEdit}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-size_2-of-12"></div>
                    </div>
                    <!-- Category -->
                </span>
            </div>
        </div>
        <div class="slds-grid">
            <div class="slds-col slds-grid slds-size_1-of-3">
