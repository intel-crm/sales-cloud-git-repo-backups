<template>
    <div class="spinner">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" variant="brand" size="large">
            </lightning-spinner>
        </template>
    </div>
    <lightning-card>
        <lightning-layout horizontal-align="left">
            <lightning-layout-item>
                <template if:true={canCancel}>
                    <p class="slds-p-horizontal_small">Click this button to Cancel Case</p><br />
                    <div class="slds-p-left_small">
                        <lightning-button variant="brand" name="Cancel Case" label="Cancel Case" title="Cancel Case" onclick={handleClick}></lightning-button>
                    </div>
                </template>

                <template if:true={isModalOpen}>
                    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                            <header class="slds-modal__header">
                                <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeModal}>
                                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                                    <span class="slds-assistive-text">Close</span>
                                </button>
                                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Cancel Case</h2>
                            </header>
                            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                                <p class="slds-m-bottom_medium">Cancel this case and release the claim from Review hold? This action cannot be undone.</p>
                                <lightning-textarea name="justification" label="Justification" value={commentValue} onchange={handleJustificationChange} required></lightning-textarea>
                            </div>
                            <footer class="slds-modal__footer">
                                <button class="slds-button slds-button_neutral" onclick={closeModal} title={cancelLabel}>No</button>
                                <button class="slds-button slds-button_brand" onclick={callCancelCase} title={confirmLabel} disabled={disableConfirm}>Yes</button>
                            </footer>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open"></div>
                </template>
            </lightning-layout-item>
        </lightning-layout>
    </lightning-card>
</template>
