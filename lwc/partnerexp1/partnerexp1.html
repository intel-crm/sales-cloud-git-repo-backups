<template>
    <template lwc:if={configurationError}>
        <div class="slds-box slds-theme_shade" role="status">
            <h2 class="slds-text-heading_small">partnerexp1 setup required</h2>
            <p class="slds-m-top_small">{configurationError}</p>
        </div>
    </template>
    <template lwc:else>
        <iframe
            class="react-frame"
            src={appUrl}
            title={accessibleTitle}
            style={frameStyle}
            referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
        <p class="slds-text-body_small slds-m-top_x-small">
            If the app does not display,
            <a href={appUrl} target="_blank" rel="noopener noreferrer">open it in a new tab</a>
            to check access.
        </p>
    </template>
</template>
