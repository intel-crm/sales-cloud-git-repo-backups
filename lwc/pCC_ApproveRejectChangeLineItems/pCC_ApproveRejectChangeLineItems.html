<template>
    <lightning-spinner alternative-text="Loading" size="small" if:true={isSpinner} ></lightning-spinner>       
    
   <template if:true={showActions}>
       <div class="slds-text-align_center slds-p-around_small">
            <lightning-button class="slds-m-around_small" variant="neutral" label="Approve Requests" onclick={handleApprove}></lightning-button>
            <lightning-button class="slds-m-around_small" variant="neutral" label="Reject Requests" onclick={handleReject}></lightning-button>
        </div>
       </template>
      	<template if:true={showWarning}>
            <div class="slds-text-color_error slds-p-around_small slds-text-heading_medium slds-text-align_center">
                Please select atleast 1 pending line items.
            </div>
        </template>
        <div class="slds-box">
        <lightning-datatable
            key-field="Id"
            data={lineItems}
            columns={columns}
						 max-row-selection="10"
            selected-rows={selectedLineItemIds}
            onrowselection={handleRowSelection}
            onsave={handleSave}
             errors={tableErrors}
            draft-values={draftValues}  
														show-row-number-column
														 >
        </lightning-datatable>
        </div>
			
        <template if:true={lineItemsError}>
            </template>

 <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Enter Comments</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea label="Comments" value={comments} onchange={handleCommentsChange} class={commentsErrorClass}></lightning-textarea>
                    <template if:true={commentsError}>
                        <div class="slds-text-color_error">Comments are required.</div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Submit" onclick={submitComments}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
