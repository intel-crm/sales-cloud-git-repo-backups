    <lightning-record-view-form record-id={recordId} object-api-name="Opportunity">
         <p class="slds-p-horizontal_small">
         <b> Search Solutions </b> <lightning-helptext content="Limited set of solutions are initially loaded. Search for the desired Solution(s); The results will dynamically update as you type one or more search terms. For help with search terms please visit: goto/opportunitysolution"></lightning-helptext>           
         </p>
        <table class="slds-table slds-table_cell-buffer">          
                <tr>
                    <th class="" scope="col">
                         <template  if:true={TypeOptions_AWL}>
                        <lightning-combobox name="Search_Appln_wkld" label="Application/Workload"  value={AWL_Search}  options={TypeOptions_AWL} onchange={searchSolutionAreaAction_AWL}> </lightning-combobox> 
                        </template>
                      </th>                     
                      <th class="" scope="col">
                          <template  if:true={TypeOptions_IUC}>
                            <lightning-combobox name="Search_Indus_usecase" label="Industry Use Case(s)" value={IUC_Search} options={TypeOptions_IUC} onchange={searchSolutionAreaAction_IUC}> </lightning-combobox> 
                         </template>
                        </th>

                         <th class="" scope="col">
                        <template  if:true={TypeOptions_TE}>
                        <lightning-combobox name="Search_Tech_enabled" label="Technology Enabled" value={TE_Search}  options={TypeOptions_TE} onchange={searchSolutionAreaAction_TE}> </lightning-combobox> 	
                        </template>
                      </th>
                       
                </tr>
                <tr>
                    <th class="sol_ptr_search" scope="col">
                        
                        <lightning-input name="Search_Sol_Partner" label="Solution Partners" type="search" class="slds-m-bottom_small" value={Sa_SP_Search}  onchange={searchSolutionAreaAction_SP}> </lightning-input> 	
                       
                      </th>
                      <th class="sol_txt_search" scope="col">
                        

                        <p class="slds-form-element__label">
                            Solution Search Text <lightning-helptext content={label.searchHelpText}></lightning-helptext>           
                         </p>
                         <lightning-input style="margin-top: -20px;" name="Search_Txt" varient="label-hidden" type="search" value={SaAreaType} onchange={searchSolutionAreaText}></lightning-input>
                        
                        </th>
                         <th class="rest_btn" scope="col">                 			  
                     <lightning-button   variant="Neutral"
                                    label="Reset Search"
                                    title="Reset Search"
                                    slot="actions"
                                    onclick={handleClearEntry}                                                                      
                                     >
                    </lightning-button>													
                      </th>                      
                </tr>
	</table>	 
       
         <div class="slds-p-around--medium">
            <div class="slds-scrollable" style="height:500px;">
            <lightning-datatable
                data-id="table"
                key-field="Id"
                data={availablesolutions}
                columns={columns}
                onrowaction = {callRowAction}
                selected-rows={allSelectedRows}
                onrowselection={handleSelected}  column-widths-mode="auto"> 
                
            </lightning-datatable>          
            </div>
            </br>

            <template if:true={isRecordOpen}>
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                      <!-- Modal/Popup Box LWC header here -->
                      <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModalPopUp}>
                            <lightning-icon icon-name="utility:close"
                                alternative-text="close"
                                variant="inverse"
                                size="small" ></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h1 class="slds-text-heading_large slds-hyphenate">Solution</h1>
                    </header>  
                        <!-- Modal/Popup Box LWC body starts here -->
                        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                            
                                <div class="container">
                                    <div class="row">
                                   <lightning-record-form
                                    record-id={recId}
                                    object-api-name="Core_Solution_Areas__c"
                                    fields={partnersol}
                                    density="auto"
         
                                    columns="2"
                                    mode="readonly">

                                    </lightning-record-form>
                                  <!--  <lightning-record-view-form
                                    record-id={recId} object-api-name="Core_Solution_Areas__c">
                                    <lightning-output-field field-name={partnersol}></lightning-output-field>
                                    </lightning-record-view-form> -->
                                </div>
                                </div>
                        </div>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <lightning-button   variant="Neutral"
