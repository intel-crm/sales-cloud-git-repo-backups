<template>
	<lightning-card variant="Narrow" title="Backend System Reprocess Failed Records">

		<template if:false={isBatchProcessed}>
			<div class="slds-grid slds-wrap">
				<div class="slds-col slds-size_1-of-2 slds-p-around_medium">
					<div class="slds-form-element">

						<div class="slds-form-element__control">
							<lightning-combobox name="objectSelect" label="Object" placeholder="Select Object"
								options={objectOptions} onchange={handleObjectChange} value={selectedObject}>
							</lightning-combobox>
						</div>
					</div>
				</div>
				<div class="slds-col slds-size_1-of-2 slds-p-around_medium">
					<div class="slds-form-element">
						<div class="slds-form-element__control">
							<lightning-input type="number" name="reprocessDays" label="Reprocess last days (days in numbers)" placeholder="Please Input last how many days failed records to Re-Process"
								value={reprocessDays} onkeyup={handleNumberKeyChange}></lightning-input>
						</div>
					</div>
				</div>
			</div>
			<div class="slds-button-group slds-m-around_medium">
				<lightning-button label="Reprocess" variant="brand" onclick={handleReprocess}
					class="slds-m-right_x-small"></lightning-button>
				<lightning-button label="Cancel" variant="neutral" onclick={handleCancel}></lightning-button>
			</div>
		</template>

		<template if:true={isBatchProcessed}>
           
           <div style="color: green; font-size: large; padding: 22px;" > Batch Process started, Monotor the Job in Apex Job - Job Id is : {batchId} </div>

            <lightning-button label="Go To Apex Job" variant="brand" onclick={handleGoToApexJob}
					class="slds-m-around_medium slds-m-right_x-small"></lightning-button>

            <lightning-button label="Go to Home" variant="neutral" onclick={handleCancel}></lightning-button>


		</template>

        <template if:true={isExecuteBatchError}>
            <div style="color: red; font-size: large; padding: 22px;" > Batch Process failed Something went Wrong, Please try again!!! </div>
        </template>

	</lightning-card>


</template>
