<template>
    <lightning-card title="New Account Plan" icon-name="standard:account">
        <lightning-record-edit-form
            object-api-name="AccountPlan"
            onsuccess={handleSuccess}
            oncancel={handleCancel}
        >
            <div class="slds-p-around_medium">
                <lightning-messages></lightning-messages>

                <!-- Account Plan Information fields -->
                <lightning-input-field field-name="Name"></lightning-input-field>
                <lightning-input-field field-name="OwnerId"></lightning-input-field>
                <lightning-input-field field-name="AccountId"></lightning-input-field>
                <lightning-input-field field-name="StartDate"></lightning-input-field>
                <!-- Add more fields from "Account Plan Information" section as needed -->

                <div class="slds-m-top_medium">
                    <lightning-button type="submit" variant="brand" label="Save"></lightning-button>
                    <lightning-button type="button" variant="neutral" label="Cancel" class="slds-m-left_small" onclick={handleCancel}></lightning-button>
                </div>
            </div>
        </lightning-record-edit-form>
    </lightning-card>
</template>
