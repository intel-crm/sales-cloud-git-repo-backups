            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                <p class="subHeadline">Project</p>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3 projectName">
                </br>{Projectdefault}
            </div>
        </div>
        <div class="slds-grid slds-wrap casecreationvalign">
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                <p class="subHeadline">Product</p>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                </br>
                {Assetdefault}
            </div>
        </div>
        <div class="line"></div>
        <div class="slds-grid slds-wrap">
            <div class="headline slds-col"><span>Case Details</span></div>
        </div>
        <div class="slds-grid slds-wrap casecreationvalign">
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                <p class="subHeadline">Subject</p>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                </br>
                <div class="subjectSSLC">
                    <lightning-input data-id="subjectField" class="subjectInputSSLC" value="" onchange={handleChangesubject} onfocus={handleOnFocus}>
                    </lightning-input>
                </div>
                <template if:true={isRequiredSubjectSSLC}>
                    <span class="requiredField"> {label.Core_IPS_Required} </span>
                </template>
            </div>
        </div>
        <div class="slds-grid slds-wrap casecreationvalign">
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                <p class="subHeadline">Case Description </p>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                </br>
                <div class="descInputSSLC">
                    <lightning-input-rich-text  class ="descInputSSLC" data-id="descriptionFeildSSLC"  value={descriptiondefault}
                    onchange={handleChange} valid={descValid} onfocus={handleOnFocus}></lightning-input-rich-text>
                </div>
                <template if:true={descriptionSSLC}>
                    <p class="slds-text-color_error">{label.Core_IPS_Required}</p>
                </template>
            </div>
        </div>
        <div class="slds-grid slds-wrap casecreationvalign">
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                <p class="subHeadline">Case Type</p>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                <span class="caseTypeSSLC">
                    <lightning-combobox data-id="CaseType" class="inputs" name="CaseType" value={CaseTypedefault}
                        placeholder="Please Select" options={CaseTypeOptions} onchange={handleChangecasetype}>
                    </lightning-combobox>
                </span>
                <template if:true={caseTypeInputSSLC}>
                    <p class="slds-text-color_error">{label.Core_IPS_Required}</p>
                </template>
            </div>
        </div>
        <div class="slds-grid slds-wrap casecreationvalign">
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                <p class="subHeadline">Severity</p>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                <span>
                    <lightning-combobox data-id="SeveritySSLC" class="inputs" name="Severity" value={severitydefValue}
                        placeholder="Please Select" options={defaultcaseSeverityoptions} onchange={handlesevdefChange}>
                    </lightning-combobox>
                </span>
            </div>
        </div>
        <template if:true={sslcSeverityReason}>
            <div class="slds-grid slds-wrap casecreationvalign">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                    <p class="subHeadline">Severity Reason</p>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                    <span class="SeverityReasonSSLC">
                        <lightning-textarea data-id="SeverityReason"   class="inputs" name="SeverityReason"
                            value={severityReasonValue} onchange={handlesslcChange} onfocus={handleOnFocus}>
                        </lightning-textarea>
                    </span>
                    <template if:true={severityResSSLC}>
                        <p class="slds-text-color_error">{label.Core_IPS_Required}</p>
                    </template>
                </div>
            </div>
        </template>
<div class="slds-grid slds-wrap casecreationvalign">

    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">

<div class="slds-grid slds-wrap casecreationvalign">

        <p class="subHeadline">End Customer<span style="font-size:12px; font-weight:500;">&nbsp;(Optional)</span></p>

    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">

</div>

<div class="slds-grid slds-wrap ">

</div>

        <span style="width: 100%;">

                    <div class="categorySSLC">
                        <lightning-combobox  data-id="categoryReq" name="progress" value={Case_Categorydefaultid}

                            onchange={handleChangedefaultCategory} onfocus={handleOnFocus}>
                        </lightning-combobox>
                    </div>
                    <template if:true={categoryReqSSLC}>
                        <p class="requiredsubcategory">{label.Core_IPS_Required}</p>
                     </template>
                </div>
                
                <div class="slds-size_2-of-12"></div>
            </div>
        </span>
    </div>
</div>
<div class="slds-grid slds-wrap casecreationvalign casecatboxalign">
    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
        <p class="subHeadline">Case Subcategory</p>
    </div>
    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
        <span style="width: 100%;">
                    <div class="slds-grid slds-wrap slds-size_12-of-12 slds-m-top_small">
                        <div class="slds-col slds-size_1-of-12"></div>
                        <div class="clds-col slds-size_9-of-12">

                            </div>
                            <template if:true={subCategoryReqSSLC}>
                                <span class="requiredsubcategory"> {label.Core_IPS_Required} </span>
                            </template>
                        </div>
                        <div class="slds-size_2-of-12"></div>
                    </div>
                </span>
    </div>
