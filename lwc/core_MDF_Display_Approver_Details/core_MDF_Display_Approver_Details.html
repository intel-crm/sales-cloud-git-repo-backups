<template>
    <!-- Show All Approvers Button -->
    <lightning-button 
        variant="brand" 
        label="Show All Approvers" 
        onclick={handleShowAllApprovers}
        class="slds-m-left_x-small"
        disabled={isLoading}>
    </lightning-button>

    <!-- Approval Flow Modal -->
    <template if:true={showApprovalFlow}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                            onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">Approval Flow - {approvalFlowData.processName}</h2>
                </header>
                
                <div class="slds-modal__content slds-p-around_medium approval-flow-container">
                    <template if:true={isLoading}>
                        <div class="slds-align_absolute-center slds-p-around_large">
                            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                        </div>
                    </template>
                    
                    <template if:false={isLoading}>
                        <div class="flow-chart">
                            <!-- Start Node -->
                            <div class="flow-step start-step">
                                <div class="step-box start-box">Start</div>
                                <div class="arrow-right"></div>
                            </div>

                            <!-- Manager Step -->
                            <div class="flow-step">
                                <div class="step-box manager-box">Manager</div>
                                <div class="arrow-right"></div>
                            </div>

                            <!-- Completed Steps -->
                            <template for:each={completedStepGroups} for:item="stepGroup">
                                <div key={stepGroup.stepName} class="flow-step completed-step">
                                    <div class="step-box completed-box">
                                        <div class="step-title">{stepGroup.stepName}</div>
                                        <div class="step-subtitle">{stepGroup.groupName}</div>
                                        <div class="approvers-list">
                                            <template for:each={stepGroup.approvers} for:item="approver">
                                                <div key={approver} class="approver-name completed-approver">
                                                    ✓ {approver}
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="arrow-right"></div>
                                </div>
                            </template>

                            <!-- Current Step -->
                            <template if:true={hasCurrentStep}>
                                <div class="flow-step current-step">
                                    <div class="step-box current-box">
                                        <div class="step-title">Current Step</div>
                                        <div class="step-subtitle">{currentStepName}</div>
                                        <div class="approvers-list">
                                            <template for:each={approvalFlowData.currentStepApprovers} for:item="approver">
                                                <div key={approver.name} class="approver-group">
                                                    <template if:true={approver.isQueue}>
                                                        <div class="queue-name">{approver.name} (Queue)</div>
                                                        <template for:each={approver.queueMembers} for:item="member">
                                                            <div key={member} class="queue-member">• {member}</div>
                                                        </template>
                                                    </template>
                                                    <template if:false={approver.isQueue}>
                                                        <div class="approver-name">{approver.name}</div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="arrow-right"></div>
                                </div>
                            </template>

                            <!-- End Node -->
                            <div class="flow-step end-step">
                                <div class="step-box end-box">Stop</div>
                            </div>
                        </div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal}>Close</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
