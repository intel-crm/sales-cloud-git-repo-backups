<template>
	<template lwc:if={dataAvailable}>
	<div class="slds-box slds-theme_default">
		
		<div class="slds-card borderline borderbtm">
		<header class="slds-media slds-media--center slds-has-flexi-truncate  greybg">
			<div class="slds-media__figure stencil slds-avatar slds-avatar_small">
			  <lightning-icon class="my-icon" icon-name="standard:approval" size="small"  alternative-text="Approval Stage Flow"></lightning-icon>
			</div>
			<div class="slds-media__body">
			  <h2 class="slds-card__header-title">
				Approval Stage Flow
			  </h2>
			</div>
		  </header>
		<div class="slds-progress slds-progress_vertical">
			<template for:each={displayContent} for:item="item">
				<ol key={item} class="slds-progress__list">
					
					<template for:each={item.stageWrapperList} for:item="con"> 
						<template lwc:if={con.IsStepCompleted}>
							 <li key={con.IsStepCompleted} class="slds-progress__item slds-is-completed">
								<span class="slds-button slds-progress__marker" >
                                                                          
                                                                        <lightning-icon icon-name="utility:success"
                                                                                alternative-text="Success!"
                                                                                variant="success" title="first"
                                                                                size="xx-small" ></lightning-icon>
                                                                        <span class="slds-assistive-text">Completed</span>
                                                                          
								</span>
								<div style="padding-top: 2px;"
									class="slds-progress__item_content slds-grid slds-grid_align-spread">
									{con.ApprovalStageLabel}</div>
							</li> 
						</template>
						<template lwc:elseif={con.IsCurrentStage}>
							<li key={con.IsCurrentStage} class="slds-progress__item slds-is-active progressItem">
								<span class="slds-button slds-progress__marker" >
                                                                        <span class="slds-assistive-text">Active</span>
								</span>
								<div style="padding-top: 2px;"
									class="slds-progress__item_content slds-grid slds-grid_align-spread">
									{con.ApprovalStageLabel}</div>
							</li>
						</template>
						<template lwc:else>

							<li key={con.IsUpcomingStep} class="slds-progress__item progressItem">
								<span class="slds-button slds-progress__marker">
                                                                        <span class="slds-assistive-text">Upcomming </span>
								</span>
								<div style="padding-top: 2px;"
									class="slds-progress__item_content slds-grid slds-grid_align-spread">
									{con.ApprovalStageLabel}</div>
							</li>
						</template>
					</template>
				</ol>
				<div key={item} class="slds-progress-bar_vertical" aria-valuemin="0" aria-valuemax="100"
					aria-valuenow={item.progressPercentage} role="progressbar">
					<span class="slds-assistive-text">Progress: {item.progressPercentage}%</span>
				</div>
			</template>
		</div>
</div>
		</div>
			</template>

</template>
