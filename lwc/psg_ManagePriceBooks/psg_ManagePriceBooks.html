<template>
    <lightning-card title="Manage Price Books" icon-name="standard:price_books">       

        <lightning-layout multiple-rows="true" vertical-align="end">
            <lightning-layout-item size="12" small-device-size="10" medium-device-size="8" large-device-size="3" padding="around-small">
                    <div class="slds-form-element">
                            <div class="slds-form-element__control">
                                    <lightning-combobox
                                        name="progress"
                                        label="Select Price Book"
                                        value={value}
                                        placeholder="Select price list"
                                        options={priceListOptions}
                                        onchange={handleChange}    
                                        ></lightning-combobox>
                                       
                            </div>
                        </div> 
            </lightning-layout-item>
            <lightning-layout-item size="12" small-device-size="10" medium-device-size="8" large-device-size="3" padding="around-small">
                    <div class="slds-form-element">
                   
                            <lightning-input
                                name="enter-search"
                                label="Product Name/OPN"
                                type="search"
                                placeholder="Enter product name /opn..."
                                onchange={handleSearch}
                            ></lightning-input>
                      
                    </div></lightning-layout-item>
                <br/>
               
            </lightning-layout><br/>
            <div if:true={errorMsg} style="margin-left: 3%;">
                <p style="color: red;">{errorMsg}</p>
            </div>
            <lightning-layout multiple-rows="true">
               <lightning-card title="Price List Items" icon-name="standard:price_book_entries">
                <lightning-layout-item flexibility="auto">

                       <div style="height: 300px;" class="slds-box slds-p-around_small">
                            <lightning-datatable    
                            data={pbedata}
                            columns={pbeColumns}
                            key-field="Id"
                            max-row-selection=1    
                            onrowselection={loadListPriceDataForSelectedProduct}
                            draft-values={draftValuespbe}
                            column-widths-mode='auto'
                            onsave={handlepbeDataSave} 
                            default-sort-direction={defaultSortDirection}
                            sorted-direction={sortDirection}
                            sorted-by={sortedBy}
                            onsort={onHandleSort}
                            onrowaction={handlePBERowAction}>
                        </lightning-datatable>
                    </div> 
                    
                  
                </lightning-layout-item>
             </lightning-card>
          <lightning-card title="Volume Discount Items" icon-name="standard:contract_line_item">
            <lightning-layout-item flexibility="auto">
                <div style="height: 300px;" class="slds-box slds-p-around_small">
                        <lightning-datatable 
                        data={lpdata}
                        columns={lpColumns}
                        key-field="Id"
                        column-widths-mode='auto'
                        show-row-number-column="true"
                        hide-checkbox-column="true"
                        draft-values={draftValueslp}
                        onsave={handlelpDataSave}
                        default-sort-direction={defaultSortDirection}
                        sorted-direction={sortDirection}
                        sorted-by={sortedBy}
                        onsort={onHandleSort}
                        onrowaction={handleRowAction}
                        >      
                        </lightning-datatable>
                       </div>                  
                </lightning-layout-item>
           </lightning-card>
                </lightning-layout>
    </lightning-card>
</template>
