<template>
  
  <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
    aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium" >
    <div class="slds-modal__container" >
     
				
      <header class="slds-modal__header">
        <button class="slds-button slds-button_icon slds-float_right slds-button_icon-inverse" style="background: grey;"
        title="Close" onclick={handleCancelNew}>
        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
            size="small"></lightning-icon>
        <span class="slds-assistive-text">Close</span>
    </button>
        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{label.Sales_standardlicheading}</h2>
      </header>
   
	  
        
      <div class="slds-modal__content slds-p-around_small">
          
        <lightning-record-edit-form object-api-name="Sales_License__c" onsuccess={handleSuccess} onsubmit ={handleSubmit} onload={handleOnLoad}>
          <div data-id="focusOnErrorBannerId">
            <lightning-messages></lightning-messages>
          </div>
        <lightning-card>
          
						<template  if:false={isInternal}>
         <template  if:false={isSfdc}>
        
									 <p style="color:#FF0000; text-align:center;"><b>{label.Sales_LicErrorMsg1}</b>&nbsp;</p>
		
             </template>
						</template>
								<template  if:true={isInternal}>
            <template  if:true={isSfdc}>
          <h3 class="slds-section__title slds-theme_shade">
            <span class="slds-truncate slds-p-horizontal_small" title="Section Title">{label.Sales_License_Info}</span>
          </h3>

         
								<lightning-layout  class="slds-grid slds-wrap" size="12" >
										<br><br>
		   <lightning-layout-item padding="around-small" size="6" flexibility="auto" class="slds-size_1-of-2 slds-p-around_medium">
                  <lightning-input-field field-name='Sales_License_Status__c' ></lightning-input-field>
					 </lightning-layout-item>
				 <lightning-layout-item padding="around-small" size="6" flexibility="auto" class="slds-size_1-of-2 slds-p-around_medium">						
              <lightning-input-field field-name='Sales_License_Type__c' ></lightning-input-field>
              <lightning-input-field field-name='Sales_License_Web_Display_Flag__c'></lightning-input-field>
			  </lightning-layout-item>
             </lightning-layout>
    
            <h3 class="slds-section__title slds-theme_shade">
              <span class="slds-truncate slds-p-horizontal_small" title="Section Title">{label.Sales_License_product_Info}</span>
            </h3>
  
            <lightning-layout  class="slds-grid slds-wrap" size="12" >
		   <lightning-layout-item padding="around-small" size="6" flexibility="auto" class="slds-size_1-of-2 slds-p-around_medium">
                   <lightning-input-field field-name='Sales_License_Product__c'></lightning-input-field>
                    <lightning-input-field field-name='Sales_License_Product_Name_Txt__c'></lightning-input-field>
                    <lightning-input-field field-name='Sales_License_Quantity__c'></lightning-input-field>
                    <lightning-input-field field-name='Sales_License_Maintenance_Exp_Dt__c'></lightning-input-field>
                    <lightning-input-field field-name='Sales_Parent_License__c'></lightning-input-field>
					 </lightning-layout-item>
				 <lightning-layout-item padding="around-small" size="6" flexibility="auto" class="slds-size_1-of-2 slds-p-around_medium">						
                     <lightning-input-field field-name='Sales_License_Avbl_Qty_Nbr__c' ></lightning-input-field>
                      <lightning-input-field field-name='Sales_License_Expiration_Date_Dt__c'></lightning-input-field>
			     </lightning-layout-item>
             </lightning-layout>
            <h3 class="slds-section__title slds-theme_shade">
              <span class="slds-truncate slds-p-horizontal_small" title="Section Title">{label.Sales_OrderInfo_HTML}</span>
            </h3>
            <lightning-layout  class="slds-grid slds-wrap" size="12" >
		   <lightning-layout-item padding="around-small" size="6" flexibility="auto" class="slds-size_1-of-2 slds-p-around_medium">
                     <lightning-input-field field-name='Sales_License_Order__c'></lightning-input-field>
                    <lightning-input-field field-name='Sales_License_Contract__c'></lightning-input-field>
					 </lightning-layout-item>
				 <lightning-layout-item padding="around-small" size="6" flexibility="auto" class="slds-size_1-of-2 slds-p-around_medium">						
                      <lightning-input-field field-name='Sales_License_Order_Product__c' ></lightning-input-field>
                <lightning-input-field field-name='Sales_License_Activation_Code__c'></lightning-input-field>
                <lightning-input-field field-name='Sales_License_SAPLine_Nbr__c'></lightning-input-field>

			     </lightning-layout-item>
             </lightning-layout>
            <h3 class="slds-section__title slds-theme_shade">
              <span class="slds-truncate slds-p-horizontal_small" title="Section Title">{label.Sales_Licensing_Info}</span>
            </h3>
            <lightning-layout  class="slds-grid slds-wrap" size="12" >
		   <lightning-layout-item padding="around-small" size="6" flexibility="auto" class="slds-size_1-of-2 slds-p-around_medium">
                     <lightning-input-field field-name='Sales_License_Primary_Admin_Contact__c'></lightning-input-field>
                    <lightning-input-field field-name='Sales_License_Lic_User_Contact_ID__c'></lightning-input-field>
                    <lightning-input-field field-name='Sales_License_Account__c'></lightning-input-field>
                    <lightning-input-field field-name='Sales_License_Host_Node_Id__c'></lightning-input-field>
                    <lightning-input-field field-name='Sales_License_Avbl_Rehost_Nbr__c'></lightning-input-field>
                    <lightning-input-field field-name='Sales_License_Internal_Comments_Txt__c'></lightning-input-field>
                    <lightning-input-field field-name='Sales_License_Comments_Txt__c'></lightning-input-field>
					 </lightning-layout-item>
				 <lightning-layout-item padding="around-small" size="6" flexibility="auto" class="slds-size_1-of-2 slds-p-around_medium">						
                      <lightning-input-field field-name='Sales_License_PriAdm_Email__c' ></lightning-input-field>
					  <lightning-input-field field-name='Sales_License_Start_Date_Dt__c'></lightning-input-field>
                      <lightning-input-field field-name='Sales_License_Available_Temp_Licenses__c'></lightning-input-field>
			     </lightning-layout-item>
             </lightning-layout>
          
       
        <footer class="slds-docked-form-footer">
         
          <lightning-button label="Cancel" title="Cancel" onclick={handleCancelNew} class="slds-m-left_x-small">
          </lightning-button>
          &nbsp;&nbsp;
            <button class="slds-button slds-button_brand"  type="submit">Save</button> 
        
        </footer>
                </template>
						</template>
						</lightning-card>
             </lightning-record-edit-form>
      </div>
    </div>
  </section>
 
</template>
