<template >
    <template if:true={isModalOpen}>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!-- Modal/Popup Box LWC header here -->
            <header class="slds-modal__header">
               <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                    <lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small" ></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Kindly translate the below fields in English.</h2>
            </header>
            <!-- Modal/Popup Box LWC body starts here -->
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
            <lightning-layout multiple-rows="true">  
                <lightning-layout-item if:true={isnamespecial} padding="around-small" size="6" large-device-size="6" medium-device-size="6"> 
                    <lightning-input type="text" class="validate" name="Name" label="Name"
                        value={nonLatinArray.accname} disabled >                       
                    </lightning-input>
                </lightning-layout-item>                       
                <lightning-layout-item if:true={isnamespecial} padding="around-small" size="6" large-device-size="6" medium-device-size="6">
                    <lightning-input type="text" class="validate" name="tName" label="Name"
                    value={payloadNew.tname} onchange={inputChangeHandler}>                       
                    </lightning-input>
                </lightning-layout-item> 
                
                <lightning-layout-item if:true={isadd1special} padding="around-small" size="6" large-device-size="6" medium-device-size="6"> 
                    <lightning-input type="text" class="validate" name="addressline1" label="Address Line 1"
                     value={nonLatinArray.addressline1} disabled>
                </lightning-input>
                </lightning-layout-item>                       
                <lightning-layout-item if:true={isadd1special} padding="around-small" size="6" large-device-size="6" medium-device-size="6">
                    <lightning-input type="text" class="validate" name="taddressline1" label="Address Line 1"
                    value={payloadNew.taddressline1} onchange={inputChangeHandler}>
                 </lightning-input>
                </lightning-layout-item>
                
                <lightning-layout-item if:true={isadd2special} padding="around-small" size="6" large-device-size="6" medium-device-size="6"> 
                    <lightning-input type="text" class="validate" name="addressline2" label="Address Line 2"
                     value={nonLatinArray.addressline2} disabled>
                </lightning-input>
                </lightning-layout-item>                       
                <lightning-layout-item if:true={isadd2special} padding="around-small" size="6" large-device-size="6" medium-device-size="6">
                    <lightning-input type="text" class="validate" name="taddressline2" label="Address Line 2"
                    value={payloadNew.taddressline2} onchange={inputChangeHandler}>
                 </lightning-input>
                </lightning-layout-item>

                <lightning-layout-item if:true={iscityspecial} padding="around-small" size="6" large-device-size="6" medium-device-size="6"> 
                    <lightning-input type="text" class="validate" name="city" label="City"
                     value={nonLatinArray.city} disabled>
                </lightning-input>
                </lightning-layout-item>                       
                <lightning-layout-item if:true={iscityspecial} padding="around-small" size="6" large-device-size="6" medium-device-size="6">
                    <lightning-input type="text" class="validate" name="tcity" label="City"
                    value={payloadNew.tcity} onchange={inputChangeHandler}>
                 </lightning-input>
                </lightning-layout-item>
                
            </lightning-layout>

            </div>
            <!-- Modal/Popup Box LWC footer starts here -->
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral slds-float_left"  onclick={skipModal} title="Skip">Skip</button>
                <button class="slds-button slds-button_brand" onclick={okModal} title="OK">OK</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
</template>
