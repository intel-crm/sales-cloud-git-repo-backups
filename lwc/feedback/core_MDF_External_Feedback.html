<!-- feedbackBar.html -->
<template>
    <div class="feedback-bar">
        <button class="feedback-link" onclick={openFeedbackPopup}> {submitFeedback}</button>
    </div>
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container" style="width:30%">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title={closeButton} onclick={closeFeedbackPopup}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">{closeButton}</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate"> {submitFeedback}
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div style="max-height:2000px">
                        <template for:each={questionSets} for:item="item">
                            <div class="slds-p-around_medium" key={item.quesOrder}>
                              <!--  <lightning-tile key={item.label} label={item.label} type="media"> -->
                                <label class="slds-form-element__label" style="color:#0176d3; font-size: medium;"> {item.label}</label>
                                        <br></br>
                                        <div class="slds-grid slds-wrap">
                                            <template for:each={item.star} for:item="star">
                                                <div key={star.Id} class="slds-col slds-size_1-of-7">
                                                <input key={star.id} type="radio" id={star.id} name={item.label}
                                                    value={star.value} data-id={item.quesId} onchange={rating} />
                                               <div key={star.id}> <label key={star.id} for={star.id}
                                                    title={star.displayLabel}>{star.value}</label> </div>
                                                </div>
                                            </template>
                                        </div>

                               <!-- </lightning-tile> -->
                               <br>
                            </div>
                        </template>

                        <br>
                      <!--  <lightning-tile label="Additional comments" type="media"> -->
                        <label class="slds-form-element__label" style="padding-left:16px; font-size: medium; color:#0176d3"> {additionalComments}</label>
                        <br></br>
                            <div style="padding-left:30px">
                                <textarea id="OptionalFeedback" name="OptionalFeedback" rows="2" cols="30"
                                    placeholder={optionalFeedback} onchange={rating}></textarea>
                            </div>
                      <!--  </lightning-tile> -->
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <div class="slds-grid slds-grid_align-center">

                    <button class="slds-button slds-button_neutral" onclick={closeFeedbackPopup} title={cancelButton}>{cancelButton}</button>
                    <button class="slds-button slds-button_brand" onclick={submitAction} title={submitButton}>{submitButton}</button>
                </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
