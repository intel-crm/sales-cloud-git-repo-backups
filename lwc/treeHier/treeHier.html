<!-- sldsValidatorIgnore -->
<!-- sldsValidatorIgnore -->
<!-- myComponent.html -->
<template>
    <template if:true={async}>
        <c-product-async-apex-job></c-product-async-apex-job>
        </template>
        <template if:false={async}>
    <template if:true={error}>
        <div class="slds-grid slds-gutters slds-p-around_x-small">
        <div class="slds-col slds-size_1-of-1 slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
            <!--error graphic-->
            <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small" title="Description of icon when needed">
            <lightning-icon icon-name="utility:error" alternative-text="Error" title="Error" variant="inverse"></lightning-icon>
            </span>
            <!--error message-->
            <h2>Some Error occured Please Contact to Admin</h2>
            <!--close button-->
        </div>
    </div>
    </template>
    <div class="slds-grid slds-wrap">
        <div class="slds-size_1-of-1 slds-m-bottom_x-small">
            <header class="slds-media slds-media--center slds-has-flexi-truncate slds-p-around_medium colorwhite">
            <div class="slds-media__figure stencil slds-avatar slds-avatar_small">
                <lightning-icon class="my-icon" icon-name="standard:hierarchy" size="small"  alternative-text="hierarchy"></lightning-icon>
            </div>
            <div class="slds-media__body">
                <h2 class="slds-card__header-title">
                    Product Hierarchy
                </h2>
            </div>
        </header>
    </div>
        <div class="slds-size_3-of-7 lgc-bg slds-p-around_small divsize slds-scrollable">
                        <template if:true={isLoading}>
                            <lightning-spinner alternative-text="Loading" variant="brand" size="large">
                            </lightning-spinner>
                        </template>
                        
                            
                                <lightning-accordion allow-multiple-sections-open>
                                    <lightning-accordion-section label="Change Hierarchy">
                                        <div class="slds-grid slds-wrap colorwhite">
                                        <lightning-combobox class="slds-col slds-size_1-of-2 slds-p-around_x-small" name="Hierarchy" label="Hierarchy"  value={HierarchyValue} options={HierarchyOptions} placeholder="Select an option" onchange={HierarchyChange}></lightning-combobox>
                                        <lightning-combobox class="slds-col slds-size_1-of-2 slds-p-around_x-small" name="Active" label="Active"  value={activeValue} options={activeOptions} placeholder="Select an option" onchange={activeChange}></lightning-combobox>
                                        </div>
                                    </lightning-accordion-section>
                                    <lightning-accordion-section label="Search">
                                        <div class="slds-grid slds-wrap colorwhite">
                                        <lightning-combobox class="slds-col slds-size_1-of-2 slds-p-around_x-small" name="SearchType" label="Search Type"  value={isSelected} options={SearchTypeOptions} placeholder="Select an option" onchange={handleActive}></lightning-combobox>
                                        <lightning-input class="slds-col slds-size_1-of-2 slds-p-around_x-small" label="Enter Value" value={inputText} onchange={handleInputChange}></lightning-input>
                                        <lightning-button class="slds-col slds-size_1-of-4 slds-p-around_x-small" icon-name="utility:search" label="Search" onclick={handleSearch}></lightning-button>
                                        <lightning-button class="slds-col slds-size_1-of-4 slds-p-around_x-small" icon-name="utility:refresh" label="Reset" onclick={resetData}></lightning-button>
                                        </div>
                                    </lightning-accordion-section>
                                </lightning-accordion> 
                                <div class="slds-grid slds-wrap">
                                <lightning-button class="slds-col slds-size_1-of-4 slds-p-around_small" label={toggleButtonLabelName} title="Show Name" icon-name={toggleIconName} onclick={handleToggleClickName}></lightning-button>
                                <lightning-button class="slds-col slds-size_1-of-4 slds-p-around_small" label={toggleButtonLabelLevel} title="Show Level" icon-name={toggleIconLevel} onclick={handleToggleClickLevel}></lightning-button>
                                <div class="slds-col slds-size_1-of-4 slds-p-around_small"><template if:true={resultsfound}><lightning-button label={toggleExLevelLabel}  icon-name={toggleIconExcoll} onclick={handleToggleexclParent}></lightning-button></template></div>
                                <div class="slds-col slds-size_1-of-4 slds-p-around_xxx-small">
                                     <div class="slds-grid slds-wrap">
                                    <div class="toggle-icon-active slds-col slds-size_1-of-2 slds-p-around_xxx-small">Represents active</div>
                                    <div class="toggle-icon-inactive slds-col slds-size_1-of-2 slds-p-around_xxx-small">Represents inactive</div>
                                </div>
                            </div>
                                <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                                    <template if:true={resultsfound}>
                                        <lightning-input type="checkbox" label="Show Searched Result Only" name="input1" onchange={handleChangeSearchResult}></lightning-input>
                                    </template>
                                </div>
                                <div class="slds-col slds-size_1-of-1 colorwhite">
                                    <template if:true={found}>
                                        <template for:each={items} for:item="item">
                                            <c-tree-item key={item.id} item={item} onselected={handleItemClick} name-visible={nameVisible} level-visible={levelVisible} checked={checked}></c-tree-item>
                                        </template>
                                    </template>
                                </div>
                            </div>
        </div>
        <div class="slds-size_4-of-7">
            <div class="relativePos">
                <template if:true={isLoading2}>
                    <lightning-spinner alternative-text="Loading" variant="brand" size="large">
                    </lightning-spinner>
                </template>
                <template if:true={recordId}>
                <div class="lgc-bg slds-m-left_x-small">
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-button
                                            class="slds-p-around_small btn2"
                                              icon-name="utility:undo"
                                              variant="border-filled"
                                              onclick={handleRevertButtonClick}
                                              alternative-text="Revert"
                                              label="Back to Search Results"
                                              ></lightning-button>
                        </div>
                        <div class="slds-col slds-size_1-of-3 slds-align_absolute-center">
                                            <lightning-button
                                              class="slds-p-around_small"
                                              label="<< Previous"
                                              name="Previous"
                                              disabled={getZeroNav}
                                              onclick={navigateRecord}
                                              ></lightning-button>
                            <lightning-button
                                              class="slds-p-around_small"
                                              label="Next >>"
                                              name="Next"
                                              disabled={getMaxNav}
                                              onclick={navigateRecord}
                                              ></lightning-button>
                        </div>
                        <div class="slds-col slds-size_1-of-3 slds-text-align_right">
                            <span> {tableDatatempcurrentRecord} out of {tableDatatempsize}</span>
                        </div>
                       
                    </div>
                   
                    <div class="bgcolor slds-m-vertical_small">
                        <h2 slot="title">
                            <div class="slds-grid slds-gutters">
                                <div class="slds-col slds-size_1-of-12 ">
                                    <lightning-icon icon-name="standard:product" size="large" class="slds-m-around_medium"></lightning-icon>
                                </div>
                                <div class="slds-col slds-size_11-of-12 divcen">
                                    <div>
                                        <b><span class="textC">{recordName}</span></b></div>
                                </div>
                            </div>
                        </h2>
                    </div>
                    <lightning-tabset variant="scoped" active-tab-value="1">
                        <lightning-tab label="Details" value="1" onactive={handleDataActive}>
                            
                            <div class="bgcolor slds-p-around_medium">
                                <lightning-record-form layout-type="Full" record-id={recordId} object-api-name="Product2"
                                                       columns="2" mode="view">
                                </lightning-record-form>
                            </div>
                        </lightning-tab>
                        <lightning-tab label="Product History" value="2" onactive={handleDataActive}>
                            <div class="slds-card borderline">
                                <header class="slds-media slds-media--center slds-has-flexi-truncate slds-p-around_medium colorwhite">
                                    <div class="slds-media__figure stencil slds-avatar slds-avatar_small">
                                        <lightning-icon class="my-icon" icon-name="standard:hierarchy" size="small"  alternative-text="hierarchy"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h2 class="slds-card__header-title">
                                            Product  History&nbsp;({dataLength})
                                        </h2>
                                    </div>
                                </header>
                                <template if:true={dataRelated}>
                                    <div class="bordertop">
                                        <div class="slds-grid slds-gutters slds-p-around_medium">
                                            <div class="slds-col">
                                                <lightning-combobox
                                                                    name="Field"
                                                                    label="Filter By Field"
                                                                    value={filterFieldValue}
                                                                    placeholder="Select an option"
                                                                    options={fieldFilterOptions.Fields}
                                                                    onchange={handleFilterChange}
                                                                    ></lightning-combobox>
                                                <template if:true={filterFieldValue}>
                                                    <lightning-button-icon name="FieldClose" class="slds-float_right" icon-name="utility:close" onclick={clear}></lightning-button-icon>
                                                </template>
                                            </div>
                                            <div class="slds-col">
                                                <lightning-combobox
                                                                    name="CreatedByName"
                                                                    label="Filter By Created Name"
                                                                    value={filterCreatedByNameValue}
                                                                    placeholder="Select an option"
                                                                    options={fieldFilterOptions.CreatedByNames}
                                                                    onchange={handleFilterChange}
                                                                    ></lightning-combobox>
                                                <template if:true={filterCreatedByNameValue}>
                                                    <lightning-button-icon name="CreatedByNameClose" class="slds-float_right" icon-name="utility:close" onclick={clear}></lightning-button-icon>
                                                </template>
                                            </div>
                                            <div class="slds-col">
                                                <lightning-combobox
                                                                    name="OldValue"
                                                                    label="Filter By Old Values"
                                                                    value={filterOldValue}
                                                                    placeholder="Select an option"
                                                                    options={fieldFilterOptions.OldValues}
                                                                    onchange={handleFilterChange}
                                                                    ></lightning-combobox>
                                                <template if:true={filterOldValue}>
                                                    <lightning-button-icon name="OldValueClose" class="slds-float_right" icon-name="utility:close" onclick={clear}></lightning-button-icon>
                                                </template>
                                            </div>
                                            <div class="slds-col">
                                                <lightning-combobox
                                                                    name="NewValue"
                                                                    label="Filter By New Values"
                                                                    value={filterNewValue}
                                                                    placeholder="Select an option"
                                                                    options={fieldFilterOptions.NewValues}
                                                                    onchange={handleFilterChange}
                                                                    ></lightning-combobox>
                                                <template if:true={filterNewValue}>
                                                    <lightning-button-icon  name="NewValueClose" class="slds-float_right" icon-name="utility:close" onclick={clear}></lightning-button-icon>
                                                </template>
                                            </div>
                                            
                                        </div>
                                        <lightning-datatable
                                                             key-field="id"
                                                             data={dataRelated}
                                                             columns={columnsRelated}
                                                             hide-checkbox-column
                                                             resize-column-disabled>
                                        </lightning-datatable> 
                                    </div>     
                                </template>  
                                
                            </div>
                        </lightning-tab>
                    </lightning-tabset>
                </div>
            </template>
        </div>
            <div class="relativePos">
            <template if:true={isLoading3}>
                <lightning-spinner alternative-text="Loading" variant="brand" size="large">
                </lightning-spinner>
            </template>
            <template if:true={table}>
                <div class="slds-card lgc-bg slds-m-left_x-small divsize">
                    <header class="slds-media slds-media--center slds-has-flexi-truncate slds-p-around_medium colorwhite">
                        <div class="slds-media__figure stencil slds-avatar slds-avatar_small">
                            <lightning-icon class="my-icon" icon-name="standard:hierarchy" size="small"  alternative-text="hierarchy"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title">
                                Product List&nbsp;({totalRecountCount})
                            </h2>
                        </div>
                    </header>
                    <div class="slds-m-around_x-small">
                        <div class="slds-grid slds-wrap">
                            <template for:each={searchInputs} for:item="searchInput" for:index="index">
                                <div key={searchInput.id} class="slds-grid slds-wrap slds-col slds-size_1-of-4">
                                    <div class="slds-col slds-size_5-of-6">
                                        <lightning-input
                                                         type="text"
                                                         label="Search Term"
                                                         value={searchInput.value}
                                                         onchange={handleSearchProductList}
                                                         data-index={index}
                                                         ></lightning-input>
                                                        <label class="colorred"> {searchInput.searchOutputError}</label>
                                    </div>
                                    <div class="slds-col slds-size_1-of-6">
                                        <lightning-button-icon
                                                               icon-name="utility:clear"
                                                               alternative-text="Remove"
                                                               onclick={handleRemoveSearchInput}
                                                               data-index={index}
                                                               class="slds-float_right slds-p-top_xx-small"
                                                               ></lightning-button-icon>
                                    </div>
                                </div>
                            </template>
                        </div>   
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_1-of-4">
                                <lightning-button class="slds-m-top_large btn2" label="Add Search Input" onclick={addSearchInput}></lightning-button>
                            </div>
                            <div class="slds-col slds-size_1-of-4"></div>
                            <div class="slds-col slds-size_1-of-4">
                                <lightning-combobox label="No of Rows"  value={recordCount} options={recordCountOptions} onchange={handleNoofRows}></lightning-combobox>
                            </div> 
                            <div class="slds-col slds-size_1-of-4"> <lightning-button class="slds-m-top_large btn2"  variant="brand" label="Export to CSV" onclick={openModal}></lightning-button></div>
                            
                        </div>           
                        
                    </div>
                    
                    <div  style="height: 52vh;">
                        <lightning-datatable
                                             key-field="Id"
                                             data={tableData}
                                             columns={columns}
                                             show-row-number-column
                                             hide-checkbox-column
                                             onrowaction={handleRowAction}>
                        </lightning-datatable>
                    
                    
                    <template if:true={loadMoreToggle}>
                        <div class="slds-align_absolute-center lgc-bg slds-p-top_small">
                            <lightning-button class="slds-p-around_xx-small" label="Load More" title="Load More" onclick={LoadMore}></lightning-button>
                        </div>
                    </template>
                </div>
                </div>
            </template>
        </div>
    </div>
</div>      
   <template if:true={bShowModal}>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
       <div class="slds-modal__container">
          <!-- modal header start -->
          <header class="slds-modal__header">
             <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                <lightning-icon icon-name="utility:close"
                   alternative-text="close"
                   variant="inverse"
                   size="small" ></lightning-icon>
                <span class="slds-assistive-text">Close</span>
             </button>
             <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Export the Data</h2>
          </header>
          <!-- modal body start -->
          <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                  <lightning-input
                              type="search"
                              label="Search Available Fields"
                              onchange={handleSearchChange}
                          ></lightning-input>
                          <lightning-dual-listbox
                              label="Select Fields"
                              source-label="Available Fields"
                              selected-label="Selected Fields"
                              options={filteredAvailableFieldOptions}
                              value={selectedFields}
                              onchange={handleFieldSelection}
                          ></lightning-dual-listbox>
          </div>
          <!-- modal footer start-->
          <footer class="slds-modal__footer">
             <button class="slds-button slds-button_neutral" onclick={exportData}>Export</button>        
             <button class="slds-button slds-button_neutral" onclick={closeModal}>Cancel</button>
          </footer>
       </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
 </template>
 </template>
 <!-- modal end -->
</template>
