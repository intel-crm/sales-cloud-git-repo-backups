<template>
    <div class="slds-p-top_large" >
    <div class="slds-grid slds-gutters">
        <div class="slds-col">
      </div>
        <div class="slds-col">
    <template if:true={showLoadingSpinner}>
        <div style="z-index: 10000 !important;">
            <lightning-spinner alternative-text="Uploading......" size="medium" style="z-index: 10000 !important;"></lightning-spinner>
        </div>
    </template>
    <lightning-card variant="Narrow" title={label.Sales_Contact_Customer_Title} >
        <lightning-layout>
            <lightning-layout-item padding="around-medium" size = "12">
                <lightning-combobox data-id="datalicense" name="TypeLicenses" label={label.Sales_Type_Of_License} value={value} placeholder="" options={pickListValues} onchange={handleChange} required variant = "label-inline" message-when-value-missing={label.Sales_Nonips_Licenseissue}></lightning-combobox> 
                <!-- <lightning-combobox name="TypeLicense" label="Type of License Issue:" value="" placeholder="" options={pickListValues} onchange={handleChanges} required></lightning-combobox>  -->
                {label.SalesAdditionalInfoHtml}<br>
                {label.SalesDescriptionCustomerService}
                <lightning-input data-id="datafield" type="text" name="po" label={label.Sales_Po} value="" maxlength="21" variant = "label-inline"></lightning-input>
                <lightning-input data-id="datafield" type="text" name="serialnumber" value="" label={label.Sales_License_Activation}  maxlength="32" variant = "label-inline"></lightning-input>
                <lightning-input data-id="datafield" type="text" name="hostid" value="" label={label.Sales_Nic_Guard} maxlength="12" variant = "label-inline"></lightning-input>
                <lightning-input data-id="datafield" type="text" name="productname" value="" label={Sales_Product_Name} maxlength="255"  variant = "label-inline"></lightning-input>
                <lightning-textarea data-id="datadescription" name="description"  label={label.Sales_Description} maxlength="1800"  variant = "label-inline" required message-when-value-missing={label.Sales_Nonips_description}></lightning-textarea>
                <lightning-button type="submit" name="submit" label={label.Sales_Submit_Issue} onclick={handleOnSubmitBtnClick} class="slds-float_right"> </lightning-button>
            </lightning-layout-item>
        </lightning-layout>
     </lightning-card>
    </div>
  <div class="slds-col">
</div>
</div>
</div>  
</template>
