        </th>
        <th aria-label="License Expiration" aria-sort="none" class="slds-is-resizable slds-is-sortable slds-cell_action-mode" scope="col">

            <span class="slds-icon_container slds-icon-utility-arrowdown">
            
            </span>
            </div>
            </a>
            <div class="slds-resizable">
            <input type="range" aria-label="Close Date column width" class="slds-resizable__input slds-assistive-text" id="cell-resize-handle-5354" max="1000" min="20" tabindex="0" />
            <span class="slds-resizable__handle">
            <span class="slds-resizable__divider"></span>
            </span>
            </div>
        </th>
        </tr>
        </thead>

        <tbody>
            <template for:each={result} for:item="product">
				<tr key={product.Id}>
					<th scope="col">
                        
                        <div class="container">
                            <label for={product.Id}  class="square">
                                <input
                                type="radio"
                                name="eachitem"
                                id={product.Id}
                                checked={product.checked} 
                                value={product.prodId}
                                onchange={handleClick}
                                    
                                />
                                <div class="circle"></div>
                            </label>
                        </div>
					</th>
                    <th >
						<div>{product.prodName}</div>
					</th>                   
					<th scope="col">
						<div>{product.maintenenceExp}</div>
					</th>
                    <th scope="col">
						<div>{product.licExp}</div>
					</th>
				</tr>
			</template>
        </tbody>
        </table>

<template if:true={inputDisable}>
<div class="input-wrapper slds-p-top_medium">
    <label for="seats" class="input-label">
        <span class="required">*</span> # of Seats
        <lightning-helptext content="Help Text"></lightning-helptext>
        
    </label>
    
        
            
          
    
    <div class="input-field">
        <input
        type="number"
        id={pid}
        min="1"
        max="9999"
        
        value={defaultValue}
        disabled='True'
    />

        
        <div class="max-allowed-text">Max allowed 9,999</div>
    </div>
</div>
</template>
<template if:false={inputDisable}>
    <div class="input-wrapper slds-p-top_medium">
        <label for="seats" class="input-label">
            <span class="required">*</span> # of Seats
            <div class="tool-tip">
            <lightning-helptext content="You'll receive weekly updates"></lightning-helptext>
        </div>
        </label>
        
            
                
                    
                
              
        
        <div class="input-field">
            <input
            type="number"
            id={pid}
            min="1"
            max="9999"
            oninput={handleSeatsInputChange}
            value={defaultValue}
            
        />
    
            
            <div class="max-allowed-text">Max allowed 9,999</div>
        </div>
    </div>
    </template>
</template>
