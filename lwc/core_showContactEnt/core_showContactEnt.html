<template>
    <div >
        <lightning-card title="Contact Entitlements" icon-name="standard:entitlement" class="slds-m-left_medium" >
            <div class="slds-card__header slds-grid"> 
                <header class="slds-media slds-media_center slds-has-flexi-truncate slds-scrollable_x">
                    <template if:true={consData}>
                        <lightning-datatable
                            key-field="Id"
                            data={consData}
                            columns={columns}
                            min-column-width="1000Px"
                        >
                        </lightning-datatable>
                    </template>
                </header>
            </div>
            <div >
                <footer class="slds-card__footer">
                    <lightning-button
                    class="slds-m-right_small"
                    variant="Neutral"
                    label={buttonLabel}
                    title="View All Entitlements"
                    onclick={viewAllHandler}
                    >
                    </lightning-button>
                </footer>
            </div>
            
        </lightning-card>
    </div>
    
</template>
