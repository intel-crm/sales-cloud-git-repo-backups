<template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
    
          <div class="slds-modal__container">
          <!-- modal header start -->
          <header class="slds-modal__header">
              <template if:true={fromlicensegenerate}>
              <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" style="background: grey;"
              title="Close" onclick={handleCancel}>
              <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                  size="small"></lightning-icon>
              <span class="slds-assistive-text">Close</span>
          </button>
          </template>
          <template if:false={fromlicensegenerate}>
              <button class="slds-button slds-button_icon slds-float_right slds-button_icon-inverse" style="background: grey;"
              title="Close" onclick={handleCancelNew}>
              <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                  size="small"></lightning-icon>
              <span class="slds-assistive-text">Close</span>
          </button>
          </template>
              <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Create Computer</h2>
          </header>
      
          <lightning-record-edit-form object-api-name="Sales_Host__c" record-id={recordId} onload={handleOnLoad} onsuccess={handleSuccess} onsubmit={handleSubmit}>
              <div class="slds-modal__content slds-p-around--medium"><!--css for proper footer-->
                  <div data-id="focusOnErrorBannerId">
                      <lightning-messages></lightning-messages>
                  </div>
                    
              <div class="slds-grid slds-wrap">
                  <div class="slds-size_1-of-2 slds-p-around_medium">
                      <lightning-input-field field-name='Sales_Computer_Name_Txt__c'></lightning-input-field>
                      <br>
                      <div style="display: inline;">
                          <lightning-formatted-text value="License Type" class="slds-form-element__label"></lightning-formatted-text>
                          <abbr title="required" class="slds-float_left slds-required">*</abbr> 
                          <lightning-helptext content="Single User-Fixed/Multiple Users-Float"></lightning-helptext>
                          <lightning-input-field field-name='Sales_License_Type__c' value={toollicensetype} onchange={handleOnChange} disabled={validateLicenseType} variant="label-hidden"></lightning-input-field>
                      </div>
  
                      <template if:true={isfloatRecord}>
                        <template if:false={isfixedRecord}>
                          <lightning-input-field field-name='Sales_Redundant_Server1_Txt__c'></lightning-input-field>
                      </template>
                      </template>
                  
                      <template if:true={isfixedRecord}>
                        <template if:false={isfloatRecord}>
                          <lightning-input-field field-name='Sales_Companion_Server1_Txt__c' label-name= 'Companion Computer ID 1'></lightning-input-field> 
                      </template>
                      </template>
                      
                      <lightning-input-field field-name='Sales_Contact__c' onchange={onchangePrimaryAdmin} value={getContactValue} disabled={disablePrimaryAdmin} required='true'></lightning-input-field>
                  </div>
  
                  <div class="slds-size_1-of-2 slds-p-around_medium">
                      <lightning-input-field field-name='Sales_Computer_Type__c' field-level-help='Enter computer type'></lightning-input-field>
                      <p><lightning-icon icon-name="utility:info" size="xx-small"></lightning-icon> &nbsp;
                      <lightning-formatted-url label={label.Sales_DetermineCompType} value="https://www.intel.com/content/www/us/en/programmable/support/support-resources/download/licensing/lic-q2se_licenses.html" target="_blank"></lightning-formatted-url></p>
                      
                      <div style="display: inline;">
                          <lightning-formatted-text value="Primary Computer ID" class="slds-form-element__label"></lightning-formatted-text>
                          <abbr title="required" class="slds-float_left slds-required">*</abbr> 
                          <lightning-helptext content={label.Sales_ComputerTypeHelpText}></lightning-helptext>
                          <lightning-input-field field-name='Name' onchange={onchangeNICId} variant="label-hidden" required='true'></lightning-input-field>
                      </div>
              
                      <template if:true={isfloatRecord}>
                        <template if:false={isfixedRecord}>
                          <lightning-input-field field-name='Sales_Redundant_Server2_Txt__c'></lightning-input-field>
                      </template>
                      </template>
                      <template if:true={isfixedRecord}>
                        <template if:false={isfloatRecord}>
                          <lightning-input-field field-name='Sales_Companion_Server2_Txt__c' label= 'Companion Computer ID 2'></lightning-input-field>
                      </template>
                      </template>
                      
                  </div>
              </div>
          </div>
          
  
          <!-- Modal Footer start-->
          <footer class="slds-modal__footer">
              <template if:true={fromlicensegenerate}>
                  <lightning-button variant="neutral" label="Cancel" title="Cancel" onclick={handleCancel} class="slds-m-left_x-small"></lightning-button>
                  <button class="slds-button slds-button_brand slds-m-left_x-small" disabled={buttonClicked} title="Generate License">Generate License</button>
                  </template>
                <template if:false={fromlicensegenerate}>
                  <lightning-button variant="neutral" label="Cancel" title="Cancel" onclick={handleCancelNew} class="slds-m-left_x-small"></lightning-button>
                  <button class="slds-button slds-button_brand slds-m-left_x-small" disabled={buttonClicked} title="Save">Save</button>
              </template>
              </footer>
      
      </lightning-record-edit-form>
  </div>  
   
  </section>
  
  
  <div class="slds-backdrop slds-backdrop_open" style="opacity: .23;"></div>
  <template if:true={enableFeedback}>
      <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
          aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
          <div class="slds-modal__container">
              <c-sales_-event-feedback rec-id={licneserecordid} capablity={capablity}>
              </c-sales_-event-feedback>
          </div>
      </section>
  </template>
  </template>
