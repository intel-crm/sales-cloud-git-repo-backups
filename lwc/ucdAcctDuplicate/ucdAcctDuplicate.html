    <lightning-layout multiple-rows="true">
        <!--Markup for showing spinner-->  
         <template if:false={loaded}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>
        <lightning-card>
            <div class="slds-theme--shade" style = "padding: 5px;height: 40px;">
                <div class=" slds-text-heading_medium slds-float_left">
                    Potential Matches
                </div>
                <div class="slds-float_right">
                    <template if:true={showpagination}> 
                        <!--Child component for searching values in the table-->            
                        <!--<c-ucd-search-box  records={tableData}                                  
                            onsearchforkey={handlePaginatorChange}>
                        </c-ucd-search-box> -->
                        <c-ucd-search-filter records={tableData} onfilterkey={handlePaginatorChange}>
                        </c-ucd-search-filter>
                    </template>
            </div>
        </div>
        <!--Markup for showing Table header--> 
        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout slds-table_resizable-cols" role="grid">              
              <thead>
                <tr class="thead_height">
                    <th class="radiocolum_width" scope="col">
                    </th>
                    <th role="gridcell">
                        <div class="slds-align_absolute-left"  title="Name">Name</div>
                    </th> 
                    <th class="" scope="col">
                        <div class="slds-truncate" title="First Name">CIM ID</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Last Name">Account ID</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Last Name">Primary Address</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Last Name">IPA Account</div>
                    </th>
                    <th class="" scope="col">
                      <div class="slds-truncate" title="Last Name">Owner Name</div>
                  </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Last Name">Duplicate Account Status</div>
                    </th>
                </tr>
            </thead>
            <tbody>
                <template for:each={recordsToDisplay} for:item="trow" for:index="indx">
                    <tr key={trow.cimID}>
                        <th>
                            <div class="slds-checkbox">
                                <lightning-input type="checkbox" onchange={checkBoxSelectionHandler} value={trow.cimID}  
                                        data-element="subscribe-checkbox"
                                        name={trow.accId} data-id={trow.cimID} placeholder={trow.accOwner}>
                                </lightning-input>                                  
                            </div>
                        </th>
                        <td class="slds-cell-wrap" data-label="Wrapped, line clamped">
                            <div class="slds-line-clamp" title={trow.accName}>{trow.accName}</div>
                        </td> 
                            <th scope="col">
                                <div class="slds-truncate" title={trow.cimID}>{trow.cimID}</div>
                            </th>
                            <th scope="col">
                             <!--   <div class="slds-truncate" title={trow.IPAFlag}>{trow.IPAFlag}</div> -->
                                <lightning-button variant="base" label={trow.accId} title={trow.accName} onclick={handleRowAction} class="slds-m-left_x-small"> {trow.accId}</lightning-button>
                            </th>
                            <td class="slds-cell-wrap" data-label="Wrapped, line clamped">
                                <div class="slds-line-clamp" title={trow.fullAddress}>{trow.fullAddress}</div>
                              </td>
                            <th scope="col">
                                <div class="slds-truncate" title={trow.IPAFlag}>{trow.IPAFlag}</div>
                            </th>
                            <th scope="col">
                               <div class="slds-truncate" title={trow.accOwner}>{trow.accOwner}</div> 
                             <!--  <lightning-button variant="base" label={trow.accId} title={trow.accName} onclick={handleRowAction} class="slds-m-left_x-small"> {trow.accId}</lightning-button> -->
                               
                            </th>
                            <th scope="col">
                              <div class="slds-truncate" title={trow.searchScore}>{trow.searchScore}</div>
                          </th>
                        </tr>
                    </template>
                </tbody>
        </table>
        <!--Child component showing pagination--> 
        <template if:true= {showpagination}>                      
                <c-ucd-pagination records={tableData} 
                         total-records={tableData.length} 
                         show-search
                         show-pagination
                         onpaginatorchange={handlePaginatorChange}>
                 </c-ucd-pagination>              
       </template>
        <br/>
        <!--Markup for showing text if no records returned--> 
            <template if:true= {showNoData}>
                <lightning-layout>
				<div class="slds-align_absolute-center">
					<p class="slds-text-heading_medium ">
						<lightning-formatted-text value="No Duplicate Records Found!!!" ></lightning-formatted-text>
					</p>    
                </div>
                <br><br>
            </lightning-layout>
             </template>
             <br/>
             <div class="slds-align_absolute-center" >
                <lightning-input type="checkbox"  data-id="checkboxField" label="Did not find any match Create New Account" onchange={handleCheckBoxChange} ></lightning-input>
             </div>
             <br/>
             <template if:true={isValidUser}>
                <lightning-button onclick={openModal} class="slds-p-left_small" variant="brand" value="Next" label="Next"></lightning-button>
            </template>
            <template if:false={isValidUser}>
                <lightning-button onclick={onNextClickHandler} disabled={disabledCondition}  data-element="next-button" class="slds-p-left_small" variant="brand" value="Next" label="Next"></lightning-button>
            </template>
</lightning-card>
          
</lightning-layout>
   <!-- <lightning-button onclick={onPrevClickHandler} value="Previous" label="Previous">Previous</lightning-button>-->
  
   
    <!--Markup for account ownership if user selects an account from table which exist in Salesforce and MDM--> 
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Account Claim Notification</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    
                    <p><b>Account is already owned,  do you want to open the account 
                    </b></p>
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={onNextClickHandler} title="OK">OK</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!--Modal showing the Account record details once user cicks on the Salesforce Id from table--> 
    <template if:true={ShowModal}>
        <section role="dialog" tabindex="-1"
                aria-labelledby="modal-heading-01"
                aria-modal="true"
                aria-describedby="modal-content-id-1"
                class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!-- modal header start -->
            <header class="slds-modal__header">
                <lightning-button-icon icon-name="utility:close" class="slds-float_right" onclick={closeModal} alternative-text="close"></lightning-button-icon>

                <h2 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">Record Detail: {recName}</h2>
            </header>
            <!-- modal body start -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                    <dl class="slds-wrap">
                        <lightning-record-form
                        record-id={recId} 
                        object-api-name="Account"
                        layout-type="Full" 
                        columns="2" 
                        mode="readonly"
                        onsuccess={handleSuccess}>
                    </lightning-record-form>
                    
                    </dl>
                </div>
            <!-- modal footer start-->
            <footer class="slds-modal__footer">
                <lightning-button variant="brand"
                label="Close"
                title="Close"
                onclick={closeModal}
                ></lightning-button>
            </footer>
        </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    </template>
</template>
