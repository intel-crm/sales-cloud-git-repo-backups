<template>
    <template if:true={quotelines}>
        <div class="slds-scrollable_y" style="height:41rem;">
            <lightning-layout horizontal-align="left" multiple-rows>
                <template for:each={quotelines} for:item="quoteline">
                    <lightning-layout-item key={quoteline.Id} padding="around-small" size="12"
                        small-device-size="4" medium-device-size="4" large-device-size="4">
                        <c-quoteline-tile quoteline={quoteline} selectedquoteline-id={selectedquotelineId}
                            onquotelineselect={updateSelectedTile} meta-data={metaData} onrefreshevent={refresh}></c-quoteline-tile>
                    </lightning-layout-item>
                </template>
            </lightning-layout>
        </div>
    </template>

    <template if:true={showReadOnlyQL}>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>  
        <section aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close this window" size="large"
                        variant="bare-inverse" onclick={closeModal} class="slds-modal__close">
                    </lightning-button-icon>
                    <h2  class="slds-modal__title slds-hyphenate">{productName}</h2>                    
                </header>
                <div class="slds-modal__content slds-p-around_medium" >
                    <c-pricing_-read-only_-field-set_-form record-id={quoteId}></c-pricing_-read-only_-field-set_-form>
                </div>
            </div>
        
        </section> 
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
