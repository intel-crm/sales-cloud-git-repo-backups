<template>
    <div class="slds-size_8-of-12">
      <div class="slds-page-header">
        <div class="slds-page-header__row">
          <div class="slds-page-header__col-title">
            <div class="slds-media">
              <div class="slds-media__figure">
                <lightning-icon icon-name="standard:approval" alternative-text="Approval" title="Approval">
                </lightning-icon>
              </div>
              <div class="slds-media__body">
                <div class="slds-page-header__name">
                  <div class="slds-page-header__name-title">
                    <h1>
                      <span> Approval Requests </span>
                      <span class="slds-page-header__title slds-truncate" title="Items to Approve">Items to Approve</span>
                    </h1>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <template if:true={phoneOrDesktop}>
            <div class="slds-page-header__col-actions slds-size_4-of-12 slds-container_right">
              <div class="slds-page-header__controls">
  
                <lightning-input data-id="searchText" type="search" style="top: 35px;" placeholder="Find"
                  onchange={handleSearch}></lightning-input>
                <!--  <lightning-input type="search" placeholder="Search here..." onchange={handleSearchWithApex} value={searchKey}></lightning-input> -->
              </div>
            </div>
          </template>
          <template if:false={phoneOrDesktop}>
            <div class="slds-page-header__col-actions">
              <div class="slds-page-header__controls">
                <div class="slds-page-header__control">
                  <template if:true={isBulkAppReqsActive}>
                    <div>
                      <lightning-input data-id="searchText" type="search" style="top: 25px; left: 200px;"
                        placeholder="Search here..." onchange={handleSearch}></lightning-input>
                    </div>
                  </template>
                  <template if:false={isBulkAppReqsActive}>
                    <div>
                      <lightning-input data-id="searchText" type="search" style="top: 25px; left: 10px;"
                        placeholder="Search here..." onchange={handleSearch}></lightning-input>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </template>
          <!--<lightning-button slot="actions" label="Refresh" icon-name="utility:refresh" variant="brand"

            </template>

          <template if:false={phoneOrDesktop}>
            <lightning-button slot="actions" variant="brand" label="Approve" title="Approve" icon-name="action:approval"

          </template>
        </div>
