<template>
    <div class="CardTable">
        <div class="slds-clearfix">
            <div class="slds-float_left slds-p-left_medium">
                <div class="slds-clearfix">
                    <div class="slds-float_left">
                        <lightning-combobox class="combo" name="listviewoptions" value={Selectedcasevalue}
                            placeholder="Select List view" options={caseoptions} onchange={handleChangeCaseListView}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-float_right slds-p-right_medium" style="padding-top:20px;">
                        <a href="#" onclick={downloadCSVFile}>
                            <img src={StaticIcon} sizes="xx-small" class="slds-p-right_medium"
                                style="height: 15px; margin-left: 35px; padding-right: 8px;" />
                        </a>
                        <input onclick={downloadCSVFile} type="button" name="caseExportBtn" class="attExBtn"
                            value="Case List Export"></input>
                    </div>
                </div>
            </div>
            <div if:true={showLoadingSpinner}>
                <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
            </div>
            <div class="slds-float_right slds-p-right_medium msearchBox slds-p-left_medium">
                <lightning-input type="search" onchange={handleKeyChangeSearch} class="slds-m-bottom_small caseSearch"
                    placeholder="Search Cases" maxlength="70">
                </lightning-input>
            </div>
        </div>
        <template if:true={ShowCseTable}>
            <template if:true={showTable}>
                <div class="myTable" style="margin-left: 17px; margin-bottom: 15px; ">
                    <lightning-datatable key-field="Id" data={paginatedCases}  columns={columnsResult}
                        hide-checkbox-column="true" column-widths-mode="auto" max-column-width="600"
                        onrowaction={handleRowAction} class="myTableList" sorted-by={sortBy}
                        sorted-direction={sortDirection} onsort={handleSorting}>
                    </lightning-datatable>
                    <template if:false={isrefreshPageination}>
                        <div style="padding-top: 10px;">
                            <c-core_-i-p-s_-paginator_-l-w-c records={recordsToDisplay}
                                total-records={recordsToDisplay.length} show-search-box="true"
                                onpaginatorchange={handleCasePaginatorChange}>
                            </c-core_-i-p-s_-paginator_-l-w-c>
                        </div>
                    </template>
                    <template if:true={isrefreshPageination}>
                        <c-core_-i-p-s_-paginator_-l-w-c records={recordsToDisplay}
                            total-records={recordsToDisplay.length} show-search-box="true"
                            onpaginatorchange={handleCasePaginatorChange}>
                        </c-core_-i-p-s_-paginator_-l-w-c>
                    </template>
                </div>
            </template>
        </template>
        <template if:false={ShowCseTable}>
            <div class="slds-p-left_medium">
                <h2 style="font-size: 16px; margin: 80px 0; text-align: center; font-weight:700;"> No Case Records to
                    show</h2>
            </div>
        </template>
    </div>
    <template if:true={isSpinner}>
        <c-core_-i-p-s_-spinner-utility></c-core_-i-p-s_-spinner-utility>
    </template>
</template>
