<template>
    <template if:true={order.data}>
        <lightning-record-edit-form object-api-name="Order" record-id={recordId} onload={handleOnLoad}>
        <template if:true={showModal}>
        <header class="slds-modal__header">
        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{label.SalesPricebookHTML}</h2>
        </header>
        <div class="slds-m-around_medium">
        <!--Change Pricebook Confirmation-->
        <p class="slds-p-horizontal_small" title="Section Title">{label.SalesPricebookErrHTML}</p>
        <div class="slds-grid slds-wrap">
        <div class="slds-size_1-of-1 slds-p-around_medium">
        <lightning-input-field field-name='Pricebook2Id' onchange={handleChange} required="true" ></lightning-input-field> 
        </div>
        </div>
        <!-- Modal Footer start-->
        <footer class="slds-modal__footer">
        <lightning-button variant="brand" label="Submit" title="Submit" onclick={handleYes} class="slds-m-left_x-small"></lightning-button>
        <lightning-button variant="neutral" label="Cancel" title="Cancel" onclick={handleNo} class="slds-m-left_x-small"></lightning-button>
        </footer>
        </div>
        </template>
        </lightning-record-edit-form>
    </template>

    <template if:true={order.error}>
        {order.error}
    </template>
</template>
