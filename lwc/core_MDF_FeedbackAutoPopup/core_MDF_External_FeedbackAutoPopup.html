<!-- feedback.html -->
<template>
    <div class="toastMessage.forceActionsText"></div>
    <!--<div class="feedback-bar">
        <div class="feedback-link" onclick={openFeedbackPopup}>{submitFeedback}</div>
    </div>-->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container" style="width:30%">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title={closeButton} onclick={closeFeedbackPopup}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">{closeButton}</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate"> {submitFeedback}
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div style="max-height:2000px">
                        <template if:true={isQuestionAvailable}>  
                        <template for:each={questionSets} for:item="item">
                            <div class="slds-p-around_medium" key={item.quesOrder}>
                                <label class="slds-form-element__label" style="color:#000000; font-size: medium;"> {item.label}</label>
                                        <br></br>
                                        <div class="slds-grid slds-wrap" style="padding-left: 7%;">
                                            <template for:each={item.radioBtn} for:item="radioBtn">
                                                <div key={radioBtn.Id} class="slds-col slds-size_1-of-5">
                                                <input key={radioBtn.id} type="radio" id={radioBtn.id} name={item.label}
                                                    value={radioBtn.value} data-id={item.quesId} onchange={rating} />
                                                </div>
                                            </template>
                                        </div>
                                    <p style="float:left; padding:inherit;">{stronglyDisagree}</p>
                                    <p style="float:right; padding:inherit;padding-inline: 8%;">{stronglyAgree}</p>
                               <br>
                            </div>
                        </template>

                        <br>
                        <label class="slds-form-element__label" style="padding-left:16px; font-size: medium; color:#000000"> {additionalComments}</label>
                        <br></br>
                            <div style="padding-left:30px">
                                <textarea id="OptionalFeedback" name="OptionalFeedback" rows="2" cols="73"
                                    placeholder={optionalFeedback} onchange={rating}></textarea>
                            </div>
                    </template>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <div class="slds-grid slds-grid_align-center">

                    <button class="slds-button slds-button_neutral" onclick={closeFeedbackPopup} title={cancelButton}>{cancelButton}</button>
                    <button class="slds-button slds-button_brand" disabled={isSubmitDisabled} onclick={submitAction} title={submitButton}>{submitButton}</button>
                </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
