<template>
    <div class="slds-p-bottom_xx-small">
        <div class="slds-clearfix">
            <div class="slds-float_right">
    <lightning-button label={label} title={label} onclick={handleClick} class="slds-m-left_x-small"></lightning-button>
    </div>
    </div>
    </div>
    <template if:true={showCaseDescriptionfields}>
    <lightning-accordion active-section-name = "Case Description Information" allow-multiple-sections-open>
        <lightning-accordion-section name="Case Description Information"
             label="Case Description Information" id ="CaseDescription">
             <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={caseDescriptionfields}
                 columns="1" mode="view">
             </lightning-record-form>
         </lightning-accordion-section> 
         </lightning-accordion>
         </template>
    <lightning-accordion active-section-name={activeSections} allow-multiple-sections-open>
      <!-- <lightning-accordion-section if:true={showCaseDescriptionfields} name="Case Description Information"
            label="Case Description Information" id ="CaseDescription">
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={caseDescriptionfields}
                columns="1" mode="view">
            </lightning-record-form>
        </lightning-accordion-section> -->
        <lightning-accordion-section if:true={showCaseDetailsfields} name="Case Detail" label="Case Detail" id ="CaseDetail">
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={caseDetailsfields}
                columns="2" mode="view">
            </lightning-record-form>
        </lightning-accordion-section>
        <lightning-accordion-section if:true={showLifeCyclefields} name="Life Cycle Management"
            label="Life Cycle Management">
            <!--Status And Sub Status-->
            <lightning-layout multiple-rows class="slds-p-around-small">
                <lightning-layout-item class="slds-p-top_xx-small" style="padding-right:40px;" size="12"
                    small-device-size="6" medium-device-size="6" large-device-size="6" padding="">
                    <label class="slds-text-body_small slds-p-left_xx-small">Status</label><br />
                    <div class="slds-border_bottom" style="padding-bottom:3px;">
                        <lightning-formatted-text class="slds-p-left_xx-small" value={status}>
                        </lightning-formatted-text>&nbsp;&nbsp;
                        <template if:false ={hideStatus}>
                        <lightning-button-icon class="slds-float_right icon-class"
                            style="margin-right:-15px;margin-top:4px;color:#b3b3b3;" icon-name="utility:edit"
                            variant="bare" size="medium" onclick={handlePopup}></lightning-button-icon>
                            </template>
                    </div>
                </lightning-layout-item>
                <lightning-layout-item class="slds-p-top_xx-small" style="padding-right:25px;" size="12"
                    small-device-size="6" medium-device-size="6" large-device-size="6" padding="horizontal-small">
                    <label class="slds-text-body_small slds-p-left_xx-small">Sub Status</label><br />
                    <div class="slds-border_bottom" style="padding-bottom:3px;">
                        <lightning-formatted-text class="slds-p-left_xx-small" value={substatus}>
                        </lightning-formatted-text>
                        <template if:false ={hideSubStatus}>
                        <lightning-button-icon class="slds-float_right icon-class"
                            style="margin-right:-15px;margin-top:4px;color:#b3b3b3;" icon-name="utility:edit"
                            variant="bare" size="medium" onclick={handlePopup}></lightning-button-icon>
                            </template>
                    </div>
                </lightning-layout-item>
            </lightning-layout>
            <!--Status And Sub Status-->
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={lifeCyclefields}
                columns="2" mode="view" onsuccess={handleSuccess}>
            </lightning-record-form>
        </lightning-accordion-section>
        <lightning-accordion-section if:true={showHotCasefields} name="Hot Case Management" label="Hot Case Management">
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={hotCasefields}
                columns="2" mode="view">
            </lightning-record-form>
        </lightning-accordion-section>
        <lightning-accordion-section if:true={showSystemfields} name="System/Integration Information"
            label="System/Integration Information (This section refers to old backend system)">
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={systemfields}
                columns="2" mode="view">
            </lightning-record-form>
        </lightning-accordion-section>
        <lightning-accordion-section if:true={showBackendSystemfields} name="New Backend System"
            label={Core_IPS_BES_Section_Name} >
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={backendSystemfields}
                columns="2" mode="view">
            </lightning-record-form>
        </lightning-accordion-section>
        <lightning-accordion-section if:true={showServiceLevelfields} name="Case Service Level"
            label="Case Service Level">
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={serviceLevelfields}
                columns="2" mode="view">
            </lightning-record-form>
        </lightning-accordion-section>
        <lightning-accordion-section if:true={showAdditionalfields} name="Additional Information"
            label="Additional Information">
            <lightning-record-form record-id={recordId} object-api-name={objectApiName} fields={additionalfields}
                columns="2" mode="view">
            </lightning-record-form>
        </lightning-accordion-section>
    </lightning-accordion>

    <!--Modal PopUp-->
    <template if:true={isShowModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <template if:true={spinner}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
            <div class="slds-modal__container">
                <!-- modal header start -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={hideModalBox}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Dependent Fields</h2>
                </header>

                <!-- modal body start -->
                <div class="container">
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1" style="overflow: visible">
                    <template if:false={hideStatus}>
                    <lightning-combobox name="Status" label="Status" value={status} placeholder="Select Progress"
                        options={options} onchange={handleChange} required ="true"></lightning-combobox>
                    </template>
                    <template if:false={hideSubStatus}>
                    <lightning-combobox name="Sub Status" class="substatusvalidation" label="Sub Status" value={substatus}
                        placeholder="Select Progress" options={subStatusOpt} disabled={disableSubStatus}
                        onchange={handleChange} required ="true"></lightning-combobox>
                    </template>
                </div>
                </div>
                <!-- modal footer start-->
               <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={saveMethod}>Save</button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!-- modal end -->
    <!--Modal PopUp-->

</template>
