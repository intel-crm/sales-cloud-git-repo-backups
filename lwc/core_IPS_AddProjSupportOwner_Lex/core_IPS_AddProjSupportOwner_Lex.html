<template>
    <div class="slds-is-relative"><div if:true={spinner}></div></div>
    <div if:false={spinner}>
        <template if:true={updateProj}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_large">
                <div class="slds-modal__container" style="width:100%!important">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon" onclick={handleCancel}>
                        <lightning-icon icon-name="utility:close" alternative-text="close"  size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                <div class="slds-modal__header" > 
                    <lightning-record-view-form record-id={recordId} object-api-name="Core_IPS_Project__c">
                       <lightning-output-field field-name="Name"></lightning-output-field>
                    </lightning-record-view-form>
                   </div> 
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <header class="slds-text-heading--small slds-align--absolute-center header" style="margin:0 30px;">
                       <b><h4>Select Intel Support Owner</h4></b>
                    </header>
                    
                <div class="slds-grid slds-wrap slds-grid--vertical-align-center" style="padding:0 30px;">
                        &nbsp;<p>Enter Search Text</p>&nbsp;<lightning-helptext content="Search by user name or email"></lightning-helptext>
                        <div class="slds-size_5-of-12 slds-m-left_x-small">
                            <lightning-input placeholder={placeholder} onchange={handleSearchKeyISO} data-name="searchTextISO"></lightning-input>
                        </div>
                        <lightning-button label="Search" onclick={handleSearchISO} class="slds-m-left_x-small slds-align-bottom"></lightning-button>
                        <lightning-button label="Reset" onclick={handleResetISO} class="slds-m-left_x-small slds-align-bottom"></lightning-button>
                </div><br/>
                <div style="padding:0 30px;">
                    <lightning-datatable
                       key-field="id"
                       columns={columns}
                       data={intelOwnerData}
                       max-row-selection="1"
                       onrowselection={getSelectedIntelOwner}>
                    </lightning-datatable>
                </div><br/>
                <header class="slds-text-heading--small slds-align--absolute-center header" style="margin:0 30px;">
                     <b><h4>Select Partner Support Owner</h4></b>
                </header>
                <div class="slds-grid slds-wrap slds-grid--vertical-align-center " style="padding:0 30px;">
                    &nbsp;<p>Enter Search Text</p>&nbsp;<lightning-helptext content="Search by user name or email"></lightning-helptext>
                    <div class="slds-size_5-of-12 slds-m-left_x-small">
                        <lightning-input placeholder={placeholder} onchange={handleSearchKeyPSO} data-name="searchTextPSO" ></lightning-input>
                    </div>
                    <lightning-button label="Search" onclick={handleSearchPSO} class="slds-m-left_x-small slds-align-bottom"></lightning-button>
                    <lightning-button label="Reset" onclick={handleResetPSO} class="slds-m-left_x-small slds-align-bottom"></lightning-button>
               </div><br/>   
               <div style="padding:0 30px;">
                    <lightning-datatable
                       key-field="id"
                       columns={columns}
                       data={partnerOwnerData}
                       max-row-selection="1"
                       onrowselection={getSelectedPartnerOwner}>
                   </lightning-datatable>
                </div><br/></div>
                <div class="slds-modal__footer">
                <div align="center">
                    <lightning-button label="Save" variant="brand" onclick={handleSave} class="slds-m-left_x-small"></lightning-button>
                    <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-left_x-small"></lightning-button><br/>
                </div>  </div></div>
            </section>
            <!--<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>-->
       </template> 
    <template if:false={updateProj}>
            <div align="center" class="error">
                &nbsp;&nbsp;&nbsp;<lightning-card title={projAccessError}></lightning-card><br/>
                <lightning-button label="Go Back" onclick={handleCancel} class="slds-m-left_x-small"></lightning-button><br/><br/>
            </div>
    </template></div>
</template>
