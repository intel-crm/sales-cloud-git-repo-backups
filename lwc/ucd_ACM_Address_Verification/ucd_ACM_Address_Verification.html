<template>
    <div class="slds-p-around_medium verify-container">
        <template if:true={loaded}>
            <div class="slds-is-relative slds-p-vertical_large">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>
        <template if:true={showContent}>
            <template if:true={hasCleansedAddress}>
                <div class="slds-m-bottom_small slds-text-align_center slds-text-color_weak">
                    Click an address to select it, then click Proceed
                </div>
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-2">
                        <div class={cleansedBoxClass} data-option="cleansed" onclick={handleAddressBoxClick}
                            style="height: 100%; cursor: pointer;">
                            <div class="slds-text-title_caps slds-text-color_weak slds-m-bottom_small">
                                <b>Loqate Cleansed Address</b>
                            </div>
                            <p style="color:rgb(27, 150, 255)">{cleansedAddress.streetName}</p>
                            <p style="color:rgb(27, 150, 255)">
                                {cleansedAddress.cityName},&nbsp;{cleansedAddress.stateName}&nbsp;{cleansedAddress.postalCode}
                            </p>
                            <p style="color:rgb(27, 150, 255)">{cleansedAddress.countryName}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <div class={userInputBoxClass} data-option="userInput" onclick={handleAddressBoxClick}
                            style="height: 100%; cursor: pointer;">
                            <div class="slds-text-title_caps slds-text-color_weak slds-m-bottom_small">
                                <b>Address As Entered</b>
                            </div>
                            <p>{userEnteredAddress.streetName}</p>
                            <p>
                                {userEnteredAddress.cityName},&nbsp;{userEnteredAddress.stateName}&nbsp;{userEnteredAddress.postalCode}
                            </p>
                            <p>{userEnteredAddress.countryName}</p>
                        </div>
                    </div>
                </div>
            </template>

            <template if:false={hasCleansedAddress}>
                <p style="color:rgb(41, 43, 44);text-align: center; font-weight: bold;">No match found,
                    Please proceed with the entered address for request submission</p>
                <div class="slds-grid slds-gutters slds-wrap slds-grid_align-center slds-m-top_small">
                    <div class="slds-col slds-size_1-of-2">
                        <div class={userInputBoxClass} data-option="userInput" onclick={handleAddressBoxClick}
                            style="height: 100%; cursor: pointer;">
                            <div class="slds-text-title_caps slds-text-color_weak slds-m-bottom_small">
                                <b>Address As Entered</b>
                            </div>
                            <p>{userEnteredAddress.streetName}</p>
                            <p>
                                {userEnteredAddress.cityName},&nbsp;{userEnteredAddress.stateName}&nbsp;{userEnteredAddress.postalCode}
                            </p>
                            <p>{userEnteredAddress.countryName}</p>
                        </div>
                    </div>
                </div>
            </template>

            <div class="slds-m-top_medium slds-grid slds-grid_align-end">
                <lightning-button-group>
                    <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                    <lightning-button variant="brand" label="Proceed" onclick={handleProceed}></lightning-button>
                </lightning-button-group>
            </div>
        </template>
    </div>
</template>
