<template>

    <!-- File Header -->

    <div class="slds-page-header">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <span class="slds-icon_container slds-icon-standard-file" title="Files">
                            <span>
                                <lightning-icon icon-name="standard:file" size="small"
                                    alternative-text="Files"></lightning-icon>
                            </span>
                            <span class="slds-assistive-text slds-page-header__title slds-truncate">Files</span>
                        </span>
                    </div>
                    <div class="slds-media__body">
                        <div class="slds-page-header__name">
                            <div class="slds-page-header__name-title">
                                <h1>
                                    <span class="slds-page-header__title slds-truncate" title="Files">Files
                                        ({filesSize})</span>
                                </h1>
                            </div>
                        </div>
                        <span slot="actions" class="slds-float_right">
                            <!-- <template if:false={showForm}> -->
                            <!-- <lightning-input type="file" label="attachment"  multiple accept={acceptedFormats}
                                    onuploadfinished={handleUploadFinished}></lightning-input> 
                                 -->
                            <!-- <input > -->
                            <lightning-file-upload name="fileUploader" accept={acceptedFormats} record-id={myRecordId}
                                onuploadfinished={handleUploadFinished} multiple>
                            </lightning-file-upload>
                            <!-- </template> -->

                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- <div slot="title">
            Files ({filesSize})
        </div>
        <div slot="actions">
            <lightning-file-upload class="slds-p-top_medium" name="fileUploader" accept={acceptedFormats}
                record-id={myRecordId} onuploadfinished={handleUploadFinished} multiple>
            </lightning-file-upload>
        </div> -->

    <div class="datatable-container">
        <!-- Card Body  -->
        <template lwc:if={openTable}>
            <!-- <div class="slds-p-around_small"> -->
            <!-- <hr class="no-margin"> -->
            <lightning-datatable key-field="id" data={uploadedFiles} columns={columns} show-row-number-column="true"
                hide-checkbox-column onrowaction={handleSelectedRow} onrowselection={handleSelectedRow}>
            </lightning-datatable>
            <!-- </div> -->
        </template>
    </div>
