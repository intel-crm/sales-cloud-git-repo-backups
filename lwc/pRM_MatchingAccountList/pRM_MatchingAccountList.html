<template>
    <div class="custom-card-container slds-card">
        <!-- <div class="slds-var-m-bottom_small"> -->
        <div class="slds-grid slds-grid_align-spread slds-var-p-around_medium custom-title-container">
            <div class="slds-media slds-media_center slds-no-space slds-grow">
                <span>
                    <lightning-icon icon-name="standard:account" size="small" alternative-text="Account"
                        title="Account"></lightning-icon>
                </span>
                <h2 class="cardHeading slds-var-p-left_medium slds-text-heading_medium">Matching Accounts</h2>
            </div>
            <div>
                <!-- Refresh button goes here -->
                <lightning-button variant="Neutral" label="Refresh" title="Refresh" onclick={handleRefresh}>
                </lightning-button>
            </div>
        </div>
        <!-- </div> -->
        <template if:true={showDupAccDetails}> 
            <div class="slds-var-m-top_small">
                <template if:true={accPresent}>
                    <lightning-button variant="brand" label="Reuse Selected Account" title="Reuse"
                        onclick={handleSelectedAcc} class="slds-var-m-left_medium slds-var-m-bottom_small"
                        disabled={reuseAcc}>
                    </lightning-button>
                    <div class="slds-var-m-around_medium">
                        <lightning-datatable key-field="id" data={pagedData} columns={columnsTable} id="accDatatable"
                            onrowselection={handleRowSelection} selected-rows={selectedRows} max-row-selection="1">
                        </lightning-datatable>
                        <lightning-button-group class="pagination-buttons slds-align_absolute-center">
                            <lightning-button label="First" onclick={handleFirst} class="pagination-button"
                                disabled={isOnFirstPage}></lightning-button>
                            <lightning-button label="<<" onclick={handlePrevious} class="pagination-button"
                                disabled={isOnFirstPage}></lightning-button>
                            <div
                                class="pageDetails slds-var-m-left_medium slds-var-m-right_medium slds-var-m-top_xx-small">
                                {pageDetails}</div>
                            <lightning-button label=">>" onclick={handleNext} class="pagination-button"
                                disabled={isOnLastPage}></lightning-button>
                            <lightning-button label="Last" onclick={handleLast} class="pagination-button"
                                disabled={isOnLastPage}></lightning-button>
                        </lightning-button-group>
                    </div>
                </template>
                <template if:true={noAccToShow}>
                    <div class="slds-var-m-around_medium noAccMsg">No Matching Accounts Found</div>
                </template>

                <!-- Show reused Account details -->
                <template if:true={showSpinner}>
                    <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                </template>
                <template if:true={showSelectedAcc}>
                    <div class="slds-var-m-around_medium">
                        <lightning-datatable key-field="Id" data={selectedAccData} columns={columnsTable}
                            hide-checkbox-column>
                        </lightning-datatable>
                    </div>
                    <lightning-layout
                        class="slds-var-m-bottom_large btnAlign slds-var-p-bottom_small slds-align_absolute-center">
                        <lightning-layout-item>
                            <lightning-button variant="brand" label="Confirm" title="Confirm" onclick={handleOnConfirm}
                                class="slds-var-m-left_medium"></lightning-button>
                        </lightning-layout-item>
                        <lightning-layout-item>
                            <lightning-button variant="brand" label="Back" title="Back" onclick={handleOnClose}
                                class="slds-var-m-left_medium"></lightning-button>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>

                <div>
                    <lightning-layout multiple-rows="true">
                        <lightning-layout-item class="slds-var-p-bottom_small slds-size_4-of-12">
                            <lightning-input variant="label-hidden" name="searchInput" type="search"
                                onchange={handleInputChange} placeholder="Key in the Account Id"
                                class="inputError slds-var-p-left_medium">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item class="slds-var-p-bottom_small slds-size_4-of-12">
                            <lightning-button variant="brand" label="Reuse" title="Reuse" onclick={handleReuseAccount}
                                class="slds-var-m-left_medium" disabled={reuseBtnState}></lightning-button>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
                <template if:true={showErrMsg}>
                    <div class="errMsg slds-var-p-bottom_large slds-var-p-left_medium">{errMsg}</div>
                </template>
            </div>
        </template>
    </div>

</template>
