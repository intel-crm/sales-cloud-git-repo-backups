<template>
    <lightning-card>{timeZoneName}</lightning-card>
                            <lightning-card
                             title="Premier Support Project Detail" icon-name="standard:contact">
                            </lightning-card>
                            <lightning-record-edit-form
                                object-api-name={objectApiName}
                                record-id ={recordId}
                                onload    = {handleLoad}
                                onsubmit  = {handleSubmit}
                                onsuccess = {handleSuccess}>
                                <lightning-messages></lightning-messages>
<!--                                 <lightning-input-field field-name="Name" required></lightning-input-field>
 -->                                <lightning-input-field field-name="TimeZoneSidKey" required></lightning-input-field>
                                <div class="slds-var-m-top_medium">
                                    <lightning-button
                                    class="slds-m-bottom_large slds-m-top_large slds-m-right_medium slds-float_right"
                                        variant="brand"
                                        type="submit"
                                        name="Save"
                                        label="Save"
                                    ></lightning-button> &nbsp;&nbsp;&nbsp;
                                        <lightning-button
                                        class="slds-m-bottom_large slds-m-top_large slds-m-right_medium slds-float_right"
                                        variant="neutral"
                                        type="Cancel"
                                        name="Cancel"
                                        label="Cancel"
                                        onclick={handleCancel}
                                    ></lightning-button>
                                  </div>
                            </lightning-record-edit-form>
</template>
