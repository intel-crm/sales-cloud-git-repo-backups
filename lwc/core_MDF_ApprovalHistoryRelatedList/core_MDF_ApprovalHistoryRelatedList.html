<template>
  <template if:true={dataLoaded}>  
      <div class="slds-card borderline borderbtm">
        <header class="slds-media slds-media--center slds-has-flexi-truncate slds-p-around_medium greybg">
          <div class="slds-media__figure stencil slds-avatar slds-avatar_small">
            <lightning-icon class="my-icon" icon-name="standard:approval" size="small"  alternative-text="Indicates approval"></lightning-icon>
          </div>
          <div class="slds-media__body">
            <h2 class="slds-card__header-title">
              {historyHeaderData}&nbsp;({dataLength})
            </h2>
          </div>
        <!-- Button to show all approvers 16852 starts-->
        <div class="slds-no-flex slds-m-left_auto" if:true={shouldShowAllApproversButton}>
          <lightning-button variant="neutral" label={labels.SHOW_ALL_APPROVERS} onclick={handleShowAllApprovers} class="slds-m-left_x-small" disabled={isLoading}></lightning-button>
        </div>
        <!-- Button to show all approvers 16852 ends-->
        </header>

      <!-- Approval Flow Modal 16852 starts-->
      <template if:true={showApprovalFlow}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large approval-flow-modal">
          <div class="slds-modal__container">
            <header class="slds-modal__header">
              <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModal}>
                <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
              </button>
              <h2 class="slds-text-heading_medium slds-hyphenate">{labels.APPROVAL_FLOW}</h2>
            </header>

            <div class="slds-modal__content">
              <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                  <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </div>
              </template>

              <template if:false={isLoading}>
                <div class="approval-flow-container">
                <div class="flow-chart">
                  <!-- Start Node -->
                  <div class="flow-step start-step">
                    <div class="step-box start-box">{labels.START}</div>
                  </div>
                  <!-- Completed Steps -->
                  <template for:each={completedStepGroups} for:item="stepGroup">
                    <div key={stepGroup.uniqueKey} class="flow-step completed-step">
                      <div class="arrow-right"></div>
                      <div class="step-box completed-box">
                        <div class="step-title">{stepGroup.stepName}</div>
                        <div class="step-subtitle">{stepGroup.stepStatus}</div>
                        <div class="approvers-list">
                          <template for:each={stepGroup.approvers} for:item="approver">
                            <div key={approver.key} class="approver-name completed-approver">
                              <div class="approver-name">{approver.assignedApprover}</div>
                              <div class="approver-name">
                                <lightning-icon icon-name="utility:check" size="xx-small" variant="success"></lightning-icon> {approver.actualApprover}
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>
                  <!-- Current Step -->
                  <template if:true={hasCurrentStep}>
                    <div class="flow-step current-step">
                      <div class="arrow-right"></div>
                      <div class="step-box current-box">
                        <div class="step-title">{currentStepName}</div>
                        <div class="step-subtitle">{labels.PENDING}</div>
                        <div class="approvers-list">
                          <template for:each={approvalFlowData.currentStepApprovers} for:item="approver">
                            <div key={approver.name} class="approver-group">
                                  <div class="approver-name">{approver.name}</div>
                              <div class="eligible-approvers-section">
                                <!-- Eligible Approvers for Current Step -->
                                <template if:true={approver.hasEligibleApprovers}>
                                    <div class="eligible-approvers-grid">
                                      <template for:each={approver.eligibleApprovers} for:item="eligible">
                                        <div key={eligible} class="grid-row">
                                          <span class="grid-bullet">•</span>
                                          <span class="grid-approver">{eligible}</span>
                                        </div>
                                      </template>
                                    </div>
                                </template>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
                </div>
              </template>
            </div>
            <footer class="slds-modal__footer">
              <button class="slds-button slds-button_neutral" onclick={closeModal}>{labels.CLOSE}</button>
            </footer>
          </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
      </template>
        <template if:true={dataLength}>
          <div style={setDatatableHeight}>
            <lightning-datatable
                    key-field="id"
                    data={fullDataSet}
                    columns={columns}
                    class = "slds-table_header-fixed_container slds-scrollable_x slds-border_top slds-wordbreak"
                    hide-checkbox-column>
            </lightning-datatable>
          </div> 
        </template> 
    </div>
  </template> 
</template>
