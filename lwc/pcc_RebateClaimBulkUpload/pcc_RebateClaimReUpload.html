<template>
    
    <template if:true={isUpload}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <div>
                    <lightning-button-icon icon-name="utility:close" variant="bare-inverse" onclick={handleCloseModal} alternative-text="close" class="slds-m-bottom_small slds-float_right" title="close"></lightning-button-icon>
                </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                <c-pcc_-rebate-claim-child-bulk-upload partner-acc={accountId} is-partner={isPartner}></c-pcc_-rebate-claim-child-bulk-upload>
            
            </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
    
    <template if:true={recordId}>
            <template if:true={Type}>
                <div class="bg-color-white slds-p-around_medium">
                    <template if:true={loading}>
                        <div class="slds-is-relative">
                            <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                        </div>
                    </template>
                    <template if:false={loading}>
                <template if:true={downloaded}>
                        <div class="text-size border-bottom">
                            <b>Upload Rebate Claim Template</b>
                            <lightning-button-icon class="slds-float_right slds-p-left_x-small" icon-name="utility:chevronleft" tooltip="Click to go back to download processed Rebate Claim Template"  onclick={refresh}></lightning-button-icon>
                        </div>
                        </br>
                        <p> Click the button shown below to upload  the Rebate Claims Template</p>
                        </br>
                        <lightning-button variant="brand" onclick={createRebateClaim} label="Upload Rebate Claim Template"></lightning-button>
                </template>
                <template if:false={downloaded}>
                    
                        <div class="text-size border-bottom">
                            <b>Download Partner uploaded RC Template</b>
                            <lightning-button-icon class="slds-float_right slds-p-left_x-small" icon-name="utility:chevronright"   tooltip="Click to go to Re-upload Rebate Claim Template window"  onclick={refresh}></lightning-button-icon>
                        </div>
                        </br>
                        <p> Click the button shown below to download the processed Rebate Claim Template</p>
                        </br>
                        <lightning-button variant="brand" onclick={downloadBulkuploadTemplateFile} label="Download processed Rebate Claim Template"></lightning-button>
                        
                </template>
                </template>
              </div>
            </template>
        </template>
</template>
