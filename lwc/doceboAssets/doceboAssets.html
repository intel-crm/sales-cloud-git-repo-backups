<template>

    <div class="learning-container">

        <!-- Header -->
        <div class="learning-header">
            <h1>Intel Learning</h1>
        </div>

        <!-- Loading -->
        <template if:true={loading}>

            <div class="loading-container">

                <lightning-spinner
                    alternative-text="Loading courses"
                    size="medium">
                </lightning-spinner>

            </div>

        </template>

        <!-- Error -->
        <template if:true={errorMessage}>

            <div class="error-container">
                {errorMessage}
            </div>

        </template>

        <!-- Courses -->
        <template if:true={hasCourses}>

            <div class="course-count">
                {courseCount} items
            </div>

            <!-- Course Carousel -->
            <div class="course-carousel">

                <!-- Previous -->
                <button
                    class="carousel-button"
                    onclick={handlePrevious}
                    disabled={isFirstPage}
                    title="Previous courses">

                    ‹

                </button>


                <!-- Courses -->
                <div class="course-grid">

                    <template
                        for:each={visibleCourses}
                        for:item="course">

                        <article
                            key={course.id}
                            class="course-card">

                            <!-- Image -->
                            <div
                                class="course-image"
                                data-url={course.fullUrl}
                                onclick={handleCourseClick}>

                                <template if:true={course.hasImage}>

                                    <img
                                        src={course.imageUrl}
                                        alt={course.title} />

                                </template>

                                <template if:false={course.hasImage}>

                                    <div class="image-placeholder">

                                        <span>
                                            Intel Learning
                                        </span>

                                    </div>

                                </template>

                                <template if:true={course.isNew}>

                                    <span class="new-badge">
                                        NEW
                                    </span>

                                </template>

                            </div>


                            <!-- Card Body -->
                            <div class="course-body">

                                <!-- Title -->
                                <a
                                    href="javascript:void(0);"
                                    class="course-title"
                                    data-url={course.fullUrl}
                                    onclick={handleCourseClick}>

                                    {course.title}

                                </a>


                                <!-- Expiration -->
                                <template if:true={course.hasExpiration}>

                                    <div class="expiration">

                                        Expiration:
                                        {course.expirationDisplay}

                                    </div>

                                </template>


                                <!-- Language / Duration -->
                                <template if:true={course.hasLanguage}>

                                    <div class="course-meta">

                                        <span>
                                            {course.languageLabel}
                                        </span>

                                        <template if:true={course.hasDuration}>

                                            <span class="separator">
                                                |
                                            </span>

                                            <span>
                                                {course.durationDisplay}
                                            </span>

                                        </template>

                                    </div>

                                </template>


                                <!-- Views / Rating -->
                                <div class="rating-row">

                                    <template if:true={course.hasViews}>

                                        <span class="views">

                                            {course.views}
                                            views

                                        </span>

                                    </template>


                                    <template if:true={course.hasRating}>

                                        <span class="rating">

                                            <span class="star">
                                                ★
                                            </span>

                                            {course.ratingDisplay}

                                        </span>

                                    </template>

                                </div>


                                <!-- Footer -->
                                <div class="course-footer">

                                    <span class="course-type">

                                        <lightning-icon
                                            icon-name="utility:play"
                                            alternative-text="Type"
                                            size="xx-small">
                                        </lightning-icon>

                                        {course.displayType}

                                    </span>


                                    <template if:true={course.showMenu}>

                                        <button
                                            class="menu-button"
                                            data-id={course.id}
                                            onclick={handleMenuClick}
                                            title="More actions">

                                            ⋮

                                        </button>

                                    </template>

                                </div>

                            </div>

                        </article>

                    </template>

                </div>


                <!-- Next -->
                <button
                    class="carousel-button"
                    onclick={handleNext}
                    disabled={isLastPage}
                    title="Next courses">

                    ›

                </button>

            </div>

        </template>


        <!-- Empty -->
        <template if:true={noCourses}>

            <div class="empty-container">

                No courses found.

            </div>

        </template>

    </div>

</template>
