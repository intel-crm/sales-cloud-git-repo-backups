<template>
    <div>
        <c-core-intc-utilities onscreenchange={handleScreenChange}></c-core-intc-utilities>
        <c-ipa-contact-partner-form></c-ipa-contact-partner-form>

        <div class="topic-card-list-container slds-is-relative" data-hide={hideComponent} data-loading={isFirstLoad}>

            <div class="scroll-to-me"></div>

            <h4 class={classes.heading} data-hide={isFirstLoad}>{dynamicHeading}</h4>

            <div class={classes.noRecordsFoundcss} if:true={noCardsFound}>
                {labels.noCardsFoundMessage}
            </div>

            <div if:true={cardsLoading}>
                <c-ipa-card-list cards={loadingCards} cards-per-row-mobile={CARDS_PER_ROW_MOBILE}
                    cards-per-row-tablet={CARDS_PER_ROW_TABLET} cards-per-row-desktop={CARDS_PER_ROW_DESKTOP}>
                </c-ipa-card-list>
            </div>

            <div if:true={showCards}>
                <c-ipa-card-list cards={cards} cards-per-row-mobile={CARDS_PER_ROW_MOBILE}
                    cards-per-row-tablet={CARDS_PER_ROW_TABLET} cards-per-row-desktop={CARDS_PER_ROW_DESKTOP}>
                </c-ipa-card-list>

                <div class={classes.pagination} data-hide={isFirstLoad}>
                    <div class="topic-card-list-text">
                        {showingResultsText}
                    </div>
                    <div class="topic-card-list-page-numbers" data-page-count={totalPages}>
                        <span role="link" aria-label={labels.previous} tabindex="0" class={prevPageClass}
                            data-page={prevPage} onclick={handlePageChange} onkeydown={handlePageChangeAccessibility}>
                            <span class="fa-angle-left slds-m-left_none"></span>
                            <span class="slds-show_medium slds-m-around_none">{labels.previous}</span>
                        </span>
                        <template for:each={paginationNumbers} for:item="paginationNumber">
                            <span role="link" tabindex="0" aria-label={paginationNumber.page} key={paginationNumber.key}
                                class={paginationNumber.class} onclick={handlePageChange}
                                onkeydown={handlePageChangeAccessibility} data-page={paginationNumber.page}>
                                {paginationNumber.page}
                            </span>
                        </template>
                        <span role="link" aria-label={labels.next} tabindex="0" class={nextPageClass}
                            data-page={nextPage} onclick={handlePageChange} onkeydown={handlePageChangeAccessibility}>
                            <span class="slds-show_medium slds-m-around_none">{labels.next}</span>
                            <span class="fa-angle-right slds-m-right_none"></span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
