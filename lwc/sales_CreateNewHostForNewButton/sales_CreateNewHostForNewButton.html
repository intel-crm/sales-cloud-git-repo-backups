<template>
    <template if:true={isModalOpen}>
     <!--   <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_large">-->
        <div class="slds-modal__container slds-modal slds-fade-in-open slds-modal_large">
            <!-- Modal/Popup Box LWC header here -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close closeIcon slds-button_icon-bare slds-button_icon-inverse"
            title="Close" onclick={handleCancel}>
            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                size="small"></lightning-icon>
            <span class="slds-assistive-text">Close</span>
          </button>
            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Create Computer</h2>
          </header>
      
          <lightning-record-edit-form object-api-name="Sales_Host__c" onload={handleOnLoad} onsuccess={handleSuccess} onsubmit={handleSubmit} onerror={handleError}>
              <div class="slds-modal__content slds-p-around--medium"><!--css for proper footer-->
                  <div data-id="focusOnErrorBannerId">
                      <lightning-messages></lightning-messages>
                  </div>
                    
              <div class="slds-grid slds-wrap">
                  <div class="slds-size_1-of-2 slds-p-around_medium">
                      <lightning-input-field  field-name='Sales_Computer_Name_Txt__c'></lightning-input-field>
                      <br>
                      <div style="display: inline;">
                          <lightning-formatted-text value="License Type" class="slds-form-element__label"></lightning-formatted-text>
                          <abbr title="required" class="slds-float_left slds-required">*</abbr> 
                          <lightning-helptext content="Single User-Fixed/Multiple Users-Float"></lightning-helptext>
                          <lightning-input-field  field-name='Sales_License_Type__c' value={toollicensetype} disabled={validateLicenseType} variant="label-hidden"></lightning-input-field>
                      </div>
  
                      <template if:true={isfloatRecord}>
                          <lightning-input-field  field-name='Sales_Redundant_Server1_Txt__c'></lightning-input-field>
                      </template>
                  
                      <template if:true={isfixedRecord}>
                          <lightning-input-field field-name='Sales_Companion_Server1_Txt__c' label-name= 'Companion Computer ID 1'></lightning-input-field> 
                      </template>
                      
                      <lightning-input-field field-name='Sales_Contact__c' value={getContactValue} disabled={disablePrimaryAdmin} required='true'></lightning-input-field>
                  </div>
  
                  <div class="slds-size_1-of-2 slds-p-around_medium">
                      <lightning-input-field   field-name='Sales_Computer_Type__c' field-level-help='Enter computer type'></lightning-input-field>
                      <p><lightning-icon icon-name="utility:info" size="xx-small"></lightning-icon> &nbsp;
                      <lightning-formatted-url label="How to determine Computer Type?" value="https://www.intel.com/content/www/us/en/programmable/support/support-resources/download/licensing/lic-q2se_licenses.html" target="_blank"></lightning-formatted-url></p>
                      
                      <div style="display: inline;">
                          <lightning-formatted-text value="Primary Computer ID" class="slds-form-element__label"></lightning-formatted-text>
                          <abbr title="required" class="slds-float_left slds-required">*</abbr> 
                          <lightning-helptext content="HOST ID : Eight digit hexadecimal digits--12345678 / NIC ID : 12 hexadecimal digits--123456789101 / GUARD ID (Dongle) : T or S prefix followed by nine digits --T000000001"></lightning-helptext>
                          <lightning-input-field   field-name='Name' variant="label-hidden"></lightning-input-field>
                      </div>
              
                      <template if:true={isfloatRecord}>
                          <lightning-input-field  field-name='Sales_Redundant_Server2_Txt__c'></lightning-input-field>
                      </template>
                      <template if:true={isfixedRecord}>
                          <lightning-input-field  field-name='Sales_Companion_Server2_Txt__c' label= 'Companion Computer ID 2'></lightning-input-field>
                      </template>
                      
                  </div>
              </div>
          </div>
          
  
          <!-- Modal Footer start-->
          <footer class="slds-modal__footer">
              <lightning-button variant="neutral" label="Cancel" title="Cancel" onclick={handleCancel} class="slds-m-left_x-small"></lightning-button>
              <button class="slds-button slds-button_brand slds-m-left_x-small" title="Generate License">Generate License</button>
          </footer>
      
      </lightning-record-edit-form>
  </div>
<!--</section> -->
</template>
  </template>
