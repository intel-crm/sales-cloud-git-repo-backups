<template>

<lightning-record-edit-form object-api-name="Order" record-id={recordId} onload={handleOnLoad} onsubmit={handleSubmit}>
    <template if:true={showModal}>
    <div class="slds-modal__content slds-p-around--medium"><!--css for proper footer-->
<!--Cancel Order Confirmation-->
<header class="slds-modal__header">
<h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{label.SalesCancelOrderHTML}</h2>
</header>
<div class="slds-m-around_medium">
<h3 class="slds-section__title">
<span class="slds-truncate slds-p-horizontal_small" title="Section Title">{label.SalesCancelOrder1HTML}</span>
</h3>
<div class="slds-grid slds-wrap">
<div class="slds-size_1-of-1 slds-p-around_medium">

<template if:true={activatedOrders}>
<lightning-input-field field-name='Sales_Cancelled_Reason_Dsc__c' label='Cancel Reason' onchange={handleCancelReasonChange} required="true" ></lightning-input-field> 
</template>

<template if:false={activatedOrders}>
        <lightning-input-field field-name='Sales_SAP_OrderCancelledReason__c' onchange={handleMetadataReason} required="true"></lightning-input-field>
</template>
<br>
<br>
</div>
</div>
</div>
</div>
<!-- Modal Footer start-->
<footer class="slds-modal__footer">
    <button class="slds-button slds-button_brand">{label.SalesOrderSubmitHTML}</button><!--type="submit"-->
    <lightning-button variant="neutral" label="Cancel" title="Cancel" onclick={handleCancel} class="slds-m-left_x-small"></lightning-button>
</footer>

</template>
</lightning-record-edit-form>
</template>
