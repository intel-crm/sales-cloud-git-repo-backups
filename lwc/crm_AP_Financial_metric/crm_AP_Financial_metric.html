<template>
    <div class="slds-box slds-theme_default" style="overflow: visible;">
      <h2 class="slds-text-heading_medium slds-m-bottom_medium">
        Customer Overview
      </h2>
  
      <!-- Action Buttons -->
      <div class="slds-m-bottom_medium">
        <lightning-button 
          variant="neutral"
          label="Add Metric"
          icon-name="utility:add"
          onclick={handleAddMetric}
          class="slds-m-right_small">
        </lightning-button>
        
        <lightning-button
          label="Save All"
          variant="brand"
          onclick={handleSaveAll}>
        </lightning-button>
      </div>
  
      <!-- Headers -->
      <template if:true={metrics}>
        <div class="slds-scrollable_y" style="max-height: 600px; overflow-y: auto;">
          <div class="slds-grid slds-grid_vertical-align-center slds-text-title_caps slds-p-horizontal_small slds-m-bottom_x-small" style="font-weight: 600;">
            <div class="slds-col slds-size_2-of-12">Fiscal Year</div>
            <div class="slds-col slds-size_3-of-12">Metric Type</div>
            <div class="slds-col slds-size_5-of-12">Value</div>
            <div class="slds-col slds-size_1-of-12"></div>
          </div>
  
          <!-- Metric Rows -->
          <template for:each={metrics} for:item="metric" for:index="index">
            <div key={metric.Id} class="slds-box slds-p-around_medium slds-m-bottom_small slds-theme_shade" style="overflow: visible;">
              <div class="slds-grid slds-wrap slds-gutters slds-align_absolute-center">
  
                <!-- Fiscal Year -->
                <div class="slds-col slds-size_12-of-12 slds-medium-size_2-of-12">
                  <lightning-combobox
                    value={metric.CRM_Fiscal_Year__c}
                    options={fiscalYearOptions}
                    data-index={index}
                    data-field="CRM_Fiscal_Year__c"
                    onchange={handleFieldChange}
                    placeholder="Select Year"
                    label="Fiscal Year">
                  </lightning-combobox>
                </div>
  
                <!-- Metric Type -->
                <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12">
                  <lightning-combobox
                    value={metric.CRM_Metric_Type__c}
                    options={metricTypeOptions}
                    data-index={index}
                    data-field="CRM_Metric_Type__c"
                    onchange={handleFieldChange}
                    placeholder="Select Type"
                    label="Metric Type">
                  </lightning-combobox>
                </div>
  
                <!-- Value / Percentage -->
                <template if:true={metric.isGrossMargin}>
                  <div class="slds-col slds-size_12-of-12 slds-medium-size_5-of-12">
                    <lightning-input
                      type="number"
                      value={metric.CRM_Percentage__c}
                      data-index={index}
                      data-field="CRM_Percentage__c"
                      onchange={handleFieldChange}
                      label="Percentage"
                      placeholder="Enter %">
                    </lightning-input>
                  </div>
                </template>
                <template if:false={metric.isGrossMargin}>
                  <div class="slds-col slds-size_12-of-12 slds-medium-size_5-of-12">
                    <lightning-input
                      type="number"
                      formatter="currency"
                      value={metric.CRM_Metric_Value__c}
                      data-index={index}
                      data-field="CRM_Metric_Value__c"
                      onchange={handleFieldChange}
                      label="Value"
                      placeholder="Enter Value">
                    </lightning-input>
                  </div>
                </template>
  
                <!-- Delete Icon -->
                <div class="slds-col slds-size_12-of-12 slds-medium-size_1-of-12 slds-align-top">
                  <lightning-button-icon
                    icon-name="utility:delete"
                    alternative-text="Remove"
                    title="Remove Metric"
                    data-index={index}
                    onclick={handleDeleteMetric}
                    class="slds-m-top_large">
                  </lightning-button-icon>
                </div>
  
              </div>
            </div>
          </template>
        </div>
      </template>
  
      <!-- Empty State -->
      <template if:false={metrics}>
        <p class="slds-text-body_regular slds-m-top_medium">No metrics added yet.</p>
      </template>
    </div>
  </template>
