<template>
    <div class="slds-m-top_medium">
        <lightning-card title={lightningCardTitle} >
            <template if:true={enableSearchAndInsertRecFeature}>
                <div class="slds-align_absolute-center">
                    <template if:true={isLookupQueryPresent}>
                        <c-custom-lookup 
                            onselectedrec={handleSelectRecordChange} 
                            iconname={lookupIconName}
                            searchfield-name={lookupSearchFieldApiName}
                            query-string={lookupSearchQueryString}>
                        </c-custom-lookup>
                    </template>
                    <lightning-button disabled={isInsertBtnDisabled} variant="brand" label={insertBtnLabel} class="slds-m-left_medium" title={insertBtnLabel} onclick={insertRecord}></lightning-button>
                </div>
            </template>

            <template if:true={isDataAvailable}>
                    <c-datatable-utility 
                        hide-checkbox-column={hideCheckboxColumn} 
                        show-row-number-column={showRowNumberColumn}
                        enable-infinite-loading={enableInfiniteLoading}
                        num-and-checkbox-both-cols={numAndCheckboxBothCols}
                        normal-data-table={normalDataTable}
                        records={records}
                        columns={columns}
                        number-of-rows-to-show={numberOfRowsToShow}
                        height-in-rem={heightInRem}>
                    </c-datatable-utility>
            </template>
        </lightning-card>
    </div>
</template>
