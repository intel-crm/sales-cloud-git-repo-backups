    <c-core-intc-utilities onscreenchange={handleScreenChange}></c-core-intc-utilities>
    <h2 class="slds-m-bottom_x-small">{label.manageBenefits}</h2>
    <p><lightning-formatted-rich-text value={_description}></lightning-formatted-rich-text></p>

    <div class="slds-clearfix">

         <lightning-formatted-url class="link-text" value={dashboardUrl} label={label.renewalLink} target="_blank" ></lightning-formatted-url>
         <a class="link-text" href={dashboardUrl} target="_blank" >{label.renewalLink}</a>
        </div>
    </div>
    </template> --> 
    <!-- IPA2.0 TWC727-3135 -->
    <div class="benefits-list">
        <template for:each={benefitsMobileShow} for:item="benefit">
            <c-ipa-benefit-card
    benefit={benefit}
    docebo-data={doceboData}
    key={benefit.id}>
</c-ipa-benefit-card>

        <div class={classes.mobileContainerClass}>

                <c-ipa-benefit-card benefit={benefit} docebo-data={doceboData} key={benefit.id}></c-ipa-benefit-card>
            </template>
        </div>
        <div class={classes.showMoreMobile}>

                    <lightning-icon icon-name="utility:chevrondown" size="xx-small"></lightning-icon>
                    <a href="javascript:void(0);" class="view-expand-all" onclick={handleShowMore} >

            </div>

    </div>
