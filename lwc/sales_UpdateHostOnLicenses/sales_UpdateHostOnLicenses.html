<template>
    <lightning-card>
        <div class="slds-page-header">
            <lightning-layout horizontal-align="center">
            <h1 class="slds-text-heading--label"><b>Bulk Update on License</b></h1>
        </lightning-layout>
        </div>
        
        <div class="demo-only demo-only--sizing slds-grid slds-wrap">
            <div class="slds-size_1-of-3">
               
            </div>
            <div class="slds-size_2-of-3">
        <div class={dynamiClassname} data-id="resultBox" aria-expanded="false" aria-haspopup="listbox" role="combobox" >
            <div class="slds-form-element__control slds-input-has-icon  slds-input-has-icon_right" role="none">
        
            
            <lightning-layout-item padding="horizontal-small" size="6" >
            <lightning-input type="search" required="true" style="width:50%;" data-id="hostinput" label="Select Primary Computer ID" value={valueselected} name="searchHost"  onchange={searchHost}   field-level-help="Enter few characters of Primary Computer ID"  placeholder="Search by hostId or Primary Computer ID">
            </lightning-input>
        </lightning-layout-item>
    
    
        <div id="listbox-id-1" class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                <template for:each={hostList} for:item="serecord">
                    <li role="presentation" class="slds-listbox__item" key={serecord.recId}>
    
                        <div data-id={serecord.Id} data-name={serecord.Name} onclick={setSelectedRecord}  class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" role="option">
                            <div class="slds-media slds-media_center">
                            <span class="slds-media__figure">
                                <span class="slds-icon_container slds-icon-standard-user">
                                    <lightning-icon icon-name="standard:user" ></lightning-icon>
                                </span>
                            </span>
    
                            <span class="slds-media__body">
                                <span class="slds-listbox__option-text slds-listbox__option-text_entity">{serecord.Name}</span>
                            </span>
                        </div>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
    </div>
    </div>
        <div if:true={messageFlag}>
            No result found.
        </div>
        <div if:true={LoadingText}>
            Loading...
        </div>
            </div>
        </div>
        <lightning-layout horizontal-align="center">
            <lightning-layout-item padding="horizontal-small" >
                <lightning-button icon-name="utility:download" 
                                  label="Get Records" 
                                  title="Get Records"
                                  onclick={getRecords} variant="brand" disabled={disableResultButton}></lightning-button>
            </lightning-layout-item>
        </lightning-layout>
        <lightning-layout-item   padding="horizontal-medium">
            <template if:true={showtable}>
            <div>    
             <div class=" slds-scrollable slds-border_top slds-border_right slds-border_bottom slds-border_left"  style="height: 150px;">
                <lightning-datatable
                key-field="Id"
                data={data}
                columns={columnnames}
                onrowselection={rowSelection}>
            </lightning-datatable>
            
         </div>
         </div>  
        </template> 
         </lightning-layout-item>
         <div class="demo-only demo-only--sizing slds-grid slds-wrap">
            <div class="slds-size_1-of-3">
               
            </div>
            <div class="slds-size_2-of-3">
        
                <div class={dynamiClassnamenew} data-id="resultBox" aria-expanded="false" aria-haspopup="listbox" role="combobox" >
                    <div class="slds-form-element__control slds-input-has-icon  slds-input-has-icon_right" role="none">
                
                <lightning-layout-item padding="horizontal-small" size="6" >
                    <lightning-input type="search" required="true" style="width:50%;" data-id="hostinputnew" label="Select New Primary Computer Id for Update" value={valueselectedNew} name="searchNewHost"  onchange={searchHostNew}  field-level-help="Enter few characters of Primary Computer ID"  placeholder="Search by HostId or Primary Computer ID ">
                    </lightning-input>
                </lightning-layout-item>
                
                
                        <div id="listbox-id-2" class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                <template for:each={newHostList} for:item="serecord">
                                    <li role="presentation" class="slds-listbox__item" key={serecord.recId}>
                
                                        <div data-id={serecord.Id} data-name={serecord.Name} onclick={setSelectedRecordNew}  class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" role="option">
                                            <div class="slds-media slds-media_center">
                                            <span class="slds-media__figure">
                                                <span class="slds-icon_container slds-icon-standard-user">
                                                    <lightning-icon icon-name="standard:user" ></lightning-icon>
                                                </span>
                                            </span>
                
                                            <span class="slds-media__body">
                                                <span class="slds-listbox__option-text slds-listbox__option-text_entity">{serecord.Name}</span>
                                            </span>
                                        </div>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </div>
                </div>
                </div>
                <div if:true={messageFlagNew}>
                    No result found.
                </div>
                <div if:true={LoadingTextNew}>
                    Loading...
                </div>
                </div> 
                </div>
        
        <lightning-layout horizontal-align="center">
            <lightning-layout-item padding="horizontal-small" >
                <lightning-button icon-name="utility:download" 
                                  label="Update License" 
                                  title="Update License"
                                  onclick={getUpdateRecords} variant="brand" ></lightning-button>
            </lightning-layout-item>
        </lightning-layout>
            <lightning-layout-item   padding="horizontal-medium">
                <template if:true={showModel}>
                <div>    
                 <div class=" slds-scrollable slds-border_top slds-border_right slds-border_bottom slds-border_left"  style="height: 150px;">
                    <lightning-datatable
                    key-field="Id"
                    data={data1}
                    columns={columnnames1}
                    hide-checkbox-column="true">
                </lightning-datatable>
                
             </div>
             </div>  
            </template > 
             </lightning-layout-item>
        
            
</lightning-card>
</template>
