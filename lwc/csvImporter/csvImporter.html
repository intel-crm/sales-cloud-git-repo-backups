<template>
    <lightning-card title="CSV Importer">
        <div class="slds-p-around_medium">

            <!-- Progress -->
            <lightning-progress-indicator
                current-step={currentStep}
                type="base">
                <lightning-progress-step
                    label="Upload File"
                    value="1">
                </lightning-progress-step>
                <lightning-progress-step
                    label="Map Columns"
                    value="2">
                </lightning-progress-step>
                <lightning-progress-step
                    label="Results"
                    value="3">
                </lightning-progress-step>
            </lightning-progress-indicator>

            <!-- Spinner -->
            <template lwc:if={isLoading}>
                <div class="slds-m-top_medium
                            slds-align_absolute-center">
                    <lightning-spinner
                        alternative-text="Processing..."
                        size="medium">
                    </lightning-spinner>
                    <p class="slds-m-top_small
                               slds-text-color_weak
                               slds-text-align_center">
                        {loadingMessage}
                    </p>
                </div>
            </template>

            <!-- Error -->
            <template lwc:if={errorMessage}>
                <div class="slds-box
                            slds-theme_error
                            slds-m-top_medium">
                    <p>❌ {errorMessage}</p>
                    <div class="slds-m-top_small">
                        <lightning-button
                            label="Try Again"
                            onclick={handleRestart}>
                        </lightning-button>
                    </div>
                </div>
            </template>

            <!-- ==================== -->
            <!-- STEP 1 : UPLOAD FILE -->
            <!-- ==================== -->
            <template lwc:elseif={isStep1}>
                <div class="slds-m-top_medium">

                    <template lwc:if={isUploaded}>
                        <div class="slds-box">
                            <p>✅
                                <strong>
                                    {fileName}
                                </strong>
                                uploaded successfully
                            </p>
                            <p class="slds-text-color_weak
                                       slds-m-top_x-small">
                                Processing...
                            </p>
                        </div>
                    </template>

                    <template lwc:else>
                        <lightning-file-upload
                            label="Upload CSV File"
                            name="csvImporterUpload"
                            accept=".csv"
                            record-id={recordId}
                            onuploadfinished={handleUploadFinished}>
                        </lightning-file-upload>
                        <p class="slds-text-color_weak
                                   slds-m-top_small">
                            CSV must contain a
                            <strong>Company Name</strong>
                            and
                            <strong>Product</strong>
                            column.
                        </p>
                    </template>

                </div>
            </template>

            <!-- ===================== -->
            <!-- STEP 2 : MAP COLUMNS  -->
            <!-- ===================== -->
            <template lwc:elseif={isStep2}>
                <div class="slds-m-top_medium">

                    <div class="slds-box
                                slds-m-bottom_medium">
                        <p class="slds-text-heading_small">
                            🔄 Map Your Columns
                        </p>
                        <p class="slds-text-color_weak
                                   slds-m-top_small">
                            Select which column in your
                            CSV maps to Company Name
                            and Product.
                        </p>
                    </div>

                    <!-- Company Name Row -->
                    <div class="slds-grid
                                slds-gutters
                                slds-m-bottom_small
                                slds-grid_vertical-align-center">
                        <div class="slds-col
                                    slds-size_1-of-3">
                            <span>
                                <abbr title="Required"
                                      class="slds-required">
                                    *
                                </abbr>
                                Company Name
                            </span>
                        </div>
                        <div class="slds-col
                                    slds-size_1-of-6
                                    slds-text-align_center">
                            →
                        </div>
                        <div class="slds-col
                                    slds-size_1-of-2">
                            <lightning-combobox
                                name="company_name"
                                label="Company Name"
                                variant="label-hidden"
                                value={companyNameValue}
                                placeholder="Select column..."
                                options={columnOptions}
                                onchange={handleMappingChange}>
                            </lightning-combobox>
                        </div>
                    </div>

                    <!-- Product Row -->
                    <div class="slds-grid
                                slds-gutters
                                slds-m-bottom_small
                                slds-grid_vertical-align-center">
                        <div class="slds-col
                                    slds-size_1-of-3">
                            <span>
                                <abbr title="Required"
                                      class="slds-required">
                                    *
                                </abbr>
                                Product
                            </span>
                        </div>
                        <div class="slds-col
                                    slds-size_1-of-6
                                    slds-text-align_center">
                            →
                        </div>
                        <div class="slds-col
                                    slds-size_1-of-2">
                            <lightning-combobox
                                name="product"
                                label="Product"
                                variant="label-hidden"
                                value={productValue}
                                placeholder="Select column..."
                                options={columnOptions}
                                onchange={handleMappingChange}>
                            </lightning-combobox>
                        </div>
                    </div>

                    <!-- Mapping Error -->
                    <template lwc:if={mappingError}>
                        <p class="slds-text-color_error
                                   slds-m-top_small">
                            ⚠️ {mappingError}
                        </p>
                    </template>

                    <!-- Confirm Button -->
                    <div class="slds-m-top_medium">
                        <lightning-button
                            variant="brand"
                            label="Confirm Mapping"
                            onclick={handleConfirmMapping}>
                        </lightning-button>
                    </div>

                </div>
            </template>

            <!-- ==================== -->
            <!-- STEP 3 : RESULTS     -->
            <!-- ==================== -->
            <template lwc:elseif={isStep3}>
                <div class="slds-m-top_medium">

                    <!-- Banner: all matched vs warnings -->
                    <template lwc:if={allMatched}>
                        <div class="slds-box
                                    slds-theme_success
                                    slds-m-bottom_medium">
                            <p class="slds-text-heading_small">
                                ✅ Import Complete
                            </p>
                        </div>
                    </template>

                    <template lwc:else>
                        <div class="slds-box
                                    slds-theme_warning
                                    slds-m-bottom_medium">
                            <p class="slds-text-heading_small">
                                ⚠️ Import Complete
                                with Warnings
                            </p>
                        </div>
                    </template>

                    <!-- Summary -->
                    <div class="slds-box
                                slds-m-bottom_medium">
                        <p class="slds-text-heading_small
                                   slds-m-bottom_small">
                            📊 Summary
                        </p>
                        <p>Total Rows:
                            <strong>{totalRows}</strong>
                        </p>
                        <p>Tasks Created:
                            <strong>{tasksCreated}</strong>
                        </p>
                        <p>Companies Not Found:
                            <strong>{notFoundCount}</strong>
                        </p>
                    </div>

                    <!-- Unmatched List -->
                    <template lwc:if={hasUnmatched}>
                        <div class="slds-box
                                    slds-theme_warning
                                    slds-m-bottom_medium">
                            <p class="slds-text-heading_small
                                       slds-m-bottom_small">
                                ⚠️ Companies Not Found
                                ({notFoundCount})
                            </p>
                            <p class="slds-text-color_weak
                                       slds-m-bottom_small">
                                The following could not
                                be matched to a
                                Salesforce Account:
                            </p>
                            <pre class="not-found-list">{notFoundListString}</pre>
                        </div>
                    </template>

                    <!-- All Matched -->
                    <template lwc:if={allMatched}>
                        <div class="slds-box
                                    slds-theme_success
                                    slds-m-bottom_medium">
                            <p>🎉 All companies matched
                                successfully.
                            </p>
                        </div>
                    </template>

                    <!-- Restart -->
                    <div class="slds-m-top_medium">
                        <lightning-button
                            label="Import Another File"
                            onclick={handleRestart}>
                        </lightning-button>
                    </div>

                </div>
            </template>

        </div>
    </lightning-card>
</template>
