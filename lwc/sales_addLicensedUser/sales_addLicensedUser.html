<template>
  <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
      <div class="slds-modal__container">
         <!-- modal header start -->
         <header class="slds-modal__header">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={navigateToObjectHome}>
               <lightning-icon icon-name="utility:close"
                  alternative-text="close"
                  variant="inverse"
                  size="small" ></lightning-icon>
               <span class="slds-assistive-text">Close</span>
            </button>
            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Add Licensed User</h2>
         </header>
         <!-- modal body start -->
          <div class="slds-modal__content slds-p-around_medium">
              <lightning-record-edit-form object-api-name="Contact" onsuccess={handleSuccess} onsubmit={handleSubmit} onerror={handleError}>
                  <!--<div class="slds-modal__content slds-p-around_medium" style="height: 300px;">--> 
                    <div data-id="focusOnErrorBannerId">
                      <lightning-messages></lightning-messages>
                    </div>
                      
                    <!--Order Information Section-->
                      <h3 class="slds-section__title slds-theme_shade">
                          <span class="slds-truncate slds-p-horizontal_small" title="Section Title">Add Licensed User</span>
                      </h3>
                      
                      <div class="slds-grid slds-wrap">
                          <!--<div class="slds-size_1-of-2 slds-p-around_medium">-->
                              <lightning-input-field field-name='FirstName'></lightning-input-field>
                              <lightning-input-field field-name='LastName' required="true"></lightning-input-field>
                              <lightning-input-field field-name='Email' required="true"></lightning-input-field>
                              <lightning-output-field field-name='AccountId' required="true"></lightning-output-field>
                              
                        <!--  </div>-->
                        </div>
                        <!--<template if:true={isAccounthidden}>
                          <lightning-output-field field-name='AccountId' value={accountVal}  required="true"></lightning-output-field>
                        </template>-->

                  <!-- modal footer start-->
                  <footer class="slds-docked-form-footer">
                      <!--<button class="slds-button slds-button_neutral"  onclick={navigateToObjectHome}>Cancel</button>&nbsp;-->
                      <lightning-button label="Cancel" title="Cancel" onclick={navigateToObjectHome} class="slds-m-left_x-small"></lightning-button>
                      <button class="slds-button slds-button_brand"  type="submit">Save</button>                      
                  </footer>
              </lightning-record-edit-form>
          </div>
      </div>
  </section>
 <!--<div class="slds-backdrop slds-backdrop_open"></div>-->
</template>
