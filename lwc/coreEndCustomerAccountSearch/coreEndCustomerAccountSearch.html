<template>
    <lightning-card
        title="Select Intel End Customer Account"
        icon-name="standard:account">

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <template if:true={isLoading}>
                <lightning-spinner
                    alternative-text="Loading"
                    size="small">
                </lightning-spinner>
            </template>

            <div class="slds-box slds-theme_default slds-m-bottom_medium">
                <div class="slds-text-heading_small slds-m-bottom_small">
                    End Customer Details
                </div>

                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                        <span class="slds-form-element__label">
                            End Customer Name
                        </span>
                        <div class="field-value">
                            {customerNameDisplay}
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                        <span class="slds-form-element__label">
                            Country
                        </span>
                        <div class="field-value">
                            {customerCountryDisplay}
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                        <span class="slds-form-element__label">
                            Website
                        </span>
                        <div class="field-value">
                            {customerWebsiteDisplay}
                        </div>
                    </div>
                </div>
            </div>

            <template if:true={hasSelectedAccount}>
                <div
                    class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_medium"
                    role="alert">
                    <span>
                        Current End Customer Account:
                        <strong>{selectedAccountName}</strong>
                    </span>
                </div>
            </template>

            <template if:false={selectionAllowed}>
                <div
                    class="slds-notify slds-notify_alert slds-theme_warning"
                    role="alert">
                    <span>
                        End Customer Account selection is available only when
                        the Design Registration status is Precheck Completed
                        or Design in Review.
                    </span>
                </div>
            </template>

            <template if:true={selectionAllowed}>
                <lightning-button
                    label="Search Intel Accounts"
                    variant="brand"
                    icon-name="utility:search"
                    onclick={handleSearch}
                    disabled={searchDisabled}>
                </lightning-button>

                <template if:true={searchCompleted}>
                    <div class="slds-m-top_medium">
                        <div class="slds-grid slds-wrap slds-grid_align-spread slds-m-bottom_small">
                            <div class="slds-text-heading_small">
                                Matching Intel Accounts
                            </div>
                            <div class="slds-text-body_small slds-text-color_weak">
                                {resultCountLabel}
                            </div>
                        </div>

                        <template if:true={hasResults}>
                            <lightning-datatable
                                key-field="accountId"
                                data={accounts}
                                columns={columns}
                                selected-rows={selectedRows}
                                max-row-selection="1"
                                onrowselection={handleRowSelection}
                                show-row-number-column>
                            </lightning-datatable>

                            <div class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                                Selecting a row immediately updates the End
                                Customer Account lookup.
                            </div>
                        </template>

                        <template if:false={hasResults}>
                            <div class="slds-box slds-theme_shade slds-text-align_center">
                                No matching Intel Accounts were found using the
                                End Customer Name, Country, and Website.
                            </div>
                        </template>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
