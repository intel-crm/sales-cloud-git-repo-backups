<template>
    <lightning-input type="text" label="Reviewed by" value={searchTerm} onchange={handleSearchChange}></lightning-input>
    <template if:true={showDropdown}>
        <ul class="slds-dropdown slds-dropdown_fluid">
            <template for:each={filteredUsers} for:item="user">
                <li key={user.Id} class="slds-dropdown__item" onclick={handleUserSelect} data-id={user.Id}>
                    <span>{user.Name}</span>
                </li>
            </template>
        </ul>
    </template>
    <div class="slds-pill_container">
        <template for:each={selectedUsers} for:item="user">
            <span key={user.Id} class="slds-pill">
                <span class="slds-pill__label">{user.Name}</span>
                <button class="slds-button slds-button_icon" onclick={handleRemoveUser} data-id={user.Id}>
                    <lightning-icon icon-name="utility:close" alternative-text="Remove"></lightning-icon>
                </button>
            </span>
        </template>
    </div>
</template>
