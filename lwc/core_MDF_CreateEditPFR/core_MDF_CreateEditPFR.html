<template>
    <div class="container cardHeight">
        <div if:true={isLoaded}>
            <lightning-spinner style="position: fixed;" alternative-text="Loading..."></lightning-spinner>
            <div style="position: fixed;" class="slds-backdrop slds-backdrop_open"></div>
        </div>
    </div>
    <div class="body">
        <template if:true={showForm}>
            <div class="slds-card">
                <lightning-layout-item flexibility="grow" size="12" small-device-size="12"
                    medium-device-size="10" large-device-size="10" padding="around-small">
                        <template if:true={error}>
                            <lightning-layout horizontal-align="center" multiple-rows="true">
                                <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12"
                                    medium-device-size="12" large-device-size="12" padding="around-small">
                                        <div class="slds-box slds-theme--error" style="text-align: center;">
                                            <lightning-icon icon-name="utility:error" size="medium"
                                                alternative-text="Error" class="iconContainer"></lightning-icon> &nbsp;
                                            <span class="slds-text-body_regular">
                                                <lightning-formatted-rich-text value={error}>
                                                </lightning-formatted-rich-text>
                                            </span>
                                        </div>               
                                </lightning-layout-item>
                            </lightning-layout>                               
                        </template>
                        <lightning:layout class="slds-page-header slds-page-header--object-home" aura:id="header">
                            <!--<lightning:layoutItem>
                                <lightning:icon iconName="standard:partner_fund_request" class="icn" alternativeText="My Activities" />
                            </lightning:layoutItem> -->
                        </lightning:layout>
                        <div class="slds-card">
                            <div class="slds-p-around_large">
                                <form class="slds-form--stacked">
                                    <template if:true={checkStatusAttribute}>
                                        <lightning:layout class="slds-page-header slds-page-header--object-home">
                                            <lightning:layoutItem padding="horizontal-small">
                                                <div class="page-section page-header">
                                                 
                                                </div>
                                            </lightning:layoutItem>
                                        </lightning:layout>
                                    </template>
                                </form>
                            </div>
                        </div>
                       <!--- <lightning:layout horizontalAlign="center" multipleRows="true">
                            <lightning:layoutItem size="12" smallDeviceSize="12" mediumDeviceSize="12" largeDeviceSize="10" padding="around-small">
                                <div class="c-container">
                                    <lightning:layout horizontalAlign="spread" multipleRows="true">
                                        <lightning:layoutItem padding="around-small" flexibility="grow" size="12" smallDeviceSize="12" mediumDeviceSize="6" largeDeviceSize="6">
                                            <template if:false={currentStatus}>
                                                
                                            </template>
                                        </lightning:layoutItem>
                                    </lightning:layout>
                                </div>
                            </lightning:layoutItem>
                        </lightning:layout> -->
                        <lightning:layout class="slds-page-header slds-page-header--object-home">
                            <lightning:layoutItem padding="horizontal-small">
                                <div class="page-section page-header">
                                   
                                </div>
                            </lightning:layoutItem>
                        </lightning:layout>
                        <lightning-layout multiple-rows="true">
                            <template if:true={PFRFieldVisibility.Title}>
                                <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12"
                                    medium-device-size="6" large-device-size="6" padding="around-small">
                                    <lightning-input type="text" maxlength="80" name="Title"
                                        field-level-help={PFRFieldHelpText.Title}
                                        value={PFRFieldValue.Title} label= "{PFRFieldLabel.Title}"
                                        required={PFRRequiredFields.Title}
                                        disabled={PFRFieldDisabled.Title}></lightning-input>
                                </lightning-layout-item>
                            </template>
                            <template if:true={PFRFieldVisibility.Core_MDF_Activity_Description__c}>
                                <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12"
                                    medium-device-size="6" large-device-size="6" padding="around-small">
                                    <lightning-input type="text" maxlength="80" name="Core_MDF_Activity_Description__c"
                                        field-level-help={PFRFieldHelpText.Core_MDF_Activity_Description__c}
                                        value={PFRFieldValue.Core_MDF_Activity_Description__c} label= "{PFRFieldLabel.Core_MDF_Activity_Description__c}"
                                        required={PFRRequiredFields.Core_MDF_Activity_Description__c}
                                        disabled={PFRFieldDisabled.Core_MDF_Activity_Description__c}></lightning-input>
                                </lightning-layout-item>
                            </template>
                            <template if:true={PFRFieldVisibility.Core_MDF_Start_Date}>
                                <lightning-layout-item flexibility="no-grow" size="12" small-device-size="12"
                                    medium-device-size="6" large-device-size="6" padding="around-small">
                                    <lightning-input type="text" maxlength="80" name="Core_MDF_Start_Date"
                                        field-level-help={PFRFieldHelpText.Core_MDF_Start_Date}
                                        value={PFRFieldValue.Core_MDF_Start_Date} label= "{PFRFieldLabel.Core_MDF_Start_Date}"
                                        required={PFRRequiredFields.Core_MDF_Start_Date}
                                        disabled={PFRFieldDisabled.Core_MDF_Start_Date}></lightning-input>
                                </lightning-layout-item>
                            </template>
                        </lightning-layout>
                                    
                </lightning-layout-item>
            </div>
        </template>
    </div>
</template>
