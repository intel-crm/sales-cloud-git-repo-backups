<template>
    <!--Spinner will be displayed till loading of data-->
    <template if:true={isSpinner}>
        <div class="spinner">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>
    <template if:true={hasdata}>
        <template if:false={isSpinner}> 
            <lightning-layout >
                <!--PartnerFundAllocations Icon & Header Name to be displayed-->
                <lightning-layout-item flexibility="auto">
                    <div class="slds-float_left">
                        <lightning-icon icon-name="standard:partner_fund_allocation" class="icn slds-m-bottom_none">
                        </lightning-icon>
                        <span class="slds-text-heading_medium slds-var-m-left_small"><b>{label.pfaDetails}</b></span>
                        <div class="slds-form-element__icon slds-var-m-left_x-small setZindex" >
                            <button class="slds-button slds-button_icon slds-var-p-right_small" onmouseover={toggleHelpText}
                                onmouseout={toggleHelpText}>
                                <lightning-icon icon-name="utility:info" alternative-text="Info" size="xx-small"
                                    title="">
                                </lightning-icon>
                            </button>
                            <div class={helpTextClass} role="tooltip">
                                <div class="slds-popover__body slds-var-m-left_xxx-small slds-var-m-top_xx-small">
                                   <div class="slds-text-align_center"><span><b>{label.glossaryOfTerms}</b></span></div><br>
                                    <span class="slds-var-p-bottom_medium"><b>{label.Program}</b>: {label.programHelpText}</span><br>
                                    <span class="slds-var-p-bottom_medium"><b>{label.accountNode}</b>: {label.accountNodeHelpText}</span><br>
                                    <span class="slds-var-p-bottom_small"><b>{label.budgetType}</b>: {label.budgetTypeHelpText}</span><br>
                                    <span class="slds-var-p-bottom_small"><b>{label.startDate}</b>: {label.startDateHelpText}</span><br>
                                    <span class="slds-var-p-bottom_small"><b>{label.endDate}</b>: {label.endDateHelpText}</span><br>
                                    <span class="slds-var-p-bottom_small"><b>{label.Amount}</b>: {label.amountHelpText}</span><br>
                                    <span class="slds-var-p-bottom_small"><b>{label.activityReservedAmount}</b>: {label.activityResAmountHelpText}</span><br> 
                                    <span class="slds-var-p-bottom_small"><b>{label.activityAvailableAmount}</b>: {label.activityAvailAmountHelpText}</span><br>
                                    <span class="slds-var-p-bottom_small"><b>{label.claimReservedAmount}</b>: {label.claimResAmountHelpText}</span><br>
                                    <span class="slds-var-p-bottom_small"><b>{label.claimAvailableAmount}</b>: {label.claimAvailAmountHelpText}</span><br>
                                </div>
                            </div>
                        </div> 
                    </div>
                </lightning-layout-item>
            </lightning-layout>
            <lightning-layout>
                <!--Count of records will be displayed-->
                <lightning-layout-item flexibility="auto">
                    <div class="slds-float_left slds-var-m-top_small"></br>
                        <span class="slds-var-m-bottom_x-small">{allocToDisplay.length} {label.itemsToDisplay}</span></div>
                </lightning-layout-item>
                <!--To display multi select budget type & program filters-->
                <lightning-layout-item>
                  <!--  <div class="slds-float_right slds-var-m-bottom_small slds-size_medium" id="budgetTypeMultiPicklist" >  -->
                    <div class="slds-float_right slds-var-m-bottom_small adjustWidth" id="budgetTypeMultiPicklist">
                        <c-core_-m-d-f_-multi-select-picklist picklistlabel={label.budgetType} values ={budgetTypeList} data-id="budgetTypeSelection" class="multiSelectBudgetType" placeholder-text="Select an Option"
                    onselect={onBudgetTypeValueSelect} no-of-values-got-selected-lable={label.budgetTypesSelected} selected-value-count ={budgetTypeSelectedValueCount}></c-core_-m-d-f_-multi-select-picklist>
                     </div> 
                    <div class="slds-float_right slds-var-m-bottom_small slds-var-m-right_small adjustWidth">
                        <c-core_-m-d-f_-multi-select-picklist picklistlabel={label.Program} values ={programList} data-id="programSelection" class="multiSelectProgram" placeholder-text="Select an Option"
                        onselect={onProgramValueSelect} no-of-values-got-selected-lable={label.programsSelected} selected-value-count ={programSelectedValueCount></c-core_-m-d-f_-multi-select-picklist>
                    </div> 
                </lightning-layout-item>
                <lightning-layout-item>
                    <div class="slds-float_right slds-var-p-around_medium slds-var-m-top_x-small">
                        <lightning-button-menu alternative-text="Show menu" variant="border-filled"
                            icon-name="utility:download" onselect={handleSelectedExport}>
                            <lightning-menu-item value="ExportToExcel" label={label.export_Excel}></lightning-menu-item>
                            <lightning-menu-item value="ExportToCsv" label={label.export_CSV}></lightning-menu-item>
                        </lightning-button-menu>

                    </div>
                </lightning-layout-item>
            </lightning-layout>
            <!--Datatable with sorting and on row selection-->
            <div class="containerHeight">
                <lightning-datatable class="slds-table_header-fixed_container slds-scrollable_x slds-border_top"
                    data={allocToDisplay} columns={columns} key-field="Id" hide-checkbox-column=true
                    onsort={handleSortdata} sorted-by={sortBy} sorted-direction={sortDirection}
                    enable-infinite-loading={isLoaded} onloadmore={loadMoreData} > <!--load-more-offset="5"-->
       
                </lightning-datatable>
            </div>
           
       </template> 
    </template>
    <!-- In case of no data,to display header & icon along with error message -->
    <template if:false={hasdata}>
        <lightning-layout multiple-rows="true">
            <lightning-layout-item flexibility="auto" size="12" padding="around-small">
                <div class="slds-float_left">
                    <lightning-icon icon-name="standard:partner_fund_allocation" class="icn slds-m-bottom_none">
                    </lightning-icon>
                    <span class="slds-text-heading_medium slds-var-m-left_small"><b>{label.pfaDetails}</b></span>
                </div>
            </lightning-layout-item>
            <lightning-layout-item flexibility="auto" size="12" padding="around-small">
                <div class="slds-float_left">
                    <span>{allocToDisplay.length} {label.itemsToDisplay}</span>
                </div>
            </lightning-layout-item>
            <lightning-layout-item flexibility="auto" size="12"></lightning-layout-item>
            <lightning-layout-item flexibility="auto" size="12">
                <div class="slds-align_absolute-center slds-var-m-top_xx-large">
                    <p style="text-align :center;"><b>{label.noRecords}</b></p>
                </div>
            </lightning-layout-item>
            <lightning-layout-item size="12" padding="around-small"></lightning-layout-item>
            <lightning-layout-item size="12" padding="around-small"></lightning-layout-item>
            <lightning-layout-item size="12" padding="around-small"></lightning-layout-item>
            <lightning-layout-item size="12" padding="around-small"></lightning-layout-item>
        </lightning-layout>

    </template>
</template>
