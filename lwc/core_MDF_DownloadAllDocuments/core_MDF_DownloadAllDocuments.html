<!-- sldsValidatorIgnore -->
<template>
    <!--Spinner Implementation-->
    <template if:true={showSpinner}>
        <lightning-spinner alternative-text={labels.loadingLabel} size="medium"></lightning-spinner>
    </template>
    <!--Download All documents-->
    <template if:true={displayDownloadAllDocuments}>
        <div class="submitAndDownload slds-grid slds-align_absolute-center">
            <div class="title_DownloadAndSubmit slds-size_5-of-12">{labels.downloadCaseReviewDocuments}</div>
            <lightning-button label={labels.downloadAllDocumentsLabel}
                class="slds-var-m-bottom_small slds-var-m-top_small slds-size_4-of-12" onclick={downloadAllFiles}>
            </lightning-button>
        </div>
    </template>
</template>
