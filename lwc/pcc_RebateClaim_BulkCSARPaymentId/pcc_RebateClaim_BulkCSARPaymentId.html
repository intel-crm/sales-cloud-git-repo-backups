<template>
    <lightning-card>
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters slds-align-bottom">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                    <lightning-record-picker
                        label="Partner Account"
                        placeholder="Search Accounts..."
                        object-api-name="Account"
                        onchange={handlepartnername}>
                    </lightning-record-picker>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                    <lightning-input label="From Date" id="fromDate" type="date" value={fromDate} onchange={handleFromDateChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                    <lightning-input label="To Date" id="toDate" type="date" value={toDate} onchange={handleToDateChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-text-align_right">
                    <lightning-button label="Search" onclick={handleSearch} variant="brand" class="slds-m-bottom_none my-custom-button-class"></lightning-button>
                </div>
            </div>

            <template if:true={displayfields}>
                <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                        <lightning-input label="CSAR ID" id="csarId" type="text" value={csarId} onchange={handleCsarIdChange} disabled={isCsarIdDisabled}></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                        <lightning-input label="Payment Ref Id" id="paymentRefId" type="text" value={paymentRefId} onchange={handlePaymentRefIdChange} disabled={isPaymentRefIdDisabled}></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-text-align_right slds-m-top_small">
                        <lightning-button label="Apply CSAR/Payment Ref Id" onclick={handleapplyCsarPaymentRef} disabled={isApplyDisabled} class="slds-m-top_small"></lightning-button>
                    </div>
                </div>
                <div class="slds-scrollable_x slds-m-top_medium">
                    <lightning-datatable
                        data={claimRecords}
                        columns={columns}
                        key-field="Id"
                        selected-rows={selectedClaimIds}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>
                    <lightning-button-group class="slds-float_left slds-p-bottom_small">
                        <lightning-button icon-name="utility:chevronleft" icon-position="left" onclick={handlePrevious} disabled={ispreviousDisable}></lightning-button>
                        <lightning-button icon-name="utility:chevronright" icon-position="right" onclick={handleNext} disabled={isnextDisable}></lightning-button>
                    </lightning-button-group>
                    <div class="slds-p-left_small slds-p-top_xx-small slds-float_left">Showing ({endRecord} of {totalRecordCount}) | Page ({currentPage} of {totalPages})</div>
                    
                </div>
            </template>
        </div>

        <!-- Footer -->
        <footer class="slds-card__footer slds-grid slds-grid_align-spread slds-p-horizontal_medium slds-p-vertical_small">
            <div class="slds-col slds-col_bump-left">
                <lightning-button class="slds-p-left_xx-small slds-p-bottom_x-small" variant="brand" label="Save" onclick={handlesave} disabled={isSaveDisable}></lightning-button>
                <lightning-button class="slds-p-left_xx-small slds-p-bottom_x-small" variant="neutral" label="Reset" onclick={handleReset}></lightning-button>
            </div>            
        </footer>
    </lightning-card>
</template>
