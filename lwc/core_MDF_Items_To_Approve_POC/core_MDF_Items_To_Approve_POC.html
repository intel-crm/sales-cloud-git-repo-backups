<template>
    
        <lightning-card>
            <h3 slot="title">
                <lightning-icon icon-name="standard:approval" size="small"></lightning-icon>
               
          
               <span class="slds-p-horizontal_small">Item to Approve</span>
            </h3>
            <div class="slds-p-horizontal_small">
                <div class="c-container">
           
                <template for:each={recordsToRender} for:item="rec">
                    <lightning-layout-item padding="around-small" key={rec.recordId}>
                       <div class="slds-box">
                        <dd class="slds-item_detail slds-truncate slds-text-heading_medium "><a href={rec.redirectLink} class="slds-text-link" >{rec.name}</a></dd>
                    <template for:each={rec.fields} for:item="recfield">
                       
                        <div key={recfield.fieldLabel}>
                                <dl class="slds-list_horizontal slds-wrap">

                                    <dt class="slds-item_label slds-text-color_weak slds-truncate">{recfield.fieldLabel}:</dt>
                                    <dd class="slds-item_detail slds-truncate">{recfield.fieldValue}</dd>
                
                                  </dl>
                            </div>
                       
                    </template>
                </div> 
                </lightning-layout-item>
                    </template>
            
            </div>
            </div>
        </lightning-card>
    </template>
</template>
