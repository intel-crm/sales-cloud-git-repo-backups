<template>
    <template lwc:if={openModal}>
        <div>
            <header class="slds-modal__header">
                <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">New Opportunity</h2>
            </header>  
            <div class="slds-modal__content slds-p-around_small" style="padding-bottom: 20px" id="modal-content-id-1">
                    <lightning-radio-group name="Select a record type" label="Select a record type"
                        options={oppoRecordTypeId} value={value} type="radio" onchange={handleQLTypeSelection}>
                    </lightning-radio-group>            
            </div>
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_brand" onclick={handleNext} disabled={disableNext}>Next</button>
            </footer>
        </div>
    </template>
    <template lwc:if={noAccess}>
        <div class="errorClass">
            {errorMsg}
        </div>
    </template>    
</template>
