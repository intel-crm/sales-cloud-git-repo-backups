<template>
    <lightning-layout >
        <template for:each={newProductDetails} for:item="detail">
            <lightning-layout-item key={detail.id} padding="around-small">
                <div  style="height: 261px; width: 212px;" class="slds-card_boundary">
                    
                    <lightning-card>
                        <h3 slot="title" style="height: 70px;">
                            <div class="slds-list_horizontal">
                               
                                    <img  src={detail.DisplayUrl} height="60px" width="60px"></img>
                               
                           
                                <div class="slds-p-left_small slds-line-clamp" style>
                                    <strong style="color: rgb(33, 33, 214);">{detail.Name}</strong>
                            </div>
                            </div>
                        </h3>
                        <div style="height: 50px;">
                            <p class="slds-p-horizontal_medium slds-line-clamp slds-text-heading_small"><strong>{detail.Description}</strong></p>
                        </div>
                        <div slot="footer" style="height: 70px;">
                            <div class="slds-list_horizontal">
                                <lightning-icon icon-name="utility:bookmark" size="small"></lightning-icon>
                                <div class="slds-p-left_xx-small">
                                    {detail.ProductCode}
                                </div>
                            </div>
                                <div class="slds-p-right_xx-large slds-p-top_x-small">
                                    {detail.StockKeepingUnit}
                                </div>
                        </div>              
                    </lightning-card>
                
                    </div>
            
                </lightning-layout-item>
    </template>
    <div style="padding: 130px 20px;">
        <lightning-button-icon onclick={handleProductList} icon-name="utility:right" size="large" variant="bare"></lightning-button-icon>
    </div>

    </lightning-layout>


</template>
