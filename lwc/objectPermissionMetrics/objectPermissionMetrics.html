<template>

    <lightning-card>
        <div class="slds-text-align_center slds-var-p-around_x-large slds-text-heading_medium ">Dashboard to get Users having Edit or Read or Delete or ModifyAll or ViewAll or Full Access on the following objects</div></br></br>
        <div style="width:400px;">   
        <lightning-combobox name="selectObjects" value={value} label="Select an Object" placeholder="Choose an Object" onchange={handlecObjectSelection} variant="label-inline" options={Objects} ></lightning-combobox>
    </div>
   <!-- <div style="width:400px;">   
        <lightning-combobox name="selectPermType" value={value} label="Select Security Type" placeholder="Choose an Security Type" onchange={handleSelection} variant="label-inline" options={PermissionSetTypes} ></lightning-combobox>
    </div>-->
    </lightning-card>
    <lightning-card>
    <lightning-datatable columns={objectMetricsColumns} data={objectMetrics} key-field="id" onrowaction={handleRowAction}>

    </lightning-datatable>
    </lightning-card>
    <div if:true={isLoading} class="slds-spinner_inline spinner-padding">
        <lightning-spinner variant="brand" 
                           alternative-text="Loading Cases"     
                           size="medium">
        </lightning-spinner>
    </div>
    <lightning-card title="Object Permissions Chart" icon-name="utility:chart">
        <!--<template if:true={chartConfiguration}>
            <c-chart chart-config={chartConfiguration}></c-chart>
        </template>-->
        <c-chart></c-chart>
    </lightning-card>
</template>
