<template>
    
    <lightning-card >
        <diV class="slds-text-align_center slds-var-p-around_x-large slds-text-heading_medium ">Dashboard to get User Assigned with profiles and Permission Sets</diV>
        <div style="width:400px;">
        <lightning-combobox name="selectPermissionSetType" value={value} label="Select Security Type" placeholder="Choose Permission Set Type" variant="label-inline" onchange={handleSelection} options={PermissionSetTypes}></lightning-combobox>
    </div>
    </lightning-card>
    
    <lightning-card title="Permissionset/Profile Details">
        <template if:true={isDataLoaded}>
       <div style="height:450px;">
    <lightning-datatable columns={permissionSetMetricsColumns} data={permissionSetMetric} key-field="id" onrowaction={handleRowAction}  enable-infinite-loading onrowselection={getSelectedName} selected-rows={preSelectedRows}>
    </lightning-datatable>
</div>
</template>
<div if:false={isDataLoaded} class="slds-text-heading_small slds-align_absolute-center">Select PermissionSet Type To See Count of Users and their Details</div>
    <div if:true={isLoading} class="slds-spinner_inline spinner-padding">
        <lightning-spinner variant="brand" 
                           alternative-text="Loading Cases"     
                           size="medium">
        </lightning-spinner>
    
</div>
    </lightning-card> 
   
    <lightning-card title="Permission Set/Profiles Chart" icon-name="utility:chart">
        <!--<template if:true={chartConfiguration}>
            <c-chart></c-chart>
        </template>-->
        <c-chart></c-chart>
    </lightning-card>
</template>
