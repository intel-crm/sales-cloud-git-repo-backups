<template>
	<template if:true={showmodel}>
		<div class="demo-only" style="height: 640px;">
			<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
				<div class="slds-modal__container">
					<header class="slds-modal__header">
						<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
							<lightning-icon icon-name="utility:close" size="small"> </lightning-icon>
							<span class="slds-assistive-text">Close</span>
						</button>
						<span id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{formLabels.PRM_Reject_Confirmation}</span>
					</header>
					<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
						<center>
							<span class="btnGeneric"><b>{formLabels.PRM_Reject_Message}</b></span
							><br />
						</center>
					</div>
					<footer class="slds-modal__footer">
						<button class="slds-button slds-button_neutral btnGeneric" onclick={closeModal}>{formLabels.PRM_Cancel_ButtonLabel}</button>
						<button class="slds-button slds-button_brand save_button btnGeneric" onclick={saveMethod}>{formLabels.PRM_Reject}</button>
					</footer>
				</div>
			</section>
			<div class="slds-backdrop slds-backdrop_open"></div>
		</div>
	</template>
</template>
