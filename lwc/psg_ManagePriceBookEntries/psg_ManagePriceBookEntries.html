    <lightning-card title="Manage Price List" icon-name="standard:price_books">
        

        <lightning-layout multiple-rows="true" vertical-align="end">

                    <div class="slds-form-element">
                            <div class="slds-form-element__control">
                                    <lightning-combobox
                                        name="progress"
                                        label="Select Price List"
                                        value={value}
                                        placeholder="Select price list"

                                        onchange={handleChange}                                        
                                        ></lightning-combobox>
                                       
                            </div>
                        </div> 
            </lightning-layout-item>
            <lightning-layout-item size="12" small-device-size="10" medium-device-size="8" large-device-size="3" padding="around-small">
                    <div class="slds-form-element">
                   
                            <lightning-input
                                name="enter-search"
                                label="Product Name/OPN"
                                type="search"
                                placeholder="Enter product name /opn..."
                                onchange={handleSearch}
                            ></lightning-input>
                      
                    </div></lightning-layout-item>
