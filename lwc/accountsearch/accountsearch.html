<template>
    <!-- Spinner while loading -->
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
    </template>

    <!-- Error message if API fails -->
    <template if:true={error}>
        <div class="slds-text-color_error slds-m-top_medium">{error}</div>
    </template>

    <!-- DataTable and Pagination when data is loaded -->
    <template if:true={pagedData}>
        <lightning-datatable
            key-field="DirectCustomerProfileId"
            data={pagedData}
            columns={columns}
            hide-checkbox-column
            onrowaction={handleRowAction}>
        </lightning-datatable>

        <!-- Pagination Controls -->
        <div class="slds-m-top_medium">
            <lightning-layout horizontal-align="spread">
                <lightning-layout-item>
                    Showing {pageFirstRecord} to {pageLastRecord} of {totalCount}
                </lightning-layout-item>
                <lightning-layout-item>
                    <lightning-button label="First" onclick={firstPage} disabled={disableFirst}></lightning-button>
                    <lightning-button label="Previous" onclick={prevPage} disabled={disablePrev}></lightning-button>
                    <lightning-input type="number" value={page} onchange={handlePageInput} style="width: 60px;" variant="label-hidden"></lightning-input>
                    &nbsp;of {totalPage}
                    <lightning-button label="Next" onclick={nextPage} disabled={disableNext}></lightning-button>
                    <lightning-button label="Last" onclick={lastPage} disabled={disableLast}></lightning-button>
                </lightning-layout-item>
            </lightning-layout>
        </div>
    </template>
</template>
