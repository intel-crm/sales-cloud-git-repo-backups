<lightning-card title={rowLabel}>
    <div class="slds-p-around_medium">
        <!-- Row Label -->
        <lightning-layout>
            <lightning-layout-item size="12" class="slds-p-bottom_small">
                <strong>{row1Label}</strong>
            </lightning-layout-item>
        </lightning-layout>

        <lightning-layout multiple-rows>
            <!-- Label-only fields -->
            <template for:each={labelFields} for:item="item">
                <lightning-layout-item key={item.label} size="2" class="slds-p-horizontal_x-small">
                    <div class="slds-p-vertical_small">
                        <strong>{item.label}</strong>
                    </div>
                </lightning-layout-item>
            </template>

            <!-- Input fields -->
            <template for:each={inputFields} for:item="item">
                <lightning-layout-item key={item.label} size="2" class="slds-p-horizontal_x-small">
                    <lightning-input 
                        name={item.label} 
                        label={item.label} 
                        type={item.type}
                        onchange={handleInputChange}>
                    </lightning-input>
                </lightning-layout-item>
            </template>
        </lightning-layout>
    </div>
</lightning-card>
</template>
