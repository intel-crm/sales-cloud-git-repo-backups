<template > 
  <lightning-card icon-name="custom:custom35">
    <h1 slot="title">{title}</h1>
    <template if:true={userviewaccess}>
      <div slot="actions">
        <lightning-button label="New"  onclick={customFormModalview}></lightning-button>
      </div>
    </template>            
    <template if:true={DefaultView}>
      <div class="slds-p-around_x-small" style="height:17rem">
          <lightning-datatable
                  key-field="Id"
                  data={records}
                  columns={columns}
                  onrowaction={handleRowAction}
                  enable-infinite-loading 
                  hide-checkbox-column>
          </lightning-datatable>
      </div>
    </template>
    <template if:false={DefaultView}>
        <div class="slds-align_absolute-center slds-p-around_x-small">No Records to display</div>
    </template>
  </lightning-card>
  <template if:true={isLoading}>
    <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
  </template>  
<!--Create Record(New) Modal Start-->
<template if:true={customFormModal}>
 
  <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
  <div class="slds-modal__container">
      <!-- modal header start -->
      <header class="slds-modal__header">
          <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={customFormModalview}>
              <lightning-icon icon-name="utility:close"
              alternative-text="close"
              variant="inverse"
              size="small" ></lightning-icon>
              <span class="slds-assistive-text">Close</span>
          </button>
          <h2 class="slds-text-heading_medium slds-hyphenate">New Forward Cost: PSG Forward Cost Record Type</h2>
      </header>
      <!-- modal body start -->
      <div class="slds-modal__content slds-p-around_medium">
        <h3 class="test-id__section-header-container slds-section__title slds-theme--shade">Information</h3>

     <div class="slds-grid slds-wrap">
          <div class="slds-col slds-6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
              <lightning-input  label="Forward Cost Name" class="validate"  required="true" value={fcname} onchange={handleChange}></lightning-input>
          </div>
          <div class="slds-col slds-size_6-of-12 slds-p-vertical--medium slds-m-bottom_medium slds-p-horizontal--medium slds-m-bottom_medium">
               <p>Active</p>
              <lightning-input type="checkbox" checked="true"  label="Active"  value={fcactive} onchange={handleChange} variant="label-hidden"></lightning-input>
          </div>
           <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
              <lightning-input label="Product/OPN" required="true" class="validate" value={opn} onchange={handleChange}></lightning-input>
          </div>
           <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
              <lightning-input label="Forward Cost Period Name" value={fcperiodname} onchange={handleChange}></lightning-input>
          </div>
           <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
            <lightning-input type="date" label="FC Start Date"  class="validate" value={fcstdate} onchange={handleChange} required="true"></lightning-input>
        </div>
         <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
          <lightning-input type="date" label="FC End Date" class="validate" value={fcenddate} onchange={handleChange} required="true"></lightning-input>
      </div> 
      <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
        <lightning-input label="Forward Cost $" value={fccost} onchange={handleChange}></lightning-input>
    </div>         
  </div>
  <!-- modal footer start-->
      <footer class="slds-modal__footer">
        <div class="slds-grid slds-grid_align-center">
          <button class="slds-button slds-button_neutral" onclick={customFormModalview}>Cancel</button>
          <button class="slds-button slds-button_neutral" onclick={handlesavenew} disabled={disableSN} >Save & New</button>
          <button class="slds-button slds-button_brand" onclick={handlesave} disabled={disableBtn}>Save</button>
        </div>    
      </footer>
  </div>
  </div>
  </section>
  <div class="slds-backdrop slds-backdrop_open">
  </div>
  </template>
  <!--Create Record(New) Modal End-->

<!--Edit Modal Start-->
  <template if:true={customeditFormModal}>
 
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
    <div class="slds-modal__container">
        <!-- modal header start -->
        <header class="slds-modal__header">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={editmodal}>
                <lightning-icon icon-name="utility:close"
                alternative-text="close"
                variant="inverse"
                size="small" ></lightning-icon>
                <span class="slds-assistive-text">Close</span>
            </button>
            <h2 class="slds-text-heading_medium slds-hyphenate">Edit {fcname}</h2>
        </header>
        <!-- modal body start -->
        <div class="slds-modal__content slds-p-around_medium">
          <h3 class="test-id__section-header-container slds-section__title slds-theme--shade">Information</h3>
           
            <lightning-record-edit-form
                record-id={fc_id}
                object-api-name={objectApiName}
                onsuccess={refreshrecord}
               onerror={handleerror}
               
              
            >
            <div class="slds-grid slds-wrap">
              <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
                <lightning-input-field field-name="Name" required="true" readonly="true"> </lightning-input-field>
              </div>
              <div class="slds-col slds-size_6-of-12 slds-p-vertical--medium slds-m-bottom_medium slds-p-horizontal--medium slds-m-bottom_medium">
                <lightning-input-field field-name="core_cpq_fc_active_cb__c" checked="true"> </lightning-input-field>
              </div>
              <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
                <lightning-input-field field-name="core_cpq_product_opn_txt__c" required="true" readonly="true"></lightning-input-field>
            </div>
            <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
              <lightning-input-field  field-name="core_cpq_forward_cost_period_name_nm__c" readonly="true"></lightning-input-field>
          </div>
          <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
            <lightning-input-field  field-name="core_cpq_fc_start_date_dt__c"  required="true" class="stdate"></lightning-input-field>
        </div>
        <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
          <lightning-input-field field-name="core_cpq_fc_end_date_dt__c" required="true"></lightning-input-field>
      </div>
      <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_medium">
        <lightning-input-field field-name="price_forward_cost_amt__c"></lightning-input-field>
    </div>
          </div>
                <footer class="slds-modal__footer">
                  <div class="slds-grid slds-grid_align-center">
                    <lightning-button variant="neutral" type="cancel" label="Cancel" onclick={editmodal}></lightning-button>
                    &nbsp;&nbsp;
                    <lightning-button  variant="brand" label="Save" onclick={handleSubmit}>Save</lightning-button>
                  </div>    
                </footer>
            </lightning-record-edit-form>
  
    </div>
    </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open">
    </div>
    </template> 
<!--Edit Modal End-->
</template>
