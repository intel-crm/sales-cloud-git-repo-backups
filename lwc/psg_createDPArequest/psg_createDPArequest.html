<template>

    <template if:false={createDPAAction}>
        <div class="slds-clearfix">
            <div class="slds-float_right" style="margin-top: -45px;margin-right: 5px;">
                <lightning-button variant = "brand" icon-name="utility:send" label={requestButtonLabel} onclick={requestUpdate}></lightning-button>
            </div>
        </div>
    </template>  

    <template if:true={createDPAAction}> 
        <lightning-layout>
            <lightning-layout-item size = "12" horizontal-align="space" padding = "around-large">
                <lightning-card title="Create DPA Request" icon-name="standard:quotes"> 
                <lightning-accordion allow-multiple-sections-open
                                                    onsectiontoggle={handleSectionToggle}
                                                    active-section-name={activeSections}> 
                        <lightning-accordion-section name="quoteDetails" label="quoteDetails">
                            <div class="main-panel">
                                <lightning-record-edit-form record-id={recordId} object-api-name="SBQQ__Quote__c" density="comfy">
                                    <div class="slds-grid slds-wrap slds-border_top slds-border_right slds-border_left">
                                        <template for:each={quoteColumnsLocked} for:item="item" for:index="index">
                                            <div key={item.fname} class="slds-col slds-size_1-of-2">
                                                <lightning-output-field field-name={item.fname} variant="label-stacked"> </lightning-output-field>
                                            </div>
                                        </template>
                                    </div>
                                </lightning-record-edit-form>    
                        </div>
                        </lightning-accordion-section>
                    
                        <lightning-accordion-section name="quoteLinesDetails" label="quoteLinesDetails">
                            <div class="slds-scrollable_x" style="width:3000px">  
                            <!--    <div class="container" style="width:2000px">-->
                                    <lightning-datatable
                                            key-field="Id" 
                                            data ={quoteLineList} 
                                            columns ={columns} 
                                            min-column-width = "150"
                                            suppress-bottom-bar="true"
                                            draft-values ={draftValues}
                                            onsave ={handleSave}
                                            onrowaction={handleRowAction}
                                            class="slds-table_header-fixed_container slds-scrollable_x slds-border_top slds-border_bottom slds-table_bordered slds-table_col-bordered"
                                            >
                                    </lightning-datatable>
            
                            <!--    </div>-->
                            </div> 
                        </lightning-accordion-section>
                       
                        
                </lightning-accordion>  
         <!-- ******************Footer Buttons********************* -->
        <div class="slds-clearfix">
            <div class="slds-float_right" style="margin-top: 8px;">
                <lightning-button class='footer-btn'  variant = "brand" icon-name="utility:save" label="Submit Request"  onclick={sendRequestUpdate}></lightning-button>
                <lightning-button class='footer-btn'  variant = "brand" icon-name="utility:cancel_file_request" label="Cancel"  onclick={cancelRequestUpdate}></lightning-button>
            </div>
            <br/>
        </div>
    </lightning-card>
    </lightning-layout-item > 
    </lightning-layout>
    </template>    
</template>
