<template>
    <!--Part 5 if block -->
 <lightning-card  variant="Basic Hide and Show Template"  title="Basic Hide and Show Template">

<lightning-input class="bold-text" type="text" variant="standard" name="Age" label="Age" placeholder="type here your Age..."></lightning-input>
</template>

<lightning-button variant="brand" label="Hide" title="Hide" onclick={handleHide}></lightning-button>
<br/>

<!--Part 6 for loop-->
<template for:each={box} for:item="eachapple">
    One By One : {eachapple} ;
    <br key={eachApple}/>
</template>
 </lightning-card> 
</template>
