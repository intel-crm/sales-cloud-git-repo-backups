<template>
    <div>
        <lightning-accordion allow-multiple-sections-open active-section-name= "{activeSections}">
            <lightning-accordion-section name="A" label="Selected Accounts">
                <lightning-datatable
                    key-field="id"
                    columns={columns}
                    data={existingData}
                    hide-checkbox-column
                    default-sort-direction={defaultSortDirection}
                    sorted-direction={sortDirection}
                    sorted-by={sortedBy}
                    onsort={onHandleSort}>
                </lightning-datatable>
            </lightning-accordion-section>
            <lightning-accordion-section name="B" label="Add Account">
                <div>
                    <lightning-Input type="search" placeholder="Search Accounts..." onchange={handleKeyChange}></lightning-input>
                </div></br>
                <div if:true={switchView} style="height: 15rem;">
                    <lightning-datatable
                        key-field="name"
                        columns={addColumns}
                        data={accountsData}
                        default-sort-direction={defSortDirection}
                        sorted-direction={sortDirectionTwo}
                        sorted-by={sortedByTwo}
                        onsort={onHandleSortTwo}
                        enable-infinite-loading
                        onloadmore={handleLoadMore}
                        onrowaction ={handleRowAction}>
                    </lightning-datatable>
                </div>
                <div if:false={switchView} style="height: 15rem;">
                    <lightning-datatable
                        key-field="name"
                        columns={addColumns}
                        data={searchResult}
                        default-sort-direction={defSortDirection}
                        sorted-direction={sortDirectionTwo}
                        sorted-by={sortedByTwo}
                        onsort={onHandleSortTwo}
                        onrowaction ={handleRowAction}>
                    </lightning-datatable>
                </div></br>
                <div align="center">
                    <lightning-button label="Add" title="Non-primary action" onclick={handleClick} class="slds-m-left_x-small"></lightning-button>
                    <lightning-button label="Add and Done" title="Non-primary action" onclick={handleClick} class="slds-m-left_x-small"></lightning-button>
                    <lightning-button label="Cancel" title="Non-primary action" onclick={handleClick} class="slds-m-left_x-small"></lightning-button>
                </div>
            </lightning-accordion-section>
        </lightning-accordion>
    </div>
    <template if:true={isModalOpen}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Members</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-combobox
                    name="progress"
                    value={initValue}
                    placeholder="Select Progress"
                    options={combOptions}
                    onchange={handleCombChange} ></lightning-combobox>
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={submitDetails} title="OK">OK</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
