<template>
    <div class="slds-m-top_x-small slds-m-bottom_x-small">
        <div class="slds-p-around_x-small">
            <!--Render Parent and child question lgc-bg -->
            <div class="main" data-id={fieldid}>
                <template if:true={piclistcheck}>
                    <lightning-combobox class="inputdat" name={fieldid} required={isrequiredfield}
                        label={fieldlabel} value={value} options={lovs}
                        placeholder="-Select Options-" onchange={loadDependentFields}>
                    </lightning-combobox>
                </template>
                <div if:true={isLoaded}>
                    <lightning-spinner style="position: fixed;" alternative-text="Loading..."></lightning-spinner>
                    <div style="position: fixed;" class="slds-backdrop slds-backdrop_open"></div>
                </div>
                <template if:true={renderChildQuestions}>
                    <template for:each={dependetQuestions} for:item="chi">
                       <template if:true={chi.isVisible}>
                            <div key={chi.Id} title={chi.type}>
                                <div aria-labelledby={chi.label} aria-placeholder={chi.lwcplaceholder}
                                    data-id={chi.fieldid}>
                                    <c-core_-i-p-s_dynamicfield  type={chi.type} 
                                        fieldlabel={chi.label} isrequiredfield={chi.required} 
                                        lovs={chi.lwcplaceholder} placeholdertext={chi.splaceholder}
                                            fieldid={chi.questionId}
                                            value ={chi.selectedValue} fielditself = {chi}>
                                    </c-core_-i-p-s_dynamicfield>
                                </div>
                            </div>
                        </template>
                    </template>         
                </template>
            </div>
        </div>
    </div>
</template>
