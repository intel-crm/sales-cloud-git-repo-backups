<template>
  <!--<template if:true={isAdmin}>-->
       <!-- <lightning-button class="slds-button slds-button_neutral slds-m-left_x-small" label="Advanced Search" title="Search" onclick={showModalBox}></lightning-button> -->
        <button class="slds-button slds-button_neutral" title="Search" onclick={showModalBox}>Advanced Search</button>
       
        <template if:true={isShowModal}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container customContainer ">
                 <!-- modal header start -->
                   <header class="slds-modal__header">
                      <!-- sldsValidatorIgnoreNextLine -->
                      <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                         <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                         <span class="slds-assistive-text">Close</span>
                      </button>
                      <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Search {searchHeader.data}</h2>
                   </header>
        
                   <!-- Table Search-->
        <div class="slds-box customHeight" style="background-color: white">
           <!--<lightning-layout>
            <lightning-layout-item size="10" padding="around-small"> -->
                <lightning-input type="search"  class="slds-var-m-bottom_small" value={searchKey} onchange={handleKeyChange}></lightning-input>
            <!--</lightning-layout-item> -->
            <!--<lightning-button class="slds-align_absolute-center slds-var-p-bottom_medium" name="Search" onclick={searchOfferings} label="Find Offerings"> </lightning-button>
            <lightning-layout-item size="2" padding="around-small"> -->
            <button class="slds-button slds-button_neutral slds-align_absolute-center" title="Find Results" onclick={search}>Find Results</button>
                <!-- sldsValidatorIgnoreNextLine -->
            <!--</lightning-layout-item>
            </lightning-layout> -->
        <div class="slds-box customHeight">               
                    <lightning-datatable 
                            if:true={showData}
                            key-field="Id"
                            data={dataset}
                            columns={columns}
                            hide-checkbox-column = "true">
                    </lightning-datatable> 
              </div>
        </div>
    
        <!-- modal footer start-->
        <footer class="slds-modal__footer">
            <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
            <div class="slds-align_absolute-center"> 
                <div class="slds-p-right_xx-small">
                         
                    <!--<lightning-button label="Prev"
                    disabled={isPrev} onclick={handlePagePrevAction}
                                        icon-name="utility:back"
                                        class="slds-button slds-button_neutral"
                                        name="prev"></lightning-button>  -->
                     <button class="slds-button slds-button_neutral" title="Prev" onclick={handlePagePrevAction} disabled={isPrev}>Prev</button>
                </div>
                <span class="slds-badge slds-badge_lightest">
                    {recordStart}-{recordEnd} of {totalRecords} | Page {pageNumber} of {totalPages}
                </span>
                <div class="slds-p-left_xx-small">
                    <!-- <lightning-button label="Next"
                    disabled={isNext} onclick={handlePageNextAction}
                                        icon-name="utility:forward"
                                        icon-position="right"
                                        class="slds-button slds-button_neutral"
                                        name="next"></lightning-button> -->
                <button class="slds-button slds-button_neutral" title="Next" onclick={handlePageNextAction} disabled={isNext}>Next</button>
                </div>
            </div>  
         </footer>
         
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!--</template>-->
    </template>
