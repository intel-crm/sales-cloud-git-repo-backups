<template>
    <template if:true={isActive}>
        <div class="slds-clearfix slds-border_bottom">
            <div class="slds-float_left">
                <div class="Fill-1">
                    <div class="logo-energyblue-white-3000px"></div>
                    <span>
                        <span style="font-size:18px;"><b>Intel</b></span>&#174;<br />
                        Premier Support
                    </span>
                </div>
                <template if:true={isMobileView}>

                    <div class="slds-float_left slds-p-around_medium">
                        <lightning-button-menu alternative-text="Show menu" variant="" icon-name="utility:rows">
                            <lightning-menu-item value="HOME" onclick={navigateToHome} label="HOME">
                            </lightning-menu-item>
                            <lightning-menu-item value="PREFERENCES" onclick={navigateToPreference} label="PREFERENCES">
                            </lightning-menu-item>
                        </lightning-button-menu>
                    </div>
                </template>
<template if:false={isMobileView}>
                    <button class="customCSS" onclick={navigateToHome}>HOME</button>
                    <button class="customCSS" onclick={navigateToPreference}>PREFERENCES</button>
                </template>
</div>
<template if:false={caseDetailPage}>
                <div class="slds-float_right" style="margin-top:35px;">
                    <div style="width:275px;"
                        class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left">
                        <!-- <lightning-button-icon class="slds-button slds-input__icon slds-text-color--default"
                            icon-name="utility:user" variant="bare" alternative-text="User"></lightning-button-icon> -->
                        <lightning-icon icon-name="utility:user"
                            class="slds-button slds-input__icon slds-text-color--default iconcolor"
                            alternative-text="user" variant="bare" size="small"></lightning-icon>
                        <span style="padding-left:25px;" class="tooltip">
                            &nbsp;&nbsp;{userName}&nbsp;&nbsp;|&nbsp;&nbsp;<button onclick={handleLogout}
                                class="logoutbutton"> Logout</button>
                            <div class="tooltiptext" style="margin-left: -28px;">{userNameTooltip}</div>
                        </span>
                    </div>
                </div>
            </template>
<template if:true={caseDetailPage}>
                <div class="slds-float_right" style="margin-top:35px;">
                    <div style="width:260px;"
                        class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left">
                        <lightning-button-icon class="slds-button slds-input__icon slds-text-color--default"
                            icon-name="utility:user" variant="bare" alternative-text="User"></lightning-button-icon>
                        <span style="padding-left:30px;" class="tooltip">
                            &nbsp;&nbsp;{userName}&nbsp;&nbsp;|&nbsp;&nbsp;<a onclick={handleLogout}> Logout</a>
                            <div class="tooltiptext" style="margin-left: -28px;">{userNameTooltip}</div>
                        </span>
                    </div>
                </div>
            </template>
</div>
<template if:false={caseDetailPage}>
            <div class="slds-clearfix slds-border_bottom">
                <div class="slds-float_left">
                    <div class="By-Product ">
                        DASHBOARD
                    </div>
                </div>
            </div>
        </template>
</template>
</template>
