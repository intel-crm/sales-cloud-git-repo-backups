<template>
    <article class="slds-card">

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading"
                size="medium"></lightning-spinner>
        </template>

        <template if:false={isLoading}>
            <div class="slds-p-around_medium lgc-bg list_view_and_table_container">
                <lightning-tile label={listOfItemTitle} title={listOfItemTitle} type="media" class="list_view_container">
                    <lightning-icon slot="media" icon-name="standard:orders" size="medium" class="icon_custom_class">
                    </lightning-icon>
                    <div class="slds-form-element">
                        <div class="slds-form-element__control">
                            <div class="slds-combobox_container slds-size_small">
                                <div class={dropdownTriggerClass} aria-expanded="false" aria-haspopup="listbox" role="combobox">
                                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                                        role="none" onclick={handleClickExtend}>
                                        <span class="current_filter">{currentFilter} 
                                            <lightning-icon
                                                class="slds-button__icon slds-icon-utility-down slds-icon_container forceIcon"
                                                data-data-rendering-service-uid="232"
                                                data-aura-rendered-by="371:0"
                                                data-aura-class="forceIcon"
                                                icon-name="utility:down"
                                                size="x-small">
                                            </lightning-icon>                                            
                                        </span>
                                    </div>                                    
                                    <div id="listbox-id-1" class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                                        role="listbox">
                                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                            <template for:each={listViewOptions} for:item="option">
                                                <li role="presentation" class="slds-listbox__item" key={option.value}>
                                                    <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                        data-filter={option.value} onclick={handleFilterChangeButton}>
                                                        <span class="slds-media__figure slds-listbox__option-icon" data-filter={option.value}></span>
                                                        <span class="slds-media__body" data-filter={option.value}>
                                                            <span class="slds-truncate" title={option.value} data-filter={option.value}>{option.label}</span>
                                                        </span>
                                                    </div>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </lightning-tile>
                <div class="slds-float_right">
                    <p><lightning-formatted-url value={mainListView} label="More.." target="_blank"></lightning-formatted-url></p></div>
            </div>
                <template if:true={loadTable}>
                    <c-pricing_-list-view-table-comp object-a-p-i-name={objectAPI} selected-list-view={currentFilterId}> </c-pricing_-list-view-table-comp>
                </template> 
        </template>
    </article>
</template>
