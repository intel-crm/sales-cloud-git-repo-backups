<template>
   
    <template for:each={fields} for:item='field'>
      
        <div key={field.id}>  
           
            <template if:false={field.hasChild} >
            
            <c-dynamic-field commcheck={iscommunity} type={field.type}   fieldlabel ={field.label}  lovs ={field.lovs} 
                                    isrequiredfield ={field.required} placeholdertext ={field.palceholderText} 
                                    fieldid ={field.id} value={field.value} mvalue = {field.mValue} fielditself = {field} mode={mode}></c-dynamic-field> 
            
            </template>   
            <template if:true={field.hasChild} >
                <c-dynamic-dependent-field commcheck={iscommunity} type={field.type} combocheck={iscummunitydropdown}  fieldlabel ={field.label}  lovs ={field.lovs} 
                                    isrequiredfield ={field.required} placeholdertext ={field.palceholderText} 
                                    fieldid ={field.id} value={field.value} execute-mode={executionMode} cs-id={caseId} product-id={supportedProductId} ></c-dynamic-dependent-field> 
            </template>
         </div>                     
    </template>
    
</template>
