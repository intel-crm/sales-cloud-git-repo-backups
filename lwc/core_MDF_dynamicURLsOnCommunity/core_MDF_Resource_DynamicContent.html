<template>
	<template if:true={resourceContent}>
		
		<template for:each={resourceContent} for:item="content">
			<span key={content.contentHeader} class="headerCss" style="color:#0071c5;font-size:24px;font-weight: 100;padding-top:10px;padding-bottom: 10px;">
                {content.contentHeader}</span>
			<div key={content.contentHeader} style="float:left;width: 100%;"  >
				<template for:each={content.subSectionList} for:item="subSection">
					<div key={subSection.contentSubHeader} class="slds-col" style={subSection.style} >
                        <div style="height:1em"></div>
						<span style="color:#222222;font-size:24px;font-weight: 100;">{subSection.contentSubHeader}</span>
                        <div style="height:1em"></div>
						<template for:each={subSection.lineItemWrapList} for:item="lineItem">
							<div key={lineItem.contentLabel} class="slds-col">
								<template if:true={lineItem.isIconRequired}>
									<p class="cta-item"><a style="display :flex;align-items:center;" target="_blank" href={lineItem.contentUrl} 
									title={lineItem.contentHelpText}><img src={lineItem.iconUrl} style={lineItem.style} />
                                    <span style="padding-left :1%;font-size:16px" class="content">{lineItem.contentLabel}</span></a></p>
								</template>	
								<template if:false={lineItem.isIconRequired}>
								<p class="cta-item"><a style="display :flex;align-items:center;" target="_blank" href={lineItem.contentUrl} title={lineItem.contentHelpText}>
										<button type="button" class="btn btn-primary">›</button>
										<span class="content" style="font-size:16px">{lineItem.contentLabel}</span></a></p>
								</template>
                            <div style="height:1em"></div>
							</div>
						</template>
					</div>
				</template>
			</div>
		</template>
		
	</template>
</template>
