<template>
  <lightning-layout multiple-rows="true">
    <lightning-layout-item
      padding="around-small"
      class="c-layout-item slds-text-align_center slds-box slds-box_xx-small"
      size="4"
      large-device-size="4"
      medium-device-size="12"
    >
      <div class="header-column">
        <p class="field-title" title="Total Cases">Total Cases</p>
        <p class="field-value">
          <lightning-formatted-number
            value={covidCounts.cases}
          ></lightning-formatted-number>
        </p>
      </div>
    </lightning-layout-item>

    <lightning-layout-item
      padding="around-small"
      class="c-layout-item slds-text-align_center slds-box slds-box_xx-small"
      size="4"
      large-device-size="4"
      medium-device-size="12"
    >
      <div class="header-column">
        <p class="field-title" title="Total Deaths">Total Deaths</p>
        <p class="field-value">
          <lightning-formatted-number
            value={covidCounts.deaths}
          ></lightning-formatted-number>
        </p>
      </div>
    </lightning-layout-item>

    <lightning-layout-item
      padding="around-small"
      class="c-layout-item slds-text-align_center slds-box slds-box_xx-small"
      size="4"
      large-device-size="4"
      medium-device-size="12"
    >
      <div class="header-column">
        <p class="field-title" title="Total Cases">Total Recovered</p>
        <p class="field-value">
          <lightning-formatted-number
            value={covidCounts.recovered}
          ></lightning-formatted-number>
        </p>
      </div>
    </lightning-layout-item>
  </lightning-layout>

  <lightning-layout class="c-layout" multiple-rows="true">
    <lightning-layout-item
      padding="around-small"
      class="c-layout-item slds-text-align_center slds-box slds-box_xx-small"
      size="6"
      large-device-size="6"
      medium-device-size="12"
    >
      <div class="header-column">
        <p class="field-title" title="Total Cases">Today's Cases</p>
        <p class="field-value">
          <lightning-formatted-number
            value={covidCounts.todaysCases}
          ></lightning-formatted-number>
        </p>
      </div>
    </lightning-layout-item>

    <lightning-layout-item
      padding="around-small"
      class="c-layout-item slds-text-align_center slds-box slds-box_xx-small"
      size="6"
      large-device-size="6"
      medium-device-size="12"
    >
      <div class="header-column">
        <p class="field-title" title="Total Deaths">Today's Deaths</p>
        <p class="field-value">
          <lightning-formatted-number
            value={covidCounts.todaysDeaths}
          ></lightning-formatted-number>
        </p>
      </div>
    </lightning-layout-item>
  </lightning-layout>
</template>
