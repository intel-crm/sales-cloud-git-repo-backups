<template>
    <div>
        <div class="slds-form-element">
            <div class="slds-form-element__control">
                <div class="slds-combobox_container">
                    <div class={txtclassname} data-id="resultBox" aria-expanded="false" aria-haspopup="listbox"
                        role="combobox">
                        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon slds-input-has-icon_right"
                            role="none">
                            <lightning-combobox
                                name="progress"
                                value={valueK}
                                placeholder="Select Program"
                                options={optionsK}
                                onchange={handleChangeK} >
                            </lightning-combobox>                               
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
