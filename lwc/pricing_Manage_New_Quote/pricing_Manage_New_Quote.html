<template>
    <lightning-button label="New Quote" title="New Quote" onclick={openModal}
        class="slds-align_absolute-center slds-m-left_x-small">
    </lightning-button>

    <template if:true={isOpenModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container containerWidth">
                <header class="slds-modal__header">
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">New Quote</h2>
                </header>
                <template if:true={errorMsg}>
                    <div class="errorClass">
                        {errorMsg}
                    </div>
                </template>
                <div class="slds-modal__content slds-p-around_small">Select Quote Type:</div>
                <div class="slds-modal__content slds-p-around_small" style="padding-bottom: 20px"
                    id="modal-content-id-1">
                    <fieldset class="slds-form-element">
                        <legend class="slds-form-element__legend slds-form-element__label">
                        </legend>
                        <div class="slds-form-element__control ">
                            <template for:each={quoteTypes} for:item="quoteType">
                                <span key={quoteType.label} class="slds-radio">
                                    <input type="radio" id={quoteType.label} value={quoteType.label} name="radioButton"
                                        onchange={handleChange} checked={quoteType.checked} />
                                    <label class="slds-radio__label" for={quoteType.label}>
                                        <span class="slds-radio_faux"></span>
                                        <span class="slds-form-element__label">{quoteType.label}</span>
                                    </label>
                                    <!--<template if:true={msgColor}>
                                        <small class={messageColor}>{quoteType.message}</small>
                                    </template>-->
                                    <template if:true={quoteType.message}>
                                        <small class={quoteType.color}>{quoteType.message}</small>
                                    </template>
                                </span>
                            </template>
                        </div>
                    </fieldset>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal}>Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={handleNext} disabled={disableButton}>Next</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
