<template>
    <lightning-card variant="Narrow">
        <lightning-layout multiple-rows>
            <lightning-layout-item
                size="12"
                padding="around-small"
            >
                                <lightning-input
                                    type="search"
                                    variant="standard"
                                    name="allfieldSearch"
                                    label="Search All Fields"
                                    placeholder="type text..."
                                    min-length="3"
                                    message-when-range-underflow="Type min 3 chars"
                                    value={searchAllValue}
                                    onchange={handleSearchAll}
                                ></lightning-input>
                          
                       
                                <lightning-button-icon
                                    variant="base"
                                    size="small"
                                    icon-name="utility:clear"
                                    alternative-text="Clear Search"
                                    onclick={clearSearch}
                                ></lightning-button-icon>
                         
                          
                                <lightning-input
                                    type="text"
                                    variant="standard"
                                    name="caseNumber"
                                    value={caseNumber}
                                    label="Search Case Number"
                                    placeholder="type case number..."
                                    onkeyup={handleKeyUp}
                                ></lightning-input>
                           
                           
                                <lightning-input
                                    type="text"
                                    variant="standard"
                                    name="ProductName"
                                    value={productName}
                                    label="Search product"
                                    placeholder="product number..."
                                    onkeyup={handleKeyUp}
                                ></lightning-input>
                           
                           
                                <lightning-input
                                    type="text"
                                    variant="standard"
                                    name="Reference ID"
                                    value={referenceid}
                                    label="Search ReferenceId"
                                    placeholder="Ref id..."
                                    onkeyup={handleKeyUp}
                                ></lightning-input>
                           
                         
                                <lightning-combobox
                                    name="status"
                                    label="Status"
                                    value={status}
                                    placeholder="Search Status"
                                    options={statusPickListValues}
                                    onchange={handleChange}
                                ></lightning-combobox>
                                <lightning-button label="Search"
                                onclick={handleSearchKeyword}
                                variant="brand"></lightning-button>
                        <template if:true={displayTable}>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col">Case Number</th>
                                    <th scope="col">Product Name</th>
                                    <th scope="col">Subject</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Severity</th>
                                </tr>
                            </thead>
                            <tbody>
                        
                                <tr
                                    class="slds-hint-parent"
                                    for:each={searchable}
                                    for:item="item"
                                    key={item.Id}
                                >
                                    <th scope="row">
                                        <a
                                            href="#"
                                            onclick={handleNavigate}
                                            data-id={item.caseData.Id}
                                        >{item.caseData.CaseNumber}
                                        </a>
                                    </th>
                                    <th scope="row">
                                        <span if:true={item.caseData.Asset}>
                                            <a
                                                href="#"
                                                onclick={handleNavigate}
                                                data-id={item.caseData.Asset.Id}
                                            >
                                                {item.caseData.Asset.Name}
                                            </a>
                                        </span>
                                    </th>
                                    <th scope="row">{item.caseData.Subject}</th>
                                    <th scope="row">{item.caseData.Status}</th>
                                    <th scope="row">{item.caseData.Core_Severity__c}</th>
                                </tr>
                        
                            </tbody>
        
                </table>
            </template>
            </lightning-layout-item>
        </lightning-layout>
    </lightning-card>
</template>
