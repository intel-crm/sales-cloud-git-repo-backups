<template>
    <lightning-card title="Deletion Tracker">
        <template if:true={deletionLogs}>
            <ul>
                <template for:each={deletionLogs} for:item="log">
                    <li key={log}>{log}</li>
                </template>
            </ul>
        </template>
        <template if:false={deletionLogs}>
            <p>No deletions recorded for this session.</p>
        </template>
    </lightning-card>
</template>
