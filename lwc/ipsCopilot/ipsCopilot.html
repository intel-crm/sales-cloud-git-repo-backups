<template>
    <lightning-card title="Salesforce IPS Copilot" icon-name="utility:chat">
        <div class="slds-m-around_medium">
            <template if:true={copilotUrl}>
                <iframe 
                    src={copilotUrl} 
                    width="100%" 
                    height="680px" 
                    style="border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);"
                    allow="clipboard-read; clipboard-write">
                </iframe>
            </template>
            <template if:false={copilotUrl}>
                <div class="slds-align_absolute-center" style="height: 200px;">
                    <lightning-spinner alternative-text="Loading Copilot Session..." size="medium"></lightning-spinner>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
