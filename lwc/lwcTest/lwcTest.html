<template>
  <div class="slds-modal__header">
    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
    onclick={onCancel}>
    <lightning-icon class="slds-icon" icon-name="utility:close" variant="inverse" alternative-text="Close"></lightning-icon>
    </button>
    <template if:true={isUserToAccountSelected}>
      <h2 id="header43" class="slds-text-heading--medium">
        User Account Mapping
      </h2>
    </template>
    <template if:false={isUserToAccountSelected}>
      <h2 id="header44" class="slds-text-heading--medium">
        Account User Mapping
      </h2>
    </template>
  </div>
  <div class="slds-modal__content slds-p-around--large slds-p-bottom_none">
    <div class="slds-grid slds-wrap">
      <div class="slds-col slds-size_2-of-6 slds-p-around_small">
        <label style="color:red;font-size: large;">*</label>
        <label
          class="slds-form-element__label"
          for="unique-id-of-input"
          style="font-weight: bold;
            font-size: small;"
          >Select Action</label
        >
      </div>
      <div
        class="slds-col slds-size_4-of-6 slds-p-around_small slds-p-bottom_none"
      >
        <select
          class="slds-select"
          name="pnumAction"
          onchange={onPnumOptionChange}
        >
          <option value="A2U"
            >Select Account and Map One or More Users to an Account</option
          >
          <option value="U2A"
            >Select User and Map One or More Accounts to the User</option
          >
        </select>
      </div>
    </div>
  </div>
  <!--Call cmp based on condition-->
  <template if:true={isUserToAccountSelected}>
    <c-lwc-dual-list-box-user-account></c-lwc-dual-list-box-user-account>
  </template>
  <template if:false={isUserToAccountSelected}>
    <c-lwc-dual-list-box-account-user></c-lwc-dual-list-box-account-user>
  </template>
  <!--Call cmp based on condition-->
</template>
