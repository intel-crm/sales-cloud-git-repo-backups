<template>
  <template if:true={showFirstButton}>
    <lightning-layout>
      <lightning-layout-item size="1">
        <div style="width: 36px; text-align: center;">
          <lightning-input key={pageNumber} type="number" value={number} oncommit={select} style="padding-bottom: 20px;"
            class="quanticInput quanticInputnew">
          </lightning-input>
        </div>
      </lightning-layout-item>
    </lightning-layout>
  </template>
  <template if:false={showFirstButton}>
    <button key={pageNumber} variant={variant} label={number} title={number} class="slds-m-left_xx-small quantiButton"
      value={number} onclick={select}>{number}</button>
  </template>
</template>
